<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b11"><title>Клановые войны — Top King</title><meta name="description" content="Текущий клановый бой Top King в Hamster King"><link rel="stylesheet" href="../assets/public.css"><link rel="icon" href="https://cdn-prod-front-dist.hwgame.cloud/assets/images/ui/clan-list-icon.png"></head><body>

<script>window.TK_PAGE_TRANSLATIONS={ru:{pageTitle:'Клановые войны — Top King',eyebrow:'Текущий бой',title:'Клановые войны',lead:'Общий счёт нашего боя с противником — без персонального урона и данных участников.',ourClan:'Наш клан',opponent:'Противник',score:'Счёт',starts:'Начало',ends:'Окончание',active:'Бой идёт',finished:'Бой завершён',waiting:'Активного боя сейчас нет.',stale:'Данные давно не обновлялись.'},en:{pageTitle:'Clan wars — Top King',eyebrow:'Current battle',title:'Clan wars',lead:'The overall score of our battle against the opponent, without member damage or personal data.',ourClan:'Our clan',opponent:'Opponent',score:'Score',starts:'Starts',ends:'Ends',active:'Battle in progress',finished:'Battle finished',waiting:'There is no active battle now.',stale:'The data has not been refreshed recently.'},fa:{pageTitle:'جنگ‌های قبیله‌ای — Top King',eyebrow:'نبرد فعلی',title:'جنگ‌های قبیله‌ای',lead:'امتیاز کلی نبرد ما با حریف، بدون نمایش آسیب یا اطلاعات شخصی اعضا.',ourClan:'قبیله ما',opponent:'حریف',score:'امتیاز',starts:'شروع',ends:'پایان',active:'نبرد در جریان است',finished:'نبرد پایان یافته',waiting:'در حال حاضر نبرد فعالی وجود ندارد.',stale:'اطلاعات مدتی است به‌روزرسانی نشده است.'}};</script>
<script src="../assets/site-i18n.js"></script><script>
const API='https://hk-license.89.125.1.71.sslip.io/api/v1/public/clan-war';let war=null;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(Number(v)*1000).toLocaleString(TopKingI18n.language):'—';
const clanIcon='https://cdn-prod-front-dist.hwgame.cloud/assets/images/ui/clan-list-icon.png';
const battleIcon='https://cdn-prod-front-dist.hwgame.cloud/assets/images/ui/vs.png';
function render(){const s=TopKingI18n.strings(),box=document.getElementById('war-card'),status=document.getElementById('war-status');if(!war||!war.active){status.className='status';status.textContent=s.waiting;box.innerHTML='';return}const stale=Date.now()/1000-Number(war.updated_at||0)>21600;status.className='status '+(stale?'warn':'good');status.textContent=(war.status==='finished'?s.finished:s.active)+(stale?' · '+s.stale:'')+' · '+s.updated+': '+fmt(war.updated_at);box.innerHTML=`<article class="card"><div class="icon-title"><img class="game-icon" src="${clanIcon}" alt=""><div><small>${safe(s.ourClan)}</small><h2>${safe(war.our_clan||'Top King')}</h2></div></div><h3 style="font-size:42px;margin-top:24px">${Number(war.our_score||0).toLocaleString()}</h3></article><article class="card"><div class="icon-title"><img class="game-icon" src="${battleIcon}" alt=""><div><small>${safe(s.opponent)}</small><h2>${safe(war.opponent||'—')}</h2></div></div><h3 style="font-size:42px;margin-top:24px">${Number(war.opponent_score||0).toLocaleString()}</h3></article><article class="card full"><b>${safe(s.starts)}:</b> ${fmt(war.started_at)} &nbsp; · &nbsp; <b>${safe(s.ends)}:</b> ${fmt(war.ends_at)}</article>`}
async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();war=d.war||null;render()}catch{const s=TopKingI18n.strings();document.getElementById('war-status').className='status bad';document.getElementById('war-status').textContent=s.error;document.getElementById('war-card').innerHTML=''}}
document.addEventListener('tk-language-change',render);load();setInterval(load,60000);
</script><script src="../assets/site-nav.js?v=20260920-7"></script>
</body></html>
