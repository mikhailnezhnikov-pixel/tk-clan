<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b11"><title>Клановые войны — Top King</title><meta name="description" content="Текущий клановый бой Top King в Hamster King"><link rel="stylesheet" href="../assets/public.css">  <link rel="icon" type="image/png" href="../assets/brand/topking-clan-crest.png">
  <link rel="apple-touch-icon" href="../assets/brand/topking-clan-crest.png">
  <style>
    .war-hp{margin-top:18px}
    .war-hp-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;font-weight:800}
    .war-hp-head span:first-child{color:#f3c969;letter-spacing:.05em}
    .war-hp-head span:last-child{font-variant-numeric:tabular-nums;color:#eef2f7}
    .war-hp-track{height:14px;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 4px rgba(0,0,0,.55)}
    .war-hp-fill{height:100%;min-width:0;border-radius:inherit;background:linear-gradient(90deg,#bf7b20 0%,#efbb4d 52%,#ffe59a 100%);box-shadow:0 0 16px rgba(239,187,77,.24);transition:width .35s ease}
    .war-hp-note{display:block;margin-top:7px;color:#8f98a7;font-size:12px}
  </style>
</head><body>
<header class="topbar"><div class="shell topbar-inner"><a class="brand" href="../" aria-label="Top King"><img class="tk-clan-crest" src="../assets/brand/topking-clan-crest.png" alt="Top King"></a><nav class="nav"><a href="../" data-i18n="home"></a><a href="../recipes/" data-i18n="recipes"></a><a class="active" href="./" data-i18n="wars"></a><a href="../ratings/" data-i18n="ratings"></a><a href="../information/" data-i18n="information"></a><a href="../feedback/" data-i18n="feedback"></a></nav><div class="languages" aria-label="Language"><button data-language="ru">RU</button><button data-language="en">EN</button><button data-language="fa">FA</button></div><button class="menu-toggle" data-menu-toggle aria-expanded="false" aria-label="Menu">☰</button></div><nav class="mobile-nav" data-mobile-nav><a href="../" data-i18n="home"></a><a href="../recipes/" data-i18n="recipes"></a><a href="../ratings/" data-i18n="ratings"></a><a href="../information/" data-i18n="information"></a><a href="../feedback/" data-i18n="feedback"></a></nav></header>
<main><header class="shell page-head"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p class="lead" data-i18n="lead"></p></header><section class="shell content"><div id="war-status" class="status" data-i18n="loading"></div><div id="war-card" class="grid" style="margin-top:16px"><div class="empty card full" data-i18n="loading"></div></div></section></main>
<footer class="footer"><div class="shell footer-row"><span data-i18n="footer"></span><a href="../feedback/" data-i18n="feedback"></a></div></footer>
<script>window.TK_PAGE_TRANSLATIONS={ru:{pageTitle:'Клановые войны — Top King',eyebrow:'Текущий бой',title:'Клановые войны',lead:'Общий счёт нашего боя с противником — без персонального урона и данных участников.',ourClan:'Наш клан',opponent:'Противник',score:'Счёт',starts:'Начало',ends:'Окончание',active:'Бой идёт',finished:'Бой завершён',waiting:'Активного боя сейчас нет.',stale:'Данные давно не обновлялись.',hp:'HP',hpUpdated:'Шкала HP из игры'},en:{pageTitle:'Clan wars — Top King',eyebrow:'Current battle',title:'Clan wars',lead:'The overall score of our battle against the opponent, without member damage or personal data.',ourClan:'Our clan',opponent:'Opponent',score:'Score',starts:'Starts',ends:'Ends',active:'Battle in progress',finished:'Battle finished',waiting:'There is no active battle now.',stale:'The data has not been refreshed recently.',hp:'HP',hpUpdated:'In-game HP bar'},fa:{pageTitle:'جنگ‌های قبیله‌ای — Top King',eyebrow:'نبرد فعلی',title:'جنگ‌های قبیله‌ای',lead:'امتیاز کلی نبرد ما با حریف، بدون نمایش آسیب یا اطلاعات شخصی اعضا.',ourClan:'قبیله ما',opponent:'حریف',score:'امتیاز',starts:'شروع',ends:'پایان',active:'نبرد در جریان است',finished:'نبرد پایان یافته',waiting:'در حال حاضر نبرد فعالی وجود ندارد.',stale:'اطلاعات مدتی است به‌روزرسانی نشده است.',hp:'HP',hpUpdated:'نوار HP بازی'}};</script>
<script src="../assets/site-i18n.js?v=20260920-10"></script><script>
const API='https://hk-license.89.125.1.71.sslip.io/api/v1/public/clan-war';let war=null;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(Number(v)*1000).toLocaleString(TopKingI18n.language):'—';
const clanIcon='https://cdn-prod-front-dist.hwgame.cloud/assets/images/ui/clan-list-icon.png';
const battleIcon='https://cdn-prod-front-dist.hwgame.cloud/assets/images/ui/vs.png';
function hpBar(current,maximum,s){const cur=Number(current),max=Number(maximum);if(!Number.isFinite(cur)||!Number.isFinite(max)||max<=0)return'';const pct=Math.max(0,Math.min(100,(cur/max)*100));const locale=TopKingI18n.language||'ru';return `<div class="war-hp"><div class="war-hp-head"><span>${safe(s.hp||'HP')}</span><span>${Math.max(0,Math.round(cur)).toLocaleString(locale)} / ${Math.max(0,Math.round(max)).toLocaleString(locale)}</span></div><div class="war-hp-track" role="progressbar" aria-valuemin="0" aria-valuemax="${Math.round(max)}" aria-valuenow="${Math.round(cur)}"><div class="war-hp-fill" style="width:${pct.toFixed(2)}%"></div></div><small class="war-hp-note">${safe(s.hpUpdated||'')}</small></div>`}
function render(){const s=TopKingI18n.strings(),box=document.getElementById('war-card'),status=document.getElementById('war-status');if(!war||!war.active){status.className='status';status.textContent=s.waiting;box.innerHTML='';return}const stale=Date.now()/1000-Number(war.updated_at||0)>21600;status.className='status '+(stale?'warn':'good');status.textContent=(war.status==='finished'?s.finished:s.active)+(stale?' · '+s.stale:'')+' · '+s.updated+': '+fmt(war.updated_at);box.innerHTML=`<article class="card"><div class="icon-title"><img class="game-icon" src="${clanIcon}" alt=""><div><small>${safe(s.ourClan)}</small><h2>${safe(war.our_clan||'Top King')}</h2></div></div><h3 style="font-size:42px;margin-top:24px">${Number(war.our_score||0).toLocaleString()}</h3>${hpBar(war.our_hp,war.our_hp_max,s)}</article><article class="card"><div class="icon-title"><img class="game-icon" src="${battleIcon}" alt=""><div><small>${safe(s.opponent)}</small><h2>${safe(war.opponent||'—')}</h2></div></div><h3 style="font-size:42px;margin-top:24px">${Number(war.opponent_score||0).toLocaleString()}</h3>${hpBar(war.opponent_hp,war.opponent_hp_max,s)}</article><article class="card full"><b>${safe(s.starts)}:</b> ${fmt(war.started_at)} &nbsp; · &nbsp; <b>${safe(s.ends)}:</b> ${fmt(war.ends_at)}</article>`}
async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();war=d.war||null;render()}catch{const s=TopKingI18n.strings();document.getElementById('war-status').className='status bad';document.getElementById('war-status').textContent=s.error;document.getElementById('war-card').innerHTML=''}}
document.addEventListener('tk-language-change',render);load();setInterval(load,60000);
</script><script src="../assets/site-nav.js?v=20260920-10"></script>
</body></html>
