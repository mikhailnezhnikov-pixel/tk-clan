<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b11">
  <title>Клановые войны — Top King</title>
  <meta name="description" content="Текущий противник Top King в клановой войне Hamster King">
  <link rel="stylesheet" href="../assets/public.css">
  <link rel="icon" type="image/png" href="../assets/brand/topking-clan-crest.png">
  <link rel="apple-touch-icon" href="../assets/brand/topking-clan-crest.png">
  <style>
    .wars-page{padding-top:calc(var(--header) + 42px)}
    .wars-heading{padding:30px 0 24px;text-align:center}
    .wars-heading .eyebrow{justify-content:center;margin-bottom:12px}
    .wars-heading .eyebrow:before{display:none}
    .wars-heading h1{margin-inline:auto;font-size:clamp(42px,7vw,78px)!important}
    .wars-heading p{margin:12px auto 0;color:#9aa2af;font-size:15px;letter-spacing:.08em;text-transform:uppercase}

    .war-arena{
      --war-accent:#e94b42;
      --war-accent-2:#7d1715;
      --war-accent-soft:rgba(233,75,66,.22);
      --war-sky:#271012;
      position:relative;
      min-height:650px;
      margin-bottom:88px;
      overflow:hidden;
      border:1px solid color-mix(in srgb,var(--war-accent) 35%,rgba(255,255,255,.08));
      border-radius:30px;
      background:
        radial-gradient(circle at 50% 115%,var(--war-accent-soft),transparent 44%),
        radial-gradient(circle at 18% 15%,rgba(255,255,255,.04),transparent 24%),
        linear-gradient(180deg,var(--war-sky),#0a0c10 50%,#07080b 100%);
      box-shadow:0 30px 90px rgba(0,0,0,.46),inset 0 1px rgba(255,255,255,.04);
      isolation:isolate
    }
    .war-arena:before{
      content:"";position:absolute;inset:0;z-index:-1;opacity:.22;pointer-events:none;
      background-image:
        linear-gradient(115deg,transparent 0 49%,var(--war-accent-soft) 49.5% 50%,transparent 50.5%),
        linear-gradient(65deg,transparent 0 49%,rgba(255,255,255,.035) 49.5% 50%,transparent 50.5%);
      background-size:96px 96px
    }

    .theme-raiders{--war-accent:#ef4940;--war-accent-2:#7a1515;--war-accent-soft:rgba(239,73,64,.25);--war-sky:#291012}
    .theme-iron{--war-accent:#bd6672;--war-accent-2:#4a5360;--war-accent-soft:rgba(189,102,114,.22);--war-sky:#171a20}
    .theme-storm{--war-accent:#64a6ff;--war-accent-2:#264a78;--war-accent-soft:rgba(100,166,255,.20);--war-sky:#101a2a}
    .theme-ember{--war-accent:#f39a35;--war-accent-2:#7b4218;--war-accent-soft:rgba(243,154,53,.22);--war-sky:#2a180d}
    .theme-venom{--war-accent:#8fd45f;--war-accent-2:#3e6b2c;--war-accent-soft:rgba(143,212,95,.19);--war-sky:#142112}
    .theme-royal{--war-accent:#d5a5ff;--war-accent-2:#68468b;--war-accent-soft:rgba(213,165,255,.20);--war-sky:#21142d}

    .war-panel{
      position:relative;z-index:8;
      width:min(920px,calc(100% - 44px));
      margin:32px auto 0;
      padding:28px 30px 26px;
      border:1px solid color-mix(in srgb,var(--war-accent) 42%,rgba(255,255,255,.10));
      border-radius:24px;
      background:linear-gradient(145deg,rgba(17,20,27,.94),rgba(8,10,15,.91));
      box-shadow:0 20px 70px rgba(0,0,0,.38),0 0 42px var(--war-accent-soft);
      backdrop-filter:blur(13px)
    }
    .war-panel-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:19px;align-items:center}
    .war-emblem{
      width:78px;height:78px;display:grid;place-items:center;position:relative;
      border:1px solid color-mix(in srgb,var(--war-accent) 64%,#fff 6%);
      border-radius:22px;
      background:
        radial-gradient(circle at 35% 24%,rgba(255,255,255,.14),transparent 28%),
        linear-gradient(145deg,var(--war-accent-2),#0d0f13 70%);
      box-shadow:inset 0 0 24px rgba(0,0,0,.32),0 10px 30px var(--war-accent-soft);
      color:#fff;font-size:34px;font-weight:900
    }
    .war-emblem:after{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.14);border-radius:16px}
    .war-label{display:block;margin-bottom:3px;color:var(--war-accent);font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
    .war-name{margin:0;color:#fff;font:700 clamp(30px,5vw,52px)/1 Georgia,"Times New Roman",serif;letter-spacing:-.035em;text-wrap:balance}
    .war-slogan{margin:9px 0 0;color:#abb2be;font-size:13px;font-weight:760;letter-spacing:.10em;text-transform:uppercase}

    .war-health{margin-top:25px}
    .war-health-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:10px}
    .war-health-title{display:flex;align-items:center;gap:8px;color:#d6dae0;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .war-health-title:before{content:"♥";color:var(--war-accent);font-size:17px;filter:drop-shadow(0 0 10px var(--war-accent))}
    .war-health-values{font-variant-numeric:tabular-nums;text-align:right}
    .war-health-values strong{color:var(--war-accent);font-size:clamp(22px,3.4vw,36px)}
    .war-health-values span{color:#d8dde5;font-size:clamp(16px,2.4vw,23px);font-weight:800}
    .war-health-track{height:18px;overflow:hidden;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(0,0,0,.36);box-shadow:inset 0 2px 8px rgba(0,0,0,.44)}
    .war-health-fill{
      width:0;height:100%;position:relative;border-radius:inherit;
      background:linear-gradient(90deg,var(--war-accent-2),var(--war-accent),color-mix(in srgb,var(--war-accent) 65%,#fff));
      box-shadow:0 0 24px var(--war-accent-soft);
      transition:width .8s cubic-bezier(.2,.8,.2,1)
    }
    .war-health-fill:after{
      content:"";position:absolute;inset:0;width:42%;transform:translateX(-150%);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
      animation:hpShine 2.8s ease-in-out infinite
    }
    .war-percent{margin-top:8px;text-align:right;color:var(--war-accent);font-size:13px;font-weight:900;letter-spacing:.08em}

    .battle-stage{position:absolute;inset:230px 0 0;z-index:1;overflow:hidden;pointer-events:none}
    .battle-stage:before{
      content:"";position:absolute;left:0;right:0;bottom:0;height:47%;
      background:
        radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.05),rgba(0,0,0,.82) 73%),
        linear-gradient(180deg,transparent,rgba(0,0,0,.28));
      z-index:6
    }
    .battle-sun{
      position:absolute;right:11%;top:18%;width:170px;height:170px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,225,161,.80),var(--war-accent-soft) 37%,transparent 70%);
      filter:blur(2px);opacity:.60;animation:sunPulse 4s ease-in-out infinite
    }
    .battle-ground{position:absolute;left:-8%;right:-8%;bottom:-12%;height:44%;background:radial-gradient(ellipse at center,var(--war-accent-soft),rgba(11,10,10,.94) 58%);transform:rotate(-1.2deg)}
    .battle-smoke{position:absolute;inset:0;opacity:.34;filter:blur(12px);background:
      radial-gradient(ellipse at 20% 70%,var(--war-accent-soft),transparent 34%),
      radial-gradient(ellipse at 76% 64%,rgba(255,255,255,.12),transparent 27%),
      radial-gradient(ellipse at 53% 83%,var(--war-accent-soft),transparent 31%);
      animation:smokeDrift 9s ease-in-out infinite alternate
    }
    .battle-flags{position:absolute;inset:0;opacity:.44}
    .flag{position:absolute;width:2px;height:190px;background:rgba(210,196,166,.42);transform-origin:bottom}
    .flag:after{content:"";position:absolute;top:8px;left:2px;width:76px;height:43px;clip-path:polygon(0 0,100% 17%,77% 48%,100% 86%,0 100%);background:linear-gradient(120deg,var(--war-accent-2),var(--war-accent));animation:flagWave 2.4s ease-in-out infinite alternate}
    .flag.f1{left:12%;bottom:20%;transform:rotate(-8deg)}.flag.f2{right:13%;bottom:18%;height:220px;transform:rotate(7deg)}.flag.f2:after{left:auto;right:2px;transform:scaleX(-1)}
    .flag.f3{left:49%;bottom:19%;height:150px;opacity:.55;transform:rotate(2deg) scale(.75)}

    .fighter{position:absolute;bottom:12%;width:min(36vw,390px);filter:drop-shadow(0 22px 24px rgba(0,0,0,.55));transform-origin:50% 75%}
    .fighter.attacker{left:10%;animation:attackBob 2.6s ease-in-out infinite}
    .fighter.defender{right:10%;animation:defendBob 2.9s ease-in-out infinite}
    .fighter svg{display:block;width:100%;height:auto;overflow:visible}
    .fighter .fur{fill:#c7884f}.fighter .fur-light{fill:#f2d3ad}.fighter .armor{fill:#303743;stroke:#b4bdc7;stroke-width:3}.fighter .accent{fill:var(--war-accent);stroke:color-mix(in srgb,var(--war-accent) 65%,#fff);stroke-width:2}.fighter .dark{fill:#15181d}.fighter .eye{fill:#08090b}.fighter .shine{fill:#fff;opacity:.9}
    .attacker .weapon{transform-origin:164px 143px;animation:weaponSwing 2.6s ease-in-out infinite}
    .defender .shield{transform-origin:190px 214px;animation:shieldBrace 2.9s ease-in-out infinite}

    .slash{position:absolute;left:48%;top:46%;width:190px;height:10px;border-radius:999px;background:linear-gradient(90deg,transparent,#fff,var(--war-accent),transparent);filter:blur(.2px) drop-shadow(0 0 14px var(--war-accent));transform:rotate(-26deg);opacity:0;animation:slashFlash 2.6s ease-out infinite}
    .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--war-accent);box-shadow:0 0 12px var(--war-accent);opacity:.75;animation:sparkFly 2.4s linear infinite}
    .spark.s1{left:42%;top:52%;animation-delay:.1s}.spark.s2{left:49%;top:44%;animation-delay:.7s}.spark.s3{left:56%;top:58%;animation-delay:1.1s}.spark.s4{left:62%;top:49%;animation-delay:1.7s}.spark.s5{left:35%;top:61%;animation-delay:2s}

    .war-message{
      position:absolute;z-index:10;left:50%;bottom:42px;transform:translateX(-50%);
      width:min(620px,calc(100% - 42px));padding:17px 20px;
      border:1px solid rgba(255,255,255,.10);border-radius:18px;
      background:rgba(7,9,13,.78);backdrop-filter:blur(14px);
      color:#cbd1da;text-align:center;font-weight:750
    }
    .war-message.hidden{display:none}
    .war-message.bad{border-color:rgba(255,156,165,.30);color:#ffb6bd}

    @keyframes hpShine{0%,45%{transform:translateX(-160%)}70%,100%{transform:translateX(340%)}}
    @keyframes smokeDrift{from{transform:translate3d(-2%,1%,0) scale(1)}to{transform:translate3d(3%,-1%,0) scale(1.08)}}
    @keyframes sunPulse{0%,100%{transform:scale(.95);opacity:.48}50%{transform:scale(1.08);opacity:.72}}
    @keyframes flagWave{from{transform:skewY(-3deg) scaleX(.96)}to{transform:skewY(3deg) scaleX(1.04)}}
    @keyframes attackBob{0%,100%{transform:translate3d(0,0,0) rotate(-2deg)}48%{transform:translate3d(22px,-8px,0) rotate(2deg)}58%{transform:translate3d(30px,1px,0) rotate(4deg)}}
    @keyframes defendBob{0%,100%{transform:translate3d(0,0,0) rotate(2deg)}50%{transform:translate3d(-8px,6px,0) rotate(-2deg)}58%{transform:translate3d(-16px,11px,0) rotate(-4deg)}}
    @keyframes weaponSwing{0%,38%,100%{transform:rotate(-18deg)}52%{transform:rotate(26deg)}62%{transform:rotate(12deg)}}
    @keyframes shieldBrace{0%,100%{transform:rotate(5deg)}50%,62%{transform:rotate(-10deg) translateX(-5px)}}
    @keyframes slashFlash{0%,43%{opacity:0;transform:rotate(-26deg) scaleX(.45)}51%{opacity:.95;transform:rotate(-26deg) scaleX(1)}62%,100%{opacity:0;transform:rotate(-26deg) scaleX(1.25)}}
    @keyframes sparkFly{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(80px,-85px) scale(0);opacity:0}}


    /* Cinematic battle scene: raster artwork + lightweight atmosphere overlays. */
    .war-arena{
      min-height:640px;
      background:#090b0f;
    }
    .war-panel{
      width:min(1080px,calc(100% - 44px));
      margin:22px auto 0;
      padding:22px 24px;
      display:grid;
      grid-template-columns:minmax(0,1.08fr) minmax(330px,.92fr);
      gap:30px;
      align-items:center;
      border-radius:20px;
      background:linear-gradient(135deg,rgba(13,16,22,.96),rgba(7,9,13,.91));
      box-shadow:0 18px 52px rgba(0,0,0,.46),0 0 38px var(--war-accent-soft);
    }
    .war-panel-top{grid-template-columns:64px minmax(0,1fr);gap:16px}
    .war-emblem{width:64px;height:64px;border-radius:18px;font-size:28px}
    .war-name{font-size:clamp(30px,4.2vw,48px)}
    .war-slogan{margin-top:7px;font-size:11px}
    .war-health{margin-top:0}
    .war-health-head{align-items:center;margin-bottom:8px}
    .war-health-values strong{font-size:clamp(24px,3vw,34px)}
    .war-health-values span{font-size:clamp(15px,2vw,21px)}
    .war-health-track{height:14px}
    .war-percent{margin-top:6px}

    .battle-stage{
      position:absolute;
      inset:168px 18px 18px;
      z-index:1;
      overflow:hidden;
      pointer-events:none;
      border:1px solid color-mix(in srgb,var(--war-accent) 40%,rgba(255,255,255,.08));
      border-radius:20px;
      background:#05070a;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.02),0 16px 40px rgba(0,0,0,.34);
    }
    .battle-stage img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
      filter:saturate(1.03) contrast(1.03) brightness(.96);
    }
    .battle-stage:before{
      content:"";
      position:absolute;
      inset:0;
      z-index:2;
      background:
        linear-gradient(90deg,rgba(0,0,0,.30),transparent 22%,transparent 78%,rgba(0,0,0,.32)),
        linear-gradient(180deg,rgba(0,0,0,.12),transparent 34%,rgba(0,0,0,.28));
    }
    .battle-stage:after{
      content:"";
      position:absolute;
      left:0;right:0;bottom:0;height:42%;
      z-index:4;
      background:linear-gradient(180deg,transparent,rgba(6,7,9,.70));
    }
    .battle-tint{
      position:absolute;inset:0;z-index:1;
      background:radial-gradient(circle at 50% 60%,transparent 36%,var(--war-accent-soft) 100%);
      mix-blend-mode:color;
      opacity:.30;
    }
    .battle-smoke{
      position:absolute;inset:-10%;z-index:3;
      opacity:.34;filter:blur(18px);
      background:
        radial-gradient(ellipse at 14% 82%,rgba(0,0,0,.82),transparent 30%),
        radial-gradient(ellipse at 80% 76%,rgba(0,0,0,.68),transparent 28%),
        radial-gradient(ellipse at 52% 62%,rgba(255,255,255,.12),transparent 24%);
      animation:smokeDrift 9s ease-in-out infinite alternate;
    }
    .battle-heat{
      position:absolute;left:18%;right:18%;bottom:-8%;height:45%;z-index:3;
      opacity:.36;filter:blur(18px);
      background:radial-gradient(ellipse at center,var(--war-accent),transparent 67%);
      animation:heatPulse 3.8s ease-in-out infinite;
    }
    .spark{z-index:5}
    .spark.s1{left:31%;top:64%}.spark.s2{left:46%;top:52%}.spark.s3{left:58%;top:62%}.spark.s4{left:72%;top:48%}.spark.s5{left:40%;top:76%}

    @keyframes battleCamera{
      from{background-position:49% 100%}
      to{background-position:51% 98%}
    }
    @keyframes heatPulse{
      0%,100%{transform:scale(.94);opacity:.24}
      50%{transform:scale(1.06);opacity:.44}
    }
    @media(max-width:760px){
      .wars-page{padding-top:calc(var(--header) + 24px)}
      .wars-heading{padding:24px 0 18px}
      .wars-heading p{font-size:11px}
      .war-arena{min-height:690px;border-radius:22px}
      .war-panel{width:calc(100% - 24px);margin-top:14px;padding:18px;grid-template-columns:1fr;gap:16px}
      .war-panel-top{grid-template-columns:58px minmax(0,1fr);gap:13px}
      .war-emblem{width:58px;height:58px;border-radius:17px;font-size:27px}
      .war-name{font-size:clamp(26px,8vw,38px)}
      .war-slogan{font-size:10px;letter-spacing:.07em}
      .war-health-head{align-items:center}
      .war-health-values strong{font-size:21px}.war-health-values span{font-size:14px}
      .battle-stage{inset:260px 10px 10px;border-radius:16px}
    }
    @media(prefers-reduced-motion:reduce){
      .war-health-fill:after,.battle-smoke,.battle-heat,.spark{animation:none!important}
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="../" aria-label="Top King"><img class="tk-clan-crest" src="../assets/brand/topking-clan-crest.png" alt="Top King"></a>
    <nav class="nav">
      <a href="../" data-i18n="home"></a>
      <a href="../recipes/" data-i18n="recipes"></a>
      <a class="active" href="./" data-i18n="wars"></a>
      <a href="../ratings/" data-i18n="ratings"></a>
      <a href="../information/" data-i18n="information"></a>
      <a href="../feedback/" data-i18n="feedback"></a>
    </nav>
    <div class="languages" aria-label="Language"><button data-language="ru">RU</button><button data-language="en">EN</button><button data-language="fa">FA</button></div>
    <button class="menu-toggle" data-menu-toggle aria-expanded="false" aria-label="Menu">☰</button>
  </div>
  <nav class="mobile-nav" data-mobile-nav>
    <a href="../" data-i18n="home"></a><a href="../recipes/" data-i18n="recipes"></a><a href="../ratings/" data-i18n="ratings"></a><a href="../information/" data-i18n="information"></a><a href="../feedback/" data-i18n="feedback"></a>
  </nav>
</header>

<main class="wars-page">
  <header class="shell wars-heading">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="title"></h1>
    <p data-i18n="battleTagline"></p>
  </header>

  <section class="shell">
    <div id="war-arena" class="war-arena theme-raiders">
      <article class="war-panel">
        <div class="war-panel-top">
          <div id="war-emblem" class="war-emblem" aria-hidden="true">⚔</div>
          <div>
            <span class="war-label" data-i18n="opponent"></span>
            <h2 id="war-name" class="war-name">—</h2>
            <p id="war-slogan" class="war-slogan"></p>
          </div>
        </div>
        <div class="war-health">
          <div class="war-health-head">
            <span class="war-health-title" data-i18n="health"></span>
            <div class="war-health-values"><strong id="war-hp">0</strong><span> / <span id="war-hp-max">0</span></span></div>
          </div>
          <div id="war-health-track" class="war-health-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="war-health-fill" class="war-health-fill"></div>
          </div>
          <div id="war-percent" class="war-percent">0%</div>
        </div>
      </article>

      <div class="battle-stage" aria-hidden="true">
        <img src="../assets/war/hamster-clan-battle-static.webp" alt="" loading="eager" decoding="async">
        <div class="battle-tint"></div>
        <div class="battle-smoke"></div>
        <div class="battle-heat"></div>
        <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i>
      </div>

      <div id="war-message" class="war-message hidden"></div>
    </div>
  </section>
</main>

<footer class="footer"><div class="shell footer-row"><span data-i18n="footer"></span><a href="../feedback/" data-i18n="feedback"></a></div></footer>

<script>
window.TK_PAGE_TRANSLATIONS={
  ru:{
    pageTitle:'Клановые войны — Top King',
    eyebrow:'Текущий бой',
    title:'Клановые войны',
    battleTagline:'Сражения делают легенды',
    opponent:'Противник',
    health:'Здоровье',
    waiting:'Активного боя сейчас нет.',
    error:'Не удалось загрузить текущий бой.',
    slogan_raiders:'Шумные. Наглые. Опасные.',
    slogan_iron:'Держатся строем. Бьют тяжело.',
    slogan_storm:'Быстрые. Резкие. Непредсказуемые.',
    slogan_ember:'Горячие головы. Тяжёлый удар.',
    slogan_venom:'Тихие. Цепкие. Ядовитые.',
    slogan_royal:'Амбиции высоки. Бой будет громким.',
    slogan_default:'Новый противник на поле боя.'
  },
  en:{
    pageTitle:'Clan wars — Top King',
    eyebrow:'Current battle',
    title:'Clan wars',
    battleTagline:'Battles create legends',
    opponent:'Opponent',
    health:'Health',
    waiting:'There is no active battle now.',
    error:'Could not load the current battle.',
    slogan_raiders:'Loud. Bold. Dangerous.',
    slogan_iron:'Hold the line. Hit hard.',
    slogan_storm:'Fast. Sharp. Unpredictable.',
    slogan_ember:'Hot heads. Heavy hits.',
    slogan_venom:'Quiet. Tenacious. Venomous.',
    slogan_royal:'High ambition. Loud battle.',
    slogan_default:'A new opponent enters the battlefield.'
  },
  fa:{
    pageTitle:'جنگ‌های قبیله‌ای — Top King',
    eyebrow:'نبرد فعلی',
    title:'جنگ‌های قبیله‌ای',
    battleTagline:'نبردها افسانه می‌سازند',
    opponent:'حریف',
    health:'سلامتی',

<script src="../assets/site-i18n.js?v=20260920-10"></script>
<script>
const API='https://hk-license.89.125.1.71.sslip.io/api/v1/public/clan-war';
let currentWar=null;
let currentTheme='raiders';

const WAR_THEME_OVERRIDES={
  'шпана с окраины':{theme:'raiders',emblem:'☠'},
  'товарищи':{theme:'iron',emblem:'✦'},
  'lad':{theme:'storm',emblem:'⚡'},
  'hamster pub':{theme:'ember',emblem:'♨'},
  'top king':{theme:'royal',emblem:'♛'}
};
const WAR_THEMES=[
  {theme:'raiders',emblem:'☠'},
  {theme:'iron',emblem:'✦'},
  {theme:'storm',emblem:'⚡'},
  {theme:'ember',emblem:'♨'},
  {theme:'venom',emblem:'◆'},
  {theme:'royal',emblem:'♛'}
];

function normalizeOpponent(value){
  return String(value||'').trim().toLowerCase().replace(/\s+/g,' ');
}
function hashName(value){
  let h=2166136261;
  for(const ch of value){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}
  return h>>>0;
}
function themeFor(name){
  const key=normalizeOpponent(name);
  return WAR_THEME_OVERRIDES[key]||WAR_THEMES[hashName(key)%WAR_THEMES.length];
}
function fmtNumber(value){
  const n=Number(value);
  return Number.isFinite(n)?Math.max(0,Math.round(n)).toLocaleString(TopKingI18n.language||'ru'):'—';
}
function sloganFor(theme,s){
  return s['slogan_'+theme]||s.slogan_default||'';
}
function setTheme(info){
  currentTheme=info.theme;
  const arena=document.getElementById('war-arena');
  arena.className='war-arena theme-'+info.theme;
  document.getElementById('war-emblem').textContent=info.emblem||'⚔';
}
function render(){
  const s=TopKingI18n.strings();
  const message=document.getElementById('war-message');

  if(!currentWar){
    setTheme({theme:'iron',emblem:'⚔'});
    document.getElementById('war-name').textContent=s.waiting;
    document.getElementById('war-slogan').textContent=s.slogan_default||'';
    document.getElementById('war-hp').textContent='0';
    document.getElementById('war-hp-max').textContent='0';
    document.getElementById('war-health-fill').style.width='0%';
    document.getElementById('war-health-track').setAttribute('aria-valuenow','0');
    document.getElementById('war-percent').textContent='0%';
    message.className='war-message hidden';
    return;
  }

  const opponent=String(currentWar.opponent||'—');
  const info=themeFor(opponent);
  setTheme(info);

  const hp=Number(currentWar.opponent_hp);
  const hpMax=Number(currentWar.opponent_hp_max);
  const pct=Number.isFinite(hp)&&Number.isFinite(hpMax)&&hpMax>0
    ?Math.max(0,Math.min(100,(hp/hpMax)*100))
    :0;

  document.getElementById('war-name').textContent=opponent;
  document.getElementById('war-slogan').textContent=sloganFor(info.theme,s);
  document.getElementById('war-hp').textContent=fmtNumber(hp);
  document.getElementById('war-hp-max').textContent=fmtNumber(hpMax);
  document.getElementById('war-health-fill').style.width=pct.toFixed(2)+'%';
  document.getElementById('war-health-track').setAttribute('aria-valuenow',String(Math.round(pct)));
  document.getElementById('war-percent').textContent=Math.round(pct)+'%';
  message.className='war-message hidden';
}
async function load(){
  const message=document.getElementById('war-message');
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    currentWar=d&&d.active&&d.war?d.war:null;
    render();
  }catch(_){
    message.className='war-message bad';
    message.textContent=TopKingI18n.strings().error;
  }
}
document.addEventListener('tk-language-change',render);
load();
setInterval(load,60000);
</script>
<script src="../assets/site-nav.js?v=20260920-11"></script>
