<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https://hk-license.89.125.1.71.sslip.io; object-src 'none'; base-uri 'self'">
  <title>Новости игры — Top King</title>
  <meta name="description" content="Официальные новости Hamster King на сайте Top King.">
  <link rel="stylesheet" href="../assets/public.css?v=20260920-8">
  <link rel="icon" type="image/png" href="../assets/brand/topking-clan-crest.png">
  <link rel="apple-touch-icon" href="../assets/brand/topking-clan-crest.png">
  <style>
    .news-head{padding-bottom:24px}
    .news-head h1{font-size:clamp(44px,5vw,68px)!important}
    .news-head .lead{max-width:760px}
    .news-content{padding-top:0}
    .news-shell{width:min(980px,100%);margin-inline:auto}
    .news-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
    .news-source{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border:1px solid rgba(232,182,84,.38);border-radius:12px;color:var(--gold-light);background:rgba(232,182,84,.07);font-size:12px;font-weight:850;text-decoration:none}
    .news-message{min-height:22px;margin:0;color:var(--muted);font-size:13px}
    .news-message.bad{color:#f0a5a5}
    .news-stale{margin-bottom:14px;padding:11px 13px;border:1px solid rgba(232,182,84,.24);border-radius:12px;color:#e8cf93;background:rgba(232,182,84,.06);font-size:12px}
    .news-stale.hidden{display:none}
    .news-list{display:grid;gap:16px}
    .news-card{padding:22px 22px 20px;border:1px solid rgba(255,255,255,.09);border-radius:20px;background:linear-gradient(145deg,rgba(19,23,30,.94),rgba(10,13,18,.96));box-shadow:0 16px 42px rgba(0,0,0,.18)}
    .news-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;color:#929aa6;font-size:11px}
    .news-meta-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .news-auto{padding:3px 7px;border:1px solid rgba(232,182,84,.20);border-radius:999px;color:#d8bc7d;background:rgba(232,182,84,.05);font-size:10px;font-weight:800}
    .news-title{margin:0;color:#fff;font-size:clamp(20px,2.2vw,27px);line-height:1.28;overflow-wrap:anywhere}
    .news-media{margin:16px 0 0;overflow:hidden;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:#080b10}
    .news-media img{display:block;width:100%;height:auto;max-height:460px;object-fit:contain;background:#080b10}
    .news-text{margin:15px 0 0;color:#dce2e9;white-space:pre-wrap;line-height:1.68;font-size:14px;overflow-wrap:anywhere}
    .news-fallback{margin-top:13px;padding:10px 12px;border:1px solid rgba(232,182,84,.18);border-radius:11px;color:#d4c293;background:rgba(232,182,84,.045);font-size:12px;line-height:1.5}
    .news-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px;padding-top:15px;border-top:1px solid rgba(255,255,255,.065)}
    .news-link{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 11px;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#cfd5dd;background:rgba(255,255,255,.035);font-size:11px;font-weight:820;text-decoration:none}
    .news-link:hover{border-color:rgba(232,182,84,.35);color:#fff}
    .news-empty{padding:24px;border:1px solid rgba(255,255,255,.08);border-radius:18px;color:var(--muted);background:rgba(255,255,255,.025)}
    @media(max-width:680px){
      .news-head h1{font-size:clamp(38px,11vw,52px)!important}
      .news-toolbar{align-items:flex-start;flex-direction:column}
      .news-source{width:100%}
      .news-card{padding:17px 16px}
      .news-meta{align-items:flex-start;flex-direction:column}
      .news-media img{max-height:360px}
      .news-links{display:grid;grid-template-columns:1fr}
      .news-link{width:100%}
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="../" aria-label="Top King"><img class="tk-clan-crest" src="../assets/brand/topking-clan-crest.png" alt="Top King"></a>
    <nav class="nav" aria-label="Основная навигация"></nav>
    <div class="languages"><button data-language="ru">RU</button><button data-language="en">EN</button><button data-language="fa">FA</button></div>
    <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-label="Меню">☰</button>
  </div>
  <nav class="mobile-nav" data-mobile-nav></nav>
</header>

<main>
  <header class="shell page-head news-head">
    <p class="eyebrow" data-i18n="eyebrow">HAMSTER KING ANNOUNCEMENT</p>
    <h1 data-i18n="title">Новости игры</h1>
    <p class="lead" data-i18n="lead">Официальные публикации Hamster King. Текст автоматически показывается на выбранном языке сайта.</p>
  </header>

  <section class="section news-content">
    <div class="shell">
      <div class="news-shell">
        <div class="news-toolbar">
          <p id="news-message" class="news-message" role="status" aria-live="polite"></p>
          <a class="news-source" href="https://t.me/hamsterking_game" target="_blank" rel="noopener" data-i18n="openChannel">Открыть официальный канал</a>
        </div>
        <div id="news-stale" class="news-stale hidden" data-i18n="stale">Telegram временно недоступен — показана последняя сохранённая версия.</div>
        <div id="news-list" class="news-list"></div>
      </div>
    </div>
  </section>
</main>

<footer class="footer"><div class="shell footer-row"><span>Top King · Hamster King</span><a href="../feedback/" data-i18n="feedback">Обратная связь</a></div></footer>

<script>
window.TK_PAGE_TRANSLATIONS={
  ru:{
    pageTitle:'Новости игры — Top King',
    eyebrow:'HAMSTER KING ANNOUNCEMENT',
    title:'Новости игры',
    lead:'Официальные публикации Hamster King. Текст автоматически показывается на выбранном языке сайта.',
    openChannel:'Открыть официальный канал',
    loadingNews:'Загружаю и перевожу новости…',
    loadError:'Не удалось загрузить новости. Попробуйте позже.',
    emptyNews:'Публикации пока не загрузились.',
    stale:'Telegram временно недоступен — показана последняя сохранённая версия.',
    telegram:'Оригинал в Telegram',
    telegraph:'Telegraph',
    auto:'Автоперевод',
    translationFallback:'Автоматический перевод этой публикации временно недоступен — показан английский оригинал.',
    feedback:'Обратная связь'
  },
  en:{
    pageTitle:'Game news — Top King',
    eyebrow:'HAMSTER KING ANNOUNCEMENT',
    title:'Game news',
    lead:'Official Hamster King announcements. The original English text is shown here.',
    openChannel:'Open official channel',
    loadingNews:'Loading game news…',
    loadError:'Could not load the news feed. Please try again later.',
    emptyNews:'No announcements have loaded yet.',
    stale:'Telegram is temporarily unavailable — showing the last cached feed.',
    telegram:'Original on Telegram',
    telegraph:'Telegraph',
    auto:'Machine translation',
    translationFallback:'Translation is temporarily unavailable — showing the English original.',
    feedback:'Feedback'
  },
  fa:{
    pageTitle:'اخبار بازی — Top King',
    eyebrow:'HAMSTER KING ANNOUNCEMENT',
    title:'اخبار بازی',
    lead:'اطلاعیه‌های رسمی Hamster King. متن به‌صورت خودکار به زبان انتخاب‌شده نمایش داده می‌شود.',
    openChannel:'باز کردن کانال رسمی',
    loadingNews:'در حال بارگذاری و ترجمه اخبار…',
    loadError:'بارگذاری اخبار ممکن نشد. بعداً دوباره تلاش کنید.',
    emptyNews:'هنوز خبری بارگذاری نشده است.',
    stale:'تلگرام موقتاً در دسترس نیست — آخرین نسخه ذخیره‌شده نمایش داده می‌شود.',
    telegram:'نسخه اصلی در تلگرام',
    telegraph:'Telegraph',
    auto:'ترجمه خودکار',
    translationFallback:'ترجمه خودکار این خبر موقتاً در دسترس نیست — متن اصلی انگلیسی نمایش داده می‌شود.',
    feedback:'بازخورد'
  }
};
</script>

<script>
(()=>{
  const API='https://hk-license.89.125.1.71.sslip.io/api/v1/announcements';
  const $=id=>document.getElementById(id);
  const safe=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cache={};
  let requestId=0;
  let dataItems=[];
  let stale=false;

  function lang(){
    const value=localStorage.getItem('tk-language');
    return ['ru','en','fa'].includes(value)?value:'ru';
  }
  function strings(){
    const l=lang();
    return (window.TK_PAGE_TRANSLATIONS&&window.TK_PAGE_TRANSLATIONS[l])||window.TK_PAGE_TRANSLATIONS.ru;
  }
  function dateText(value){
    if(!value)return '';
    try{
      const l=lang();
      const locale=l==='fa'?'fa-IR':(l==='en'?'en-GB':'ru-RU');
      return new Date(value).toLocaleString(locale,{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }catch{return ''}
  }
  function splitText(text){
    const lines=String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
    const title=lines.shift()||'Hamster King Announcement';
    return {title:title.length>180?title.slice(0,177)+'…':title,body:lines.join('\n\n').trim()};
  }
  function telegraphLinks(item){
    const seen=new Set();
    return (Array.isArray(item.links)?item.links:[]).filter(link=>{
      const url=String(link.url||'');
      if(!/^https?:\/\/telegra\.ph\//i.test(url)||seen.has(url))return false;
      seen.add(url);
      return true;
    });
  }
  function render(){
    const list=$('news-list');if(!list)return;
    const l=lang(),s=strings();
    list.innerHTML=dataItems.map(item=>{
      const parts=splitText(item.text||item.text_en||'');
      const isTranslated=l!=='en'&&!!item.translated;
      const fellBack=l!=='en'&&!item.translated;
      const media=item.image_url
        ?'<figure class="news-media"><img src="'+safe(item.image_url)+'" alt="" loading="lazy" referrerpolicy="no-referrer"></figure>'
        :'';
      const links=telegraphLinks(item).slice(0,4).map(link=>
        '<a class="news-link" href="'+safe(link.url)+'" target="_blank" rel="noopener">'+safe(link.label||s.telegraph)+'</a>'
      );
      links.push('<a class="news-link" href="'+safe(item.url||'https://t.me/hamsterking_game')+'" target="_blank" rel="noopener">'+safe(s.telegram)+'</a>');
      return '<article class="news-card">'+
        '<div class="news-meta"><div class="news-meta-left"><span>'+safe(dateText(item.datetime))+'</span>'+
          (isTranslated?'<span class="news-auto">'+safe(s.auto)+'</span>':'')+
        '</div><span>#'+safe(item.id||'')+'</span></div>'+
        '<h2 class="news-title">'+safe(parts.title)+'</h2>'+
        media+
        (parts.body?'<p class="news-text">'+safe(parts.body)+'</p>':'')+
        (fellBack?'<div class="news-fallback">'+safe(s.translationFallback)+'</div>':'')+
        '<div class="news-links">'+links.join('')+'</div>'+
      '</article>';
    }).join('')||'<div class="news-empty">'+safe(s.emptyNews)+'</div>';
    $('news-stale').classList.toggle('hidden',!stale);
  }

  async function load(force=false){
    const l=lang();
    const s=strings();
    const myId=++requestId;
    $('news-message').classList.remove('bad');
    if(cache[l]&&!force){
      dataItems=cache[l].items;
      stale=cache[l].stale;
      $('news-message').textContent='';
      render();
      return;
    }
    $('news-message').textContent=s.loadingNews;
    try{
      const response=await fetch(API+'?lang='+encodeURIComponent(l),{cache:'no-store'});
      const data=await response.json();
      if(myId!==requestId)return;
      if(!response.ok)throw new Error(data.error||'request_failed');
      const packet={items:Array.isArray(data.items)?data.items:[],stale:!!data.stale};
      cache[l]=packet;
      dataItems=packet.items;
      stale=packet.stale;
      $('news-message').textContent='';
      render();
    }catch{
      if(myId!==requestId)return;
      $('news-message').textContent=s.loadError;
      $('news-message').classList.add('bad');
      dataItems=[];
      stale=false;
      render();
    }
  }

  document.addEventListener('tk-language-change',()=>load(false));
  load(false);
})();
</script>
<script src="../assets/site-i18n.js?v=20260920-8"></script>
<script src="../assets/site-nav.js?v=20260920-8"></script>
</body>
</html>
