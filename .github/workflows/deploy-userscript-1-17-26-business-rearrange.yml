name: Deploy Userscript 1.17.34 Safe Auto Routines

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-34-auto-routines-safe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch fresh live and patch
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.33" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-shop-dom-history-capture-20260922-r3" /tmp/HamsterKingMobile.user.js
          grep -Fq "game-api-rate-guard-20260922-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "public-collector-activity-lease-20260922-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-kokkaras-donor-20260922-r1" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/source.sha
          python3 deploy/topking/patch_auto_routines_safe_1_17_34.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.34" /tmp/HamsterKingMobile.user.js
          grep -Fq "auto-routines-safe-orchestrator-20260922-r2" /tmp/HamsterKingMobile.user.js
          grep -Fq "after.startedAt!==before.startedAt" /tmp/HamsterKingMobile.user.js
          grep -Fq "if(result.status!=='done')" /tmp/HamsterKingMobile.user.js
          grep -Fq "runnerActive||autoRoutineLeaseHold" /tmp/HamsterKingMobile.user.js
          grep -Fq "hkRunner.running||autoRoutineLeaseHold" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-shop-dom-history-capture-20260922-r3" /tmp/HamsterKingMobile.user.js
          grep -Fq "module-live-cooldown-20260922-r1" /tmp/HamsterKingMobile.user.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')
          a=s.index('let autoRoutineRunning = false;')
          b=s.index('function applyLanguage()',a)
          block=s[a:b]
          assert "completed+=1;\n        await sleep(250);" not in block
          assert "if(result.status!=='done')" in block
          assert "after.startedAt!==before.startedAt" in block
          assert "autoRoutineAcquireCollectorLease" in block
          assert "autoRoutineReleaseCollectorLease" in block
          print('AUTO_ROUTINES_STATIC_PATCH=PASS')
          PY

      - name: Race-safe deploy userscript
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/source.sha)"
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.34.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 "SOURCE_SHA='$source_sha' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(sha256sum /opt/hamsterking-license/HamsterKingMobile.user.js | awk '{print $1}')" = "$SOURCE_SHA"
          node --check /tmp/HamsterKingMobile.1.17.34.user.js
          stamp="$(date +%Y%m%d-%H%M%S)"
          cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.34.$stamp"
          install -m 0644 /tmp/HamsterKingMobile.1.17.34.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
          printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.17.34\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
          systemctl daemon-reload
          systemctl restart hamsterking-license.service
          systemctl is-active --quiet hamsterking-license.service
          REMOTE

      - name: Verify public exact match
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://hk-license.89.125.1.71.sslip.io/panel.js?auto-routines-safe=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.34" /tmp/public.js
          grep -Fq "auto-routines-safe-orchestrator-20260922-r2" /tmp/public.js
          grep -Fq "clan-shop-dom-history-capture-20260922-r3" /tmp/public.js
          echo "PUBLIC_1_17_34_AUTO_ROUTINES_SAFE=PASS"

      - name: Sync baseline and Stage 2.10 audit
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          printf "%s\n" \
            "USERSCRIPT_1_17_34_AUTO_ROUTINES_SAFE=PASS" \
            "version=1.17.34" \
            "base=1.17.33" \
            "stage_success_requires_new_runner=PASS" \
            "stage_success_requires_runner_done=PASS" \
            "runner_error_stops_chain=PASS" \
            "cancel_or_noop_stops_chain=PASS" \
            "stop_blocks_next_stage=PASS" \
            "auto_routine_collector_lease_continuous=PASS" \
            "collector_heartbeat_between_stages=PASS" \
            "clan_shop_dom_history_1_17_33=PRESERVED" \
            "adaptive_429_guard=PRESERVED" \
            "kokkaras_business_canon=PRESERVED" \
            "ci_game_mutations=NONE" \
            "user_browser_check=PENDING" \
            > audit/hk-userscript-1-17-34-auto-routines-safe-status.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/hk-stage2-10-auto-routines.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              '**SOURCE_PREFLIGHT_PASS · STATIC_BUG_CONFIRMED · PATCH_PREPARED · LIVE_DEPLOY_PENDING**',
              '**SOURCE_PREFLIGHT_PASS · STATIC_BUG_CONFIRMED · TECHNICAL_LIVE_PASS · USER_BROWSER_CHECK_PENDING**'
          )
          p.write_text(s,encoding='utf-8')
          p=Path('audit/HK_STAGE2_CHECKPOINT.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('- userscript: 1.17.31','- userscript: 1.17.34')
          s=s.replace('- current module status: SOURCE_PREFLIGHT_PENDING','- current module status: SOURCE_PREFLIGHT_PASS · STATIC_BUG_CONFIRMED · TECHNICAL_LIVE_PASS · USER_BROWSER_CHECK_PENDING')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-34-auto-routines-safe-status.txt audit/hk-stage2-10-auto-routines.md audit/HK_STAGE2_CHECKPOINT.md
          if ! git diff --cached --quiet; then
            git commit -m "fix: harden Auto Routines orchestration in userscript 1.17.34"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
