name: Deploy Userscript 1.17.29 Game API Rate Guard

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-29-rate-guard-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Validate candidate
        run: |
          set -euo pipefail
          cp deploy/topking/HamsterKingMobile.1.17.29.rate-guard.candidate.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.29" /tmp/HamsterKingMobile.user.js
          grep -Fq "game-api-rate-guard-20260922-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "GAME_API_MIN_REQUEST_GAP_MS = 1800" /tmp/HamsterKingMobile.user.js
          grep -Fq "if (response.status === 429) throw gameApiRateLimitError(path,response);" /tmp/HamsterKingMobile.user.js
          grep -Fq "firstError?.name==='HKRateLimitError'" /tmp/HamsterKingMobile.user.js
          grep -Fq "pairError?.name==='HKRateLimitError'" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-kokkaras-donor-20260922-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-runner-canon-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-shop-purchase-history-capture-20260922-r1" /tmp/HamsterKingMobile.user.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text()
          a=s.index('async function apiJsonCore(')
          b=s.index('const HK_MUTATION_GATE_REV',a)
          block=s[a:b]
          assert 'response.status === 429 || response.status >= 500' not in block
          assert 'payload.count = 1' not in s
          PY

      - name: Deploy userscript
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.29.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.1.17.29.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.29.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.1.17.29.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.17.29\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
            systemctl daemon-reload
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public script
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://hk-license.89.125.1.71.sslip.io/panel.js?rate-guard=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.29" /tmp/public.js
          grep -Fq "game-api-rate-guard-20260922-r1" /tmp/public.js
          grep -Fq "businesses-kokkaras-donor-20260922-r1" /tmp/public.js
          grep -Fq "clan-shop-purchase-history-capture-20260922-r1" /tmp/public.js
          echo "PUBLIC_1_17_29_RATE_GUARD=PASS"

      - name: Sync baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          printf "%s\n" \
            "USERSCRIPT_1_17_29_GAME_API_RATE_GUARD=PASS" \
            "version=1.17.29" \
            "base=1.17.28" \
            "game_api_min_gap_ms=1800" \
            "http_429_retry=DISABLED" \
            "http_429_cooldown_ms=60000" \
            "business_429_refresh=DISABLED" \
            "business_429_rollback=DISABLED" \
            "kokkaras_business_canon=PRESERVED" \
            "business_runner_canon=PRESERVED" \
            "clan_shop_1_17_25=PRESERVED" \
            > audit/hk-userscript-1-17-29-game-api-rate-guard-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-29-game-api-rate-guard-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix: add Game API 429 rate guard in userscript 1.17.29"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
