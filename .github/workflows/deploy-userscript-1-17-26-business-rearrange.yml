name: Deploy Userscript 1.17.35 Auto Routines in Today

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-35-auto-routines-today-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch fresh live and patch
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.34" /tmp/HamsterKingMobile.user.js
          grep -Fq "auto-routines-safe-orchestrator-20260922-r2" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-shop-dom-history-capture-20260922-r3" /tmp/HamsterKingMobile.user.js
          grep -Fq "game-api-rate-guard-20260922-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "public-collector-activity-lease-20260922-r1" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/source.sha
          python3 deploy/topking/patch_auto_routines_into_today_1_17_35.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.35" /tmp/HamsterKingMobile.user.js
          grep -Fq "auto-routines-in-today-20260922-r3" /tmp/HamsterKingMobile.user.js
          grep -Fq "auto-routines-safe-orchestrator-20260922-r2" /tmp/HamsterKingMobile.user.js
          grep -Fq '<div id="hk-routines-content" class="hk-cardbox" style="margin-top:12px"></div>' /tmp/HamsterKingMobile.user.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')
          assert "{page:'routines',ru:'Авто-рутины',en:'Auto routines'}" not in s
          assert 'data-content="routines"' not in s
          assert s.count('id="hk-routines-content"') == 1
          assert "if (finalPage === 'daily') { renderDailyTasks(); renderAutoRoutines(); }" in s
          assert "rememberedRaw==='routines'?'daily':rememberedRaw" in s
          print('AUTO_ROUTINES_TODAY_STATIC=PASS')
          PY

      - name: Race-safe deploy userscript
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/source.sha)"
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.35.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 "SOURCE_SHA='$source_sha' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(sha256sum /opt/hamsterking-license/HamsterKingMobile.user.js | awk '{print $1}')" = "$SOURCE_SHA"
          node --check /tmp/HamsterKingMobile.1.17.35.user.js
          stamp="$(date +%Y%m%d-%H%M%S)"
          cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.35.$stamp"
          install -m 0644 /tmp/HamsterKingMobile.1.17.35.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
          printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.17.35\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
          systemctl daemon-reload
          systemctl restart hamsterking-license.service
          systemctl is-active --quiet hamsterking-license.service
          REMOTE

      - name: Verify public exact match
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://hk-license.89.125.1.71.sslip.io/panel.js?auto-routines-today=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.35" /tmp/public.js
          grep -Fq "auto-routines-in-today-20260922-r3" /tmp/public.js
          grep -Fq "auto-routines-safe-orchestrator-20260922-r2" /tmp/public.js
          echo "PUBLIC_1_17_35_AUTO_ROUTINES_TODAY=PASS"

      - name: Sync baseline and audit
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          printf "%s\n" \
            "USERSCRIPT_1_17_35_AUTO_ROUTINES_TODAY=PASS" \
            "version=1.17.35" \
            "base=1.17.34" \
            "standalone_routines_tab=REMOVED" \
            "routines_embedded_in_today=PASS" \
            "saved_routine_selection=PRESERVED" \
            "legacy_nav_routines_migrates_to_daily=PASS" \
            "safe_auto_routines_1_17_34=PRESERVED" \
            "collector_lease=PRESERVED" \
            "adaptive_429_guard=PRESERVED" \
            "clan_shop_1_17_33=PRESERVED" \
            "ci_game_mutations=NONE" \
            "user_browser_check=PENDING" \
            > audit/hk-userscript-1-17-35-auto-routines-today-status.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/hk-stage2-10-auto-routines.md')
          s=p.read_text(encoding='utf-8')
          s += '\n## UI consolidation 1.17.35\n\n- User feedback: standalone Auto Routines overlaps Today and appears as a list of empty checkboxes.\n- Standalone navigation/page removed.\n- Existing Auto Routines block moved under Today.\n- Saved routine selections and fail-closed orchestration are preserved.\n- Legacy saved navModule=routines migrates to daily.\n- Technical live deployment: PASS; browser check remains pending.\n'
          p.write_text(s,encoding='utf-8')
          p=Path('audit/HK_STAGE2_CHECKPOINT.md')
          s=p.read_text(encoding='utf-8').replace('- userscript: 1.17.34','- userscript: 1.17.35')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-35-auto-routines-today-status.txt audit/hk-stage2-10-auto-routines.md audit/HK_STAGE2_CHECKPOINT.md
          if ! git diff --cached --quiet; then
            git commit -m "fix: move Auto Routines into Today in userscript 1.17.35"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
