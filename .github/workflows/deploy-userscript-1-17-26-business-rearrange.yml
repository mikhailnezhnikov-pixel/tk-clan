name: Deploy Userscript 1.17.27 Business Timeout Safe

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-27-business-timeout-safe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Validate candidate
        run: |
          set -euo pipefail
          cp deploy/topking/HamsterKingMobile.1.17.27.candidate.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.27" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-rearrange-timeout-safe-20260922-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUSINESS_MUTATION_TIMEOUT_MS=60000;" /tmp/HamsterKingMobile.user.js
          grep -Fq "return {__hk_skipped:true,reason:'game_logic',state};" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-shop-purchase-history-capture-20260922-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-runner-canon-20260921-r1" /tmp/HamsterKingMobile.user.js
          if grep -Fq "businessAction('remove',state)" /tmp/HamsterKingMobile.user.js; then exit 1; fi

      - name: Deploy userscript
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.27.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.1.17.27.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.27.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.1.17.27.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.17.27\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
            systemctl daemon-reload
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public script
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://hk-license.89.125.1.71.sslip.io/panel.js?business-timeout-safe=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.27" /tmp/public.js
          grep -Fq "businesses-rearrange-timeout-safe-20260922-r1" /tmp/public.js
          grep -Fq "clan-shop-purchase-history-capture-20260922-r1" /tmp/public.js
          echo "PUBLIC_1_17_27_BUSINESS_TIMEOUT_SAFE=PASS"

      - name: Sync baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          printf "%s\n" "USERSCRIPT_1_17_27_BUSINESS_TIMEOUT_SAFE=PASS" "version=1.17.27" "base=1.17.26" "business_timeout_ms=60000" "blind_remove_retry=REMOVED" "game_logic_skip=PASS" "uncertain_auto_rollback=DISABLED" "business_runner_canon=PRESERVED" "clan_shop_1_17_25=PRESERVED" > audit/hk-userscript-1-17-27-business-timeout-safe-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-27-business-timeout-safe-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix: make Businesses timeout handling safe in 1.17.27"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
