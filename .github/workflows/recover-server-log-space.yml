name: Recover Server Log Space

on:
  push:
    paths:
      - 'deploy/topking/server-log-space-recover-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Vacuum system journal and restart license service
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== BEFORE ==="
          df -h /
          journalctl --disk-usage || true
          journalctl --vacuum-size=256M
          sync
          echo "=== AFTER VACUUM ==="
          df -h /
          journalctl --disk-usage || true
          test -f /var/lib/hamsterking-license/licenses.db
          test -f /var/lib/hamsterking-license/licenses.db.bak.rumors-shared-r2.20260926-063329
          python3 -m py_compile /opt/hamsterking-license/server.py
          grep -Fq "HK_RUMORS_COORDINATOR_R3" /opt/hamsterking-license/server.py
          systemctl restart hamsterking-license.service
          sleep 3
          systemctl is-active --quiet hamsterking-license.service
          curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:8787/health -o /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True,d
          print('LOCAL_HEALTH=PASS')
          PY
          REMOTE
      - name: Verify public health
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 https://hk-license.89.125.1.71.sslip.io/health -o /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True,d
          print('PUBLIC_HEALTH=PASS')
          PY
      - name: Persist audit
        run: |
          set -euo pipefail
          git pull --rebase origin main
          {
            echo "SERVER_LOG_SPACE_RECOVERY=PASS"
            echo "db_files=UNCHANGED"
            echo "rumors_shared_r2_backup=PRESERVED"
            echo "rumors_r3_server_marker=PRESENT"
            echo "local_health=PASS"
            echo "public_health=PASS"
          } > audit/hk-server-log-space-recovery.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-server-log-space-recovery.txt
          git commit -m "ops: recover license service disk space"
          git push origin HEAD:main
