name: Verify HK Loader Current Core

on:
  push:
    paths:
      - 'deploy/topking/hk-loader-current-verify-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public loader
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 30 \
            "https://tk-clan.ru/hk/loader.js?verify=$(date +%s)" -o /tmp/loader.js
          grep -Fq "const LOADER_REV='loader-20260921-r12';" /tmp/loader.js
          grep -Fq "const EXPECTED_CORE_REV='core-20260921-r15-late-login-handoff';" /tmp/loader.js
          ! grep -Fq "const EXPECTED_CORE_REV='core-20260920-r6';" /tmp/loader.js
          ! grep -Fq " · r6" /tmp/loader.js
          echo "PUBLIC_HK_LOADER_CURRENT_CORE=PASS"
