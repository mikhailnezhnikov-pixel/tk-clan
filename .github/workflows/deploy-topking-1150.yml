name: Deploy TopKing 1.15.0 Stage 1 Runner

on:
  push:
    paths:
      - '.github/workflows/deploy-topking-1150.yml'
      - 'deploy/topking/stage1_runner_patch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Fetch live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.14.4$' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
      - name: Build and validate Stage 1
        run: |
          set -euo pipefail
          python3 deploy/topking/stage1_runner_patch.py
          grep -q '^// @version      1.15.0$' /tmp/HamsterKingMobile.user.js
          grep -q 'const hkMutationGate' /tmp/HamsterKingMobile.user.js
          grep -q 'runtime.mutationGate = hkMutationGate' /tmp/HamsterKingMobile.user.js
          grep -q 'return hkMutationGate.run' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | tee /tmp/topking-1150.sha256
      - name: Deploy and verify
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -euo pipefail;
            stamp="$(date +%Y%m%d-%H%M%S)";
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp";
            node --check /tmp/HamsterKingMobile.user.js;
            install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js;
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.15.0\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf;
            systemctl daemon-reload;
            systemctl restart hamsterking-license.service;
            systemctl is-active --quiet hamsterking-license.service;
            sleep 2;
            (curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/cabinet/config || curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/cabinet/config) >/tmp/cabinet.json;
            grep -q "^// @version      1.15.0$" /opt/hamsterking-license/HamsterKingMobile.user.js;
            grep -q "const hkMutationGate" /opt/hamsterking-license/HamsterKingMobile.user.js;
            grep -q "runtime.mutationGate = hkMutationGate" /opt/hamsterking-license/HamsterKingMobile.user.js;
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js;
            echo DEPLOY_OK'
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/topking-1150.sha256
