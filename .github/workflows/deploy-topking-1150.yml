name: Deploy TopKing 1.15.0 Stage 1 Runner

on:
  push:
    paths:
      - 'deploy/topking/stage1-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -Eq '^// @version      (1\.14\.4|1\.15\.0)$' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Build and validate Stage 1
        run: |
          set -euo pipefail
          python3 deploy/topking/test_stage1_patch_fixture.py
          python3 deploy/topking/stage1_runner_patch.py
          grep -q '^// @version      1.15.0$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MUTATION_GATE_REV = 'stage1-20260919-r4'" /tmp/HamsterKingMobile.user.js
          grep -Fq "GROWTH_HAMSTER_BUDGET_ID = 'cur_cap'" /tmp/HamsterKingMobile.user.js
          grep -Fq "GROWTH_GENERAL_BUDGET_ID = 'item_pit_token'" /tmp/HamsterKingMobile.user.js
          grep -Fq 'growthCostOnlyUses(cost,[GROWTH_HAMSTER_BUDGET_ID])' /tmp/HamsterKingMobile.user.js
          grep -Fq 'growthCostOnlyUses(cost,[GROWTH_GENERAL_BUDGET_ID])' /tmp/HamsterKingMobile.user.js
          grep -Fq 'growthGeneralCostSafe(fast)' /tmp/HamsterKingMobile.user.js
          grep -Fq 'growthGeneralCostSafe(costs)' /tmp/HamsterKingMobile.user.js
          grep -Fq 'growth-general-no-progress' /tmp/HamsterKingMobile.user.js
          grep -Fq 'growth-hamster-no-progress' /tmp/HamsterKingMobile.user.js
          grep -Fq 'const hkMutationGate' /tmp/HamsterKingMobile.user.js
          grep -Fq 'const safeDiagnostic' /tmp/HamsterKingMobile.user.js
          grep -Fq 'runtime.mutationGate = hkMutationGate' /tmp/HamsterKingMobile.user.js
          grep -Fq 'return hkMutationGate.run' /tmp/HamsterKingMobile.user.js
          grep -Fq 'HKNetworkTimeout' /tmp/HamsterKingMobile.user.js
          grep -Fq 'GROWTH_NO_PROGRESS_LIMIT' /tmp/HamsterKingMobile.user.js
          ! grep -Fq 'hk-growth-nuts-percent' /tmp/HamsterKingMobile.user.js
          ! grep -Fq 'growthNutCost' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | tee /tmp/topking-1150.sha256

      - name: Deploy with rollback and verify service
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            live=/opt/hamsterking-license/HamsterKingMobile.user.js
            incoming=/tmp/HamsterKingMobile.user.js
            stamp=$(date +%Y%m%d-%H%M%S)
            backup="${live}.bak.${stamp}"
            old_version=$(grep -m1 "^// @version" "$live" | sed "s#^// @version[[:space:]]*##")

            node --check "$incoming"
            grep -q "^// @version      1.15.0$" "$incoming"
            grep -q "stage1-20260919-r4" "$incoming"
            grep -q "GROWTH_HAMSTER_BUDGET_ID.*cur_cap" "$incoming"
            grep -q "GROWTH_GENERAL_BUDGET_ID.*item_pit_token" "$incoming"
            grep -Fq "growthCostOnlyUses(cost,[GROWTH_HAMSTER_BUDGET_ID])" "$incoming"
            grep -Fq "growthCostOnlyUses(cost,[GROWTH_GENERAL_BUDGET_ID])" "$incoming"
            grep -Fq "growth-general-no-progress" "$incoming"
            grep -Fq "growth-hamster-no-progress" "$incoming"

            cp -a "$live" "$backup"
            install -m 0644 "$incoming" "$live"
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.15.0\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
            systemctl daemon-reload

            deploy_ok=1
            systemctl restart hamsterking-license.service || deploy_ok=0
            systemctl is-active --quiet hamsterking-license.service || deploy_ok=0
            if [ "$deploy_ok" = "1" ]; then
              sleep 2
              (curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/cabinet/config || curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/cabinet/config) >/tmp/cabinet.json || deploy_ok=0
            fi

            if [ "$deploy_ok" != "1" ]; then
              echo "Stage 1 health check failed; rolling back to $old_version" >&2
              install -m 0644 "$backup" "$live"
              printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=$old_version\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
              systemctl daemon-reload
              systemctl restart hamsterking-license.service || true
              exit 1
            fi

            node --check "$live"
            grep -q "^// @version      1.15.0$" "$live"
            grep -q "stage1-20260919-r4" "$live"
            grep -Fq "growthCostOnlyUses(cost,[GROWTH_HAMSTER_BUDGET_ID])" "$live"
            grep -Fq "growthCostOnlyUses(cost,[GROWTH_GENERAL_BUDGET_ID])" "$live"
            grep -Fq "growth-general-no-progress" "$live"
            grep -Fq "growth-hamster-no-progress" "$live"
            echo DEPLOY_OK
          '

      - name: Fetch live back and record verification
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/topking-live-after-deploy.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/topking-live-after-deploy.js
          node --check /tmp/topking-live-after-deploy.js
          grep -q '^// @version      1.15.0$' /tmp/topking-live-after-deploy.js
          grep -Fq "HK_MUTATION_GATE_REV = 'stage1-20260919-r4'" /tmp/topking-live-after-deploy.js
          grep -Fq "GROWTH_HAMSTER_BUDGET_ID = 'cur_cap'" /tmp/topking-live-after-deploy.js
          grep -Fq "GROWTH_GENERAL_BUDGET_ID = 'item_pit_token'" /tmp/topking-live-after-deploy.js
          grep -Fq 'growthCostOnlyUses(cost,[GROWTH_HAMSTER_BUDGET_ID])' /tmp/topking-live-after-deploy.js
          grep -Fq 'growthCostOnlyUses(cost,[GROWTH_GENERAL_BUDGET_ID])' /tmp/topking-live-after-deploy.js
          grep -Fq 'growth-general-no-progress' /tmp/topking-live-after-deploy.js
          grep -Fq 'growth-hamster-no-progress' /tmp/topking-live-after-deploy.js

          live_sha=$(sha256sum /tmp/topking-live-after-deploy.js | awk '{print $1}')
          {
            echo 'version=1.15.0'
            echo 'revision=stage1-20260919-r4'
            echo 'hamsters=cur_cap'
            echo 'generals=item_pit_token'
            echo 'growth_guards=strict'
            echo 'no_progress_limit=2'
            echo "sha256=$live_sha"
            echo 'verified_by=deploy-topking-1150'
          } > /tmp/hk-stage1-live-status.txt

          grep -nE -C 10 'const hkRunner|AbortController|waitIfPaused|pitRunning|fairRunning|fairStop|shopRunning|recipeRunning|recipeStop|bureauRunning|moduleMutationBusy|const hkStateStore|hkStateStore\.|async function apiJsonCore|async function apiJson\(' \
            /tmp/topking-live-after-deploy.js > /tmp/hk-stage1-live-snippets.txt || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit
            cp /tmp/hk-stage1-live-status.txt audit/hk-stage1-live-status.txt
            cp /tmp/hk-stage1-live-snippets.txt audit/hk-stage1-live-snippets.txt
            git add audit/hk-stage1-live-status.txt audit/hk-stage1-live-snippets.txt
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m "Verify live TopKing 1.15.0 Stage 1 r4"
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = "1"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/topking-1150.sha256 /tmp/topking-live-after-deploy.js /tmp/hk-stage1-live-status.txt /tmp/hk-stage1-live-snippets.txt
