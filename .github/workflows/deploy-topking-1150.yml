name: Deploy TopKing 1.15.0 Stage 1 Runner

concurrency:
  group: deploy-topking-1150
  cancel-in-progress: true

on:
  push:
    paths:
      - '.github/workflows/deploy-topking-1150.yml'
      - 'deploy/topking/stage1_runner_patch.py'
      - 'deploy/topking/test_stage1_mutation_gate.js'
      - 'deploy/topking/test_stage1_patch_fixture.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -Eq '^// @version      (1\.14\.4|1\.15\.0)$' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Build and validate Stage 1
        run: |
          set -euo pipefail
          python3 deploy/topking/test_stage1_patch_fixture.py
          python3 deploy/topking/stage1_runner_patch.py
          grep -q '^// @version      1.15.0$' /tmp/HamsterKingMobile.user.js
          grep -q "HK_MUTATION_GATE_REV.*stage1-20260919-r4" /tmp/HamsterKingMobile.user.js
          grep -q "GROWTH_HAMSTER_BUDGET_ID.*cur_cap" /tmp/HamsterKingMobile.user.js
          grep -q "GROWTH_GENERAL_BUDGET_ID.*item_pit_token" /tmp/HamsterKingMobile.user.js
          grep -q 'const hkMutationGate' /tmp/HamsterKingMobile.user.js
          grep -q 'const safeDiagnostic' /tmp/HamsterKingMobile.user.js
          grep -q 'runtime.mutationGate = hkMutationGate' /tmp/HamsterKingMobile.user.js
          grep -q 'return hkMutationGate.run' /tmp/HamsterKingMobile.user.js
          grep -q 'HKNetworkTimeout' /tmp/HamsterKingMobile.user.js
          grep -q 'GROWTH_NO_PROGRESS_LIMIT' /tmp/HamsterKingMobile.user.js
          ! grep -q 'hk-growth-nuts-percent' /tmp/HamsterKingMobile.user.js
          ! grep -q 'growthNutCost' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | tee /tmp/topking-1150.sha256

      - name: Deploy and verify
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -euo pipefail;
            stamp="$(date +%Y%m%d-%H%M%S)";
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp";
            node --check /tmp/HamsterKingMobile.user.js;
            install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js;
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.15.0\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf;
            systemctl daemon-reload;
            systemctl restart hamsterking-license.service;
            systemctl is-active --quiet hamsterking-license.service;
            sleep 2;
            (curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/cabinet/config || curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/cabinet/config) >/tmp/cabinet.json;
            grep -q "^// @version      1.15.0$" /opt/hamsterking-license/HamsterKingMobile.user.js;
            grep -q "HK_MUTATION_GATE_REV.*stage1-20260919-r4" /opt/hamsterking-license/HamsterKingMobile.user.js;
            grep -q "GROWTH_HAMSTER_BUDGET_ID.*cur_cap" /opt/hamsterking-license/HamsterKingMobile.user.js;
            grep -q "GROWTH_GENERAL_BUDGET_ID.*item_pit_token" /opt/hamsterking-license/HamsterKingMobile.user.js;
            grep -q "const hkMutationGate" /opt/hamsterking-license/HamsterKingMobile.user.js;
            grep -q "const safeDiagnostic" /opt/hamsterking-license/HamsterKingMobile.user.js;
            grep -q "runtime.mutationGate = hkMutationGate" /opt/hamsterking-license/HamsterKingMobile.user.js;
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js;
            echo DEPLOY_OK'

      - name: Fetch live back and record verification
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/topking-live-after-deploy.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/topking-live-after-deploy.js
          node --check /tmp/topking-live-after-deploy.js
          grep -q '^// @version      1.15.0 /tmp/topking-live-after-deploy.js
          grep -q "HK_MUTATION_GATE_REV.*stage1-20260919-r4" /tmp/topking-live-after-deploy.js
          grep -q "GROWTH_HAMSTER_BUDGET_ID.*cur_cap" /tmp/topking-live-after-deploy.js
          grep -q "GROWTH_GENERAL_BUDGET_ID.*item_pit_token" /tmp/topking-live-after-deploy.js

          mkdir -p audit
          live_sha="$(sha256sum /tmp/topking-live-after-deploy.js | awk '{print $1}')"
          {
            echo "version=1.15.0"
            echo "revision=stage1-20260919-r4"
            echo "hamsters=cur_cap"
            echo "generals=item_pit_token"
            echo "sha256=$live_sha"
            echo "verified_by=deploy-topking-1150"
          } > audit/hk-stage1-live-status.txt

          grep -nE -C 10 'const hkRunner|AbortController|waitIfPaused|stopRequested|pitRunning|fairRunning|fairStop|recipeRunning|recipeStop|moduleMutationBusy|const hkStateStore|hkStateStore\.|async function apiJsonCore|async function apiJson\(' /tmp/topking-live-after-deploy.js > audit/hk-stage1-live-snippets.txt || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage1-live-status.txt audit/hk-stage1-live-snippets.txt
          if ! git diff --cached --quiet; then
            git commit -m "Verify live TopKing 1.15.0 Stage 1 r4"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/topking-1150.sha256 /tmp/topking-live-after-deploy.js
