name: Build Userscript 1.17.90 Shop 429 Resume

on:
  push:
    paths:
      - 'deploy/topking/patch_shop_rate_limit_resume_1_17_90.py'
      - '.github/workflows/build-userscript-1-17-90-shop-rate-limit-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-userscript-1-17-90-shop-rate-limit-resume
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate from exact live baseline
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          test -f "$base"
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.17.89" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.17.89';" /tmp/HamsterKingMobile.user.js
          grep -Fq "fair-reroll-timeout-reconcile-20260925-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "shop-buy-fast-path-20260923-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_shop_rate_limit_resume_1_17_90.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.90" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.17.90';" /tmp/HamsterKingMobile.user.js
          grep -Fq "shop-rate-limit-resume-20260925-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "const SHOP_BUY_MIN_GAP_MS = 700;" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function shopBuyWithRateLimitResume" /tmp/HamsterKingMobile.user.js
          grep -Fq "Магазин: лимит 429" /tmp/HamsterKingMobile.user.js

          if grep -Fq "const gapMs=fastShopBuy?0:gameApiCurrentGapMs();" /tmp/HamsterKingMobile.user.js; then
            echo "Zero-gap shop buy path still present" >&2
            exit 1
          fi

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate and release manifest
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.17.90.shop-rate-limit-resume.candidate.user.js
          audit=audit/hk-userscript-1-17-90-shop-rate-limit-resume-predeploy.txt

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
            cp /tmp/HamsterKingMobile.user.js "$candidate"

            python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.17.89':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")

          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)

          out={
              'schema':1,
              'source_version':'1.17.89',
              'target_version':'1.17.90',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.17.90.shop-rate-limit-resume.candidate.user.js',
              'primary_marker':'shop-rate-limit-resume-20260925-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-17-90-shop-rate-limit-resume-live-status.txt',
              'commit_message':'fix: deploy Shop 429 auto-resume in userscript 1.17.90',
          }
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

            mkdir -p "$(dirname "$audit")"
            {
              echo "USERSCRIPT_1_17_90_SHOP_RATE_LIMIT_RESUME_PREDEPLOY=PASS"
              echo "source_version=1.17.89"
              echo "target_version=1.17.90"
              echo "base_sha256=$(cat /tmp/base.sha)"
              echo "candidate_sha256=$(cat /tmp/candidate.sha)"
              echo "shop_buy_min_gap_ms=700"
              echo "shop_buy_post_429_gap_ms=1500"
              echo "429_auto_wait_resume=PASS"
              echo "blind_network_retry=DISABLED"
              echo "syntax=PASS"
            } > "$audit"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$candidate" deploy/topking/userscript-release.json "$audit"
            git commit -m "build: prepare userscript 1.17.90 Shop 429 resume"

            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep 2
          done

          test "$pushed" = 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
