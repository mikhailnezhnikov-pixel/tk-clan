name: Deploy maps visibility access V2

on:
  push:
    paths:
      - 'deploy/topking/unified-maps-u1-live-trigger.txt'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/topking
          chmod 600 ~/.ssh/topking

      - name: Build server candidate from exact live
        run: |
          set -euo pipefail
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          before_sha="$(sha256sum /tmp/server.py | awk '{print $1}')"
          echo "SERVER_SHA_BEFORE=$before_sha"
          if [ "$before_sha" != "4c98d3dee4f76dddbff073293688e665cc596171d05ae04d9e159849c7c4f753" ] && [ "$before_sha" != "12f4ea6ee5032bac565015578fd9c174daa235bc138c803eebabfc5bdd9d7556" ]; then
            echo "unexpected live server sha: $before_sha"
            exit 1
          fi
          python3 deploy/topking/patch_server_maps_visibility_access_v2.py
          python3 -m py_compile /tmp/server.py
          grep -Fq "HK_MAP_VISIBILITY_ACCESS_V2" /tmp/server.py
          candidate_sha="$(sha256sum /tmp/server.py | awk '{print $1}')"
          echo "$candidate_sha" > /tmp/server-candidate.sha
          echo "SERVER_SHA_CANDIDATE=$candidate_sha"

      - name: Verify access behavior on temporary DB
        run: |
          cat > /tmp/maps-access-v2-test.py <<'PY'
          import importlib.util, os, tempfile, time
          spec=importlib.util.spec_from_file_location('s','/tmp/server.py')
          s=importlib.util.module_from_spec(spec); spec.loader.exec_module(s)
          fd,path=tempfile.mkstemp(prefix='maps-access-v2-',suffix='.db'); os.close(fd)
          try:
              s.DB_PATH=path
              s.init_db()
              now=int(time.time())
              with s.db_session() as db:
                  db.execute("""INSERT INTO clan_members(
                      telegram_id,note,first_name,username,linked_player_id,active,maps_access,maps_manage,created_at,updated_at
                  ) VALUES(?,?,?,?,?,?,?,?,?,?)""",
                  ('11111','manager','Manager','',None,1,1,1,now,now))
                  db.execute("""INSERT INTO clan_members(
                      telegram_id,note,first_name,username,linked_player_id,active,maps_access,maps_manage,created_at,updated_at
                  ) VALUES(?,?,?,?,?,?,?,?,?,?)""",
                  ('22222','viewer','Viewer','',None,1,0,0,now,now))

              row={'key':'hk_access0101','city':'AccessCity','grid':'01:01','invest':0,'buildings':1,'unknown':0,
                   'crystals':[1,0,0,0,0,0],'eventBuildings':0,'totalEvents':0,'progress':100,'score':1,
                   'reward':{'max':0,'normal':0,'investment':0},'open_url':'/maps/view/?key=hk_access0101'}
              s.import_hk_maps_index([row])
              s.import_hk_map_points([['hk_access0101',[3000000,4000000,0]]])

              manager={'telegram_id':'11111','maps_manage':1,'maps_access':1}
              viewer={'telegram_id':'22222','maps_manage':0,'maps_access':0}

              locked=s.cabinet_maps(viewer)
              assert len(locked['maps'])==1,locked
              item=locked['maps'][0]
              assert item['access_state']=='locked' and item['access_allowed'] is False,item
              assert locked['members']==[],locked
              try:
                  s.hk_map_data('hk_access0101',member=viewer)
                  raise AssertionError('private data opened without permission')
              except PermissionError:
                  pass

              s.set_member_map_scope(manager,'22222','map','hk_access0101',True)
              granted=s.cabinet_maps(viewer)
              item2=granted['maps'][0]
              assert item2['access_state']=='granted' and item2['access_allowed'] is True,item2
              data=s.hk_map_data('hk_access0101',member=viewer)
              assert data.get('ok') is True,data

              print('MAPS_VISIBLE_WITHOUT_ACCESS=PASS')
              print('MAP_PRIVATE_DATA_LOCKED=PASS')
              print('MAP_SINGLE_GRANT_UNLOCKS=PASS')
              print('MAP_MANAGER_MEMBER_LIST_NOT_LEAKED=PASS')
          finally:
              try: os.remove(path)
              except OSError: pass
          PY
          python3 /tmp/maps-access-v2-test.py

      - name: Read-only production precheck
        run: |
          cat > /tmp/maps-v2-prod-check.py <<'PY'
          import json,sqlite3
          db=sqlite3.connect('file:/var/lib/hamsterking-license/licenses.db?mode=ro',uri=True);db.row_factory=sqlite3.Row
          def table(name):
              return bool(db.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",(name,)).fetchone())
          out={
            'catalog':db.execute("SELECT COUNT(*) FROM hk_maps_catalog").fetchone()[0],
            'area_links':db.execute("SELECT COUNT(*) FROM hk_map_area_links").fetchone()[0],
            'areas':db.execute("SELECT COUNT(*) FROM map_areas").fetchone()[0],
            'buildings':db.execute("SELECT COUNT(*) FROM map_buildings").fetchone()[0],
            'access_rules':db.execute("SELECT COUNT(*) FROM hk_map_access_rules").fetchone()[0] if table('hk_map_access_rules') else 0,
          }
          print(json.dumps(out,sort_keys=True))
          assert out['catalog']==235,out
          assert out['area_links']==235,out
          assert out['areas']==385,out
          assert out['buildings']==222153,out
          db.close()
          PY
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/maps-v2-prod-check.py root@89.125.1.71:/tmp/maps-v2-prod-check.py
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/maps-v2-prod-check.py' | tee /tmp/maps-v2-before.json

      - name: Backup and deploy server only
        run: |
          set -euo pipefail
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/server.py root@89.125.1.71:/tmp/server.maps-access-v2.py
          candidate_sha="$(cat /tmp/server-candidate.sha)"
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 "
            set -euo pipefail
            stamp=\$(date +%Y%m%d-%H%M%S)
            cp -a /opt/hamsterking-license/server.py /opt/hamsterking-license/server.py.bak.maps-access-v2.\$stamp
            install -m 0644 /tmp/server.maps-access-v2.py /opt/hamsterking-license/server.py
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
            actual=\$(sha256sum /opt/hamsterking-license/server.py | cut -d' ' -f1)
            test \"\$actual\" = \"$candidate_sha\"
          "
          echo "SERVER_DEPLOY=PASS"

      - name: Post-deploy verification
        run: |
          set -euo pipefail
          candidate_sha="$(cat /tmp/server-candidate.sha)"
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.live.py
          python3 -m py_compile /tmp/server.live.py
          test "$(sha256sum /tmp/server.live.py | awk '{print $1}')" = "$candidate_sha"
          grep -Fq "HK_MAP_VISIBILITY_ACCESS_V2" /tmp/server.live.py
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/maps-v2-prod-check.py' | tee /tmp/maps-v2-after.json
          diff -u /tmp/maps-v2-before.json /tmp/maps-v2-after.json
          echo "PRODUCTION_MAP_COUNTS_UNCHANGED=PASS"
          echo "MAPS_VISIBILITY_ACCESS_V2_LIVE=PASS"

      - name: Record status
        run: |
          set -euo pipefail
          candidate_sha="$(cat /tmp/server-candidate.sha)"
          {
            echo "MAPS_VISIBILITY_ACCESS_V2_LIVE=PASS"
            echo "server_sha256=$candidate_sha"
            echo "catalogue_visible_to_all_members=PASS"
            echo "private_map_data_gate=PASS"
            echo "single_map_grant=PASS"
            echo "userscript_changed=NO"
            echo "production_counts=$(cat /tmp/maps-v2-after.json)"
          } > audit/hk-maps-visibility-access-v2-live-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-maps-visibility-access-v2-live-status.txt
          git commit -m "audit: maps visibility access V2 live"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: |
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'rm -f /tmp/server.maps-access-v2.py /tmp/maps-v2-prod-check.py' || true
          rm -f ~/.ssh/topking /tmp/server.py /tmp/server.live.py /tmp/server-candidate.sha /tmp/maps-access-v2-test.py /tmp/maps-v2-before.json /tmp/maps-v2-after.json
