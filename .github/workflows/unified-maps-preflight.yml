name: Unified maps preflight

on:
  push:
    paths:
      - 'deploy/topking/unified-maps-preflight-trigger.txt'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/topking
          chmod 600 ~/.ssh/topking
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
      - name: Extract current backend paths
        run: |
          python3 - <<'PY'
          import ast,hashlib
          from pathlib import Path
          s=Path('/tmp/server.py').read_text('utf-8')
          t=ast.parse(s)
          names={'cabinet_maps','map_index','map_detail','hk_maps_index','hk_map_data'}
          out=['server_sha256='+hashlib.sha256(s.encode()).hexdigest()]
          for n in t.body:
              if isinstance(n,ast.FunctionDef) and n.name in names:
                  out.append('\n### '+n.name+'\n'+(ast.get_source_segment(s,n) or ''))
          for needle in ("'/maps'","'/api/v1/maps/list'","'/api/v1/maps/detail'"):
              p=s.find(needle)
              if p>=0:out.append('\n### ROUTE '+needle+'\n'+s[max(0,p-2500):p+7000])
          Path('audit/hk-stage2-unified-maps-preflight.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          cat audit/hk-stage2-unified-maps-preflight.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-unified-maps-preflight.txt
          git commit -m "audit: inspect unified maps backend path"
          git pull --rebase origin main
          git push origin HEAD:main
