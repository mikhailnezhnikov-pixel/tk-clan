name: Check Buildings Active Semantics R1

on:
  push:
    paths:
      - 'deploy/topking/buildings-active-r1-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build candidate and run schema fixture
        run: |
          set -euo pipefail
          cp baseline/topking/HamsterKingMobile.current.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.15" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r17-buildings-ui-compact" /tmp/HamsterKingMobile.user.js

          python3 -m py_compile deploy/topking/patch_buildings_active_semantics_1_17_16.py
          python3 deploy/topking/patch_buildings_active_semantics_1_17_16.py
          node --check /tmp/HamsterKingMobile.user.js

          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/HamsterKingMobile.user.js','utf8');
          const a=s.indexOf('  function buildingCanonAllRows(');
          const b=s.indexOf('  function buildingCanonMapRow(',a);
          if(a<0||b<0) throw new Error('Buildings active helper block missing');
          let playerDocument=null;
          eval(s.slice(a,b));

          const rows=Array.from({length:2175},(_,i)=>({
            id:'b'+i,
            next_tier_level:i<467?100:null,
            is_favorite:false
          }));
          const doc={player:{player_active_building:467,max_buildings:698,max_favorite_building:10},buildings:rows};
          const active=buildingCanonActiveRows(doc);
          const ids=buildingCanonActiveIds(doc);
          const cap=buildingCanonCapacity(doc);
          if(active.length!==467) throw new Error('active rows '+active.length);
          if(ids.size!==467) throw new Error('active ids '+ids.size);
          if(cap.active!==467) throw new Error('capacity active '+cap.active);
          if(cap.max!==698) throw new Error('capacity max '+cap.max);
          if(cap.free!==231) throw new Error('capacity free '+cap.free);

          const drift={player:{player_active_building:468,max_buildings:698,max_favorite_building:10},buildings:rows};
          const driftActive=buildingCanonActiveRows(drift);
          const driftCap=buildingCanonCapacity(drift);
          if(driftActive.length!==2175) throw new Error('schema drift must fail closed');
          if(driftCap.active!==468||driftCap.free!==230) throw new Error('reported active count not authoritative');

          console.log('fixture_rows=2175');
          console.log('fixture_active=467');
          console.log('fixture_max=698');
          console.log('fixture_free=231');
          console.log('active_ids=467');
          console.log('schema_drift_fail_closed=PASS');
          console.log('BUILDINGS_ACTIVE_SEMANTICS_FIXTURE=PASS');
          NODE

          grep -Fq "buildings-active-semantics-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "Подходящие здания есть, но свободных активных слотов нет." /tmp/HamsterKingMobile.user.js
          grep -Fq "maps-shared-runtime-20260921-r7-safe5" /tmp/HamsterKingMobile.user.js
          grep -Fq "explore-e3-single-20260920-r9-runner" /tmp/HamsterKingMobile.user.js
          grep -Fq "AUTH_PASSIVE_SAFETY_R1" /tmp/HamsterKingMobile.user.js
          echo "BUILDINGS_ACTIVE_SEMANTICS_R1_PREDEPLOY=PASS"
