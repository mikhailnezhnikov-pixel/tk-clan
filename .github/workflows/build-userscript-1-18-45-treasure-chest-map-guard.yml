name: Build Userscript 1.18.45 Treasure Chest Map Foreground Guard

on:
  push:
    paths:
      - 'deploy/topking/patch_treasure_chest_map_foreground_guard_1_18_45.py'
      - '.github/workflows/build-userscript-1-18-45-treasure-chest-map-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.18.44" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasury-left-path-exit-recovery-20260927-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-auto-map-stale-runner-20260927-r2" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_treasure_chest_map_foreground_guard_1_18_45.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.45" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-chest-map-foreground-guard-20260927-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-chest-map-false-positive-blocked" /tmp/HamsterKingMobile.user.js
          grep -Fq "chest-map-guard-pre" /tmp/HamsterKingMobile.user.js
          grep -Fq "chest-map-guard-post" /tmp/HamsterKingMobile.user.js

          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')

          chest=s[s.index('function treasureChestElements()'):s.index('function treasureChestSignature()')]
          assert "closest?.('[data-lot-id^=\"mf_treasurelot_active_sl\"]')" in chest

          guard=s[s.index('function treasureChestBlockedByForegroundMap('):s.index('function autoMapMiniGameForeground()')]
          assert "autoMapElementIsForeground" in guard
          assert "treasure-chest-map-false-positive-blocked" in guard
          assert "[data-lot-id^=\"mf_treasurelot_active_sl\"]" in guard

          runner=s[s.index('async function runTreasureChestAuto()'):s.index('function battleVictoryElement()')]
          assert runner.count('treasureChestBlockedByForegroundMap()') >= 2
          assert "runAutoMapTick('chest-map-guard-pre')" in runner
          assert "runAutoMapTick('chest-map-guard-post')" in runner

          signature=s[s.index('function getSignature()'):s.index('function checkPuzzle()')]
          assert "if (treasureChestBlockedByForegroundMap(chestRows)) return 'NONE';" in signature
          assert "return treasureChestSignature();" in signature

          foreground=s[s.index('function autoMapMiniGameForeground()'):s.index('function autoMapModalCloseButton')]
          assert "if (treasureChestBlockedByForegroundMap(chestRows)) return false;" in foreground

          print("TREASURE_CHEST_MAP_FOREGROUND_GUARD_STATIC_SMOKE=PASS")
          PY

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.45.treasure-chest-map-guard.candidate.user.js
          audit=audit/hk-userscript-1-18-45-treasure-chest-map-guard-predeploy.txt

          git fetch origin main
          git reset --hard origin/main

          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.44':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")

          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)

          out={
              'schema':1,
              'source_version':'1.18.44',
              'target_version':'1.18.45',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.45.treasure-chest-map-guard.candidate.user.js',
              'primary_marker':'treasure-chest-map-foreground-guard-20260927-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-45-treasure-chest-map-guard-live-status.txt',
              'commit_message':'fix: deploy treasure chest foreground map guard in userscript 1.18.45',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          {
            echo "USERSCRIPT_1_18_45_TREASURE_CHEST_MAP_GUARD_PREDEPLOY=PASS"
            echo "source_version=1.18.44"
            echo "target_version=1.18.45"
            echo "map_foreground=PRIORITY_OVER_CHEST_SIGNATURE"
            echo "map_card_chest_descendants=IGNORED"
            echo "chest_runner_foreground_guard=DOUBLE_CHECK"
            echo "real_chest_room=UNCHANGED_WHEN_MAP_NOT_FOREGROUND"
            echo "syntax=PASS"
            echo "static_smoke=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.45 treasure chest map guard"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
