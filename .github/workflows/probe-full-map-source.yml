name: Probe full New York map source

on:
  push:
    paths:
      - '.github/workflows/probe-full-map-source.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe source
        shell: bash
        run: |
          set -euo pipefail
          url='https://kokkaras.com/hk_maps/hk_newyork2332.php'
          curl -fL --compressed --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' "$url" -o /tmp/map.html
          echo "BYTES=$(wc -c < /tmp/map.html)"
          echo "TITLE=$(grep -o '<title>[^<]*' /tmp/map.html | head -1 | sed 's/<title>//' || true)"
          echo "HAS_LOGIN=$(grep -ciE 'login|auth|вход|авториза' /tmp/map.html || true)"
          echo "HAS_BUILDINGS=$(grep -c 'buildingsGeoJSON' /tmp/map.html || true)"
          echo "HAS_MAPLIBRE=$(grep -ci 'maplibre' /tmp/map.html || true)"
          echo "PHP_LINKS:"
          grep -oE 'href="[^"]+\.php[^"]*"' /tmp/map.html | head -20 || true
