name: Deploy HK map data

on:
  push:
    paths:
      - '.github/workflows/deploy-hk-map-points.yml'
      - 'deploy/topking/server-map-points.patch.gz.b64'
      - 'deploy/topking/hk-map-points.part*.json.gz.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Build one compact map dataset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob, gzip, json
          rows=[]
          files=sorted(glob.glob('deploy/topking/hk-map-points.part*.json.gz.b64'))
          if len(files) != 13:
              raise SystemExit(f'expected 13 map data parts, found {len(files)}')
          for path in files:
              encoded=open(path,'rb').read()
              try:
                  block=json.loads(gzip.decompress(base64.b64decode(encoded)))
              except Exception as exc:
                  raise SystemExit(f'bad map data part {path}: {exc}')
              rows.extend(block)
          if len(rows) != 235:
              raise SystemExit(f'expected 235 maps, found {len(rows)}')
          keys=[row[0] for row in rows]
          if len(set(keys)) != 235:
              raise SystemExit('duplicate map keys')
          points=sum(len(row[1])//3 for row in rows)
          if points != 26378:
              raise SystemExit(f'expected 26378 points, found {points}')
          with gzip.open('/tmp/hk-map-points.json.gz','wt',encoding='utf-8',compresslevel=9) as out:
              json.dump(rows,out,separators=(',',':'),ensure_ascii=False)
          print({'maps':len(rows),'points':points})
          PY

      - name: Fetch and patch live backend
        shell: bash
        env:
          MAP_ROUTES_B64: 
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py

          if ! grep -q 'CREATE TABLE IF NOT EXISTS hk_map_points' /tmp/server.py; then
            base64 -d deploy/topking/server-map-points.patch.gz.b64 | gzip -d > /tmp/server-map-points.patch
            patch --batch --forward /tmp/server.py < /tmp/server-map-points.patch || true
          fi

          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path=Path('/tmp/server.py')
          text=path.read_text()
          if '/api/v1/cabinet/maps/data' not in text:
              anchor='        elif path == "/api/v1/public/maps":\n'
              if anchor not in text:
                  raise SystemExit('public maps route anchor not found')
              routes=base64.b64decode(os.environ['MAP_ROUTES_B64']).decode()
              text=text.replace(anchor,routes+anchor,1)
              path.write_text(text)
          PY

          grep -q 'CREATE TABLE IF NOT EXISTS hk_map_points' /tmp/server.py
          grep -q 'def hk_map_data' /tmp/server.py
          grep -q '/api/v1/public/maps/data' /tmp/server.py
          grep -q -- '--import-hk-map-points' /tmp/server.py
          python3 -m py_compile /tmp/server.py

      - name: Deploy backend and import 235 maps
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/server.py root@89.125.1.71:/tmp/hamsterking-server.py
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/hk-map-points.json.gz root@89.125.1.71:/tmp/hk-map-points.json.gz

          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'set -euo pipefail;
              stamp="$(date +%Y%m%d-%H%M%S)";
              python3 -m py_compile /tmp/hamsterking-server.py;
              cp -a /opt/hamsterking-license/server.py "/opt/hamsterking-license/server.py.bak.$stamp";
              install -m 0644 /tmp/hamsterking-server.py /opt/hamsterking-license/server.py;
              systemctl restart hamsterking-license.service;
              systemctl is-active --quiet hamsterking-license.service;
              sleep 2;
              python3 /opt/hamsterking-license/server.py --import-hk-map-points /tmp/hk-map-points.json.gz | tee /tmp/hk-map-import-result.txt;
              grep -q "\"accepted\": 235" /tmp/hk-map-import-result.txt;
              grep -q "\"points\": 26378" /tmp/hk-map-import-result.txt;
              rm -f /tmp/hk-map-points.json.gz /tmp/hk-map-import-result.txt;
              curl -fsS --max-time 10 http://127.0.0.1:3188/health;
              echo;
              curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/public/maps;
              echo;
              echo HK_MAPS_DATA_DEPLOY_OK'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/topking" /tmp/server.py /tmp/server-map-points.patch /tmp/hk-map-points.json.gz
