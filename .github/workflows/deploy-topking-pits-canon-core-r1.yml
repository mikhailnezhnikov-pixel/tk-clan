name: Deploy TopKing Pits Canon Core R1

on:
  push:
    paths:
      - 'deploy/topking/pits-canon-core-r1-trigger.txt'
  workflow_dispatch:

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify patch payload
        run: |
          set -euo pipefail
          cat deploy/topking/pits-canon-core-r1.parts/*.b64 | base64 -d > /tmp/patch_pits.py
          test "$(sha256sum /tmp/patch_pits.py | awk '{print $1}')" = "6aae30d52492c11d9e85afae56a62abd76189c2ba967ada3791ab5b11f49d57e"
          python3 -m py_compile /tmp/patch_pits.py
          echo "PATCH_PAYLOAD=PASS"

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "303f6813d6e001751b53b32d83c6098f307aeedcee6a3cf320887bc93a07a117"
          grep -Fq "HK_TODAY_TOOLBAR_REV = 'today-toolbar-clean-20260920-r3'" /tmp/HamsterKingMobile.user.js
          ! grep -Fq "HK_PITS_CANON_REV = 'pits-canon-core-20260920-r1'" /tmp/HamsterKingMobile.user.js
          echo "BEFORE_SHA=$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"

      - name: Apply canonical Pits core
        run: |
          set -euo pipefail
          python3 /tmp/patch_pits.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_CANON_REV = 'pits-canon-core-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_PITS_CANON_DEFINITIONS" /tmp/HamsterKingMobile.user.js
          grep -Fq "function pitCanonPlans" /tmp/HamsterKingMobile.user.js
          grep -Fq "function pitCanonReadRunConfigs" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function runPitsCanonical" /tmp/HamsterKingMobile.user.js
          grep -Fq 'id="hk-pits-content"' /tmp/HamsterKingMobile.user.js
          ! grep -Fq 'id="hk-pit-start"' /tmp/HamsterKingMobile.user.js
          ! grep -Fq 'id="hk-pit-stop"' /tmp/HamsterKingMobile.user.js
          ! grep -Fq 'id="hk-pit-collect-only"' /tmp/HamsterKingMobile.user.js
          echo "PATCHED_SHA=$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.pits-r1.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.pits-r1.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.pits-r1.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.pits-r1.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?pits-r1=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          grep -Fq "HK_PITS_CANON_REV = 'pits-canon-core-20260920-r1'" /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          echo "PUBLIC_SHA=$(sha256sum /tmp/public.js | awk '{print $1}')"
          echo "PITS_CANON_CORE_R1=PASS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js /tmp/patch_pits.py
