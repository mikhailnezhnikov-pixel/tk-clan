name: Validate Userscript 1.17.54 Shop Caps Compact

on:
  push:
    paths:
      - 'deploy/topking/HamsterKingMobile.1.17.54.shop-caps-compact.candidate.user.js'
      - '.github/workflows/validate-userscript-1-17-54-shop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.17.54.shop-caps-compact.candidate.user.js
          node --check "$candidate"
          grep -Fq "// @version      1.17.54" "$candidate"
          grep -Fq "const BUILD_VERSION = '1.17.54';" "$candidate"
          grep -Fq "shop-cap-balance-mode-20260923-r1" "$candidate"
          grep -Fq "shop-compact-cards-20260923-r1" "$candidate"
          grep -Fq "treasure-guide-priority-lots-20260923-r1" "$candidate"
          grep -Fq "function shopWalletPurchaseLimit" "$candidate"
          grep -Fq "function shopIsCapsSweep" "$candidate"
          grep -Fq "По текущим крышкам: до " "$candidate"
          grep -Fq "grid-template-columns:repeat(4,minmax(0,1fr))" "$candidate"
          ! grep -Fq "SHOP_UNLIMITED_RUN_MAX" "$candidate"
          sha256sum "$candidate"
