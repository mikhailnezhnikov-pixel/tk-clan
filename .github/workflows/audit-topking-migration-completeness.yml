name: Audit TopKing Migration Completeness

on:
  push:
    paths:
      - 'deploy/topking/migration-audit-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-topking-migration-completeness
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live and preserved donor scripts
        run: |
          set -euo pipefail
          host='root@89.125.1.71'
          opts=(-i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          scp "${opts[@]}" "$host:/opt/hamsterking-license/HamsterKingMobile.user.js" /tmp/live.js
          scp "${opts[@]}" "$host:/opt/hamsterking-license/HamsterKingMobile.user.js.bak-1.7.95" /tmp/donor-1.7.95.js
          scp "${opts[@]}" "$host:/opt/hamsterking-license/HamsterKingMobile.user.js.bak.20260919-083158" /tmp/donor-1.9.8.js
          scp "${opts[@]}" "$host:/opt/hamsterking-license/HamsterKingMobile.user.js.bak.20260919-100048" /tmp/donor-1.12.0.js
          scp "${opts[@]}" "$host:/opt/hamsterking-license/HamsterKingMobile.user.js.bak.20260919-105415" /tmp/donor-1.13.0.js
          scp "${opts[@]}" "$host:/opt/hamsterking-license/HamsterKingMobile.user.js.bak.20260919-142123" /tmp/donor-1.14.4.js
          grep -q '^// @version      1.16.8$' /tmp/live.js
          node --check /tmp/live.js
          for f in /tmp/donor-*.js; do node --check "$f"; done

      - name: Compare donors with live
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib, collections

          sources = {
              '1.7.95': Path('/tmp/donor-1.7.95.js'),
              '1.9.8': Path('/tmp/donor-1.9.8.js'),
              '1.12.0': Path('/tmp/donor-1.12.0.js'),
              '1.13.0': Path('/tmp/donor-1.13.0.js'),
              '1.14.4': Path('/tmp/donor-1.14.4.js'),
          }
          live_path = Path('/tmp/live.js')

          def read(p): return p.read_text(encoding='utf-8')
          def functions(s):
              out=set(re.findall(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',s))
              out.update(re.findall(r'(?m)^\s*(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?\([^\n;]*\)\s*=>',s))
              return out
          def endpoints(s):
              out=set()
              for m in re.finditer(r'([\x27\x22\x60])(/[^\n\x27\x22\x60]{1,180})\1',s):
                  value=m.group(2)
                  if value.startswith('//'): continue
                  value=re.sub(r'\$\{[^}]+\}','{…}',value)
                  value=re.sub(r'\?.*','',value) if '?' in value and '{…}' not in value else value
                  out.add(value)
              return out
          def constants(s):
              return set(re.findall(r'(?m)^\s*const\s+([A-Z][A-Z0-9_]{2,})\s*=',s))
          def nav(s):
              rows=[]
              for m in re.finditer(r"\{(?:(?:planned:true,)?ru:'([^']+)',en:'([^']+)'|page:'([^']+)',ru:'([^']+)',en:'([^']+)')\}",s):
                  raw=m.group(0)
                  rows.append({'raw':raw,'planned':'planned:true' in raw,'page':m.group(3) or '', 'ru':m.group(1) or m.group(4) or '', 'en':m.group(2) or m.group(5) or ''})
              uniq=[]
              seen=set()
              for row in rows:
                  key=(row['page'],row['ru'],row['planned'])
                  if key not in seen: seen.add(key); uniq.append(row)
              return uniq

          live=read(live_path)
          lf=functions(live); le=endpoints(live); lc=constants(live)
          donor_data={}
          freq_f=collections.Counter(); freq_e=collections.Counter(); freq_c=collections.Counter()
          for version,path in sources.items():
              s=read(path)
              fs,es,cs=functions(s),endpoints(s),constants(s)
              donor_data[version]={'functions':fs,'endpoints':es,'constants':cs,'nav':nav(s),'sha256':hashlib.sha256(s.encode()).hexdigest()}
              freq_f.update(fs); freq_e.update(es); freq_c.update(cs)

          missing_f=sorted((set(freq_f)-lf), key=lambda x:(-freq_f[x],x.lower()))
          missing_e=sorted((set(freq_e)-le), key=lambda x:(-freq_e[x],x.lower()))
          missing_c=sorted((set(freq_c)-lc), key=lambda x:(-freq_c[x],x.lower()))

          # Filter obvious generic helpers when presenting high-priority missing functions.
          generic={'sleep','clean','number','visible','tr','either','escapeHtml','log','load','save','locale'}
          priority_f=[x for x in missing_f if x not in generic and freq_f[x]>=2]
          single_f=[x for x in missing_f if freq_f[x]==1]

          live_nav=nav(live)
          feature_terms=['war','rumor','boss','building','explore','map','resource','fair','shop','recipe','bureau','clan','pit','daily','remind','socket','realtime','rat']
          presence={}
          for term in feature_terms:
              presence[term]={
                  'live_functions':sum(1 for x in lf if term in x.lower()),
                  'donor_functions':sum(1 for x in freq_f if term in x.lower()),
                  'live_text_hits':live.lower().count(term),
                  'donor_versions':sum(1 for v in donor_data.values() if term in read(sources[next(k for k,val in donor_data.items() if val is v)]).lower()) if False else None
              }

          lines=[]
          lines += ['# TopKing migration completeness audit','',
                    f'live_version=1.16.8',
                    f'live_sha256={hashlib.sha256(live.encode()).hexdigest()}',
                    f'live_functions={len(lf)}',
                    f'donor_union_functions={len(freq_f)}',
                    f'missing_donor_functions={len(missing_f)}',
                    f'live_endpoints={len(le)}',
                    f'donor_union_endpoints={len(freq_e)}',
                    f'missing_donor_endpoints={len(missing_e)}','']
          lines += ['## High-priority donor functions missing from live (present in 2+ donor versions)']
          if priority_f:
              for name in priority_f:
                  versions=[v for v,d in donor_data.items() if name in d['functions']]
                  lines.append(f'- {name} | donor_count={freq_f[name]} | versions={",".join(versions)}')
          else: lines.append('- none')
          lines += ['','## Donor endpoints missing from live']
          if missing_e:
              for ep in missing_e:
                  versions=[v for v,d in donor_data.items() if ep in d['endpoints']]
                  lines.append(f'- {ep} | donor_count={freq_e[ep]} | versions={",".join(versions)}')
          else: lines.append('- none')
          lines += ['','## Donor constants missing from live (present in 2+ donors)']
          for name in missing_c:
              if freq_c[name]>=2:
                  versions=[v for v,d in donor_data.items() if name in d['constants']]
                  lines.append(f'- {name} | donor_count={freq_c[name]} | versions={",".join(versions)}')
          if not any(freq_c[x]>=2 for x in missing_c): lines.append('- none')
          lines += ['','## Live navigation']
          for row in live_nav:
              lines.append(f"- {row['ru']} / {row['en']} | page={row['page'] or '-'} | planned={str(row['planned']).lower()}")
          lines += ['','## Donor navigation snapshots']
          for version,d in donor_data.items():
              lines.append(f'### {version}')
              for row in d['nav']:
                  lines.append(f"- {row['ru']} / {row['en']} | page={row['page'] or '-'} | planned={str(row['planned']).lower()}")
          lines += ['','## Single-version donor functions missing from live']
          for name in single_f:
              version=next(v for v,d in donor_data.items() if name in d['functions'])
              lines.append(f'- {name} | version={version}')

          Path('/tmp/migration-audit.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')

          machine={
              'live':{'version':'1.16.8','functions':sorted(lf),'endpoints':sorted(le),'constants':sorted(lc),'nav':live_nav},
              'donors':{v:{'functions':sorted(d['functions']),'endpoints':sorted(d['endpoints']),'constants':sorted(d['constants']),'nav':d['nav'],'sha256':d['sha256']} for v,d in donor_data.items()},
              'missing':{'functions':missing_f,'endpoints':missing_e,'constants':missing_c}
          }
          Path('/tmp/migration-audit.json').write_text(json.dumps(machine,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cat /tmp/migration-audit.txt

      - name: Commit audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p audit
          cp /tmp/migration-audit.txt audit/hk-migration-completeness.txt
          cp /tmp/migration-audit.json audit/hk-migration-completeness.json
          git add audit/hk-migration-completeness.txt audit/hk-migration-completeness.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit TopKing donor migration completeness"
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/live.js /tmp/donor-*.js /tmp/migration-audit.txt /tmp/migration-audit.json
