name: Inspect cabinet API schema

on:
  push:
    paths:
      - '.github/workflows/inspect-cabinet-api.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public cabinet endpoints
        shell: bash
        run: |
          set +e
          for u in             "https://hk-license.89.125.1.71.sslip.io/"             "https://hk-license.89.125.1.71.sslip.io/openapi.json"             "https://hk-license.89.125.1.71.sslip.io/docs"             "https://hk-license.89.125.1.71.sslip.io/api/v1/cabinet/config"             "https://hk-license.89.125.1.71.sslip.io/api/v1/cabinet/dashboard"
          do
            echo "===== $u ====="
            curl -k -sS -i --max-time 20 "$u" | head -c 12000
            echo
          done
