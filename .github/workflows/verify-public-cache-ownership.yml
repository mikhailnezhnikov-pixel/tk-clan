name: Verify Public Cache Ownership

on:
  push:
    paths:
      - 'deploy/topking/public-cache-ownership-trigger.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Read live ownership only
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            echo "server_only_marker="
            grep -F "PUBLIC_SNAPSHOT_SERVER_ONLY_R3" /opt/hamsterking-license/server.py | head -1
            echo "=== DB ==="
            python3 - <<"PY"
          import json, sqlite3
          db=sqlite3.connect("/var/lib/hamsterking-license/licenses.db")
          try:
              row=db.execute("select snapshot_json,source_player_id,updated_at from public_clan_war_snapshot where singleton=1").fetchone()
              if row:
                  try: doc=json.loads(row[0])
                  except Exception: doc={}
                  print("war_source="+str(row[1]))
                  print("war_updated_at="+str(row[2]))
                  print("war_opponent="+str(doc.get("opponent","")))
                  print("war_hp="+str(doc.get("opponent_hp","")))
              else:
                  print("war_source=missing")
              for kind in ("alliance_defense","alliance_influence","alliance_power"):
                  rows=db.execute("select count(*),group_concat(distinct source_player_id),max(updated_at) from public_rating_snapshots where kind=?",(kind,)).fetchone()
                  print(f"{kind}_count={rows[0]}")
                  print(f"{kind}_sources={rows[1]}")
                  print(f"{kind}_updated_at={rows[2]}")
          finally:
              db.close()
          PY
            echo "=== WAR JOURNAL ==="
            journalctl -u hamsterking-public-war.service --since "2026-09-20 16:20:00" --no-pager | tail -80
            echo "=== RATINGS JOURNAL ==="
            journalctl -u hamsterking-public-collector.service --since "2026-09-20 16:20:00" --no-pager | tail -120
            echo "=== LEGACY POSTS AFTER PATCH ==="
            journalctl -u hamsterking-license.service --since "2026-09-20 16:20:00" --no-pager | grep "POST /api/v1/public-snapshot" | tail -30 || true
          '

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
