name: Deploy Userscript 1.17.24 Native Play Performance Hotfix

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-24-puzzle-solver-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.24" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r27-businesses-runner-canon" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-finalize-single-snapshot-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "puzzle-solver-v3-embedded-20260921-r1" /tmp/HamsterKingMobile.user.js
          cmp -s /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          echo "LIVE_BASELINE_INPUT=PASS"

      - name: Apply native play performance hotfix
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_native_play_performance_1_17_24.py
          python3 deploy/topking/patch_native_play_performance_1_17_24.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "native-play-performance-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "native-game-priority-no-bridge-race-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "puzzle-solver-v3-embedded-20260921-r1" /tmp/HamsterKingMobile.user.js
          echo "NATIVE_PLAY_PERFORMANCE_CANDIDATE=PASS"

      - name: Static regression verification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')
          checks={
            'version_preserved':"// @version      1.17.24" in s,
            'perf_marker':"native-play-performance-20260921-r1" in s,
            'native_lock_fix_preserved':"native-game-priority-no-bridge-race-20260921-r1" in s,
            'business_redraw_gated':"if(hkBusinessUiVisible()) refreshBusinessData();" in s,
            'pit_scan_gated':"if(pitRunning || hkPitUiVisible()) updatePitStatus();" in s,
            'heartbeat_5s':"}, 5000);" in s,
            'health_dedup':"if(current?.ok===next.ok && current?.detail===next.detail) return;" in s,
            'puzzle_preserved':"puzzle-solver-v3-embedded-20260921-r1" in s,
            'business_finalize_preserved':"businesses-finalize-single-snapshot-20260921-r1" in s,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(f"{k}={'PASS' if v else 'FAIL'}")
          if failed: raise SystemExit("failed checks: "+", ".join(failed))
          assert "setInterval(() => {\n      updatePitStatus();" not in s
          PY

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.24.native-play-performance.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.1.17.24.native-play-performance.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.24.puzzle-solver.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.1.17.24.native-play-performance.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?native-play-performance=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "puzzle-solver-v3-embedded-20260921-r1" /tmp/public.js
          grep -Fq "core-20260921-r27-businesses-runner-canon" /tmp/public.js
          grep -Fq "mf_fairlot_lights_out_sl(\\d+)_(true|false)" /tmp/public.js
          grep -Fq "mf_treasurelot_sword_\\d+_(\\d+)" /tmp/public.js
          grep -Fq "enemy_type_(01|02|03)_(\\d+)_sl(\\d+)" /tmp/public.js
          echo "PUBLIC_NATIVE_PLAY_PERFORMANCE_HOTFIX=PASS"

      - name: Sync verified baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          {
            echo "USERSCRIPT_1_17_24_NATIVE_PLAY_PERFORMANCE=PASS"
            echo "version=1.17.24"
            echo "core=core-20260921-r27-businesses-runner-canon"
            echo "puzzle_solver=puzzle-solver-v3-embedded-20260921-r1"
            echo "native_play_performance=PASS"
            echo "background_scan_500ms=PASS"
            echo "initial_scan_300ms=PASS"
            echo "lights_out_3x3=PASS"
            echo "battle_solver=PASS"
            echo "auto_clicks=NONE"
            echo "runtime_destroy_cleanup=PASS"
            echo "business_finalize=PRESERVED"
            echo "t4_t6_guard=PRESERVED"
            echo "catalog_read_only=PRESERVED"
          } > audit/hk-userscript-1-17-24-puzzle-solver-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-24-puzzle-solver-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "hotfix: remove rhythmic native gameplay lag"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.1.17.24.native-play-performance.user.js /tmp/public.js
