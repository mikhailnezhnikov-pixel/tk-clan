name: Inspect Collector Auth Anchors

on:
  push:
    paths:
      - 'deploy/topking/public-collector-auth-inspect-trigger.txt'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Inspect safe source anchors
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            python3 - <<"PY"
          from pathlib import Path
          s=Path("/opt/hamsterking-license/server.py").read_text()
          for needle in ("def license_check(", "elif path == \"/api/v1/check\":", "elif path == \"/api/v1/public-snapshot\":"):
              i=s.find(needle)
              print("=== "+needle+" ===")
              print("index",i)
              if i>=0:
                  print(s[max(0,i-1200):i+6500])
          PY
          '

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
