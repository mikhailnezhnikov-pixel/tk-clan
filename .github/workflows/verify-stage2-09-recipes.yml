name: Verify Stage 2.09 Recipes

on:
  push:
    paths:
      - 'deploy/topking/stage2-09-recipes-verify-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-stage2-09-recipes
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live and public
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/live.user.js
          curl -fsSL --retry 5 --retry-delay 2 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?stage2-09-recipes=$(date +%s)" \
            -o /tmp/public.user.js
          node --check /tmp/live.user.js
          node --check /tmp/public.user.js
          cmp -s /tmp/live.user.js /tmp/public.user.js
          cmp -s /tmp/live.user.js baseline/topking/HamsterKingMobile.current.user.js
          grep -Fq "// @version      1.17.30" /tmp/live.user.js

      - name: Verify Recipes and Project Bureau invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          s=Path('/tmp/live.user.js').read_text(encoding='utf-8')

          required=[
              "HK_RECIPES_LIVE_VERIFY_V1 recipes-live-20260920-r1",
              "game-api-rate-guard-20260922-r1",
              "public-collector-activity-lease-20260922-r1",
              "businesses-kokkaras-donor-20260922-r1",
              "async function loadRecipes()",
              "async function runRecipes()",
              "async function loadCommunityRecipes()",
              "async function loadProjectBureau()",
              "async function runProjectBureau()",
              "playerDocument = await apiJson('/player/me', 'POST');",
              "fairDocument = await apiJson('/fair/reroll', 'POST', {fair_id:recipeFairId});",
              "const recipeDecision = budgetDecision(state.fair_reroll_cost, 'recipes', 1, playerDocument);",
              "appendExpense({section:'recipes'",
              "await hkAuthoritativePlayerRead('recipes-complete')",
              "const values = await apiJson('/business/values', 'GET');",
              "const liveBureauCost = bureauCost();",
              "!costParts(liveBureauCost).length",
              "const projectedBureau = budgetDecision(liveBureauCost, 'bureau', attempts, playerDocument);",
              "Number(count) * attempts > (available.get(id) || 0)",
              "const bureauDecision = budgetDecision(liveBureauCost, 'bureau', 1, playerDocument);",
              "apiJson('/player/business/recipe/craft', 'POST', {businesses:inputs}, true, 0)",
              "appendExpense({section:'bureau'",
              "hkRunner.start({title:either('Рецепты','Recipes')",
              "hkRunner.start({title:either('Проектное бюро','Project Bureau')",
              "await hkRunner.waitIfPaused();",
              "hkRunner.signal?.aborted",
              "hkAuthoritativePlayerRead('bureau-complete')",
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("missing invariants:\n" + "\n".join(missing))

          ro_start=s.index("const HK_READ_ONLY_POST_PATHS = new Set([")
          ro_end=s.index("]);", ro_start)
          ro=s[ro_start:ro_end]
          assert "'/player/me'" in ro, "/player/me must remain read-only"
          assert "'/fair/reroll'" not in ro, "/fair/reroll must be mutation"
          assert "'/player/business/recipe/craft'" not in ro, "recipe/craft must be mutation"

          api_start=s.index("async function apiJson(path")
          api_end=s.index("async function hkAuthoritativePlayerRead", api_start)
          api=s[api_start:api_end]
          assert "apiJsonCore(path, method, body, retryAuthorization, 0, timeoutMs)" in api

          print("STAGE2_09_RECIPES_STATIC_LIVE=PASS")
          print("recipe_reroll_mutation_gate=PASS")
          print("recipe_reroll_budget_guard=PASS")
          print("recipe_reroll_expense_journal=PASS")
          print("bureau_fresh_state_cost=PASS")
          print("bureau_unknown_cost_fail_closed=PASS")
          print("bureau_stock_attempts_guard=PASS")
          print("bureau_mutation_retry_zero=PASS")
          print("runner_pause_stop_abort=PASS")
          print("game_api_rate_guard=PRESERVED")
          print("collector_activity_lease=PRESERVED")
          PY

      - name: Record technical live verification
        run: |
          set -euo pipefail
          sha256="$(sha256sum /tmp/live.user.js | awk '{print $1}')"
          cat > /tmp/hk-stage2-09-recipes-live-status.txt <<EOF
          STAGE2_09_RECIPES_TECHNICAL_LIVE=PASS
          version=1.17.30
          sha256=$sha256
          public_live_exact_match=PASS
          baseline_live_exact_match=PASS
          recipe_reroll_mutation_gate=PASS
          recipe_reroll_budget_guard=PASS
          recipe_reroll_expense_journal=PASS
          bureau_fresh_state_cost=PASS
          bureau_unknown_cost_fail_closed=PASS
          bureau_stock_attempts_guard=PASS
          bureau_mutation_retry_zero=PASS
          runner_pause_stop_abort=PASS
          game_api_rate_guard=PRESERVED
          collector_activity_lease=PRESERVED
          destructive_game_calls=NONE
          user_browser_check=PENDING
          EOF

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/hk-stage2-09-recipes-live-status.txt audit/hk-stage2-09-recipes-live-status.txt
            python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/hk-stage2-09-recipes.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              '**SOURCE_PREFLIGHT_PASS · STATIC_CURRENT_PASS · TECHNICAL_LIVE_VERIFY_PENDING · USER_BROWSER_CHECK_PENDING**',
              '**SOURCE_PREFLIGHT_PASS · STATIC_CURRENT_PASS · TECHNICAL_LIVE_PASS · USER_BROWSER_CHECK_PENDING**'
          )
          p.write_text(s,encoding='utf-8')
          p=Path('audit/HK_STAGE2_CHECKPOINT.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              'SOURCE_PREFLIGHT_PASS · STATIC_CURRENT_PASS · TECHNICAL_LIVE_VERIFY_PENDING · USER_BROWSER_CHECK_PENDING',
              'SOURCE_PREFLIGHT_PASS · STATIC_CURRENT_PASS · TECHNICAL_LIVE_PASS · USER_BROWSER_CHECK_PENDING'
          )
          p.write_text(s,encoding='utf-8')
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audit/hk-stage2-09-recipes-live-status.txt audit/hk-stage2-09-recipes.md audit/HK_STAGE2_CHECKPOINT.md
            git commit -m "verify: Stage 2.09 Recipes technical live PASS" || true
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/live.user.js /tmp/public.user.js /tmp/hk-stage2-09-recipes-live-status.txt
