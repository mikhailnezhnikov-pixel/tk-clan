name: Run Clan Shop test history reset

on:
  push:
    paths:
      - '.github/workflows/run-clan-shop-test-history-reset.yml'

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Run one-time reset
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new root@89.125.1.71 \
            "cd /opt/hamsterking-license && python3 -c \"import importlib.util,json,sqlite3; spec=importlib.util.spec_from_file_location('hk_server','/opt/hamsterking-license/server.py'); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); db=sqlite3.connect('/var/lib/hamsterking-license/licenses.db'); before_alloc=db.execute('SELECT COUNT(*) FROM clan_shop_allocations').fetchone()[0]; before_req=db.execute('SELECT COUNT(*) FROM clan_shop_requests').fetchone()[0]; result=mod.reset_clan_shop_test_history({'maps_manage':1,'telegram_id':'manual-test-reset'}); after_alloc=db.execute('SELECT COUNT(*) FROM clan_shop_allocations').fetchone()[0]; after_req=db.execute('SELECT COUNT(*) FROM clan_shop_requests').fetchone()[0]; print('CLAN_SHOP_TEST_RESET_OK',json.dumps(result,ensure_ascii=False)); print('ALLOCATIONS',before_alloc,'->',after_alloc); print('REQUESTS',before_req,'->',after_req); assert before_alloc==after_alloc and before_req==after_req\""

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
