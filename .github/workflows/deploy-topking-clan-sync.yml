name: Deploy TopKing 1.9.9

on:
  push:
    paths:
      - '.github/workflows/deploy-topking-clan-sync.yml'
      - 'deploy/topking/userscript-1.9.9.patch.gz.b64'
      - 'deploy/topking/server-no-rumors.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live 1.9.8 sources
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          grep -q '^// @version      1.9.8$' /tmp/HamsterKingMobile.user.js
          grep -q '/api/v1/rumors/today' /tmp/server.py
          grep -q '/admin/rumors/publish' /tmp/server.py
          grep -q 'runDailyRumors' /tmp/HamsterKingMobile.user.js

      - name: Build 1.9.9 without rumor collection
        shell: bash
        run: |
          set -euo pipefail
          base64 -d deploy/topking/userscript-1.9.9.patch.gz.b64 | gzip -d > /tmp/userscript-1.9.9.patch
          base64 -d deploy/topking/server-no-rumors.patch.gz.b64 | gzip -d > /tmp/server-no-rumors.patch
          patch --fuzz=0 /tmp/HamsterKingMobile.user.js < /tmp/userscript-1.9.9.patch
          patch --fuzz=0 /tmp/server.py < /tmp/server-no-rumors.patch

          grep -q '^// @version      1.9.9$' /tmp/HamsterKingMobile.user.js
          grep -q 'clanCanonicalSnapshot' /tmp/HamsterKingMobile.user.js
          grep -q 'bootstrapLateGameConnection' /tmp/HamsterKingMobile.user.js
          ! grep -q 'runDailyRumors' /tmp/HamsterKingMobile.user.js
          ! grep -q 'dailyRumorRoute' /tmp/HamsterKingMobile.user.js
          ! grep -q 'RUMOR_API_BASE' /tmp/HamsterKingMobile.user.js
          ! grep -q '/rumors/search' /tmp/HamsterKingMobile.user.js
          ! grep -q '/api/v1/rumors/today' /tmp/server.py
          ! grep -q '/admin/rumors/publish' /tmp/server.py
          ! grep -q 'Маршрут слухов на день' /tmp/server.py
          node --check /tmp/HamsterKingMobile.user.js
          python3 -m py_compile /tmp/server.py

      - name: Deploy userscript and backend
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/server.py root@89.125.1.71:/tmp/server.py

          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'set -euo pipefail;
              stamp="$(date +%Y%m%d-%H%M%S)";
              cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp";
              cp -a /opt/hamsterking-license/server.py "/opt/hamsterking-license/server.py.bak.$stamp";
              grep -q "^// @version      1.9.9$" /tmp/HamsterKingMobile.user.js;
              ! grep -q "runDailyRumors" /tmp/HamsterKingMobile.user.js;
              ! grep -q "/api/v1/rumors/today" /tmp/server.py;
              python3 -m py_compile /tmp/server.py;
              install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js;
              install -m 0644 /tmp/server.py /opt/hamsterking-license/server.py;
              install -d -m 755 /etc/systemd/system/hamsterking-license.service.d;
              printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.9.9\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf;
              systemctl daemon-reload;
              systemctl restart hamsterking-license.service;
              systemctl is-active --quiet hamsterking-license.service;
              sleep 2;
              (curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/cabinet/config || curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/cabinet/config);
              echo;
              echo DEPLOY_OK;
              grep -m1 "^// @version" /opt/hamsterking-license/HamsterKingMobile.user.js;
              ! grep -q "Маршрут слухов на день" /opt/hamsterking-license/server.py;
              ! grep -q "runDailyRumors" /opt/hamsterking-license/HamsterKingMobile.user.js'

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/server.py /tmp/userscript-1.9.9.patch /tmp/server-no-rumors.patch
