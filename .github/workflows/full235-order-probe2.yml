name: Probe HKMP3 decoded order 2
on:
  push:
    paths: ['deploy/topking/full235-order-probe2-trigger.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH
        env:
          K: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/k
          chmod 600 ~/.ssh/k
      - name: Probe
        run: |
          cat > /tmp/p.py <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('s','/opt/hamsterking-license/server.py')
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)
          keys=['hk_newyork2332','hk_moscow1226','hk_london3424','hk_dubai6808','hk_berlin2620','hk_lagos3141','hk_paris3122','hk_saintpetersburg1921','hk_riodejaneiro3430','hk_losangeles3638']
          out={}
          for key in keys:
              d=s.private_hk_map_data(key)
              points=d.get('points') or []
              rows=[]
              for i,p in enumerate(points[:10]):
                  rows.append({'i':i,'lon':float(p[0]),'lat':float(p[1]),'flag':int(p[2])})
              out[key]={'point_count':d.get('point_count'),'rows':rows}
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY
          scp -i ~/.ssh/k -o StrictHostKeyChecking=accept-new /tmp/p.py root@89.125.1.71:/tmp/p.py
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/p.py' > audit/hk-stage2-full235-order-probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-full235-order-probe.json
          git commit -m "audit: record decoded HKMP3 point order"
          git pull --rebase origin main
          git push origin HEAD:main
