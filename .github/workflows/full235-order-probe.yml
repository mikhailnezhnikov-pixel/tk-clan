name: Probe HKMP3 point order

on:
  push:
    paths:
      - 'deploy/topking/full235-order-probe-trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/topking
          chmod 600 ~/.ssh/topking
      - name: Read private points
        run: |
          cat > /tmp/probe-order.py <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('s','/opt/hamsterking-license/server.py')
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)
          keys=[
            'hk_newyork2332','hk_moscow1226','hk_london3424','hk_dubai6808',
            'hk_berlin2620','hk_lagos3141','hk_paris3122','hk_saintpetersburg1921',
            'hk_riodejaneiro3430','hk_losangeles3638'
          ]
          out={}
          for key in keys:
              d=s.private_hk_map_data(key)
              flat=d.get('points') or []
              rows=[]
              lng=lat=0
              for i in range(0,min(len(flat),30),3):
                  lng+=int(flat[i]);lat+=int(flat[i+1])
                  rows.append({'i':i//3,'lon':lng/1e5,'lat':lat/1e5,'flag':int(flat[i+2])})
              out[key]={'point_count':d.get('point_count'),'rows':rows}
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          PY
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/probe-order.py root@89.125.1.71:/tmp/probe-order.py
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/probe-order.py' > audit/hk-stage2-full235-order-probe.json
          cat audit/hk-stage2-full235-order-probe.json
      - name: Record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-full235-order-probe.json
          git commit -m "audit: probe HKMP3 full-map point order"
          git pull --rebase origin main
          git push origin HEAD:main
