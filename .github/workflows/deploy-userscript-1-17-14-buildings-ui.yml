name: Deploy Userscript 1.17.14 Buildings UI R2

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-14-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.13" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r15-late-login-handoff" /tmp/HamsterKingMobile.user.js
          cmp -s /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          echo "LIVE_BASELINE_INPUT=PASS"

      - name: Apply Buildings UI r2
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_buildings_ui_r2_1_17_14.py
          python3 deploy/topking/patch_buildings_ui_r2_1_17_14.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.14" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r16-buildings-ui" /tmp/HamsterKingMobile.user.js
          grep -Fq "buildings-ui-20260921-r2" /tmp/HamsterKingMobile.user.js
          grep -Fq "class=\"hk-building-row\"" /tmp/HamsterKingMobile.user.js
          grep -Fq "class=\"hk-building-id\"" /tmp/HamsterKingMobile.user.js
          grep -Fq "class=\"hk-building-actions\"" /tmp/HamsterKingMobile.user.js
          grep -Fq "AUTH_PASSIVE_SAFETY_R1" /tmp/HamsterKingMobile.user.js
          grep -Fq "maps-shared-runtime-20260921-r7-safe5" /tmp/HamsterKingMobile.user.js
          grep -Fq "explore-e3-single-20260920-r9-runner" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /tmp/HamsterKingMobile.user.js
          echo "BUILDINGS_UI_R2_CANDIDATE=PASS"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.14.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.1.17.14.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.14.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.1.17.14.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?buildings-ui-r2=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.14" /tmp/public.js
          grep -Fq "core-20260921-r16-buildings-ui" /tmp/public.js
          grep -Fq "buildings-ui-20260921-r2" /tmp/public.js
          echo "PUBLIC_USERSCRIPT_1_17_14=PASS"

      - name: Sync verified baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          {
            echo "USERSCRIPT_1_17_14_BUILDINGS_UI_R2=PASS"
            echo "version=1.17.14"
            echo "core=core-20260921-r16-buildings-ui"
            echo "buildings_ui=buildings-ui-20260921-r2"
            echo "buildings_action_logic=UNCHANGED"
            echo "maps_safe5=PASS"
            echo "explore_e3_r9=PASS"
          } > audit/hk-userscript-1-17-14-buildings-ui-r2-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-14-buildings-ui-r2-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "release: publish userscript 1.17.14 Buildings UI r2"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.1.17.14.user.js /tmp/public.js
