name: Check unified maps runtime U1

on:
  push:
    paths:
      - 'deploy/topking/unified-maps-u1-check-trigger.txt'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/topking
          chmod 600 ~/.ssh/topking
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/server.py|awk '{print $1}')" = "b5189981acade420e1aaa533dec8b745c0e16969bf1def0c5008aa297f2a2812"
          test "$(sha256sum /tmp/HamsterKingMobile.user.js|awk '{print $1}')" = "bddc55fc46bd4fe8da70c37799a35b74f3924015b071a3e692c532f0f7e6d766"

      - name: Apply candidate patches
        run: |
          python3 deploy/topking/patch_server_unified_maps_runtime_u1.py
          python3 deploy/topking/patch_userscript_unified_maps_runtime_u1.py
          python3 -m py_compile /tmp/server.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq HK_MAP_UNIFIED_RUNTIME_U1_V1 /tmp/server.py
          grep -Fq maps-shared-runtime-20260921-r7-safe5 /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5" /tmp/HamsterKingMobile.user.js
          grep -Fq "if(!areaId||(selected&&!selected.has(areaId)))continue;" /tmp/HamsterKingMobile.user.js
          grep -Fq "const pending=mapSharedKnowledgeEnabled()?unique.filter" /tmp/HamsterKingMobile.user.js
          grep -Fq "_website_geometry:mapSharedKnowledgeEnabled()" /tmp/HamsterKingMobile.user.js
          grep -Fq "id=\"hk-map-shared-knowledge\"" /tmp/HamsterKingMobile.user.js

      - name: Backend regression
        run: |
          python3 - <<'PY'
          import importlib.util,os,tempfile
          spec=importlib.util.spec_from_file_location('s','/tmp/server.py')
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)
          fd,path=tempfile.mkstemp(prefix='unified-u1-',suffix='.db');os.close(fd)
          def poly(cx,cy,d=.0003):
              return {'type':'Polygon','coordinates':[[[cx-d,cy-d],[cx+d,cy-d],[cx+d,cy+d],[cx-d,cy+d],[cx-d,cy-d]]]}
          def cat(key,city,grid):
              return {'key':key,'city':city,'grid':grid,'invest':0,'buildings':1,'unknown':0,'crystals':[0,1,0,0,0,0],
                      'eventBuildings':1,'totalEvents':1,'progress':100,'score':1,'reward':{}}
          try:
              s.DB_PATH=path;s.init_db()
              manager={'telegram_id':'mgr','maps_manage':1,'maps_access':1}
              # Combined row.
              s.import_hk_maps_index([cat('hk_combo0201','Combo','02:01')])
              s.import_hk_map_points([['hk_combo0201',[1000000,2000000,2]]])
              s.submit_map_area('player-live',{'area_id':'area-combo','city_id':'city-combo','city_name':'Combo','coord_revision':'column-row-v1','x':1,'y':2,'invest_count':0,'expected_buildings':1,
                'buildings':[{'building_id':'way1','opened':True,'room_count':4,'has_events':True,'is_invest':False,'tier':1,'faction':'','building_type':''}]})
              s.link_hk_map_area('hk_combo0201','area-combo')
              # Website-only row.
              s.import_hk_maps_index([cat('hk_web0909','WebOnly','09:09')])
              s.import_hk_map_points([['hk_web0909',[9000000,9000000,1]]])
              # Script-only row.
              s.submit_map_area('player-live',{'area_id':'area-script','city_id':'city-script','city_name':'ScriptOnly','coord_revision':'column-row-v1','x':7,'y':8,'invest_count':0,'expected_buildings':1,
                'buildings':[{'building_id':'way2','opened':True,'room_count':3,'has_events':True,'is_invest':False,'tier':1,'faction':'','building_type':''}]})
              cab=s.cabinet_maps(manager)
              kinds={r['source_kind'] for r in cab['maps']}
              assert {'combined','website','script'}<=kinds,kinds
              combo=[r for r in cab['maps'] if r.get('canonical_area_id')=='area-combo']
              assert len(combo)==1 and combo[0]['source_kind']=='combined',combo
              assert combo[0]['shared_known']==1 and combo[0]['crystals'][4]==1,combo[0]
              assert sum(1 for r in cab['maps'] if r.get('canonical_area_id')=='area-script')==1

              # Legacy website-only map becomes canonical knowledge when game area is scanned.
              s.import_hk_maps_index([cat('hk_legacy0403','Legacy','04:03')])
              s.import_hk_map_points([['hk_legacy0403',[3000000,4000000,3]]])
              payload={'area_id':'area-legacy','city_id':'city-legacy','city_name':'Legacy','coord_revision':'column-row-v1','x':3,'y':4,'invest_count':0,'expected_buildings':1,
                'buildings':[{'building_id':'way3','opened':False,'room_count':None,'has_events':False,'is_invest':False,'tier':None,'faction':'','building_type':''}],
                '_website_hydrate':True,
                '_website_geometry':{'type':'FeatureCollection','features':[{'type':'Feature','id':'way3','geometry':poly(30.0,40.0),'properties':{'building_id':'way3'}}]}}
              first=s.submit_map_area('player-live',payload)
              h=first.get('website_hydration') or {}
              assert h.get('status')=='hydrated' and h.get('map_key')=='hk_legacy0403',h
              detail=s.map_detail('area-legacy')
              assert detail['buildings'][0]['room_count']==3,detail
              assert detail['buildings'][0]['knowledge_source']=='hk_maps_import',detail
              with s.db_session() as db:
                  assert db.execute("SELECT COUNT(*) FROM hk_map_area_links WHERE map_key='hk_legacy0403'").fetchone()[0]==1
                  assert db.execute("SELECT COUNT(*) FROM hk_map_point_links WHERE map_key='hk_legacy0403'").fetchone()[0]==1

              # Fresh game data wins and later hydration cannot overwrite it.
              payload2={**payload,'buildings':[{'building_id':'way3','opened':True,'room_count':5,'has_events':True,'is_invest':False,'tier':1,'faction':'','building_type':''}]}
              second=s.submit_map_area('player-live',payload2)
              d2=s.map_detail('area-legacy')
              assert d2['buildings'][0]['room_count']==5 and d2['buildings'][0]['knowledge_source']=='game_live',d2
              assert second['website_hydration']['status']=='hydrated'
              d3=s.map_detail('area-legacy')
              assert d3['buildings'][0]['room_count']==5 and d3['buildings'][0]['knowledge_source']=='game_live',d3

              cab2=s.cabinet_maps(manager)
              legacy=[r for r in cab2['maps'] if r.get('canonical_area_id')=='area-legacy']
              assert len(legacy)==1 and legacy[0]['source_kind']=='combined',legacy

              print('UNIFIED_CABINET_DEDUPE=PASS')
              print('LEGACY_MAP_AUTO_HYDRATE=PASS')
              print('LEGACY_POINT_TO_BUILDING=PASS')
              print('SHARED_ROOM_IMPORT=PASS')
              print('GAME_LIVE_PRIORITY=PASS')
          finally:
              try:os.remove(path)
              except OSError:pass
          PY

      - name: Record build status
        run: |
          server_sha="$(sha256sum /tmp/server.py|awk '{print $1}')"
          client_sha="$(sha256sum /tmp/HamsterKingMobile.user.js|awk '{print $1}')"
          {
            echo "UNIFIED_MAPS_RUNTIME_U1_BUILD=PASS"
            echo "candidate_server_sha256=$server_sha"
            echo "candidate_client_sha256=$client_sha"
            echo "unified_cabinet=PASS"
            echo "legacy_auto_hydrate=PASS"
            echo "shared_preload_filter=PASS"
            echo "safe_active_intersection=PASS"
            echo "read_concurrency=5"
            echo "game_live_priority=PASS"
            echo "deployed=NO"
          } > audit/hk-stage2-unified-maps-u1-build-status.txt
          cat audit/hk-stage2-unified-maps-u1-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-unified-maps-u1-build-status.txt
          git commit -m "audit: verify unified maps runtime U1"
          git pull --rebase origin main
          git push origin HEAD:main
