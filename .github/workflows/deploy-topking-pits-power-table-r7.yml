name: Deploy TopKing Pits Power Table R7

on:
  push:
    paths:
      - 'deploy/topking/pits-power-table-r7-trigger.txt'
  workflow_dispatch:

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact Pits r6 live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_RESPAWN_REV = 'pits-respawn-cost-20260920-r6'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "f8644b37332e2b8d9d763ef80ff00768f932fae31e88963bac51f8791946d895"

      - name: Apply collapsed power table r7
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_pits_power_table_r7_1174.py
          python3 deploy/topking/patch_pits_power_table_r7_1174.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_POWER_TABLE_REV = 'pits-power-table-collapsed-20260920-r7'" /tmp/HamsterKingMobile.user.js
          grep -Fq "let pitPowerTableOpen = false;" /tmp/HamsterKingMobile.user.js
          ! grep -Fq "let pitPowerTableOpen = true;" /tmp/HamsterKingMobile.user.js
          echo "PATCHED_SHA=$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.pits-r7.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.pits-r7.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.pits-r7.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.pits-r7.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?pits-r7=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "HK_PITS_POWER_TABLE_REV = 'pits-power-table-collapsed-20260920-r7'" /tmp/public.js
          grep -Fq "let pitPowerTableOpen = false;" /tmp/public.js
          echo "PUBLIC_SHA=$(sha256sum /tmp/public.js | awk '{print $1}')"
          echo "PITS_POWER_TABLE_R7=PASS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
