name: Diagnose public war and alliance data

on:
  push:
    paths:
      - 'deploy/topking/public-data-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Read public data
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -e
            base=""
            for port in 8787 3188; do
              if curl -fsS --max-time 3 "http://127.0.0.1:$port/health" >/tmp/hk-health.json 2>/dev/null; then
                base="http://127.0.0.1:$port"
                break
              fi
            done
            echo "=== BASE === $base"
            echo "=== HEALTH ==="
            cat /tmp/hk-health.json || true
            echo
            echo "=== WAR ==="
            curl -fsS "$base/api/v1/public/clan-war" || true
            echo
            for kind in alliance_power alliance_influence alliance_defense alliances; do
              echo "=== RATING:$kind ==="
              curl -fsS "$base/api/v1/public/ratings?kind=$kind&limit=10" || true
              echo
            done
          '
      - name: Inspect live collector and recent submissions
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -e
            echo "=== LICENSE CHECK SOURCE ==="
            grep -n -B 20 -A 120 "^def license_check" /opt/hamsterking-license/server.py || true
            echo "=== UPDATE REQUIRED SOURCE ==="
            grep -n -B 25 -A 45 "update_required" /opt/hamsterking-license/server.py | head -160 || true
            echo "=== LIVE LOADER HEADER ==="
            head -40 /opt/hamsterking-license/HamsterKingMobile.loader.user.js || true
            echo "=== SERVICE MIN VERSION ==="
            systemctl show hamsterking-license.service -p Environment --no-pager | tr " " "\n" | grep -E "HK_MIN_SCRIPT_VERSION|HK_RELEASE_PATH" || true
            echo "=== LIVE MAP CRYSTAL SOURCE ==="
            python3 - <<'PY'
            from pathlib import Path
            import re
            p=Path("/opt/hamsterking-license/HamsterKingMobile.user.js")
            s=p.read_text("utf-8","replace")
            for term in ("crystalRoomCount","buildingRooms","mapAreaPayload","acceptBuildingStudy","/player/building?building_id=","mapBackfillActiveBuildingStudies"):
                print("###",term)
                starts=[m.start() for m in re.finditer(re.escape(term),s)]
                for i in starts[:6]:
                    print(s[max(0,i-1800):min(len(s),i+5200)])
                    print("---")
            PY
            echo "=== LIVE V4 MARKERS ==="
            grep -nE "HK_PUBLIC_WAR_ALLIANCE_V4|readPublicWarV4|readPublicRatingsV4|public-snapshot" /opt/hamsterking-license/HamsterKingMobile.user.js | head -40 || true
            echo "=== LIVE SNAPSHOT CALL ==="
            grep -nE "Promise\.all\(\[readPublicWar|collectPublicSnapshot" /opt/hamsterking-license/HamsterKingMobile.user.js | head -30 || true
            echo "=== RATING DB SUMMARY ==="
            python3 -c "import sqlite3;d=sqlite3.connect(\"/var/lib/hamsterking-license/licenses.db\");[(print(*r,sep=\"|\")) for r in d.execute(\"SELECT kind,COUNT(*),MIN(updated_at),MAX(updated_at),substr(source_player_id,1,12) FROM public_rating_snapshots GROUP BY kind,source_player_id ORDER BY MAX(updated_at) DESC\")]" || true
            echo "=== WAR DB SUMMARY ==="
            python3 -c "import sqlite3;d=sqlite3.connect(\"/var/lib/hamsterking-license/licenses.db\");[(print(*r,sep=\"|\")) for r in d.execute(\"SELECT singleton,updated_at,substr(source_player_id,1,12),snapshot_json FROM public_clan_war_snapshot\")]" || true
            echo "=== RECENT SCRIPT VERSIONS ==="
            python3 -c "import sqlite3;d=sqlite3.connect(\"/var/lib/hamsterking-license/licenses.db\");[(print(*r,sep=\"|\")) for r in d.execute(\"SELECT script_version,MAX(last_seen),COUNT(*) FROM devices GROUP BY script_version ORDER BY MAX(last_seen) DESC LIMIT 12\")]" || true
            echo "=== RECENT ACCESS VERSIONS ==="
            python3 -c "import sqlite3,time;d=sqlite3.connect(\"/var/lib/hamsterking-license/licenses.db\");[(print(*r,sep=\"|\")) for r in d.execute(\"SELECT script_version,MAX(created_at),COUNT(*) FROM access_log WHERE created_at>? GROUP BY script_version ORDER BY MAX(created_at) DESC\",(int(time.time())-1800,))]" || true
            echo "=== RECENT HTTP ==="
            journalctl -u hamsterking-license.service --since "15 minutes ago" --no-pager | grep -E "public-snapshot|/api/v1/check|POST /api/v1" | tail -80 || true
          '
      - name: Inspect Hamster King alliance routes
        run: |
          set -euo pipefail
          mkdir -p /tmp/hk-app
          curl -fsSL --max-time 20 https://app.hamsterking.games/ -o /tmp/hk-app/index.html
          echo "=== APP HTML PREVIEW ==="
          sed -n '1,40p' /tmp/hk-app/index.html || true
          echo "=== SCRIPT SRCS ==="
          grep -o 'src="[^"]*"' /tmp/hk-app/index.html | head -40 || true
          echo "=== CLIENT BUILD ==="
          curl -fsSL --max-time 20 https://cdn-prod-route-service.hwgame.cloud/version -o /tmp/hk-app/version.json
          cat /tmp/hk-app/version.json
          echo
          build="$(python3 -c 'import json;print(json.load(open("/tmp/hk-app/version.json")).get("client_build",""))')"
          test -n "$build"
          curl -fsSL --max-time 25 "https://app.hamsterking.games/app_${build}.html" -o /tmp/hk-app/app.html
          echo "=== APP BUILD HTML ==="
          sed -n '1,50p' /tmp/hk-app/app.html || true
          python3 - <<'PY'
          import re, html, pathlib, urllib.parse
          text=pathlib.Path('/tmp/hk-app/app.html').read_text('utf-8','replace')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',text,re.I)
          base='https://app.hamsterking.games/'
          for i,src in enumerate(srcs[:30]):
              print(f'SCRIPT {i} {urllib.parse.urljoin(base,html.unescape(src))}')
          PY
          python3 - <<'PY' >/tmp/hk-app/scripts.txt
          import re, html, pathlib, urllib.parse
          text=pathlib.Path('/tmp/hk-app/index.html').read_text('utf-8','replace')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',text,re.I)
          base='https://app.hamsterking.games/'
          for src in srcs[:30]:
              print(urllib.parse.urljoin(base,html.unescape(src)))
          PY
          n=0
          while IFS= read -r url; do
            n=$((n+1))
            curl -fsSL --max-time 25 "$url" -o "/tmp/hk-app/$n.js" || continue
          done </tmp/hk-app/scripts.txt
          curl -fsSL --max-time 30 https://cdn-prod-front-dist.hwgame.cloud/assets/app_2017.js -o /tmp/hk-app/app_2017.js
          echo "=== FOCUSED API CONTEXTS ==="
          python3 deploy/topking/inspect_game_bundle.py /tmp/hk-app/app_2017.js

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
