name: Diagnose public war and alliance data

on:
  push:
    paths:
      - 'deploy/topking/public-data-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Read public data
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -e
            base=""
            for port in 8787 3188; do
              if curl -fsS --max-time 3 "http://127.0.0.1:$port/health" >/tmp/hk-health.json 2>/dev/null; then
                base="http://127.0.0.1:$port"
                break
              fi
            done
            echo "=== BASE === $base"
            echo "=== HEALTH ==="
            cat /tmp/hk-health.json || true
            echo
            echo "=== WAR ==="
            curl -fsS "$base/api/v1/public/clan-war" || true
            echo
            for kind in alliance_power alliance_influence alliance_defense alliances; do
              echo "=== RATING:$kind ==="
              curl -fsS "$base/api/v1/public/ratings?kind=$kind&limit=10" || true
              echo
            done
          '
      - name: Inspect Hamster King alliance routes
        run: |
          set -euo pipefail
          mkdir -p /tmp/hk-app
          curl -fsSL --max-time 20 https://app.hamsterking.games/ -o /tmp/hk-app/index.html
          echo "=== APP HTML PREVIEW ==="
          sed -n '1,40p' /tmp/hk-app/index.html || true
          echo "=== SCRIPT SRCS ==="
          grep -o 'src="[^"]*"' /tmp/hk-app/index.html | head -40 || true
          python3 - <<'PY'
          import re, html, pathlib, urllib.parse
          text=pathlib.Path('/tmp/hk-app/index.html').read_text('utf-8','replace')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',text,re.I)
          base='https://app.hamsterking.games/'
          for i,src in enumerate(srcs[:30]):
              print(f'SCRIPT {i} {urllib.parse.urljoin(base,html.unescape(src))}')
          PY
          python3 - <<'PY' >/tmp/hk-app/scripts.txt
          import re, html, pathlib, urllib.parse
          text=pathlib.Path('/tmp/hk-app/index.html').read_text('utf-8','replace')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',text,re.I)
          base='https://app.hamsterking.games/'
          for src in srcs[:30]:
              print(urllib.parse.urljoin(base,html.unescape(src)))
          PY
          n=0
          while IFS= read -r url; do
            n=$((n+1))
            curl -fsSL --max-time 25 "$url" -o "/tmp/hk-app/$n.js" || continue
          done </tmp/hk-app/scripts.txt
          echo "=== ALLIANCE ROUTE STRINGS ==="
          python3 - <<'PY'
          import pathlib,re
          found=[]
          for p in pathlib.Path('/tmp/hk-app').glob('*.js'):
              text=p.read_text('utf-8','replace')
              for m in re.finditer(r'.{0,140}(?:/alliance|alliance/|active_defense_wars|active_battles).{0,220}',text,re.I|re.S):
                  s=re.sub(r'\s+',' ',m.group(0))
                  if s not in found:
                      found.append(s)
                  if len(found)>=120: break
              if len(found)>=120: break
          for row in found: print(row[:500])
          PY

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
