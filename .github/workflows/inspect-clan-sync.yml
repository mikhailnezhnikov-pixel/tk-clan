name: Inspect TopKing clan sync source

on:
  push:
    paths:
      - '.github/workflows/inspect-clan-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Locate live source files
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking"             -o BatchMode=yes             -o ConnectTimeout=15             -o StrictHostKeyChecking=accept-new             root@89.125.1.71 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "SSH_OK"
          echo "SERVICE=$(systemctl is-active hamsterking-license.service 2>/dev/null || true)"
          echo "SERVER_PY:"
          test -f /opt/hamsterking-license/server.py && printf '%s\n' /opt/hamsterking-license/server.py || true
          echo "USERSCRIPT_CANDIDATES:"
          find /opt /srv /var/www /root -maxdepth 5 -type f             \( -iname '*HamsterKingMobile*.js' -o -iname '*.user.js' -o -iname '*hamster*mobile*.js' \)             2>/dev/null | head -20
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/topking"
