name: Test TopKing Stage 1 Build Only

on:
  push:
    paths:
      - 'deploy/topking/stage1-build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-topking-stage1-build
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live 1.14.4 read only
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js

      - name: Test Stage 1 build and record result
        run: |
          set +e
          : > /tmp/stage1-build.log
          python3 deploy/topking/test_stage1_patch_fixture.py >>/tmp/stage1-build.log 2>&1
          fixture_status=$?
          if [ "$fixture_status" -eq 0 ]; then fixture=passed; else fixture=failed; fi

          python3 deploy/topking/stage1_runner_patch.py >>/tmp/stage1-build.log 2>&1
          patch_status=$?
          if [ "$patch_status" -eq 0 ]; then patch=passed; else patch=failed; fi

          node --check /tmp/HamsterKingMobile.user.js >>/tmp/stage1-build.log 2>&1
          syntax_status=$?
          if [ "$syntax_status" -eq 0 ]; then syntax=ok; else syntax=bad; fi

          validation=failed
          if [ "$patch_status" -eq 0 ] &&
             grep -q '^// @version      1.15.0            echo "--- log tail ---"
            tail -n 40 /tmp/stage1-build.log
          } > audit/hk-stage1-build-test.txt

          cp audit/hk-stage1-build-test.txt /tmp/hk-stage1-build-test.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit
            cp /tmp/hk-stage1-build-test.txt audit/hk-stage1-build-test.txt
            git add audit/hk-stage1-build-test.txt
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m "Record Stage 1 build-only test"
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = "1"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/stage1-build.log
 /tmp/HamsterKingMobile.user.js &&
             grep -q "HK_MUTATION_GATE_REV.*stage1-20260919-r4" /tmp/HamsterKingMobile.user.js &&
             grep -q "growthCostOnlyUses(cost,\[GROWTH_HAMSTER_BUDGET_ID\])" /tmp/HamsterKingMobile.user.js &&
             grep -q "growthCostOnlyUses(cost,\[GROWTH_GENERAL_BUDGET_ID\])" /tmp/HamsterKingMobile.user.js &&
             grep -q "growthGeneralCostSafe(fast)" /tmp/HamsterKingMobile.user.js &&
             grep -q "growthGeneralCostSafe(costs)" /tmp/HamsterKingMobile.user.js &&
             grep -q "growth-general-no-progress" /tmp/HamsterKingMobile.user.js &&
             grep -q "growth-hamster-no-progress" /tmp/HamsterKingMobile.user.js; then
            validation=passed
          fi

          mkdir -p audit
          {
            echo "fixture=$fixture"
            echo "patch=$patch"
            echo "syntax=$syntax"
            echo "validation=$validation"
            echo "built_version=$(grep -m1 '^// @version' /tmp/HamsterKingMobile.user.js | sed 's/^\/\/ @version[[:space:]]*//')"
            echo "--- log tail ---"
            tail -n 40 /tmp/stage1-build.log
          } > audit/hk-stage1-build-test.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage1-build-test.txt
          git commit -m "Record Stage 1 build-only test" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/stage1-build.log
