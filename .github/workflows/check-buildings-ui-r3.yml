name: Check Buildings UI R3

on:
  push:
    paths:
      - 'deploy/topking/buildings-ui-r3-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build compact candidate
        run: |
          set -euo pipefail
          cp baseline/topking/HamsterKingMobile.current.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.14" /tmp/HamsterKingMobile.user.js
          python3 -m py_compile deploy/topking/patch_buildings_ui_r3_1_17_15.py
          python3 deploy/topking/patch_buildings_ui_r3_1_17_15.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.15" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r17-buildings-ui-compact" /tmp/HamsterKingMobile.user.js
          grep -Fq "buildings-ui-20260921-r3" /tmp/HamsterKingMobile.user.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text()
          a=s.index('  function renderBuildings() {')
          b=s.index('\n\n  async function refreshBuildings',a)
          block=s[a:b]
          assert 'Активные здания' not in block
          assert 'Active buildings' not in block
          assert 'data-building-read' not in block
          assert "either('Активные','Active')" in block
          assert 'activeValue' in block
          print('ACTIVE_BUILDING_LIST_REMOVED=PASS')
          PY
          grep -Fq "maps-shared-runtime-20260921-r7-safe5" /tmp/HamsterKingMobile.user.js
          grep -Fq "explore-e3-single-20260920-r9-runner" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /tmp/HamsterKingMobile.user.js
          grep -Fq "AUTH_PASSIVE_SAFETY_R1" /tmp/HamsterKingMobile.user.js
          echo "BUILDINGS_UI_R3_PREDEPLOY=PASS"
