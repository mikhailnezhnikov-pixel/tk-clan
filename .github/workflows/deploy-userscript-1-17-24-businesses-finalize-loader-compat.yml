name: Deploy Userscript 1.17.24 Businesses Finalize Loader Compat

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-24-businesses-finalize-loader-compat-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch current r28 live
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.24" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r28-businesses-finalize" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-finalize-single-snapshot-20260921-r1" /tmp/HamsterKingMobile.user.js
          cmp -s /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          echo "R28_LIVE_BASELINE=PASS"

      - name: Apply loader compatibility pin
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_businesses_finalize_loader_compat_1_17_24.py
          python3 deploy/topking/patch_businesses_finalize_loader_compat_1_17_24.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r27-businesses-runner-canon" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-finalize-single-snapshot-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "business-final-check" /tmp/HamsterKingMobile.user.js
          echo "LOADER_COMPAT_CANDIDATE=PASS"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.24.finalize-loader-compat.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.1.17.24.finalize-loader-compat.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.24.finalize-loader-compat.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.1.17.24.finalize-loader-compat.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?businesses-finalize-compat=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "core-20260921-r27-businesses-runner-canon" /tmp/public.js
          grep -Fq "businesses-finalize-single-snapshot-20260921-r1" /tmp/public.js
          echo "PUBLIC_FINALIZE_LOADER_COMPAT=PASS"

      - name: Sync baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          {
            echo "USERSCRIPT_1_17_24_BUSINESSES_FINALIZE_LOADER_COMPAT=PASS"
            echo "version=1.17.24"
            echo "core=core-20260921-r27-businesses-runner-canon"
            echo "finalize_marker=businesses-finalize-single-snapshot-20260921-r1"
            echo "single_snapshot_final_check=PASS"
            echo "public_loader_r24_core_r27=COMPATIBLE"
          } > audit/hk-userscript-1-17-24-businesses-finalize-loader-compat-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-24-businesses-finalize-loader-compat-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "hotfix: keep Businesses finalize compatible with loader r24"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.1.17.24.finalize-loader-compat.user.js /tmp/public.js
