name: Deploy TopKing 1.16.8 Buildings Explore

on:
  push:
    paths:
      - 'deploy/topking/stage2i-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Fetch verified live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.16.7$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2H_WARS_REV = 'stage2h-wars-20260919-r1'" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
      - name: Build and validate
        run: |
          set -euo pipefail
          python3 deploy/topking/stage2i_buildings_explore_patch.py
          grep -q '^// @version      1.16.8$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2I_BUILDINGS_REV = 'stage2i-buildings-explore-20260919-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq 'data-content="buildings"' /tmp/HamsterKingMobile.user.js
          grep -Fq 'data-content="explore"' /tmp/HamsterKingMobile.user.js
          grep -Fq "/player/building?building_id=" /tmp/HamsterKingMobile.user.js
          grep -Fq "/game_area/" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
      - name: Deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -euo pipefail;
            stamp="$(date +%Y%m%d-%H%M%S)";
            node --check /tmp/HamsterKingMobile.user.js;
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp";
            install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js;
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.16.8\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf;
            systemctl daemon-reload;
            systemctl restart hamsterking-license.service;
            systemctl is-active --quiet hamsterking-license.service;
            grep -q "^// @version      1.16.8$" /opt/hamsterking-license/HamsterKingMobile.user.js;
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js'
      - name: Round trip verify
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/live-after.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/live-after.js
          node --check /tmp/live-after.js
          sha="$(sha256sum /tmp/live-after.js | awk '{print $1}')"
          mkdir -p audit
          {
            echo "version=1.16.8"
            echo "stage2i=stage2i-buildings-explore-20260919-r1"
            echo "modules=buildings,explore"
            echo "building_endpoint=/player/building"
            echo "explore_endpoints=/game_area/*,/game_area/*/buildings"
            echo "syntax=ok"
            echo "roundtrip=identical"
            echo "sha256=$sha"
          } > audit/hk-1168-live-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-1168-live-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Verify live TopKing 1.16.8 Buildings Explore"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/live-after.js
