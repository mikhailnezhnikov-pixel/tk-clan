name: Deploy TopKing 1.16.9 Bosses
on:
  push:
    paths: ['deploy/topking/stage2i-deploy-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: SSH
        env: {SSH_PRIVATE_KEY: \${{ secrets.TOPKING_SSH_KEY }}}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"; printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"; chmod 600 "$HOME/.ssh/topking"
      - name: Fetch and build
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.16.9 /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/stage2i_bosses_patch.py
          grep -q '^// @version      1.16.9$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2J_BOSSES_REV = 'stage2j-bosses-20260920-r1'" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
      - name: Deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -euo pipefail; stamp="$(date +%Y%m%d-%H%M%S)"; node --check /tmp/HamsterKingMobile.user.js; cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp"; install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js; printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.16.9\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf; systemctl daemon-reload; systemctl restart hamsterking-license.service; systemctl is-active --quiet hamsterking-license.service; grep -q "^// @version      1.16.9$" /opt/hamsterking-license/HamsterKingMobile.user.js; node --check /opt/hamsterking-license/HamsterKingMobile.user.js'
      - name: Verify
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/live.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/live.js; node --check /tmp/live.js
          sha="$(sha256sum /tmp/live.js | awk '{print $1}')"; mkdir -p audit
          printf '%s\n' "version=1.16.9" "stage2i=stage2j-bosses-20260920-r1" "modules=bosses-view,boss-state,boss-pit-summary" "mode=read-only" "syntax=ok" "roundtrip=identical" "sha256=$sha" > audit/hk-1169-live-status.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add audit/hk-1169-live-status.txt
          if ! git diff --cached --quiet; then git commit -m "Verify live TopKing 1.16.9 Bosses"; git pull --rebase origin main; git push origin HEAD:main; fi
      - if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/live.js
