name: Build Userscript 1.18.36 Lights Completed DOM Return

on:
  push:
    paths:
      - 'deploy/topking/patch_lights_completed_dom_return_1_18_36.py'
      - '.github/workflows/build-userscript-1-18-36-lights-completed-dom-return.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.35" /tmp/HamsterKingMobile.user.js
          grep -Fq "lights-map-return-after-main-reward-20260927-r1" /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/patch_lights_completed_dom_return_1_18_36.py /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.36" /tmp/HamsterKingMobile.user.js
          grep -Fq "lights-completed-dom-return-20260927-r2" /tmp/HamsterKingMobile.user.js
          grep -Fq "lightsRewardActivated" /tmp/HamsterKingMobile.user.js
          grep -Fq "lights-completed-runner-release" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.36.lights-completed-dom-return.candidate.user.js
          audit=audit/hk-userscript-1-18-36-lights-completed-dom-return-predeploy.txt
          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.35':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.35',
              'target_version':'1.18.36',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.36.lights-completed-dom-return.candidate.user.js',
              'primary_marker':'lights-completed-dom-return-20260927-r2',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-36-lights-completed-dom-return-live-status.txt',
              'commit_message':'fix: deploy activated lights return in userscript 1.18.36',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          {
            echo "USERSCRIPT_1_18_36_LIGHTS_COMPLETED_DOM_RETURN_PREDEPLOY=PASS"
            echo "source_version=1.18.35"
            echo "target_version=1.18.36"
            echo "completion_source=ACTIVATED_REWARD_DOM"
            echo "stale_lights_runner=RELEASED"
            echo "return_target=BOTTOM_GAME_FOOTER"
            echo "right_floating_back=EXCLUDED"
            echo "map_return_verification=ENABLED"
            echo "syntax=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.36 activated lights return"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
