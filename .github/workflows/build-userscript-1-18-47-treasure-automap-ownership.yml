name: Build Userscript 1.18.47 Treasure AutoMap Ownership

on:
  push:
    paths:
      - 'deploy/topking/patch_treasure_automap_module_ownership_1_18_47.py'
      - 'deploy/topking/verify_treasure_autopilot_contract.py'
      - '.github/workflows/build-userscript-1-18-47-treasure-automap-ownership.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.18.46" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-location-modal-root-20260927-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-chest-map-foreground-guard-20260927-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_treasure_automap_module_ownership_1_18_47.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.47" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-automap-module-ownership-20260927-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-automap-module-rearm" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-automap-module-block" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/verify_treasure_autopilot_contract.py /tmp/HamsterKingMobile.user.js

          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')

          owner=s[s.index('function autoMapEnsureOwnedModule'):s.index('function autoMapCaptureModes')]
          for marker in [
              "setLightsAutoEnabled(true)",
              "setChestAutoEnabled(true)",
              "setFishingAutoEnabled(true)",
              "setTraderAutoEnabled(true)",
              "treasure-automap-module-rearm",
              "treasure-automap-module-block",
          ]:
              assert marker in owner, marker

          fail=s[s.index('function failLightsAuto'):s.index('async function runLightsAuto')]
          fatal=fail[fail.index('const fatalReasons'):fail.index('if (autoMapOwnsLights')]
          assert 'stale-modal-blocking' not in fatal
          assert 'modal-not-closed-after-change' not in fatal
          assert "autoMapBlockOwnedModule('lights',reason,30000)" in fail

          tick=s[s.index('async function runAutoMapTick'):s.index('function setAutoMapEnabled')]
          assert "if (autoMapEnsureOwnedModule(ownedSignature))" in tick

          check=s[s.index('function checkPuzzle()'):s.index('function start()')]
          assert "if (autoMapEnsureOwnedModule(signature)) return;" in check

          print("TREASURE_AUTOMAP_OWNERSHIP_STATIC_SMOKE=PASS")
          PY

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.47.treasure-automap-ownership.candidate.user.js
          audit=audit/hk-userscript-1-18-47-treasure-automap-ownership-predeploy.txt

          git fetch origin main
          git reset --hard origin/main

          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.46':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")

          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)

          out={
              'schema':1,
              'source_version':'1.18.46',
              'target_version':'1.18.47',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.47.treasure-automap-ownership.candidate.user.js',
              'primary_marker':'treasure-automap-module-ownership-20260927-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-47-treasure-automap-ownership-live-status.txt',
              'commit_message':'fix: deploy AutoMap module ownership and Treasure regression gate in userscript 1.18.47',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          {
            echo "USERSCRIPT_1_18_47_TREASURE_AUTOMAP_OWNERSHIP_PREDEPLOY=PASS"
            echo "source_version=1.18.46"
            echo "target_version=1.18.47"
            echo "automap_child_modules=PARENT_OWNED"
            echo "lights_ui_failures=RECOVERABLE"
            echo "lights_math_failures=BLOCKED_30S"
            echo "treasure_regression_contract=PASS"
            echo "syntax=PASS"
            echo "static_smoke=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.47 AutoMap ownership"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
