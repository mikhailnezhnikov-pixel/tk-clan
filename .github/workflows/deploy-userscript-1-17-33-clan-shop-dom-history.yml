name: Deploy Userscript 1.17.33 Clan Shop DOM History

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-33-clan-shop-history-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch and patch live userscript
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.32" /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/patch_clan_shop_dom_history_1_17_33.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.33" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-shop-dom-history-capture-20260922-r3" /tmp/HamsterKingMobile.user.js
          grep -Fq "/clan-shop-events/submit" /tmp/HamsterKingMobile.user.js

      - name: Deploy
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.33.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.1.17.33.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.33.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.1.17.33.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.17.33\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
            systemctl daemon-reload
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public script
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 "https://hk-license.89.125.1.71.sslip.io/panel.js?clan-shop-dom-history=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.33" /tmp/public.js
          grep -Fq "clan-shop-dom-history-capture-20260922-r3" /tmp/public.js
          echo "PUBLIC_1_17_33=PASS"

      - name: Sync baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          printf "%s\n" "USERSCRIPT_1_17_33_CLAN_SHOP_DOM_HISTORY=PASS" "version=1.17.33" > audit/hk-userscript-1-17-33-clan-shop-dom-history-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-33-clan-shop-dom-history-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix: capture visible Clan Shop history in userscript 1.17.33"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
