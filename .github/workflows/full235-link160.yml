name: Link 160 full235 exact building matches

on:
  push:
    paths:
      - 'deploy/topking/full235-link160-trigger.txt'

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/topking
          chmod 600 ~/.ssh/topking

      - name: Build exact manifest from read-only dry-run
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('audit/hk-stage2-full235-fingerprint-dryrun.json'))
          rows=[x for x in d['rows'] if x['category']=='exact6']
          assert len(rows)==160,len(rows)
          assert len({x['map_key'] for x in rows})==160
          assert len({x['top_area_id'] for x in rows})==160
          assert all(x['sample_hit_ids']==6 and x['top_hits']==6 and x['second_hits']==0 for x in rows)
          manifest=[{
              'map_key':x['map_key'],
              'canonical_area_id':x['top_area_id'],
              'sample_ids':x['sample_ids'],
              'city':x['city'],
              'grid':x['grid'],
          } for x in rows]
          open('/tmp/full235-link160.json','w').write(json.dumps(manifest,ensure_ascii=False,separators=(',',':')))
          print('LINK160_MANIFEST=PASS maps=160')
          PY

      - name: Preflight live DB read-only
        run: |
          set -euo pipefail
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/full235-link160.json root@89.125.1.71:/tmp/full235-link160.json
          cat > /tmp/link160.py <<'PY'
          import importlib.util,json,sqlite3,os,time
          DB='/var/lib/hamsterking-license/licenses.db'
          manifest=json.load(open('/tmp/full235-link160.json'))

          spec=importlib.util.spec_from_file_location('s','/opt/hamsterking-license/server.py')
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)

          def ro():
              db=sqlite3.connect('file:'+DB+'?mode=ro',uri=True);db.row_factory=sqlite3.Row;return db

          db=ro()
          conflicts=[]
          missing_areas=[]
          bad_samples=[]
          before_links={r['map_key']:r['canonical_area_id'] for r in db.execute("SELECT map_key,canonical_area_id FROM hk_map_area_links")}
          area_count=db.execute("SELECT COUNT(*) FROM map_areas").fetchone()[0]
          building_count=db.execute("SELECT COUNT(*) FROM map_buildings").fetchone()[0]
          for m in manifest:
              key=m['map_key'];area=m['canonical_area_id']
              old=before_links.get(key)
              if old and old!=area: conflicts.append([key,old,area])
              if not db.execute("SELECT 1 FROM map_areas WHERE area_id=?",(area,)).fetchone():
                  missing_areas.append(area)
              q=','.join('?'*len(m['sample_ids']))
              got={r[0] for r in db.execute(
                  f"SELECT building_id FROM map_buildings WHERE area_id=? AND building_id IN ({q})",
                  [area,*m['sample_ids']]
              )}
              if got!=set(m['sample_ids']):bad_samples.append([key,len(got)])
          db.close()
          assert not conflicts,conflicts
          assert not missing_areas,missing_areas
          assert not bad_samples,bad_samples

          # Consistent backup immediately before the first link write.
          stamp=time.strftime('%Y%m%d-%H%M%S',time.gmtime())
          backup=DB+'.bak.full235-link160.'+stamp
          src=sqlite3.connect(DB);dst=sqlite3.connect(backup);src.backup(dst);dst.close();src.close()

          for m in manifest:
              r=s.link_hk_map_area(m['map_key'],m['canonical_area_id'])
              link=r.get('link') or {}
              assert link.get('canonical_area_id')==m['canonical_area_id'],(m,r)

          db=ro()
          after_links={r['map_key']:r['canonical_area_id'] for r in db.execute("SELECT map_key,canonical_area_id FROM hk_map_area_links")}
          for m in manifest:
              assert after_links.get(m['map_key'])==m['canonical_area_id'],m
          assert db.execute("SELECT COUNT(*) FROM map_areas").fetchone()[0]==area_count
          assert db.execute("SELECT COUNT(*) FROM map_buildings").fetchone()[0]==building_count
          exact_targets=[after_links[m['map_key']] for m in manifest]
          assert len(set(exact_targets))==160
          db.close()

          # Idempotent second pass.
          for m in manifest:
              r=s.link_hk_map_area(m['map_key'],m['canonical_area_id'])
              assert (r.get('link') or {}).get('canonical_area_id')==m['canonical_area_id']

          db=ro()
          second={r['map_key']:r['canonical_area_id'] for r in db.execute("SELECT map_key,canonical_area_id FROM hk_map_area_links")}
          assert all(second.get(m['map_key'])==m['canonical_area_id'] for m in manifest)
          out={
              'FULL235_LINK160':'PASS',
              'safe_maps':160,
              'existing_before':sum(1 for m in manifest if m['map_key'] in before_links),
              'new_links':sum(1 for m in manifest if m['map_key'] not in before_links),
              'total_links_after':len(second),
              'map_areas_unchanged':True,
              'map_buildings_unchanged':True,
              'idempotent_rerun':'PASS',
              'backup':backup,
          }
          print(json.dumps(out,sort_keys=True))
          db.close()
          PY
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/link160.py root@89.125.1.71:/tmp/link160.py
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/link160.py' | tee /tmp/link160-result.json

      - name: Record status
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/link160-result.json'))
          assert d['FULL235_LINK160']=='PASS'
          assert d['safe_maps']==160
          assert d['idempotent_rerun']=='PASS'
          open('audit/hk-stage2-full235-link160-live-status.txt','w').write('\n'.join(f'{k}={v}' for k,v in d.items())+'\n')
          PY
          cat audit/hk-stage2-full235-link160-live-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-full235-link160-live-status.txt
          git commit -m "audit: link 160 full235 exact building matches"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: |
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'rm -f /tmp/full235-link160.json /tmp/link160.py' || true
          rm -f ~/.ssh/topking /tmp/full235-link160.json /tmp/link160-result.json
