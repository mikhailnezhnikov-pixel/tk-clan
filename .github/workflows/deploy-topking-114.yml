name: Deploy TopKing 1.14.0

on:
  push:
    paths:
      - '.github/workflows/deploy-topking-114.yml'
      - 'deploy/topking/userscript-1.14.0.patch.part00.b64'
      - 'deploy/topking/userscript-1.14.0.patch.part01.b64'
      - 'deploy/topking/userscript-1.14.0.patch.part02.b64'
      - 'deploy/topking/userscript-1.14.0.patch.part03.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live 1.13.0
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.13.0$' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Build and validate 1.14.0
        shell: bash
        run: |
          set -euo pipefail
          cat \
            deploy/topking/userscript-1.14.0.patch.part00.b64 \
            deploy/topking/userscript-1.14.0.patch.part01.b64 \
            deploy/topking/userscript-1.14.0.patch.part02.b64 \
            deploy/topking/userscript-1.14.0.patch.part03.b64 \
            | base64 -d | gzip -d > /tmp/userscript-1.14.0.patch

          patch --fuzz=0 /tmp/HamsterKingMobile.user.js < /tmp/userscript-1.14.0.patch
          grep -q '^// @version      1.14.0$' /tmp/HamsterKingMobile.user.js
          grep -q 'const hkGameBridge' /tmp/HamsterKingMobile.user.js
          grep -q 'game-bridge-discovered' /tmp/HamsterKingMobile.user.js
          grep -q 'refreshModuleLive' /tmp/HamsterKingMobile.user.js
          grep -q 'MODULE_LIVE_TTL_MS' /tmp/HamsterKingMobile.user.js
          grep -q "shopViewDocument = await apiJson('/shop/view', 'GET')" /tmp/HamsterKingMobile.user.js
          grep -q 'growthRunGeneralsCore' /tmp/HamsterKingMobile.user.js
          grep -q 'growthRunPriorityCopiesCore' /tmp/HamsterKingMobile.user.js
          grep -q 'clanCanonicalSnapshot' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          echo '06acfbf79575c757533d0207cc0928bb8093dbb4f0aca6f312618aac39a8560b  /tmp/HamsterKingMobile.user.js' | sha256sum -c -

      - name: Deploy 1.14.0
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js

          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'set -euo pipefail;
              stamp="$(date +%Y%m%d-%H%M%S)";
              cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp";
              grep -q "^// @version      1.14.0$" /tmp/HamsterKingMobile.user.js;
              node --check /tmp/HamsterKingMobile.user.js;
              install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js;
              install -d -m 755 /etc/systemd/system/hamsterking-license.service.d;
              printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.14.0\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf;
              systemctl daemon-reload;
              systemctl restart hamsterking-license.service;
              systemctl is-active --quiet hamsterking-license.service;
              sleep 2;
              (curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/cabinet/config || curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/cabinet/config);
              echo;
              grep -m1 "^// @version" /opt/hamsterking-license/HamsterKingMobile.user.js;
              grep -q "const hkGameBridge" /opt/hamsterking-license/HamsterKingMobile.user.js;
              grep -q "refreshModuleLive" /opt/hamsterking-license/HamsterKingMobile.user.js;
              sha256sum /opt/hamsterking-license/HamsterKingMobile.user.js | grep -q "^06acfbf79575c757533d0207cc0928bb8093dbb4f0aca6f312618aac39a8560b ";
              echo DEPLOY_OK'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/userscript-1.14.0.patch
