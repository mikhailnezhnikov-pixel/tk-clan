name: Build Userscript 1.18.94 Treasure Exit Battle Confirm

on:
  push:
    paths:
      - 'deploy/topking/patch_treasure_exit_battle_confirm_1_18_94.py'
      - 'deploy/topking/verify_treasure_exit_battle_confirm_contract.py'
      - '.github/workflows/build-userscript-1-18-94-treasure-exit-battle-confirm.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-topking-userscript
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.18.93" /tmp/HamsterKingMobile.user.js
          grep -Fq "chest-phase-order-20260929-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_treasure_exit_battle_confirm_1_18_94.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_autopilot_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_lights_resume_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_lights_outer_modal_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_lights_map6_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_key_ack_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_battle_viewport_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_chest_fast_pacing_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_treasury_loop_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_battle_full_clear_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_battle_achievement_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_automation_toggle_guard_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_chest_phase_order_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_exit_battle_confirm_contract.py /tmp/HamsterKingMobile.user.js

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.94.treasure-exit-battle-confirm.candidate.user.js
          audit=audit/hk-userscript-1-18-94-treasure-exit-battle-confirm-predeploy.txt

          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.93':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [
              'chest-phase-order-20260929-r1',
              'chest-uncommitted-retry-20260929-r1',
              'treasure-map-target-scroll-20260929-r1',
              'battle-context-foreground-20260929-r1',
              'treasure-key-receipt-priority-20260929-r1',
              'treasury-corridor-ack-20260929-r1',
              'treasure-map-dominates-stale-minigame-20260929-r1',
              'automation-toggle-trusted-input-20260929-r1',
              'coordinate-overlay-guard-20260929-r1',
              'treasure-map-quiet-gate-20260929-r1',
              'stale-modal-shell-close-20260929-r1',
              'treasure-transaction-gate-20260929-r1',
              'chest-lot-hard-gate-20260929-r1',
              'treasure-key-global-gate-20260929-r1',
              'battle-offscreen-action-scroll-20260929-r1',
              m.get('primary_marker'),
              *m.get('preserve_markers', [])
          ]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.93',
              'target_version':'1.18.94',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.94.treasure-exit-battle-confirm.candidate.user.js',
              'primary_marker':'battle-open-modal-confirm-20260930-r1',
              'preserve_markers':[
                  'chest-exhausted-exit-20260930-r1',
                  *preserve
              ],
              'audit_status_path':'audit/hk-userscript-1-18-94-treasure-exit-battle-confirm-live-status.txt',
              'commit_message':'fix: exit exhausted chests and confirm battle modal in userscript 1.18.94',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          {
            echo "USERSCRIPT_1_18_94_TREASURE_EXIT_BATTLE_CONFIRM_PREDEPLOY=PASS"
            echo "source_version=1.18.93"
            echo "target_version=1.18.94"
            echo "chest_exhausted_exit=ENABLED"
            echo "battle_open_modal_confirm=ENABLED"
            echo "syntax=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.94 treasure exit battle confirm"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
