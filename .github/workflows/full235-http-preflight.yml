name: Full235 import HTTP preflight

on:
  push:
    paths:
      - 'deploy/topking/full235-http-preflight-trigger.txt'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH
        env:
          K: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          scp -i ~/.ssh/k -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
      - name: Extract HTTP/cabinet handlers
        run: |
          python3 - <<'PY'
          import ast,hashlib
          from pathlib import Path
          s=Path('/tmp/server.py').read_text('utf-8')
          t=ast.parse(s)
          wanted={'cabinet_api','cabinet_maps','ensure_cabinet_session','read_json_body','send_json'}
          out=['server_sha256='+hashlib.sha256(s.encode()).hexdigest()]
          for node in ast.walk(t):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in wanted:
                  out.append('\n### '+node.name+'\n'+(ast.get_source_segment(s,node) or ''))
              if isinstance(node,ast.ClassDef):
                  text=ast.get_source_segment(s,node) or ''
                  if 'do_POST' in text or 'do_GET' in text:
                      out.append('\n### HTTP_CLASS '+node.name+'\n'+text)
          Path('audit/hk-full235-http-preflight.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-full235-http-preflight.txt
          git commit -m "audit: inspect full235 import HTTP path"
          git pull --rebase origin main
          git push origin HEAD:main
