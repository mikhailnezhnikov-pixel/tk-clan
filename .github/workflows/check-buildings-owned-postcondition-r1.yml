name: Check Buildings Owned Postcondition R1

on:
  push:
    paths:
      - 'deploy/topking/buildings-owned-postcondition-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify candidate
        run: |
          set -euo pipefail
          cp baseline/topking/HamsterKingMobile.current.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.17" /tmp/HamsterKingMobile.user.js

          python3 -m py_compile deploy/topking/patch_buildings_owned_postcondition_1_17_18.py
          python3 deploy/topking/patch_buildings_owned_postcondition_1_17_18.py
          node --check /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.17.18" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r20-buildings-owned-postcondition" /tmp/HamsterKingMobile.user.js
          grep -Fq "buildings-owned-semantics-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "buildings-postcondition-20260921-r1" /tmp/HamsterKingMobile.user.js

          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/HamsterKingMobile.user.js','utf8');
          const a=s.indexOf('  function buildingCanonAllRows(');
          const b=s.indexOf('  function buildingCanonMapRow(',a);
          if(a<0||b<0) throw new Error('Buildings helper block missing');
          let playerDocument=null;
          eval(s.slice(a,b));

          const rows=Array.from({length:2175},(_,i)=>({
            id:'b'+i,
            tier:i===2000?7:1,
            level:i===2000?33576:100,
            next_tier_level:i<467?100:null,
            is_favorite:i<2,
            slot_index:i<2?i:null
          }));
          const doc={player:{player_active_building:467,max_buildings:698,max_favorite_building:10},buildings:rows};
          const owned=buildingCanonOwnedIds(doc);
          const active=buildingCanonActiveRows(doc);
          const cap=buildingCanonCapacity(doc);

          if(owned.size!==2175) throw new Error('owned size '+owned.size);
          if(!owned.has('b2000')) throw new Error('max-tier owned building missing');
          if(active.length!==467) throw new Error('active rows '+active.length);
          if(cap.active!==467||cap.max!==698||cap.free!==231) throw new Error('capacity '+JSON.stringify(cap));
          if(cap.favorites!==2||cap.favoriteMax!==10||cap.favoriteFree!==8) throw new Error('favorite capacity '+JSON.stringify(cap));

          console.log('owned_rows=2175');
          console.log('active_rows=467');
          console.log('active_capacity=467/698');
          console.log('free_slots=231');
          console.log('max_tier_owned_with_null_next_tier=PASS');
          console.log('favorite_capacity=2/10');
          console.log('BUILDINGS_OWNED_FIXTURE=PASS');
          NODE

          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text()
          plan=s[s.index('async function buildingCanonBuildPlan'):s.index('function buildingCanonActualMetrics')]
          runner=s[s.index('async function runBuildingsCanonical'):s.index('function accountBuildingRows')]
          explore=s[s.index('function exploreActive('):s.index('function exploreTotalEvents')]

          assert 'const ownedBuildingIds=buildingCanonOwnedIds(playerDocument);' in plan
          assert 'ownedBuildingIds.has(buildingId)' in plan
          assert 'buildingCanonActiveIds(playerDocument).has(candidate.buildingId)' not in runner
          assert 'buildingCanonOwnedIds(playerDocument).has(candidate.buildingId)' in runner
          assert "hkAuthoritativePlayerRead('buildings:after-claim')" in runner
          assert 'if(!claimed)' in runner
          assert "hkAuthoritativePlayerRead('buildings:after-favorite')" in runner
          assert 'buildingCanonIsFavorite(candidate.buildingId,playerDocument)' in runner
          assert 'opened+=1;' in runner and runner.index('if(!claimed)') < runner.index('opened+=1;')
          assert 'buildingCanonActiveRows(st)' in explore
          print('candidate_excludes_all_owned=PASS')
          print('claim_postcondition=PASS')
          print('favorite_postcondition=PASS')
          print('explore_active_semantics_preserved=PASS')
          print('BUILDINGS_OWNED_POSTCONDITION_R1_PREDEPLOY=PASS')
          PY

          grep -Fq "maps-shared-runtime-20260921-r7-safe5" /tmp/HamsterKingMobile.user.js
          grep -Fq "explore-e3-single-20260920-r9-runner" /tmp/HamsterKingMobile.user.js
          grep -Fq "AUTH_PASSIVE_SAFETY_R1" /tmp/HamsterKingMobile.user.js
