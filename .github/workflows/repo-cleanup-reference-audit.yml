name: Repo Cleanup Reference Audit

on:
  push:
    paths:
      - 'maintenance/cleanup-audit-trigger.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit references
        run: python3 maintenance/repo_cleanup_audit.py
