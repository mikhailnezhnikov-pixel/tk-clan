name: Validate Userscript 1.17.59 War HP

on:
  push:
    paths:
      - 'deploy/topking/HamsterKingMobile.1.17.59.war-hp-ui.candidate.user.js'
      - '.github/workflows/validate-userscript-1-17-59-war.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.17.59.war-hp-ui.candidate.user.js
          node --check "$candidate"
          grep -Fq "// @version      1.17.59" "$candidate"
          grep -Fq "const BUILD_VERSION = '1.17.59';" "$candidate"
          grep -Fq "war-hp-ui-20260923-r1" "$candidate"
          grep -Fq "fair-bonus-threshold-state-20260923-r1" "$candidate"
          grep -Fq "function warHpHtml" "$candidate"
          grep -Fq "const ourHp=warHpHtml" "$candidate"
          grep -Fq ".hk-war-hp.enemy>span>i" "$candidate"
          sha256sum "$candidate"
