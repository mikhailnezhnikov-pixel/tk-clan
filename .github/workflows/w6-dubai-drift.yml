name: W6 Dubai drift audit
on:
  push:
    paths: ['deploy/topking/w6-dubai-drift-trigger.txt']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/topking
          chmod 600 ~/.ssh/topking
      - name: audit read-only
        run: |
          cat > /tmp/w6-dubai.py <<'PY'
          import json,sqlite3
          db=sqlite3.connect('file:/var/lib/hamsterking-license/licenses.db?mode=ro',uri=True);db.row_factory=sqlite3.Row
          old='79cb821a-ecc1-4605-a96d-0d8ee504b74c'
          out={}
          out['old_area']=[dict(r) for r in db.execute('SELECT * FROM map_areas WHERE area_id=?',(old,))]
          out['old_alias']=[dict(r) for r in db.execute('SELECT * FROM map_area_aliases WHERE source_area_id=? OR canonical_area_id=?',(old,old))]
          out['dubai_35_53']=[dict(r) for r in db.execute("SELECT area_id,city_id,city_name,x,y,last_seen FROM map_areas WHERE lower(trim(city_name))='dubai' AND x=35 AND y=53")]
          out['dubai_53_35']=[dict(r) for r in db.execute("SELECT area_id,city_id,city_name,x,y,last_seen FROM map_areas WHERE lower(trim(city_name))='dubai' AND x=53 AND y=35")]
          out['dubai_nearby']=[dict(r) for r in db.execute("SELECT area_id,city_id,city_name,x,y,last_seen FROM map_areas WHERE lower(trim(city_name))='dubai' AND x BETWEEN 30 AND 60 AND y BETWEEN 30 AND 60 ORDER BY x,y LIMIT 50")]
          print(json.dumps(out,ensure_ascii=False,indent=2))
          db.close()
          PY
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/w6-dubai.py root@89.125.1.71:/tmp/w6-dubai.py
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/w6-dubai.py' > audit/hk-stage2-w6-dubai-drift.json
          cat audit/hk-stage2-w6-dubai-drift.json
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-w6-dubai-drift.json
          git commit -m "audit: inspect W6 Dubai classification drift"
          git pull --rebase origin main
          git push origin HEAD:main
