name: Build Userscript 1.18.43 Battle Skip Run9

on:
  push:
    paths:
      - 'deploy/topking/patch_battle_skip_run9_1_18_43.py'
      - '.github/workflows/build-userscript-1-18-43-battle-skip-run9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.42" /tmp/HamsterKingMobile.user.js
          grep -Fq "trader-exit-handoff-20260927-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_battle_skip_run9_1_18_43.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.43" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-skip-run9-20260927-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-skip-leave-location" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-skip-intro-ack" /tmp/HamsterKingMobile.user.js

          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')
          run=s[s.index('function runBattle()'):s.index('// ----- Full Treasure Map orchestrator -----')]
          assert "if (autoMapEnabled())" in run
          assert "runBattleAuto(solution)" in run
          branch=s[s.index("if (signature.startsWith('BATTLE')) {"):s.index("if (signature.startsWith('FISHING|'))")]
          assert "autoMapSkipBattleWithoutFight()" in branch
          assert "runBattleAuto(" not in branch
          helper=s[s.index("async function autoMapSkipBattleWithoutFight()"):s.index("function autoMapCurrentModuleComplete()")]
          assert "battle-skip-intro-ack" in helper
          assert "battle-skip-leave-location" in helper
          assert "10" in helper
          print("BATTLE_SKIP_RUN9_STATIC_SMOKE=PASS")
          PY

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.43.battle-skip-run9.candidate.user.js
          audit=audit/hk-userscript-1-18-43-battle-skip-run9-predeploy.txt
          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.42':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.42',
              'target_version':'1.18.43',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.43.battle-skip-run9.candidate.user.js',
              'primary_marker':'battle-skip-run9-20260927-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-43-battle-skip-run9-live-status.txt',
              'commit_message':'fix: deploy Treasure Map battle skip from recording 9 in userscript 1.18.43',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          {
            echo "USERSCRIPT_1_18_43_BATTLE_SKIP_RUN9_PREDEPLOY=PASS"
            echo "source_version=1.18.42"
            echo "target_version=1.18.43"
            echo "recording_9_sequence=ACK_LEAVE_CONFIRM10_MAP"
            echo "battle_attacks_during_automap=DISABLED"
            echo "manual_autobattle_without_automap=PRESERVED"
            echo "syntax=PASS"
            echo "static_smoke=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.43 battle skip run9"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
