name: Build Userscript 1.18.25 Trader Whitelist Fishing Budget

on:
  push:
    paths:
      - 'deploy/topking/patch_trader_whitelist_fishing_budget_1_18_25.py'
      - '.github/workflows/build-userscript-1-18-25-trader-whitelist-fishing-budget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.24" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-auto-map-stale-runner-20260927-r2" /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/patch_trader_whitelist_fishing_budget_1_18_25.py /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.25" /tmp/HamsterKingMobile.user.js
          grep -Fq "trader-approved-lots-20260927-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "fishing-live-budget-20260927-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "function traderApprovedLot(lotId)" /tmp/HamsterKingMobile.user.js
          grep -Fq "function fishingAffordable(cost)" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha
      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.25.trader-whitelist-fishing-budget.candidate.user.js
          audit=audit/hk-userscript-1-18-25-trader-whitelist-fishing-budget-predeploy.txt
          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.24':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.24',
              'target_version':'1.18.25',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.25.trader-whitelist-fishing-budget.candidate.user.js',
              'primary_marker':'fishing-live-budget-20260927-r1',
              'preserve_markers':['trader-approved-lots-20260927-r1', *preserve],
              'audit_status_path':'audit/hk-userscript-1-18-25-trader-whitelist-fishing-budget-live-status.txt',
              'commit_message':'fix: deploy trader whitelist and fishing budget in userscript 1.18.25',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          {
            echo "USERSCRIPT_1_18_25_TRADER_WHITELIST_FISHING_BUDGET_PREDEPLOY=PASS"
            echo "source_version=1.18.24"
            echo "target_version=1.18.25"
            echo "trader_allow=random4coins,food_*,map*"
            echo "trader_deny=keys,eggs,hk_coins,other"
            echo "fishing_live_balance_required=YES"
            echo "fishing_recheck_before_confirm=YES"
            echo "fishing_no_affordable_target=EXIT_ELIGIBLE"
            echo "syntax=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.25 trader whitelist fishing budget"
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
