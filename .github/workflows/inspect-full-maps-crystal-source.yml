name: Inspect Full Maps Crystal Source

on:
  push:
    paths:
      - 'deploy/topking/full-maps-crystal-source-trigger.txt'
      - 'deploy/topking/inspect_full_maps_crystal_source.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Inspect source crystals in all full maps
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            deploy/topking/inspect_full_maps_crystal_source.py root@89.125.1.71:/tmp/inspect_full_maps_crystal_source.py
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'python3 /tmp/inspect_full_maps_crystal_source.py' > /tmp/full-maps-crystal-source.json
          cp /tmp/full-maps-crystal-source.json audit/hk-full-maps-crystal-source.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-full-maps-crystal-source.json
          git commit -m "audit: inspect full Maps crystal source"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/inspect_full_maps_crystal_source.py /tmp/full-maps-crystal-source.json
