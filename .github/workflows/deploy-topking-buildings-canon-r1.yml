name: Deploy TopKing Buildings Canon R1

on:
  push:
    paths:
      - 'deploy/topking/buildings-canon-r1-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact Bosses r2 live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_REWARD_PICKER_REV = 'pits-reward-picker-20260920-r20'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2J_BOSSES_REV = 'bosses-area-target-20260920-r2'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_BOSSES_TARGET_REV='bosses-area-target-20260920-r2'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "0e168e81ff6e4ee42400f99aaad8a4fb9359bcfbdc051d56c981d0adcbf247e7"

      - name: Apply Buildings canonical core r1
        run: |
          set -euo pipefail
          cat deploy/topking/patch_buildings_canon_r1.part{0,1,2,3}.zb64 > /tmp/patch_buildings_canon_r1.zb64
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          raw=Path('/tmp/patch_buildings_canon_r1.zb64').read_text().strip()
          Path('/tmp/patch_buildings_canon_r1_1174.py').write_bytes(zlib.decompress(base64.b64decode(raw)))
          PY
          python3 -m py_compile /tmp/patch_buildings_canon_r1_1174.py
          python3 /tmp/patch_buildings_canon_r1_1174.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_BUILDINGS_CANON_REV = 'buildings-canon-core-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function buildingCanonBuildPlan" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function runBuildingsCanonical" /tmp/HamsterKingMobile.user.js
          grep -Fq "hkMutationGate.run('/player/building'" /tmp/HamsterKingMobile.user.js
          grep -Fq "/player/building/favorite/add?building_id=" /tmp/HamsterKingMobile.user.js
          grep -Fq "hkAuthoritativePlayerRead('buildings:complete')" /tmp/HamsterKingMobile.user.js
          echo "PATCHED_SHA=$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.buildings-r1.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.buildings-r1.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.buildings-r1.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.buildings-r1.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?buildings-r1=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "HK_BUILDINGS_CANON_REV = 'buildings-canon-core-20260920-r1'" /tmp/public.js
          sha="$(sha256sum /tmp/public.js | awk '{print $1}')"
          echo "PUBLIC_SHA=$sha"
          echo "BUILDINGS_CANON_R1=PASS"
          {
            echo "BUILDINGS_CANON_R1=PASS"
            echo "live_sha256=$sha"
            echo "public_sha256=$sha"
            echo "public_byte_equality=PASS"
            echo "syntax=PASS"
            echo "marker=buildings-canon-core-20260920-r1"
          } > audit/hk-stage2-06-buildings-r1-live-status.txt

      - name: Sync verified baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-stage2-06-buildings-r1-live-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "stage2: sync Buildings canonical core r1 live candidate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.buildings-r1.user.js /tmp/public.js /tmp/patch_buildings_canon_r1_1174.py /tmp/patch_buildings_canon_r1.zb64
