name: Diagnose TopKing Bosses R1 Predeploy

on:
  push:
    paths:
      - 'deploy/topking/bosses-r1-diagnose-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Diagnose predeploy
        run: |
          set +e
          status=PASS
          reason=none
          detail=""
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          rc=$?
          if [ $rc -ne 0 ]; then status=FAIL; reason=fetch_live; detail="scp_rc_$rc"; fi

          if [ "$status" = PASS ]; then
            live_sha="$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"
            if [ "$live_sha" != "c733c62a49c38ae6c497c03c89ee9ec018363bc8f75c2ec64e7e8f3990dfafdb" ]; then status=FAIL; reason=exact_sha; detail="$live_sha"; fi
          else
            live_sha=unknown
          fi

          if [ "$status" = PASS ]; then
            python3 -m py_compile deploy/topking/patch_bosses_canon_core_r1_1174.py >/tmp/diag.out 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then status=FAIL; reason=python_compile; detail="$(tail -20 /tmp/diag.out | tr '\n' ' ' | sed 's/|/ /g')"; fi
          fi

          if [ "$status" = PASS ]; then
            python3 deploy/topking/patch_bosses_canon_core_r1_1174.py >/tmp/diag.out 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then status=FAIL; reason=patch; detail="$(tail -20 /tmp/diag.out | tr '\n' ' ' | sed 's/|/ /g')"; fi
          fi

          if [ "$status" = PASS ]; then
            node --check /tmp/HamsterKingMobile.user.js >/tmp/diag.out 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then status=FAIL; reason=node_check; detail="$(tail -20 /tmp/diag.out | tr '\n' ' ' | sed 's/|/ /g')"; fi
          fi

          if [ "$status" = PASS ]; then
            for needle in \
              "HK_STAGE2J_BOSSES_REV = 'bosses-canon-core-20260920-r1'" \
              "HK_BOSSES_CANON_REV='bosses-canon-core-20260920-r1'" \
              "function bossCanonBuildPlans" \
              "async function bossCanonFinishAreaAttempt" \
              "async function bossCanonFinishRegionalAttempt" \
              "async function runBossesCanonical" \
              "'/regional_boss/battle_state',"
            do
              grep -Fq "$needle" /tmp/HamsterKingMobile.user.js
              rc=$?
              if [ $rc -ne 0 ]; then status=FAIL; reason=invariant; detail="$needle"; break; fi
            done
          fi

          if [ "$status" = PASS ]; then patched_sha="$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"; else patched_sha=unknown; fi

          {
            echo "checked_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "status=$status"
            echo "reason=$reason"
            echo "detail=$detail"
            echo "input_sha256=$live_sha"
            echo "patched_sha256=$patched_sha"
          } > audit/hk-stage2-03-bosses-predeploy-status.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-03-bosses-predeploy-status.txt
          git commit -m "stage2: diagnose Bosses r1 predeploy" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/diag.out
