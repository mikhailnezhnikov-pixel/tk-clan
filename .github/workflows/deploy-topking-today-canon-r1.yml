name: Deploy TopKing Today Canon R1

on:
  push:
    paths:
      - 'deploy/topking/today-canon-r1-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.17.4$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STARTUP_ERROR_SCOPE_REV = 'startup-error-scope-20260920-r9'" /tmp/HamsterKingMobile.user.js
          ! grep -Fq "HK_TODAY_CANON_REV = 'today-kokkaras-order-20260920-r1'" /tmp/HamsterKingMobile.user.js
          echo "BEFORE_SHA=$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"

      - name: Apply Today canonical patch
        run: |
          set -euo pipefail
          python3 deploy/topking/patch_today_kokkaras_order_r1_1174.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_TODAY_CANON_REV = 'today-kokkaras-order-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "1. Действия" /tmp/HamsterKingMobile.user.js
          grep -Fq "2. Магазин клана" /tmp/HamsterKingMobile.user.js
          grep -Fq "3. Инвестиционные предложения" /tmp/HamsterKingMobile.user.js
          grep -Fq "4. Обычные предложения события" /tmp/HamsterKingMobile.user.js
          grep -Fq "5. Получение наград" /tmp/HamsterKingMobile.user.js
          grep -Fq "dailyClaimCompletedQuestsCurrent" /tmp/HamsterKingMobile.user.js
          grep -Fq "dailyClaimLeaderboardRewardsCurrent" /tmp/HamsterKingMobile.user.js
          grep -Fq "dailyClaimAreaBossBattlePassCurrent" /tmp/HamsterKingMobile.user.js
          echo "PATCHED_SHA=$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.today-r1.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.today-r1.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.today-r1.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.today-r1.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?today-r1=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          grep -Fq "HK_TODAY_CANON_REV = 'today-kokkaras-order-20260920-r1'" /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          echo "PUBLIC_SHA=$(sha256sum /tmp/public.js | awk '{print $1}')"
          echo "TODAY_CANON_R1=PASS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
