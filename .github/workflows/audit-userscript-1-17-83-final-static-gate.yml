name: Audit Userscript 1.17.83 Final Static Gate

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-83-final-static-gate-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-userscript-1-17-83-final-static
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify syntax and final gate
        run: |
          set -euo pipefail
          node --check baseline/topking/HamsterKingMobile.current.user.js
          python3 deploy/topking/audit_userscript_1_17_83_final_gate.py | tee /tmp/hk-userscript-1-17-83-final-static-gate.txt
          grep -Fq "HK_1_17_83_FINAL_STATIC_GATE=PASS" /tmp/hk-userscript-1-17-83-final-static-gate.txt
          grep -Fq "checks_fail=0" /tmp/hk-userscript-1-17-83-final-static-gate.txt

      - name: Persist audit
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node --check baseline/topking/HamsterKingMobile.current.user.js
          python3 deploy/topking/audit_userscript_1_17_83_final_gate.py > /tmp/hk-userscript-1-17-83-final-static-gate.txt
          mkdir -p audit
          cp /tmp/hk-userscript-1-17-83-final-static-gate.txt audit/hk-userscript-1-17-83-final-static-gate.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-userscript-1-17-83-final-static-gate.txt
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist userscript 1.17.83 final static gate"
            git push origin HEAD:main
          fi
