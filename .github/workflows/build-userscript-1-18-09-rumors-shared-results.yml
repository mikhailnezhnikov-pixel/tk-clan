name: Build Userscript 1.18.09 Rumors Shared Results

on:
  push:
    paths:
      - 'deploy/topking/patch_rumors_shared_results_1_18_09.py'
      - '.github/workflows/build-userscript-1-18-09-rumors-shared-results.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-userscript-1-18-09-rumors-shared-results
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate from exact live baseline
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          test -f "$base"
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.18.08" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.18.08';" /tmp/HamsterKingMobile.user.js
          grep -Fq "rumors-hunter-kokkaras-public-feed-20260925-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "fishing-canon-priority-20260926-r2" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_rumors_shared_results_1_18_09.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.09" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.18.09';" /tmp/HamsterKingMobile.user.js
          grep -Fq "rumors-shared-results-20260926-r2" /tmp/HamsterKingMobile.user.js
          grep -Fq "const RUMOR_AUTO_REFRESH_MS=30*1000;" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function reportRumorJackpot" /tmp/HamsterKingMobile.user.js
          grep -Fq "Координаты сегодня" /tmp/HamsterKingMobile.user.js

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate and release manifest
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.09.rumors-shared-results.candidate.user.js
          audit=audit/hk-userscript-1-18-09-rumors-shared-results-predeploy.txt

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
            cp /tmp/HamsterKingMobile.user.js "$candidate"

            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.08':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.08',
              'target_version':'1.18.09',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.09.rumors-shared-results.candidate.user.js',
              'primary_marker':'rumors-shared-results-20260926-r2',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-09-rumors-shared-results-live-status.txt',
              'commit_message':'rumors: deploy shared live results in userscript 1.18.09',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

            mkdir -p "$(dirname "$audit")"
            {
              echo "USERSCRIPT_1_18_09_RUMORS_SHARED_RESULTS_PREDEPLOY=PASS"
              echo "source_version=1.18.08"
              echo "target_version=1.18.09"
              echo "base_sha256=$(cat /tmp/base.sha)"
              echo "candidate_sha256=$(cat /tmp/candidate.sha)"
              echo "kokkaras_public_feed=PRESERVED"
              echo "auto_refresh_seconds=30"
              echo "today_coordinates=PASS"
              echo "hk_jackpot_report=PASS"
              echo "syntax=PASS"
            } > "$audit"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$candidate" deploy/topking/userscript-release.json "$audit"
            git commit -m "build: prepare userscript 1.18.09 Rumors shared results"

            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
