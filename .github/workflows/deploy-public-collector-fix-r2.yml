name: Deploy Public Collector R3

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/topking/public-collector-fix-r2-trigger.txt'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh current main before deploy
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate collector
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/public_collector.py deploy/topking/verify_public_collector_r2.py
          grep -Fq "ExecStart=/usr/bin/python3 /opt/hamsterking-license/public_collector.py ratings" deploy/topking/hamsterking-public-collector.service
          grep -Fq "OnCalendar=*-*-* 16:00:00 Europe/Moscow" deploy/topking/hamsterking-public-collector.timer
          grep -Fq "ExecStart=/usr/bin/python3 /opt/hamsterking-license/public_collector.py war" deploy/topking/hamsterking-public-war.service
          grep -Fq "OnCalendar=*-*-* *:03/10:00" deploy/topking/hamsterking-public-war.timer
          grep -Fq "setInterval(load,60000)" wars/index.html
          grep -Fq "setInterval(load,300000)" ratings/index.html

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Make legacy public snapshot endpoint read-only
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          sha256sum /tmp/server.py | awk '{print $1}' > /tmp/server-source.sha
          python3 deploy/topking/patch_public_snapshot_server_only_r3.py /tmp/server.py
          python3 -m py_compile /tmp/server.py
          grep -Fq "PUBLIC_SNAPSHOT_SERVER_ONLY_R3" /tmp/server.py
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/server.py root@89.125.1.71:/tmp/server.public-server-only-r3.py
          source_sha="$(cat /tmp/server-source.sha)"
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 "
            set -euo pipefail
            current=\$(sha256sum /opt/hamsterking-license/server.py | awk '{print \$1}')
            test \"\$current\" = \"$source_sha\" || { echo LIVE_SERVER_CHANGED_BEFORE_PUBLIC_SNAPSHOT_R3; exit 42; }
            python3 -m py_compile /tmp/server.public-server-only-r3.py
            grep -Fq PUBLIC_SNAPSHOT_SERVER_ONLY_R3 /tmp/server.public-server-only-r3.py
            stamp=\$(date +%Y%m%d-%H%M%S)
            cp -a /opt/hamsterking-license/server.py /opt/hamsterking-license/server.py.bak.public-server-only-r3.\$stamp
            install -m 0644 /tmp/server.public-server-only-r3.py /opt/hamsterking-license/server.py
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          "

      - name: Capture live preflight
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            echo "=== LIVE COLLECTOR REV ==="
            grep -E "^REV = " /opt/hamsterking-license/public_collector.py || true
            echo "=== STATUS ==="
            cat /var/lib/hamsterking-license/public-collector-status.json 2>/dev/null || true
            echo
            echo "=== WAR JOURNAL ==="
            journalctl -u hamsterking-public-war.service -n 30 --no-pager || true
            echo "=== RATINGS JOURNAL ==="
            journalctl -u hamsterking-public-collector.service -n 30 --no-pager || true
            echo "=== DB SUMMARY ==="
            python3 - <<"PY"
          import json, sqlite3
          db=sqlite3.connect("/var/lib/hamsterking-license/licenses.db")
          try:
              row=db.execute("select snapshot_json,source_player_id,updated_at from public_clan_war_snapshot where singleton=1").fetchone()
              if row:
                  try: doc=json.loads(row[0])
                  except Exception: doc={}
                  print("war_present=1")
                  print("war_source="+str(row[1]))
                  print("war_updated_at="+str(row[2]))
                  print("war_opponent="+str(doc.get("opponent","")))
                  print("war_hp="+str(doc.get("opponent_hp","")))
                  print("war_hp_max="+str(doc.get("opponent_hp_max","")))
              else:
                  print("war_present=0")
              for kind in ("alliance_defense","alliance_influence","alliance_power"):
                  count,source,updated=db.execute(
                      "select count(*),min(source_player_id),max(updated_at) from public_rating_snapshots where kind=?",(kind,)
                  ).fetchone()
                  print(f"{kind}_count={count}")
                  print(f"{kind}_source={source}")
                  print(f"{kind}_updated_at={updated}")
          finally:
              db.close()
          PY
          ' > /tmp/public-collector-r2-preflight.txt
          cat /tmp/public-collector-r2-preflight.txt

      - name: Install collector R3
        run: |
          set -euo pipefail
          for file in public_collector.py verify_public_collector_r2.py hamsterking-public-collector.service hamsterking-public-collector.timer hamsterking-public-war.service hamsterking-public-war.timer; do
            scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              "deploy/topking/$file" "root@89.125.1.71:/tmp/$file"
          done
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            test -s /etc/hamsterking-public-collector.env
            grep -q "^HK_PUBLIC_COLLECTOR_GAME_TOKEN=." /etc/hamsterking-public-collector.env
            install -m 0755 /tmp/public_collector.py /opt/hamsterking-license/public_collector.py
            install -m 0755 /tmp/verify_public_collector_r2.py /opt/hamsterking-license/verify_public_collector_r2.py
            install -m 0644 /tmp/hamsterking-public-collector.service /etc/systemd/system/hamsterking-public-collector.service
            install -m 0644 /tmp/hamsterking-public-collector.timer /etc/systemd/system/hamsterking-public-collector.timer
            install -m 0644 /tmp/hamsterking-public-war.service /etc/systemd/system/hamsterking-public-war.service
            install -m 0644 /tmp/hamsterking-public-war.timer /etc/systemd/system/hamsterking-public-war.timer
            python3 -m py_compile /opt/hamsterking-license/public_collector.py /opt/hamsterking-license/verify_public_collector_r2.py
            systemctl daemon-reload
            systemctl enable --now hamsterking-public-collector.timer
            systemctl enable --now hamsterking-public-war.timer
            systemctl is-active --quiet hamsterking-public-collector.timer
            systemctl is-active --quiet hamsterking-public-war.timer
          '

      - name: Run one fresh war snapshot
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            systemctl reset-failed hamsterking-public-war.service || true
            systemctl start hamsterking-public-war.service
          '

      - name: Run one corrected ratings snapshot
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            systemctl reset-failed hamsterking-public-collector.service || true
            systemctl start hamsterking-public-collector.service
          '

      - name: Verify DB
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'python3 /opt/hamsterking-license/verify_public_collector_r2.py' \
            > /tmp/public-collector-r2-db.txt
          cat /tmp/public-collector-r2-db.txt

      - name: Verify server-only cache ownership
        run: |
          set -euo pipefail
          sleep 20
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            grep -Fq PUBLIC_SNAPSHOT_SERVER_ONLY_R3 /opt/hamsterking-license/server.py
            python3 - <<"PY"
          import sqlite3
          db=sqlite3.connect("/var/lib/hamsterking-license/licenses.db")
          try:
              war=db.execute("select source_player_id from public_clan_war_snapshot where singleton=1").fetchone()
              assert war and war[0]=="server-collector", war
              print("war_source_persisted=server-collector")
              for kind in ("alliance_defense","alliance_influence","alliance_power"):
                  rows=db.execute("select distinct source_player_id from public_rating_snapshots where kind=?",(kind,)).fetchall()
                  sources={row[0] for row in rows}
                  assert sources=={"server-collector"}, (kind,sources)
                  print(kind+"_source_persisted=server-collector")
          finally:
              db.close()
          PY
          '

      - name: Verify latest ratings coverage evidence
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            journalctl -u hamsterking-public-collector.service --no-pager | grep -E "alliances discovered:|alliance metric coverage:" | tail -n 8
          ' > /tmp/public-collector-r2-ratings-evidence.txt
          cat /tmp/public-collector-r2-ratings-evidence.txt
          grep -Fq "alliances discovered: 117" /tmp/public-collector-r2-ratings-evidence.txt
          grep -Fq "alliance metric coverage: total=117 defense=117 influence=117 power=117 clan_influence_rows=500 clan_power_rows=500" /tmp/public-collector-r2-ratings-evidence.txt

      - name: Verify public endpoints and timers
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/api/v1/public/clan-war?verify=$(date +%s)" \
            -o /tmp/public-war.json
          python3 -c "import json; d=json.load(open('/tmp/public-war.json')); assert d.get('active') and d.get('war',{}).get('opponent'), d; print('public_war_active=PASS'); print('public_war_opponent='+str(d['war']['opponent']))"

          for kind in alliance_defense alliance_influence alliance_power; do
            curl -fsSL --retry 4 --connect-timeout 15 --max-time 30 \
              "https://hk-license.89.125.1.71.sslip.io/api/v1/public/ratings?kind=$kind&verify=$(date +%s)" \
              -o "/tmp/$kind.json"
            KIND="$kind" python3 -c "import json,os; k=os.environ['KIND']; d=json.load(open('/tmp/'+k+'.json')); rows=d.get('rows',[]); assert len(rows)>0,d; print(k+'_public_count='+str(len(rows))); print(k+'_top5='+json.dumps(rows[:5],ensure_ascii=False,separators=(',',':')))"
          done

          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            systemctl is-active --quiet hamsterking-public-collector.timer
            systemctl is-active --quiet hamsterking-public-war.timer
            grep -Fq "public-server-only-20260920-r2" /opt/hamsterking-license/HamsterKingMobile.user.js
            grep -Fq "explore-e3-single-20260920-r9-runner" /opt/hamsterking-license/HamsterKingMobile.user.js
            grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /opt/hamsterking-license/HamsterKingMobile.user.js
            echo "ratings_timer=PASS"
            echo "war_timer=PASS"
            echo -n "ratings_next="
            systemctl show hamsterking-public-collector.timer -p NextElapseUSecRealtime --value
            echo -n "war_next="
            systemctl show hamsterking-public-war.timer -p NextElapseUSecRealtime --value
          ' > /tmp/public-collector-r2-timers.txt
          cat /tmp/public-collector-r2-timers.txt

      - name: Verify public site cache polling
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            curl -fsSL --connect-timeout 15 --max-time 30 "https://tk-clan.ru/wars/?collector-r2=$RANDOM" -o /tmp/wars-public.html || true
            curl -fsSL --connect-timeout 15 --max-time 30 "https://tk-clan.ru/ratings/?collector-r2=$RANDOM" -o /tmp/ratings-public.html || true
            if grep -Fq "setInterval(load,60000)" /tmp/wars-public.html && grep -Fq "setInterval(load,300000)" /tmp/ratings-public.html; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = 1

      - name: Save evidence
        run: |
          set -euo pipefail
          {
            echo "PUBLIC_COLLECTOR_R3_LIVE=PASS"
            echo "player_client_public_collection=DISABLED"
            echo "ratings_collector_interval=24h"
            echo "ratings_collector_schedule=16:00_Europe/Moscow"
            echo "war_collector_interval=10m"
            echo "war_api_requests_per_run=1"
            echo "ratings_refresh_forced_during_deploy=YES_ONE_TIME_R3_FIX"
            echo "wars_page_cache_poll=60s"
            echo "ratings_page_cache_poll=300s"
            cat /tmp/public-collector-r2-preflight.txt
            cat /tmp/public-collector-r2-db.txt
            cat /tmp/public-collector-r2-ratings-evidence.txt
            cat /tmp/public-collector-r2-timers.txt
            echo "public_war_endpoint=PASS"
            echo "public_alliance_endpoints=PASS"
            echo "alliance_list_pagination=ALL_117_DISCOVERABLE"
            echo "clan_leaderboard_source_rows=UP_TO_500"
            echo "explore_r9_preserved=PASS"
            echo "map_concurrency_5_preserved=PASS"
            echo "maps_backend_schema_changed=NO"
          } > /tmp/public-collector-r2-live-status.txt
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/public-collector-r2-live-status.txt audit/hk-public-collector-r2-live-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-public-collector-r2-live-status.txt
          git commit -m "audit: verify public collector R2" || true
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/server.py /tmp/server-source.sha /tmp/public-collector-r2-preflight.txt /tmp/public-collector-r2-db.txt /tmp/public-collector-r2-ratings-evidence.txt /tmp/public-collector-r2-timers.txt /tmp/public-collector-r2-live-status.txt /tmp/public-war.json /tmp/alliance_*.json /tmp/wars-public.html /tmp/ratings-public.html
