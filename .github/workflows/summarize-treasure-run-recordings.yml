name: Summarize Treasure Run Recordings

on:
  push:
    paths:
      - 'deploy/topking/treasure-run-summary-trigger.txt'
      - 'deploy/topking/summarize_treasure_run_recordings_server.py'
      - '.github/workflows/summarize-treasure-run-recordings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Summarize recordings
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            deploy/topking/summarize_treasure_run_recordings_server.py \
            root@89.125.1.71:/tmp/summarize_treasure_run_recordings_server.py
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 "python3 /tmp/summarize_treasure_run_recordings_server.py" \
            > /tmp/treasure-run-summary.json
          python3 -m json.tool /tmp/treasure-run-summary.json >/dev/null
      - name: Persist summary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/treasure-run-summary.json audit/treasure-run-summary-latest.json
          git add audit/treasure-run-summary-latest.json
          git commit -m "audit: persist compact Treasure Map run summary" || true
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/treasure-run-summary.json
