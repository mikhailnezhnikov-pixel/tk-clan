name: Inspect Top King cabinet bot

on:
  push:
    paths:
      - '.github/workflows/inspect-cabinet-bot.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Inspect bot service
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            echo "=== SERVICES ==="
            systemctl list-unit-files --type=service --no-pager | grep -Ei "topking|telegram|bot|hamsterking" | head -80 || true
            echo "=== PROCESSES ==="
            ps -eo pid,user,args | grep -Ei "TopKingClanCabinetBot|telegram|bot.py|cabinet.*bot|feedback" | grep -v grep | head -80 || true
            echo "=== FILES ==="
            find /opt /srv /root -maxdepth 4 -type f \( -name "*.py" -o -name "*.js" -o -name "*.service" -o -name "*.env" \) 2>/dev/null | grep -Ei "bot|telegram|topking|cabinet|feedback" | head -120 || true
            echo "=== CODE REFS ==="
            grep -RIl --exclude="*.db" --exclude="*.sqlite*" -E "TopKingClanCabinetBot|start=application|message_thread_id|sendMessage|feedback" /opt /srv 2>/dev/null | head -80 || true
          '

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
