name: Validate Userscript 1.17.58 Fair Bonus Thresholds

on:
  push:
    paths:
      - 'deploy/topking/HamsterKingMobile.1.17.58.fair-bonus-thresholds.candidate.user.js'
      - '.github/workflows/validate-userscript-1-17-58-fair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.17.58.fair-bonus-thresholds.candidate.user.js
          node --check "$candidate"
          grep -Fq "// @version      1.17.58" "$candidate"
          grep -Fq "const BUILD_VERSION = '1.17.58';" "$candidate"
          grep -Fq "fair-tiered-combo-20260923-r1" "$candidate"
          grep -Fq "fair-bonus-threshold-state-20260923-r1" "$candidate"
          grep -Fq "const boughtMainCells = refreshedOptions.filter" "$candidate"
          grep -Fq "const openedBonusSlots = Math.min(3, Math.floor(boughtMainCells / 3));" "$candidate"
          ! grep -Fq "index >= 9 + groupSize / 3" "$candidate"
          sha256sum "$candidate"
