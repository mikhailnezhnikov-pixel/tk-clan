name: Build Userscript 1.18.34 Lights Reward Bottom Action

on:
  push:
    paths:
      - 'deploy/topking/patch_lights_reward_bottom_action_1_18_34.py'
      - '.github/workflows/build-userscript-1-18-34-lights-reward-bottom-action.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.33" /tmp/HamsterKingMobile.user.js
          grep -Fq "lights-stable-plan-20260927-r1" /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/patch_lights_reward_bottom_action_1_18_34.py /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.34" /tmp/HamsterKingMobile.user.js
          grep -Fq "lights-reward-bottom-action-20260927-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "lights-final-reward-claim-bottom-action" /tmp/HamsterKingMobile.user.js
          ! grep -Fq "waitLightsRewardAck(" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.34.lights-reward-bottom-action.candidate.user.js
          audit=audit/hk-userscript-1-18-34-lights-reward-bottom-action-predeploy.txt
          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.33':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.33',
              'target_version':'1.18.34',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.34.lights-reward-bottom-action.candidate.user.js',
              'primary_marker':'lights-reward-bottom-action-20260927-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-34-lights-reward-bottom-action-live-status.txt',
              'commit_message':'fix: deploy lights reward bottom action in userscript 1.18.34',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          {
            echo "USERSCRIPT_1_18_34_LIGHTS_REWARD_BOTTOM_ACTION_PREDEPLOY=PASS"
            echo "source_version=1.18.33"
            echo "target_version=1.18.34"
            echo "reward_target=BOTTOM_CENTER_ACTION_ONLY"
            echo "resource_icons=EXCLUDED"
            echo "global_ack=EXCLUDED"
            echo "post_click_ui_verification=ENABLED"
            echo "syntax=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.34 lights reward bottom action"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
