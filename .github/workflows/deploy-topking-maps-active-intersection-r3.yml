name: Deploy TopKing Maps Active Intersection R3

on:
  push:
    paths:
      - 'deploy/topking/maps-active-intersection-r3-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_SCANNER_REV = 'maps-building-scan-20260920-r2'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_COORDS_REV = 'maps-coordinates-column-row-20260920-r1'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "f52ed4a3c61a3833941f8bf0c5e8016be8a59eac2ca4f6f352dd28ee16c3b290"

      - name: Compile and apply verified patch
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_maps_active_intersection_r3.py
          python3 deploy/topking/patch_maps_active_intersection_r3.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_SCANNER_REV = 'maps-active-intersection-20260920-r3'" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function ensureCrystalEventCatalog()" /tmp/HamsterKingMobile.user.js
          grep -Fq "function activePlayerBuildingIds(" /tmp/HamsterKingMobile.user.js
          grep -Fq "roomCount=crystalRoomCount(value,crystalIds)" /tmp/HamsterKingMobile.user.js
          grep -Fq "'/player/building'," /tmp/HamsterKingMobile.user.js
          grep -Fq "hkMutationGate.run('/player/building'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_COORDS_REV = 'maps-coordinates-column-row-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_BUILDINGS_CANON_REV = 'buildings-canon-core-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2J_BOSSES_REV = 'bosses-area-target-20260920-r2'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_REWARD_PICKER_REV = 'pits-reward-picker-20260920-r20'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "f8a34bff26fd449f315f07a2ef8e6a8a6e8169ea62f463e7efe527766d698101"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.maps-active-r3.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.maps-active-r3.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.maps-active-r3.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.maps-active-r3.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?maps-active-r3=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "HK_MAP_SCANNER_REV = 'maps-active-intersection-20260920-r3'" /tmp/public.js
          grep -Fq "HK_MAP_COORDS_REV = 'maps-coordinates-column-row-20260920-r1'" /tmp/public.js
          sha="$(sha256sum /tmp/public.js | awk '{print $1}')"
          test "$sha" = "f8a34bff26fd449f315f07a2ef8e6a8a6e8169ea62f463e7efe527766d698101"
          {
            echo "MAPS_ACTIVE_INTERSECTION_R3_LIVE=PASS"
            echo "live_sha256=$sha"
            echo "public_sha256=$sha"
            echo "public_byte_equality=PASS"
            echo "syntax=PASS"
            echo "scanner=maps-active-intersection-20260920-r3"
            echo "coords=maps-coordinates-column-row-20260920-r1"
          } > audit/hk-stage2-maps-active-intersection-r3-live-status.txt

      - name: Sync verified baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-stage2-maps-active-intersection-r3-live-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "stage2: sync safe active-building scanner r3 live candidate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.maps-active-r3.user.js /tmp/public.js
