name: Inspect Userscript Service Environment

on:
  push:
    paths:
      - 'deploy/topking/userscript-service-env-inspect-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Inspect service environment
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            deploy/topking/inspect_userscript_service_env.py \
            root@89.125.1.71:/tmp/inspect_userscript_service_env.py
          {
            printf 'USERSCRIPT_SERVICE_ENV_INSPECT=1\n'
            printf 'captured_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              root@89.125.1.71 'python3 /tmp/inspect_userscript_service_env.py'
          } | tee /tmp/userscript-service-env-inspect.txt
          test -s /tmp/userscript-service-env-inspect.txt

      - name: Persist inspection
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p audit
          cp /tmp/userscript-service-env-inspect.txt audit/hk-userscript-service-env-inspect.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-userscript-service-env-inspect.txt
          if ! git diff --cached --quiet; then
            git commit -m "audit: persist userscript service environment inspection"
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/userscript-service-env-inspect.txt
