name: Build Userscript 1.18.05 Lights Auto Click

on:
  push:
    paths:
      - 'deploy/topking/patch_lights_auto_click_1_18_05.py'
      - '.github/workflows/build-userscript-1-18-05-lights-auto-click.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-userscript-1-18-05-lights-auto-click
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate from exact live baseline
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          test -f "$base"
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.18.04" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.18.04';" /tmp/HamsterKingMobile.user.js
          grep -Fq "chest-auto-dig-open-20260926-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-auto-click-toggle-20260926-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_lights_auto_click_1_18_05.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.05" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.18.05';" /tmp/HamsterKingMobile.user.js
          grep -Fq "lights-auto-recalc-20260926-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "Автолампы: ВКЛ" /tmp/HamsterKingMobile.user.js
          grep -Fq "waitLightsBoardChange" /tmp/HamsterKingMobile.user.js
          grep -Fq "state-cycle" /tmp/HamsterKingMobile.user.js
          grep -Fq "field-no-change" /tmp/HamsterKingMobile.user.js
          grep -Fq "chest-auto-dig-open-20260926-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-auto-click-toggle-20260926-r1" /tmp/HamsterKingMobile.user.js

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate and release manifest
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.05.lights-auto-click.candidate.user.js
          audit=audit/hk-userscript-1-18-05-lights-auto-click-predeploy.txt

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
            cp /tmp/HamsterKingMobile.user.js "$candidate"

            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.04':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.04',
              'target_version':'1.18.05',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.05.lights-auto-click.candidate.user.js',
              'primary_marker':'lights-auto-recalc-20260926-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-05-lights-auto-click-live-status.txt',
              'commit_message':'fix: deploy safe Lights Out auto-click in userscript 1.18.05',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

            mkdir -p "$(dirname "$audit")"
            {
              echo "USERSCRIPT_1_18_05_LIGHTS_AUTO_CLICK_PREDEPLOY=PASS"
              echo "source_version=1.18.04"
              echo "target_version=1.18.05"
              echo "scope=COMMON_HK_USERSCRIPT_ONLY"
              echo "public_treasure_script=UNCHANGED"
              echo "auto_lights_default=OFF"
              echo "click_mode=ONE_CLICK_THEN_RESCAN_AND_RECALCULATE"
              echo "field_change_guard=ENABLED"
              echo "missing_target_guard=ENABLED"
              echo "invalid_board_guard=ENABLED"
              echo "state_cycle_guard=ENABLED"
              echo "failure_behavior=DISABLE_AUTO_LIGHTS"
              echo "number_hints=PRESERVED"
              echo "battle_auto=PRESERVED"
              echo "chest_auto=PRESERVED"
              echo "syntax=PASS"
              echo "base_sha256=$(cat /tmp/base.sha)"
              echo "candidate_sha256=$(cat /tmp/candidate.sha)"
            } > "$audit"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$candidate" deploy/topking/userscript-release.json "$audit"
            git commit -m "build: prepare userscript 1.18.05 lights auto-click"

            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
