name: Build Userscript 1.18.24 Treasure Auto Map Stale Runner

on:
  push:
    paths:
      - 'deploy/topking/patch_treasure_auto_map_stale_runner_1_18_24.py'
      - '.github/workflows/build-userscript-1-18-24-treasure-auto-map-stale-runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.23" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-chest-element-state-20260927-r1" /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/patch_treasure_auto_map_stale_runner_1_18_24.py /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.24" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-auto-map-stale-runner-20260927-r2" /tmp/HamsterKingMobile.user.js
          grep -Fq "function autoMapCancelStaleRunners" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha
      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.24.treasure-auto-map-stale-runner.candidate.user.js
          audit=audit/hk-userscript-1-18-24-treasure-auto-map-stale-runner-predeploy.txt
          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.23':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.23',
              'target_version':'1.18.24',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.24.treasure-auto-map-stale-runner.candidate.user.js',
              'primary_marker':'treasure-auto-map-stale-runner-20260927-r2',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-24-treasure-auto-map-stale-runner-live-status.txt',
              'commit_message':'fix: deploy stale minigame runner cancellation in userscript 1.18.24',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          {
            echo "USERSCRIPT_1_18_24_TREASURE_AUTOMAP_STALE_RUNNER_PREDEPLOY=PASS"
            echo "source_version=1.18.23"
            echo "target_version=1.18.24"
            echo "real_map_foreground=OVERRIDES_STALE_RUNNING_FLAGS"
            echo "stale_runners=CANCEL_BY_RUN_ID"
            echo "module_preferences=PRESERVED"
            echo "syntax=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.24 Treasure AutoMap stale runner"
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
