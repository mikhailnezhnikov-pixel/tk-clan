name: Build Userscript 1.18.40 Treasury Visual Exit

on:
  push:
    paths:
      - 'deploy/topking/patch_treasury_visual_exit_1_18_40.py'
      - '.github/workflows/build-userscript-1-18-40-treasury-visual-exit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.39" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasury-exit-after-claim-20260927-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_treasury_visual_exit_1_18_40.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.40" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasury-visual-exit-20260927-r2" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasury-leave-location-direct" /tmp/HamsterKingMobile.user.js
          grep -Fq "пауза → выход" /tmp/HamsterKingMobile.user.js

          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')
          assert "function autoMapTreasuryCompletedVisual()" in s
          assert "function autoMapTreasuryDone()" in s
          assert "async function autoMapDirectTreasuryExit()" in s
          gate=s.index("// A completed Treasury is a navigation handoff")
          pause=s.index("if (Date.now()<autoMapRetryNotBefore)",gate)
          early=s.index("if (autoMapTreasuryDone())",gate)
          assert early < pause
          run=s.index("async function runAutoMapTick")
          block=s[run:run+8000]
          assert "return await autoMapDirectTreasuryExit();" in block
          print("TREASURY_VISUAL_EXIT_STATIC_SMOKE=PASS")
          PY

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.40.treasury-visual-exit.candidate.user.js
          audit=audit/hk-userscript-1-18-40-treasury-visual-exit-predeploy.txt
          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.39':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.39',
              'target_version':'1.18.40',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.40.treasury-visual-exit.candidate.user.js',
              'primary_marker':'treasury-visual-exit-20260927-r2',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-40-treasury-visual-exit-live-status.txt',
              'commit_message':'fix: deploy visual treasury exit in userscript 1.18.40',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          {
            echo "USERSCRIPT_1_18_40_TREASURY_VISUAL_EXIT_PREDEPLOY=PASS"
            echo "source_version=1.18.39"
            echo "target_version=1.18.40"
            echo "completion_detection=TITLE_PLUS_ACTIVATED_PLUS_EXIT"
            echo "claimed_chest_reclick=DISABLED"
            echo "exit_mode=DIRECT_SINGLE_TAP"
            echo "pause_handoff=WAIT_THEN_EXIT"
            echo "syntax=PASS"
            echo "static_smoke=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.40 treasury visual exit"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
