name: Check Userscript 1.17.40 Hamsters Cost Parity

on:
  push:
    paths:
      - '.github/workflows/check-userscript-1-17-40-hamsters-cost-parity.yml'
      - 'deploy/topking/HamsterKingMobile.1.17.40.hamsters-cost-parity.candidate.user.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate
        run: |
          set -euo pipefail
          f=deploy/topking/HamsterKingMobile.1.17.40.hamsters-cost-parity.candidate.user.js
          node --check "$f"
          grep -Fq "// @version      1.17.40" "$f"
          grep -Fq "const BUILD_VERSION = '1.17.40';" "$f"
          grep -Fq "hamsters-kokkaras-cost-parity-20260923-r1" "$f"
          grep -Fq "treasure-guide-passive-capture-20260923-r1" "$f"
          grep -Fq "maps-manual-scan-only-20260923-r1" "$f"
          grep -Fq "growth-hamster-nuts-canon-20260923-r1" "$f"
          grep -Fq "clan-snapshot-numeric-player-id-20260923-r1" "$f"
          grep -Fq "auto-routines-in-today-20260922-r3" "$f"
          grep -Fq "game-api-rate-guard-20260922-r1" "$f"
          grep -Fq "public-collector-activity-lease-20260922-r1" "$f"
          grep -Fq "businesses-kokkaras-donor-20260922-r1" "$f"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('deploy/topking/HamsterKingMobile.1.17.40.hamsters-cost-parity.candidate.user.js')
          s=p.read_text(encoding='utf-8')
          assert "const GROWTH_HAMSTER_BUDGET_ID = 'cur_nut';" in s
          assert "nutsPercent:pct(saved.nutsPercent ?? saved.capsPercent,100)" in s
          assert "function growthHamsterCostSafe(cost){ const parts=costParts(cost).filter(row=>row.id&&row.quantity>0); return parts.length>0&&growthSafeCost(cost); }" in s
          assert "function growthHamsterLevelCostSafe(cost){ return growthHamsterCostSafe(cost)&&growthNutCost(cost)>0; }" in s
          assert "growthCostOnlyUses(cost,[GROWTH_HAMSTER_BUDGET_ID])" not in s
          assert s.count("submitOwnedMapAreas(true)") == 1
          i=s.index("submitOwnedMapAreas(true)")
          assert "#hk-map-scan" in s[max(0,i-250):i+250]
          assert "Date.now()-lastByPlayer>86400000&&!initialMapResearchAttempted.has(playerId)" not in s
          assert "if (contribute && Date.now()-Number(load().lastMapContribution || 0)>86400000)" not in s
          print("USERSCRIPT_1_17_40_HAMSTERS_STATIC=PASS")
          PY
