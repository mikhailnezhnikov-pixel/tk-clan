name: Fix TopKing Telegram authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare temporary SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking_fix"
          chmod 600 "$HOME/.ssh/topking_fix"

      - name: Validate bot and update service environment file
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TOPKING_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN"
          {
            printf '%s\n' "$BOT_TOKEN"
            cat <<'REMOTE'
          set -euo pipefail

          if [[ ! "$BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo 'The supplied value is not a Telegram bot token.' >&2
            exit 1
          fi

          bot_json="$(curl -fsS --max-time 15 "https://api.telegram.org/bot${BOT_TOKEN}/getMe")"
          bot_username="$(python3 -c 'import json,sys; print((json.load(sys.stdin).get("result") or {}).get("username", ""))' <<<"$bot_json")"
          if [[ "${bot_username,,}" != 'topkingclancabinetbot' ]]; then
            echo "The token belongs to @${bot_username:-unknown}, not @TopKingClanCabinetBot." >&2
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          import shlex
          import shutil
          import subprocess
          from pathlib import Path

          token = os.environ['BOT_TOKEN']
          unit = subprocess.check_output(
              ['systemctl', 'cat', 'hamsterking-license.service'], text=True
          )
          env_paths = []
          for line in unit.splitlines():
              stripped = line.strip()
              if not stripped.startswith('EnvironmentFile='):
                  continue
              for value in shlex.split(stripped.split('=', 1)[1]):
                  value = value.removeprefix('-')
                  if value.startswith('/'):
                      env_paths.append(Path(value))
          existing = [path for path in env_paths if path.is_file()]
          if not existing:
              raise SystemExit('No existing EnvironmentFile was found for hamsterking-license.service')

          token_re = re.compile(r'^\s*(?:export\s+)?HK_TELEGRAM_BOT_TOKEN\s*=')
          username_re = re.compile(r'^\s*(?:export\s+)?HK_TELEGRAM_BOT_USERNAME\s*=')
          targets = []
          for path in existing:
              lines = path.read_text(encoding='utf-8').splitlines()
              if any(token_re.match(line) for line in lines):
                  targets.append(path)
          if not targets:
              targets = [existing[0]]

          for path in targets:
              backup = path.with_name(path.name + '.bak-topking')
              if not backup.exists():
                  shutil.copy2(path, backup)
              lines = path.read_text(encoding='utf-8').splitlines()
              updated = []
              token_seen = False
              username_seen = False
              for line in lines:
                  if token_re.match(line):
                      updated.append(f'HK_TELEGRAM_BOT_TOKEN={token}')
                      token_seen = True
                  elif username_re.match(line):
                      updated.append('HK_TELEGRAM_BOT_USERNAME=TopKingClanCabinetBot')
                      username_seen = True
                  else:
                      updated.append(line)
              if not token_seen:
                  updated.append(f'HK_TELEGRAM_BOT_TOKEN={token}')
              if not username_seen:
                  updated.append('HK_TELEGRAM_BOT_USERNAME=TopKingClanCabinetBot')
              temporary = path.with_name(path.name + '.topking-new')
              temporary.write_text('\n'.join(updated) + '\n', encoding='utf-8')
              os.chmod(temporary, path.stat().st_mode & 0o777)
              os.replace(temporary, path)
              print(f'Updated EnvironmentFile: {path}')
          PY

          rm -f /etc/systemd/system/hamsterking-license.service.d/telegram.conf

          systemctl daemon-reload
          systemctl restart hamsterking-license.service
          systemctl is-active --quiet hamsterking-license.service

          configured="$(curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/cabinet/config 2>/dev/null || true)"
          echo "Telegram bot verified: @${bot_username}"
          echo "Service status: $(systemctl is-active hamsterking-license.service)"
          if [ -n "$configured" ]; then
            python3 -c 'import json,sys; d=json.load(sys.stdin); print("Cabinet config:", {"ok": d.get("ok"), "enabled": d.get("enabled"), "bot_username": d.get("bot_username")})' <<<"$configured"
          fi

          REMOTE
          } | ssh -i "$HOME/.ssh/topking_fix" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'read -r BOT_TOKEN; export BOT_TOKEN; bash -s'

      - name: Verify Telegram signature end to end
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TOPKING_TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          telegram = {
              'id': '999999999999',
              'first_name': 'Signature Test',
              'username': 'topking_signature_test',
              'auth_date': int(time.time()),
          }
          data_check = '\n'.join(f'{key}={value}' for key, value in sorted(telegram.items())).encode()
          secret_key = hashlib.sha256(os.environ['BOT_TOKEN'].encode()).digest()
          telegram['hash'] = hmac.new(secret_key, data_check, hashlib.sha256).hexdigest()
          request = urllib.request.Request(
              'https://hk-license.89.125.1.71.sslip.io/api/v1/cabinet/login',
              data=json.dumps({'telegram': telegram}).encode(),
              headers={'Content-Type': 'application/json', 'Origin': 'https://tk-clan.ru'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  status, body = response.status, json.load(response)
          except urllib.error.HTTPError as exc:
              status, body = exc.code, json.load(exc)
          print(json.dumps({'status': status, 'error': body.get('error')}))
          if status != 403 or body.get('error') != 'telegram_id_not_allowed':
              raise SystemExit('Telegram signature verification did not reach the allowlist check')
          print('Telegram signature verification: passed')
          PY

      - name: Remove temporary SSH access from server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking_fix" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'bash -s' <<'REMOTE'
          set -euo pipefail
          authorized_keys=/root/.ssh/authorized_keys
          if [ -f "$authorized_keys" ]; then
            cleaned="$(mktemp /root/.ssh/authorized_keys.XXXXXX)"
            grep -v 'AAAAC3NzaC1lZDI1NTE5AAAAIM+x5X8f3zQyl3r2WLmw4qON85X0XKiZ0uiTcIyLEdYq' \
              "$authorized_keys" > "$cleaned" || true
            chmod 600 "$cleaned"
            mv "$cleaned" "$authorized_keys"
          fi
          echo 'Temporary TopKing Fix SSH key removed from the server.'
          REMOTE

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/topking_fix"
