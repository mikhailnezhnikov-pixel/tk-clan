name: Check Explore Production UI R1

on:
  push:
    paths:
      - 'deploy/topking/explore-production-ui-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify candidate
        run: |
          set -euo pipefail
          cp baseline/topking/HamsterKingMobile.current.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.21" /tmp/HamsterKingMobile.user.js
          python3 -m py_compile deploy/topking/patch_explore_production_ui_1_17_22.py
          python3 deploy/topking/patch_explore_production_ui_1_17_22.py
          node --check /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.17.22" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r24-explore-production-ui" /tmp/HamsterKingMobile.user.js
          grep -Fq "explore-production-ui-20260921-r1" /tmp/HamsterKingMobile.user.js

          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text()
          render=s[s.index('function renderExplore()'):s.index('async function refreshExplore')]
          e4=s[s.index('async function runExploreE4Queue()'):s.index('function explorePrOptions')]

          assert 'id="hk-ex-max"' in render
          assert 'id="hk-ex-run-queue"' in render
          assert "either('Запустить','Run')" in render
          assert 'Будет обработано зданий:' in render

          for bad in [
              'id="hk-ex-run-limit"',
              'id="hk-ex-run-one"',
              'Лимит запуска E4',
              'Тест E3 · 1 здание',
              'Запустить E4',
              's.runLimit',
              'settings.runLimit',
          ]:
              assert bad not in s

          assert "const queue=source;" in e4
          assert "maxBuildings:clamp(x.maxBuildings,1,5000,500)" in s
          assert "selected:settings.exploreTargetTier?candidates.slice(0,settings.maxBuildings):candidates" in s
          assert "async function exploreE3ProcessOne(initial,settings)" in s
          assert "const result=await exploreE3ProcessOne(candidate,settings)" in e4

          for marker in [
              "explore-e3-single-20260920-r9-runner",
              "explore-e3-speed-20260921-r1",
              "explore-e4-queue-20260921-r1",
              "buildings-native-sync-20260921-r1",
              "maps-shared-runtime-20260921-r7-safe5",
              "AUTH_PASSIVE_SAFETY_R1",
          ]:
              assert marker in s

          print("explore_single_max_buildings_limit=PASS")
          print("explore_test_button_removed=PASS")
          print("explore_redundant_e4_limit_removed=PASS")
          print("explore_production_run_button=PASS")
          print("explore_e4_core_preserved=PASS")
          print("EXPLORE_PRODUCTION_UI_R1_PREDEPLOY=PASS")
          PY
