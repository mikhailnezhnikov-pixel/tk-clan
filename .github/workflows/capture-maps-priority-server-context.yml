name: Capture Maps Priority Server Context

on:
  push:
    paths:
      - 'deploy/topking/maps-priority-server-context-trigger.txt'
      - 'deploy/topking/capture_map_priority_server_context.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Capture context
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            deploy/topking/capture_map_priority_server_context.py root@89.125.1.71:/tmp/capture_map_priority_server_context.py
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'python3 /tmp/capture_map_priority_server_context.py' > audit/hk-maps-priority-server-context.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-maps-priority-server-context.txt
          git commit -m "audit: capture Maps priority server context"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
