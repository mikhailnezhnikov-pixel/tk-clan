name: Deploy TopKing 1.17.4 Core Revision Hotfix

on:
  push:
    paths:
      - 'deploy/topking/core-revision-hotfix-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live 1.17.4
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.17.4$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_LAUNCHER_HANDOFF_REV = 'launcher-handoff-20260920-r4'" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Apply core revision hotfix
        run: |
          set -euo pipefail
          python3 deploy/topking/patch_core_revision_hotfix_1174.py
          grep -Fq "HK_CORE_REVISION = 'core-20260920-r5'" /tmp/HamsterKingMobile.user.js
          grep -Fq "window.__HK_MOBILE_REVISION__ = HK_CORE_REVISION" /tmp/HamsterKingMobile.user.js
          grep -Fq "bootstrapButton.id = 'hk-bootstrap-button'" /tmp/HamsterKingMobile.user.js
          grep -Fq "root.dataset.hkRevision = HK_CORE_REVISION" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -euo pipefail;
            stamp="$(date +%Y%m%d-%H%M%S)";
            node --check /tmp/HamsterKingMobile.user.js;
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp";
            install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js;
            systemctl restart hamsterking-license.service;
            systemctl is-active --quiet hamsterking-license.service;
            grep -Fq "HK_CORE_REVISION = '\''core-20260920-r5'\''" /opt/hamsterking-license/HamsterKingMobile.user.js;
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js'

      - name: Verify public panel
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 "https://hk-license.89.125.1.71.sslip.io/panel.js?v=$(date +%s)" -o /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "HK_CORE_REVISION = 'core-20260920-r5'" /tmp/public.js
          node --check /tmp/public.js
          sha="$(sha256sum /tmp/public.js | awk '{print $1}')"
          mkdir -p audit
          {
            echo 'version=1.17.4'
            echo 'hotfix=core-20260920-r5'
            echo 'runtime_revision=PASS'
            echo 'legacy_takeover_watchdog=PASS'
            echo 'public_delivery=PASS'
            echo 'syntax=ok'
            echo "sha256=$sha"
          } > audit/hk-1174-core-revision-hotfix-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-1174-core-revision-hotfix-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Verify live TopKing 1.17.4 core revision hotfix"
            git pull --rebase origin main
            git push origin HEAD:main || true
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
