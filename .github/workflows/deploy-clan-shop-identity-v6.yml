name: Deploy Clan Shop Known Player ID V13

on:
  push:
    paths:
      - 'deploy/topking/clan-shop-identity-v6-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Patch live server
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          python3 deploy/topking/patch_clan_shop_known_player_id_fallback_v13.py /tmp/server.py
          python3 -m py_compile /tmp/server.py
          grep -Fq "CLAN_SHOP_KNOWN_PLAYER_ID_FALLBACK_V13" /tmp/server.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/server.py').read_text(encoding='utf-8')
          a=s.index('def clan_shop_history_payload() -> dict:')
          b=s.index('\ndef clan_shop_publication_text',a)
          h=s[a:b]
          assert 'known_player_identities=clan_shop_license_identities()' in h
          assert '"cabinet_linked":bool(linked)' in h
          assert '"known_player_id" if known and known.get("display_name") else "player_id"' in h
          assert '"nickname": "Не распределено по игрокам"' not in h
          assert '"nickname": "Не определён игрок"' not in h
          print('V13_STATIC_CHECK=PASS')
          PY

      - name: Deploy server
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new /tmp/server.py root@89.125.1.71:/tmp/server.clan-shop-v13.py
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -e; stamp=$(date +%Y%m%d-%H%M%S); cp -a /opt/hamsterking-license/server.py /opt/hamsterking-license/server.py.bak.clan-shop-v13.$stamp; install -m 0644 /tmp/server.clan-shop-v13.py /opt/hamsterking-license/server.py; python3 -m py_compile /opt/hamsterking-license/server.py; systemctl restart hamsterking-license.service; systemctl is-active --quiet hamsterking-license.service'

      - name: Verify service
        run: |
          set -euo pipefail
          sleep 2
          curl -fsS --retry 4 --retry-delay 1 https://hk-license.89.125.1.71.sslip.io/health -o /tmp/health.json
          python3 -c "import json; d=json.load(open('/tmp/health.json')); assert d.get('ok') is True"
          echo "CLAN_SHOP_KNOWN_PLAYER_ID_FALLBACK_V13=PASS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/server.py /tmp/health.json
