name: Extract Kokkaras Pits Advanced Canon

on:
  push:
    paths:
      - 'reference/topking/extract-pits-advanced-trigger.txt'

permissions:
  contents: write

concurrency:
  group: extract-kokkaras-pits-advanced
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact pinned donor from git history
        run: |
          set -euo pipefail
          git show 4369003431dfc539e98a70a41157752e4c96b84c:reference/topking/_temp/kokkaras-current.js > /tmp/kokkaras.current.js
          git show 4369003431dfc539e98a70a41157752e4c96b84c:.github/workflows/reconstruct-kokkaras-reference.yml > /tmp/reconstruct.yml
          test "$(sha256sum /tmp/kokkaras.current.js | awk '{print $1}')" = "454f7bd810be7b39582f947f955d011042878eb10dd4b2cfd985d28b07190f0a"
          python3 - <<'PY'
          from pathlib import Path
          import re, ast
          src=Path('/tmp/kokkaras.current.js').read_text(encoding='utf-8')
          wf=Path('/tmp/reconstruct.yml').read_text(encoding='utf-8')
          m=re.search(r"^\s*replacement=(.+)$",wf,re.M)
          if not m:
              raise SystemExit('historical replacement not found')
          replacement=ast.literal_eval(m.group(1).strip())
          out,n=re.subn(r'^const SERVER_ACCESS = .*?;$',replacement,src,count=1,flags=re.M)
          if n != 1:
              raise SystemExit(f'SERVER_ACCESS replacement count={n}')
          Path('/tmp/kokkaras.js').write_text(out,encoding='utf-8')
          PY
          echo "RECONSTRUCTED_SHA=$(sha256sum /tmp/kokkaras.js | awk '{print $1}')"
          test "$(sha256sum /tmp/kokkaras.js | awk '{print $1}')" = "28c3104020ecb7f54d0d51a72d067404d0176bc069d59fcca417d66817d1fcf1"
          node --check /tmp/kokkaras.js

      - name: Extract Pits advanced canonical logic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('/tmp/kokkaras.js').read_text(encoding='utf-8')
          lines=src.splitlines()
          patterns=[
              r'runPits', r'pitBuildMenuState', r'pitReadRunConfigs',
              r'sniper', r'tournament', r'reward.?strategy', r'daily.?base',
              r'restor', r'paw', r'crystal', r'cur_pit', r'pit_pass',
              r'снайпер', r'турнир', r'награ', r'лап'
          ]
          rx=re.compile('|'.join(f'(?:{p})' for p in patterns), re.I)
          hits=[i for i,l in enumerate(lines) if rx.search(l)]
          ranges=[]
          for i in hits:
              a=max(0,i-22); b=min(len(lines),i+23)
              if ranges and a <= ranges[-1][1]+6:
                  ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
              else:
                  ranges.append((a,b))
          out=[
              '# Kokkaras Pits advanced canon extraction',
              '',
              'source_version: 5.3.22-ui-icons-pit-dim',
              'source_sha256: 28c3104020ecb7f54d0d51a72d067404d0176bc069d59fcca417d66817d1fcf1',
              ''
          ]
          for n,(a,b) in enumerate(ranges,1):
              out += [f'## Window {n} — lines {a+1}-{b}', '~~~js']
              out += [f'{j+1:06d}: {lines[j]}' for j in range(a,b)]
              out += ['~~~','']
          Path('audit/hk-stage2-pits-advanced-donor-extract.md').write_text('\n'.join(out),encoding='utf-8')
          print('hits',len(hits),'ranges',len(ranges))
          PY

      - name: Commit extraction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-pits-advanced-donor-extract.md
          if ! git diff --cached --quiet; then
            git commit -m "audit: extract Kokkaras advanced Pits canon"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
