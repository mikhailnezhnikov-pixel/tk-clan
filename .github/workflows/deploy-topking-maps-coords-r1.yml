name: Deploy TopKing Maps Coords R1

on:
  push:
    paths:
      - 'deploy/topking/maps-coords-r1-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_SCANNER_REV = 'maps-building-scan-20260920-r2'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "a250839d884d23ff12fb2808364338d62b5555554fad2edc4d7b4a1e0cec177e"

      - name: Compile and apply patch
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_maps_coords_r1.py
          python3 deploy/topking/patch_maps_coords_r1.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_COORDS_REV = 'maps-coordinates-column-row-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "x:full?.info?.y ?? full?.meta?.gamearea_coords?.y" /tmp/HamsterKingMobile.user.js
          grep -Fq "y:full?.info?.x ?? full?.meta?.gamearea_coords?.x" /tmp/HamsterKingMobile.user.js
          grep -Fq "Number(row?.x) === wantedY && Number(row?.y) === wantedX" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_SCANNER_REV = 'maps-building-scan-20260920-r2'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_BUILDINGS_CANON_REV = 'buildings-canon-core-20260920-r1'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "f52ed4a3c61a3833941f8bf0c5e8016be8a59eac2ca4f6f352dd28ee16c3b290"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.maps-coords-r1.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.maps-coords-r1.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.maps-coords-r1.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.maps-coords-r1.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?maps-coords-r1=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "HK_MAP_COORDS_REV = 'maps-coordinates-column-row-20260920-r1'" /tmp/public.js
          sha="$(sha256sum /tmp/public.js | awk '{print $1}')"
          test "$sha" = "f52ed4a3c61a3833941f8bf0c5e8016be8a59eac2ca4f6f352dd28ee16c3b290"
          {
            echo "MAPS_COORDS_R1_LIVE=PASS"
            echo "live_sha256=$sha"
            echo "public_sha256=$sha"
            echo "public_byte_equality=PASS"
            echo "syntax=PASS"
            echo "marker=maps-coordinates-column-row-20260920-r1"
          } > audit/hk-stage2-maps-coords-r1-live-status.txt

      - name: Sync verified baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-stage2-maps-coords-r1-live-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "stage2: sync canonical map coordinates r1 live candidate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.maps-coords-r1.user.js /tmp/public.js
