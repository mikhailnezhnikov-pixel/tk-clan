name: Deploy W5 provenance priority
on:
  push:
    paths: ['deploy/topking/w5-live-trigger.txt']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: prepare ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/topking
          chmod 600 ~/.ssh/topking
      - name: build exact W5 candidate
        run: |
          set -euo pipefail
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          test "$(sha256sum /tmp/server.py|awk '{print $1}')" = "c1c583230f632ed38c654a00541809b1a7cb2f2bf0296708f4c44b2456ad46ce"
          python3 deploy/topking/patch_server_maps_shared_kb_w5.py
          python3 -m py_compile /tmp/server.py
          grep -Fq HK_MAP_PROVENANCE_W5_V1 /tmp/server.py
          test "$(sha256sum /tmp/server.py|awk '{print $1}')" = "8e3664d5a437ea7e924e91f4b6de3944e75b80e0bafbed5fc10769e37f71b22d"
      - name: W5 live precheck
        run: |
          cat > /tmp/w5-pre.py <<'PY'
          import hashlib,json,sqlite3
          K='hk_moscow1226';A='9ea6ff78-b881-45b3-b92d-a8f1da8eca05'
          db=sqlite3.connect('file:/var/lib/hamsterking-license/licenses.db?mode=ro',uri=True);db.row_factory=sqlite3.Row
          cols=[r['name'] for r in db.execute("PRAGMA table_info(map_buildings)")]
          assert 'knowledge_source' not in cols and 'knowledge_observed_at' not in cols,cols
          p=db.execute("SELECT points_json,point_count FROM hk_map_points WHERE map_key=?",(K,)).fetchone()
          rows=db.execute("SELECT room_count,last_player_id FROM map_buildings WHERE area_id=?",(A,)).fetchall()
          hist={}
          for r in rows:
            k='null' if r['room_count'] is None else str(r['room_count']);hist[k]=hist.get(k,0)+1
          assert hist=={'0':114,'2':3},hist
          assert sum(1 for r in rows if r['last_player_id']=='source-hk-maps-import')==3
          links=db.execute("SELECT COUNT(*) FROM hk_map_point_links WHERE map_key=?",(K,)).fetchone()[0]
          assert links==29,links
          global_row=db.execute("SELECT COUNT(*) n,SUM(CASE WHEN room_count IS NOT NULL THEN 1 ELSE 0 END) known,COALESCE(SUM(room_count),0) rooms FROM map_buildings").fetchone()
          out={'point_sha':hashlib.sha256(p['points_json'].encode()).hexdigest(),'point_count':p['point_count'],'pilot_hist':hist,'links':links,'global_count':global_row['n'],'global_known':global_row['known'],'global_rooms':global_row['rooms']}
          print(json.dumps(out,sort_keys=True))
          db.close()
          PY
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/w5-pre.py root@89.125.1.71:/tmp/w5-pre.py
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/w5-pre.py' | tee /tmp/w5-before.json
      - name: deploy W5 server only
        run: |
          set -euo pipefail
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/server.py root@89.125.1.71:/tmp/server.w5.py
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -e
            stamp="$(date +%Y%m%d-%H%M%S)"
            cp -a /opt/hamsterking-license/server.py "/opt/hamsterking-license/server.py.bak.w5.$stamp"
            install -m 0644 /tmp/server.w5.py /opt/hamsterking-license/server.py
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '
      - name: verify W5 live provenance read-only
        run: |
          cat > /tmp/w5-verify.py <<'PY'
          import hashlib,importlib.util,json,sqlite3
          K='hk_moscow1226';A='9ea6ff78-b881-45b3-b92d-a8f1da8eca05'
          before=json.load(open('/tmp/w5-before.json'))
          spec=importlib.util.spec_from_file_location('s','/opt/hamsterking-license/server.py')
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)
          assert hasattr(s,'map_knowledge_source')
          db=sqlite3.connect('file:/var/lib/hamsterking-license/licenses.db?mode=ro',uri=True);db.row_factory=sqlite3.Row
          cols=[r['name'] for r in db.execute("PRAGMA table_info(map_buildings)")]
          assert 'knowledge_source' in cols and 'knowledge_observed_at' in cols,cols
          counts={r['knowledge_source']:r['n'] for r in db.execute("SELECT knowledge_source,COUNT(*) n FROM map_buildings GROUP BY knowledge_source")}
          assert set(counts)<= {'game_live','hk_maps_import','legacy'},counts
          assert sum(counts.values())==before['global_count'],(counts,before)
          global_row=db.execute("SELECT COUNT(*) n,SUM(CASE WHEN room_count IS NOT NULL THEN 1 ELSE 0 END) known,COALESCE(SUM(room_count),0) rooms,SUM(CASE WHEN knowledge_observed_at<=0 THEN 1 ELSE 0 END) bad_ts FROM map_buildings").fetchone()
          assert global_row['n']==before['global_count']
          assert global_row['known']==before['global_known']
          assert global_row['rooms']==before['global_rooms']
          pilot=db.execute("SELECT building_id,room_count,knowledge_source,knowledge_observed_at FROM map_buildings WHERE area_id=?",(A,)).fetchall()
          ph={}
          sh={}
          for r in pilot:
            k='null' if r['room_count'] is None else str(r['room_count']);ph[k]=ph.get(k,0)+1
            sh[r['knowledge_source']]=sh.get(r['knowledge_source'],0)+1
            assert r['knowledge_observed_at']>0,dict(r)
          assert ph=={'0':114,'2':3},ph
          assert sh=={'game_live':114,'hk_maps_import':3},sh
          detail=s.map_detail(A)
          by={r['building_id']:r for r in detail['buildings']}
          for bid in ('way29242551','way29242552','way430609368'):
            assert by[bid]['knowledge_source']=='hk_maps_import',by[bid]
            assert by[bid]['knowledge_observed_at']>0,by[bid]
          data=s.hk_map_data(K,{'telegram_id':'w5-audit','maps_manage':1,'maps_access':1})
          assert data['canonical']['linked_points']==29 and data['canonical']['applied_points']==29,data['canonical']
          flat=data['points'];hist={}
          for i in range(0,len(flat),3):
            flag=int(flat[i+2]);rooms=flag-8 if flag>=7 else flag;hist[str(rooms)]=hist.get(str(rooms),0)+1
          assert hist=={'0':26,'1':1,'2':3,'3':2},hist
          p=db.execute("SELECT points_json FROM hk_map_points WHERE map_key=?",(K,)).fetchone()
          assert hashlib.sha256(p['points_json'].encode()).hexdigest()==before['point_sha']
          out={'server_sha256':hashlib.sha256(open('/opt/hamsterking-license/server.py','rb').read()).hexdigest(),'source_counts':counts,'bad_timestamps':global_row['bad_ts'],'pilot_source_hist':sh,'pilot_room_hist':ph,'website_render_hist':hist,'geometry_sha':before['point_sha']}
          print(json.dumps(out,sort_keys=True))
          db.close()
          PY
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/w5-verify.py root@89.125.1.71:/tmp/w5-verify.py
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/w5-before.json root@89.125.1.71:/tmp/w5-before.json
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/w5-verify.py' | tee /tmp/w5-after.json
          test "$(python3 -c "import json;print(json.load(open('/tmp/w5-after.json'))['server_sha256'])")" = "8e3664d5a437ea7e924e91f4b6de3944e75b80e0bafbed5fc10769e37f71b22d"
      - name: verify current Maps client untouched
        run: |
          curl -fsSL "https://hk-license.89.125.1.71.sslip.io/panel.js?w5=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          grep -Fq "HK_MAP_SCANNER_REV = 'maps-parallel-read-20260920-r6-safe5'" /tmp/public.js
          grep -Fq "HK_MAP_COORDS_REV = 'maps-coordinates-column-row-20260920-r2'" /tmp/public.js
          grep -Fq "coord_revision:'column-row-v1'" /tmp/public.js
          echo "client_sha256=$(sha256sum /tmp/public.js|awk '{print $1}')"
          echo W5_LIVE_PASS
