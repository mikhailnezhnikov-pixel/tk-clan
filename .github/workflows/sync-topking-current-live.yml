name: Sync TopKing Current From Live

on:
  push:
    paths:
      - 'deploy/topking/sync-current-live-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Fetch verified live candidate
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/live.js
          node --check /tmp/live.js
          grep -Fq "HK_TODAY_CANON_REV = 'today-kokkaras-order-20260920-r1'" /tmp/live.js
          grep -Fq "HK_PITS_CANON_REV = 'pits-canon-core-20260920-r1'" /tmp/live.js
          grep -Fq "HK_PITS_UI_REV = 'pits-ui-align-20260920-r2'" /tmp/live.js
          grep -Fq "HK_PITS_SNIPER_REV = 'pits-passplan-sniper-20260920-r3'" /tmp/live.js
          grep -Fq "HK_PITS_TOOLBAR_REV = 'pits-toolbar-clean-20260920-r4'" /tmp/live.js
          grep -Fq "HK_PITS_START_REV = 'pits-start-config-snapshot-20260920-r5'" /tmp/live.js
          grep -Fq "HK_PITS_RESPAWN_REV = 'pits-respawn-cost-20260920-r6'" /tmp/live.js
          grep -Fq "HK_PITS_POWER_TABLE_REV = 'pits-power-table-collapsed-20260920-r7'" /tmp/live.js
          grep -Fq "HK_PITS_PROGRESS_REV = 'pits-battle-progress-20260920-r8'" /tmp/live.js
          grep -Fq "HK_PITS_RUNNER_HISTORY_REV = 'pits-runner-history-20260920-r9'" /tmp/live.js
          grep -Fq "HK_PITS_SPEED_REV = 'pits-fast-cycle-20260920-r10'" /tmp/live.js
          grep -Fq "HK_PITS_DECISION_REV = 'pits-restoration-decision-20260920-r11'" /tmp/live.js
          grep -Fq "HK_PITS_REWARD_REV = 'pits-reward-planner-core-20260920-r12'" /tmp/live.js
          grep -Fq "HK_PITS_REWARD_EXEC_REV = 'pits-reward-execution-20260920-r13'" /tmp/live.js
          grep -Fq "HK_PITS_SUMMARY_REV = 'pits-plan-totals-20260920-r14'" /tmp/live.js
          grep -Fq "HK_PITS_SHARED_FORECAST_REV = 'pits-shared-reward-forecast-20260920-r15'" /tmp/live.js
          grep -Fq "HK_PITS_REWARD_ONLY_REV = 'pits-reward-only-plan-20260920-r16'" /tmp/live.js
          grep -Fq "HK_PITS_PREVIEW_REV = 'pits-runtime-preview-20260920-r17'" /tmp/live.js
          grep -Fq "HK_PITS_REWARD_FIT_REV = 'pits-reward-fit-available-20260920-r18'" /tmp/live.js
          grep -Fq "HK_PITS_PREFLIGHT_REV = 'pits-aggregate-preflight-20260920-r19'" /tmp/live.js
          test "$(sha256sum /tmp/live.js | awk '{print $1}')" = "0c13faad6e3a85b6105e62d8b9e764077724063947c047e13a377b1d8c0fe71a"
          cp /tmp/live.js baseline/topking/HamsterKingMobile.current.user.js
      - name: Commit current snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js
          if ! git diff --cached --quiet; then
            git commit -m "stage2: sync Pits aggregate preflight r19 live candidate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/live.js
