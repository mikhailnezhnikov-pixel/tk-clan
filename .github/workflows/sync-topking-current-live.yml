name: Sync TopKing Current From Live

on:
  push:
    paths:
      - 'deploy/topking/sync-current-live-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Fetch verified live candidate
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/live.js
          node --check /tmp/live.js
          grep -Fq "// @version      1.17.8" /tmp/live.js
          grep -Fq "const BUILD_VERSION = '1.17.8';" /tmp/live.js
          grep -Fq "PRELOGIN_ZERO_GAME_API_R1" /tmp/live.js
          grep -Fq "AUTH_PASSIVE_SAFETY_R1" /tmp/live.js
          grep -Fq "PUBLIC_COLLECTOR_NATIVE_AUTH_OBSERVER_R1" /tmp/live.js
          grep -Fq "explore-e3-single-20260920-r9-runner" /tmp/live.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /tmp/live.js
          grep -Fq "public-server-only-20260920-r2" /tmp/live.js
          cp /tmp/live.js baseline/topking/HamsterKingMobile.current.user.js
      - name: Commit current snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js
          if ! git diff --cached --quiet; then
            git commit -m "hotfix: sync userscript 1.17.8 safe live baseline"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/live.js
