name: Build Userscript 1.17.96 Game API 429 Cooldown 20s

on:
  push:
    paths:
      - 'deploy/topking/patch_game_api_429_cooldown_20s_1_17_96.py'
      - '.github/workflows/build-userscript-1-17-96-game-api-429-cooldown-20s.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-userscript-1-17-96-game-api-429-cooldown-20s
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate from exact live baseline
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          test -f "$base"
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.17.95" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.17.95';" /tmp/HamsterKingMobile.user.js
          grep -Fq "game-api-rate-guard-20260922-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "shop-rate-limit-resume-20260925-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "resource-maximum-direct-run-20260925-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_game_api_429_cooldown_20s_1_17_96.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.96" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.17.96';" /tmp/HamsterKingMobile.user.js
          grep -Fq "game-api-429-cooldown-20s-20260925-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "const GAME_API_429_FALLBACK_COOLDOWN_MS = 20 * 1000;" /tmp/HamsterKingMobile.user.js
          if grep -Fq "const GAME_API_429_FALLBACK_COOLDOWN_MS = 60 * 1000;" /tmp/HamsterKingMobile.user.js; then
            echo "Old 60s 429 cooldown still present" >&2
            exit 1
          fi
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate and release manifest
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.17.96.game-api-429-cooldown-20s.candidate.user.js
          audit=audit/hk-userscript-1-17-96-game-api-429-cooldown-20s-predeploy.txt

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
            cp /tmp/HamsterKingMobile.user.js "$candidate"

            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.17.95':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.17.95',
              'target_version':'1.17.96',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.17.96.game-api-429-cooldown-20s.candidate.user.js',
              'primary_marker':'game-api-429-cooldown-20s-20260925-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-17-96-game-api-429-cooldown-20s-live-status.txt',
              'commit_message':'fix: deploy 20s Game API 429 cooldown in userscript 1.17.96',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

            mkdir -p "$(dirname "$audit")"
            {
              echo "USERSCRIPT_1_17_96_GAME_API_429_COOLDOWN_20S_PREDEPLOY=PASS"
              echo "source_version=1.17.95"
              echo "target_version=1.17.96"
              echo "game_api_429_fallback_cooldown_ms=20000"
              echo "shop_extra_429_delay_ms=0"
              echo "server_retry_after=RESPECTED"
              echo "syntax=PASS"
              echo "base_sha256=$(cat /tmp/base.sha)"
              echo "candidate_sha256=$(cat /tmp/candidate.sha)"
            } > "$audit"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$candidate" deploy/topking/userscript-release.json "$audit"
            git commit -m "build: prepare userscript 1.17.96 Game API 429 cooldown 20s"

            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
