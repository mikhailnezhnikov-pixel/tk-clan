name: Deploy TopKing Public Snapshot 3H R1

on:
  push:
    paths:
      - 'deploy/topking/public-snapshot-3h-r1-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch current live and patch public snapshot schedule only
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_EXPLORE_CANON_REV='explore-e3-single-20260920-r9-runner'" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /tmp/HamsterKingMobile.user.js
          grep -Fq "const PUBLIC_SNAPSHOT_INTERVAL_MS = 15 * 60 * 1000;" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/source.sha
          cp /tmp/HamsterKingMobile.user.js /tmp/before.js

          python3 deploy/topking/patch_public_snapshot_3h_r1.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "const PUBLIC_SNAPSHOT_INTERVAL_MS = 3 * 60 * 60 * 1000;" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PUBLIC_SNAPSHOT_CLIENT_REV = 'public-snapshot-3h-20260920-r1'" /tmp/HamsterKingMobile.user.js
          ! grep -Fq "setTimeout(() => collectPublicSnapshot(true), 5000)" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_EXPLORE_CANON_REV='explore-e3-single-20260920-r9-runner'" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Race-safe install
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/source.sha)"
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.public-snapshot-3h-r1.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 "set -euo pipefail; current=\$(sha256sum /opt/hamsterking-license/HamsterKingMobile.user.js | awk '{print \$1}'); test \"\$current\" = \"$source_sha\" || { echo LIVE_CHANGED_BEFORE_PUBLIC_SNAPSHOT_3H_R1; exit 42; }; node --check /tmp/HamsterKingMobile.public-snapshot-3h-r1.user.js; stamp=\$(date +%Y%m%d-%H%M%S); cp -a /opt/hamsterking-license/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js.bak.public-snapshot-3h-r1.\$stamp; install -m 0644 /tmp/HamsterKingMobile.public-snapshot-3h-r1.user.js /opt/hamsterking-license/HamsterKingMobile.user.js; systemctl restart hamsterking-license.service; systemctl is-active --quiet hamsterking-license.service"

      - name: Verify public exact candidate
        run: |
          set -euo pipefail
          sleep 2
          curl -fsSL --retry 4 --connect-timeout 15 --max-time 30 "https://hk-license.89.125.1.71.sslip.io/panel.js?public-snapshot-3h-r1=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          candidate="$(cat /tmp/candidate.sha)"
          test "$(sha256sum /tmp/public.js | awk '{print $1}')" = "$candidate"
          grep -Fq "const PUBLIC_SNAPSHOT_INTERVAL_MS = 3 * 60 * 60 * 1000;" /tmp/public.js
          grep -Fq "HK_PUBLIC_SNAPSHOT_CLIENT_REV = 'public-snapshot-3h-20260920-r1'" /tmp/public.js
          ! grep -Fq "setTimeout(() => collectPublicSnapshot(true), 5000)" /tmp/public.js
          {
            echo "PUBLIC_SNAPSHOT_3H_R1_LIVE=PASS"
            echo "source_live_sha256=$(cat /tmp/source.sha)"
            echo "live_sha256=$candidate"
            echo "public_sha256=$candidate"
            echo "public_byte_equality=PASS"
            echo "syntax=PASS"
            echo "snapshot_interval_hours=3"
            echo "forced_login_snapshot=REMOVED"
            echo "website_game_token_exposure=NO"
            echo "explore_r9_preserved=PASS"
            echo "map_concurrency_5_preserved=PASS"
          } > /tmp/public-snapshot-3h-r1-live-status.txt

      - name: Sync baseline and evidence
        run: |
          set -euo pipefail
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
            cp /tmp/public-snapshot-3h-r1-live-status.txt audit/hk-public-snapshot-3h-r1-live-status.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-public-snapshot-3h-r1-live-status.txt
            git commit -m "hotfix: throttle public snapshot collection to 3 hours" || true
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js /tmp/before.js /tmp/source.sha /tmp/candidate.sha /tmp/public-snapshot-3h-r1-live-status.txt
