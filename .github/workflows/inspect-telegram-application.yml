name: Inspect Telegram application handlers

on:
  push:
    paths:
      - '.github/workflows/inspect-telegram-application.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Inspect handlers
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            f=/opt/hamsterking-license/server.py
            echo "=== TELEGRAM CONSTANT NAMES ==="
            grep -n -E "TELEGRAM_[A-Z_]+|BOT_[A-Z_]+|message_thread_id" "$f" | sed -E "s/(TOKEN|SECRET)[^=]*=.*/\1=<redacted>/" | head -120 || true
            echo "=== APPLICATION FIELDS ==="
            grep -n -A40 -B10 "^APPLICATION_FIELDS" "$f" || true
            echo "=== APPLICATION FLOW ==="
            grep -n -A180 -B20 "^def telegram_summary" "$f" | head -240 || true
          '

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
