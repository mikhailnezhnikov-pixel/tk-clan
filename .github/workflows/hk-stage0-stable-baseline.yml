name: HK Stage 0 Stable Baseline

on:
  push:
    paths:
      - 'deploy/topking/stage0-baseline-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hk-stage0-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch and validate live userscript
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.live.user.js
          node --check /tmp/HamsterKingMobile.live.user.js
          version="$(sed -n 's#^// @version[[:space:]]*##p' /tmp/HamsterKingMobile.live.user.js | head -1)"
          sha="$(sha256sum /tmp/HamsterKingMobile.live.user.js | awk '{print $1}')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "LIVE_SHA=$sha" >> "$GITHUB_ENV"
          test "$version" = "1.17.4"
          grep -Fq "HK_LAUNCHER_REV = 'launcher-hotfix-20260920-r1'" /tmp/HamsterKingMobile.live.user.js
          grep -Fq "HK_LAUNCHER_HANDOFF_REV = 'launcher-handoff-20260920-r4'" /tmp/HamsterKingMobile.live.user.js
          grep -Fq "HK_RUNTIME_TAKEOVER_REV = 'runtime-takeover-20260920-r5'" /tmp/HamsterKingMobile.live.user.js
          grep -Fq "HK_CORE_REVISION = 'core-20260920-r6'" /tmp/HamsterKingMobile.live.user.js
          grep -Fq "HK_STARTUP_STAGE_REV = 'startup-stages-20260920-r7'" /tmp/HamsterKingMobile.live.user.js
          grep -Fq "HK_STARTUP_ERROR_TRAP_REV = 'startup-error-trap-20260920-r8'" /tmp/HamsterKingMobile.live.user.js
          echo "LIVE_VERSION=$version"
          echo "LIVE_SHA256=$sha"

      - name: Create immutable Stage 0 server backup
        run: |
          set -euo pipefail
          short="${LIVE_SHA:0:12}"
          backup="/opt/hamsterking-license/stage0-backups/HamsterKingMobile.stage0-1.17.4-${short}.user.js"
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 "set -euo pipefail; mkdir -p /opt/hamsterking-license/stage0-backups; if [ ! -f '$backup' ]; then cp -a /opt/hamsterking-license/HamsterKingMobile.user.js '$backup'; chmod 0444 '$backup'; fi; cmp -s /opt/hamsterking-license/HamsterKingMobile.user.js '$backup'"
          echo "BACKUP_PATH=$backup" >> "$GITHUB_ENV"
          echo "BACKUP_PATH=$backup"

      - name: Verify service and backend health
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -euo pipefail; systemctl is-active --quiet hamsterking-license.service; echo SERVICE=active; if curl -fsS --max-time 10 http://127.0.0.1:8787/health >/tmp/hk-health.json; then echo HEALTH_PORT=8787; else curl -fsS --max-time 10 http://127.0.0.1:3188/health >/tmp/hk-health.json; echo HEALTH_PORT=3188; fi; printf "HEALTH_BODY="; cat /tmp/hk-health.json; echo'

      - name: Verify public panel round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 "https://hk-license.89.125.1.71.sslip.io/panel.js?stage0=$(date +%s)" -o /tmp/HamsterKingMobile.public.user.js
          node --check /tmp/HamsterKingMobile.public.user.js
          public_sha="$(sha256sum /tmp/HamsterKingMobile.public.user.js | awk '{print $1}')"
          echo "PUBLIC_SHA=$public_sha" >> "$GITHUB_ENV"
          cmp -s /tmp/HamsterKingMobile.live.user.js /tmp/HamsterKingMobile.public.user.js
          test "$public_sha" = "$LIVE_SHA"
          echo PUBLIC_ROUNDTRIP=PASS
          echo "PUBLIC_SHA256=$public_sha"

      - name: Synchronize canonical baseline with exact live
        run: |
          set -euo pipefail
          mkdir -p baseline/topking audit
          short="${LIVE_SHA:0:12}"
          immutable="baseline/topking/HamsterKingMobile.${VERSION}-${short}.user.js"
          cp /tmp/HamsterKingMobile.live.user.js baseline/topking/HamsterKingMobile.current.user.js
          if [ ! -f "$immutable" ]; then cp /tmp/HamsterKingMobile.live.user.js "$immutable"; fi
          cat > baseline/topking/BASELINE.json <<EOF
          {
            "schema": "hk-canonical-baseline-v1",
            "version": "${VERSION}",
            "sha256": "${LIVE_SHA}",
            "immutable_file": "${immutable}",
            "current_file": "baseline/topking/HamsterKingMobile.current.user.js",
            "source": "live-server:/opt/hamsterking-license/HamsterKingMobile.user.js",
            "captured_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "stage0_backup": "${BACKUP_PATH}",
            "stage0_status": "TECHNICAL_PASS"
          }
          EOF
          cmp -s /tmp/HamsterKingMobile.live.user.js baseline/topking/HamsterKingMobile.current.user.js
          cat > audit/hk-stage0-baseline-status.txt <<EOF
          stage=0
          name=STABLE_BASELINE
          version=${VERSION}
          sha256=${LIVE_SHA}
          public_sha256=${PUBLIC_SHA}
          syntax=PASS
          live_markers=PASS
          service=PASS
          backend_health=PASS
          public_roundtrip=PASS
          server_backup=PASS
          backup_path=${BACKUP_PATH}
          canonical_baseline_sync=PASS
          ui_hk_appears=USER_CONFIRMED_PREVIOUSLY
          ui_panel_opens=USER_CONFIRMED_PREVIOUSLY
          ui_close_reopen=PENDING_USER_CHECK
          ui_reload=PENDING_USER_CHECK
          ui_spa_recovery=PENDING_USER_CHECK
          technical_result=PASS
          overall_result=PENDING_UI_CONFIRMATION
          EOF

      - name: Update roadmap current baseline text
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/HK_MASTER_ROADMAP.md')
          s=p.read_text(encoding='utf-8')
          old='Рабочая live-база:\n\n**1.17.4 + launcher-hotfix-20260920-r1**'
          new='Рабочая live-база:\n\n**1.17.4 · launcher r1 · handoff r4 · runtime r5 · core r6 · startup r7 · error-trap r8**\n\nStage 0 technical baseline is pinned by baseline/topking/BASELINE.json and audit/hk-stage0-baseline-status.txt.'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit Stage 0 baseline evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking audit/hk-stage0-baseline-status.txt docs/HK_MASTER_ROADMAP.md
          if ! git diff --cached --quiet; then
            git commit -m "stage0: pin stable HK technical baseline"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main || true
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.live.user.js /tmp/HamsterKingMobile.public.user.js
