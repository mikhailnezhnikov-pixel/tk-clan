name: Deploy TopKing 1.16.0 Stage 2A Runner

on:
  push:
    paths:
      - 'deploy/topking/stage2a-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-1160-stage2a
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch verified Stage 1 live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.15.0$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MUTATION_GATE_REV = 'stage1-20260919-r4'" /tmp/HamsterKingMobile.user.js
          grep -Fq 'growthCostOnlyUses(cost,[GROWTH_HAMSTER_BUDGET_ID])' /tmp/HamsterKingMobile.user.js
          grep -Fq 'growthCostOnlyUses(cost,[GROWTH_GENERAL_BUDGET_ID])' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Build and validate Stage 2A
        run: |
          set -euo pipefail
          python3 deploy/topking/test_stage2_runner_fixture.py
          python3 deploy/topking/stage2_runner_patch.py
          grep -q '^// @version      1.16.0$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2_RUNNER_REV = 'stage2a-20260919-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MUTATION_GATE_REV = 'stage1-20260919-r4'" /tmp/HamsterKingMobile.user.js
          grep -Fq "GROWTH_HAMSTER_BUDGET_ID = 'cur_cap'" /tmp/HamsterKingMobile.user.js
          grep -Fq "GROWTH_GENERAL_BUDGET_ID = 'item_pit_token'" /tmp/HamsterKingMobile.user.js
          grep -Fq "title:either('Яма','Pit')" /tmp/HamsterKingMobile.user.js
          grep -Fq "hkRunner.stop('pit')" /tmp/HamsterKingMobile.user.js
          grep -Fq "title:either('Ярмарка','Fair')" /tmp/HamsterKingMobile.user.js
          grep -Fq "hkRunner.stop('fair')" /tmp/HamsterKingMobile.user.js
          grep -Fq 'await gameRetryDelay(Math.max(700, settings.interval * 1000));' /tmp/HamsterKingMobile.user.js
          grep -Fq 'await gameRetryDelay(550);' /tmp/HamsterKingMobile.user.js
          grep -Fq 'growth-general-no-progress' /tmp/HamsterKingMobile.user.js
          grep -Fq 'growth-hamster-no-progress' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Deploy with rollback and verify service
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            live=/opt/hamsterking-license/HamsterKingMobile.user.js
            incoming=/tmp/HamsterKingMobile.user.js
            stamp=$(date +%Y%m%d-%H%M%S)
            backup="${live}.bak.${stamp}"
            old_version=$(grep -m1 "^// @version" "$live" | sed "s#^// @version[[:space:]]*##")

            node --check "$incoming"
            grep -q "^// @version      1.16.0$" "$incoming"
            grep -q "stage2a-20260919-r1" "$incoming"
            grep -q "stage1-20260919-r4" "$incoming"
            grep -Fq "hkRunner.stop('pit')" "$incoming"
            grep -Fq "hkRunner.stop('fair')" "$incoming"

            cp -a "$live" "$backup"
            install -m 0644 "$incoming" "$live"
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.16.0\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
            systemctl daemon-reload

            deploy_ok=1
            systemctl restart hamsterking-license.service || deploy_ok=0
            systemctl is-active --quiet hamsterking-license.service || deploy_ok=0
            if [ "$deploy_ok" = "1" ]; then
              sleep 2
              (curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/cabinet/config || curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/cabinet/config) >/tmp/cabinet.json || deploy_ok=0
            fi

            if [ "$deploy_ok" != "1" ]; then
              echo "Stage 2A health check failed; rolling back to $old_version" >&2
              install -m 0644 "$backup" "$live"
              printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=$old_version\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
              systemctl daemon-reload
              systemctl restart hamsterking-license.service || true
              exit 1
            fi

            node --check "$live"
            grep -q "^// @version      1.16.0$" "$live"
            grep -q "stage2a-20260919-r1" "$live"
            grep -Fq "hkRunner.stop('pit')" "$live"
            grep -Fq "hkRunner.stop('fair')" "$live"
            echo DEPLOY_OK
          '

      - name: Fetch live back and record verification
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/topking-live-after-deploy.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/topking-live-after-deploy.js
          node --check /tmp/topking-live-after-deploy.js
          grep -q '^// @version      1.16.0$' /tmp/topking-live-after-deploy.js
          grep -Fq "HK_STAGE2_RUNNER_REV = 'stage2a-20260919-r1'" /tmp/topking-live-after-deploy.js
          grep -Fq "HK_MUTATION_GATE_REV = 'stage1-20260919-r4'" /tmp/topking-live-after-deploy.js
          grep -Fq "hkRunner.stop('pit')" /tmp/topking-live-after-deploy.js
          grep -Fq "hkRunner.stop('fair')" /tmp/topking-live-after-deploy.js
          grep -Fq 'growth-general-no-progress' /tmp/topking-live-after-deploy.js
          grep -Fq 'growth-hamster-no-progress' /tmp/topking-live-after-deploy.js

          live_sha=$(sha256sum /tmp/topking-live-after-deploy.js | awk '{print $1}')
          {
            echo 'version=1.16.0'
            echo 'revision=stage2a-20260919-r1'
            echo 'base_revision=stage1-20260919-r4'
            echo 'modules=pit,fair'
            echo 'runner=shared'
            echo 'syntax=ok'
            echo "sha256=$live_sha"
            echo 'verified_by=deploy-topking-1160-stage2a'
          } > /tmp/hk-stage2a-live-status.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit
            cp /tmp/hk-stage2a-live-status.txt audit/hk-stage2a-live-status.txt
            git add audit/hk-stage2a-live-status.txt
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m "Verify live TopKing 1.16.0 Stage 2A"
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = "1"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/topking-live-after-deploy.js /tmp/hk-stage2a-live-status.txt
