name: Export TopKing bookmarklet sources
# stage0 audit refresh 2026-09-19
# refresh live server for HK map data v2
# verify live 1.14.2 audited
# verify live 1.13.0
# secure private maps permissions + publishing
# verify private maps owner access 2026-09-19

on:
  push:
    paths:
      - '.github/workflows/export-topking-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Export live backend and userscript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py live/server.py
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js live/HamsterKingMobile.user.js
          grep -m1 '^// @version' live/HamsterKingMobile.user.js
          python3 -m py_compile live/server.py
          node --check live/HamsterKingMobile.user.js

      - name: Build secure maps backend
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'CREATE TABLE IF NOT EXISTS hk_maps_catalog' live/server.py; then
            base64 -d deploy/topking/server-maps-access.patch.gz.b64 | gzip -d > /tmp/server-maps-access.patch
            patch --fuzz=0 live/server.py < /tmp/server-maps-access.patch
          fi
          python3 -m py_compile live/server.py
          python3 live/server.py --self-test

          if [ -f cabinet/hk-maps-index.js ]; then
            node <<'NODE'
          const fs=require('fs');
          global.window={};
          require(process.cwd()+'/cabinet/hk-maps-index.js');
          if(!Array.isArray(window.HK_MAPS_INDEX)||window.HK_MAPS_INDEX.length!==235){
            throw new Error('Expected 235 HK maps');
          }
          fs.writeFileSync('/tmp/hk-maps-index.json',JSON.stringify(window.HK_MAPS_INDEX));
          NODE
          fi

      - name: Deploy secure maps backend
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            live/server.py root@89.125.1.71:/tmp/hamsterking-server.py
          if [ -f /tmp/hk-maps-index.json ]; then
            scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              /tmp/hk-maps-index.json root@89.125.1.71:/tmp/hk-maps-index.json
          fi

          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'set -euo pipefail;
              stamp="$(date +%Y%m%d-%H%M%S)";
              python3 -m py_compile /tmp/hamsterking-server.py;
              cp -a /opt/hamsterking-license/server.py "/opt/hamsterking-license/server.py.bak.$stamp";
              install -m 0644 /tmp/hamsterking-server.py /opt/hamsterking-license/server.py;
              systemctl restart hamsterking-license.service;
              systemctl is-active --quiet hamsterking-license.service;
              sleep 2;
              if [ -f /tmp/hk-maps-index.json ]; then
                python3 /opt/hamsterking-license/server.py --import-hk-maps-index /tmp/hk-maps-index.json;
                rm -f /tmp/hk-maps-index.json;
              fi;
              curl -fsS --max-time 10 http://127.0.0.1:8787/health || curl -fsS --max-time 10 http://127.0.0.1:3188/health;
              echo;
              curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/public/maps || curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/public/maps;
              echo;
              echo MAPS_BACKEND_DEPLOY_OK'

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: topking-bookmarklet-live
          path: live/
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/server-maps-access.patch /tmp/hk-maps-index.json
