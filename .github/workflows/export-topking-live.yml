name: Export TopKing bookmarklet sources

on:
  push:
    paths:
      - '.github/workflows/export-topking-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Export live backend and userscript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py live/server.py
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js live/HamsterKingMobile.user.js
          grep -m1 '^// @version' live/HamsterKingMobile.user.js
          python3 -m py_compile live/server.py
          node --check live/HamsterKingMobile.user.js

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: topking-bookmarklet-live
          path: live/
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
