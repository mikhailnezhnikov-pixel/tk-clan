name: Export preserved TopKing 1.9.6

on:
  push:
    paths:
      - '.github/workflows/export-topking-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Export preserved source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preserved
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new             root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js.bak.20260919-061430             preserved/HamsterKingMobile_v1.9.6_preserved.user.js
          grep -m1 '^// @version' preserved/HamsterKingMobile_v1.9.6_preserved.user.js
          sha256sum preserved/HamsterKingMobile_v1.9.6_preserved.user.js

      - name: Upload preserved source
        uses: actions/upload-artifact@v4
        with:
          name: topking-preserved-1-9-6
          path: preserved/
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
