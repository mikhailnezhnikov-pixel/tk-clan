name: Export TopKing bookmarklet sources
# stage1 runner source refresh 2026-09-19
# refresh live server for HK map data v2
# verify live 1.14.2 audited
# verify live 1.13.0
# secure private maps permissions + publishing
# verify private maps owner access 2026-09-19

on:
  push:
    paths:
      - '.github/workflows/export-topking-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Export live backend and userscript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py live/server.py
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js live/HamsterKingMobile.user.js
          grep -m1 '^// @version' live/HamsterKingMobile.user.js
          python3 -m py_compile live/server.py
          node --check live/HamsterKingMobile.user.js

      - name: Build secure maps backend
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'CREATE TABLE IF NOT EXISTS hk_maps_catalog' live/server.py; then
            base64 -d deploy/topking/server-maps-access.patch.gz.b64 | gzip -d > /tmp/server-maps-access.patch
            patch --fuzz=0 live/server.py < /tmp/server-maps-access.patch
          fi
          python3 - <<'PY'
          from pathlib import Path
          path=Path('live/server.py')
          text=path.read_text()

          # A maps manager always has viewing access, even if maps_access was
          # accidentally cleared separately.
          text=text.replace(
              'if not public and (not member or not member.get("maps_access")):',
              'if not public and (not member or not (member.get("maps_access") or member.get("maps_manage"))):'
          )
          text=text.replace(
              'def cabinet_maps(member: dict) -> dict:\n    if not member.get("maps_access"):',
              'def cabinet_maps(member: dict) -> dict:\n    if not (member.get("maps_access") or member.get("maps_manage")):'
          )
          text=text.replace(
              '    return dict(row) if row and row["active"] else None',
              '    if not row or not row["active"]:\n        return None\n    member = dict(row)\n    if member.get("maps_manage"):\n        member["maps_access"] = 1\n    return member'
          )

          # The viewer must use the current DB-backed 235-map dataset.
          text=text.replace(
              '            if not member.get("maps_access"):\n                self.send_cabinet_json(HTTPStatus.FORBIDDEN, {"error": "maps_access_denied"}); return\n            key = parse_qs(parsed.query).get("key", [""])[0].strip()\n            try:\n                self.send_cabinet_json(HTTPStatus.OK, private_hk_map_data(key))',
              '            if not (member.get("maps_access") or member.get("maps_manage")):\n                self.send_cabinet_json(HTTPStatus.FORBIDDEN, {"error": "maps_access_denied"}); return\n            key = parse_qs(parsed.query).get("key", [""])[0].strip()\n            try:\n                self.send_cabinet_json(HTTPStatus.OK, hk_map_data(key, member=member))'
          )
          text=text.replace(
              '                self.send_public_json(HTTPStatus.OK, public_hk_map_data(key))',
              '                self.send_public_json(HTTPStatus.OK, hk_map_data(key, public=True))'
          )

          path.write_text(text)
          PY

          python3 -m py_compile live/server.py
          python3 live/server.py --self-test

          if [ -f cabinet/hk-maps-index.js ]; then
            node <<'NODE'
          const fs=require('fs');
          global.window={};
          require(process.cwd()+'/cabinet/hk-maps-index.js');
          if(!Array.isArray(window.HK_MAPS_INDEX)||window.HK_MAPS_INDEX.length!==235){
            throw new Error('Expected 235 HK maps');
          }
          fs.writeFileSync('/tmp/hk-maps-index.json',JSON.stringify(window.HK_MAPS_INDEX));
          NODE
          fi

      - name: Deploy secure maps backend
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-map-viewer.py <<'PY'
          import json, os, sqlite3, subprocess, sys, urllib.request

          # Load the same runtime environment as the systemd service so the
          # verification token is signed with the live signing secret.
          pid=subprocess.check_output(
              ["systemctl","show","hamsterking-license.service","-p","MainPID","--value"],
              text=True,
          ).strip()
          for item in open(f"/proc/{pid}/environ","rb").read().split(b"\\0"):
              if b"=" not in item:
                  continue
              key,value=item.split(b"=",1)
              os.environ[key.decode("utf-8","ignore")]=value.decode("utf-8","ignore")

          sys.path.insert(0, "/opt/hamsterking-license")
          import server

          db=sqlite3.connect("/var/lib/hamsterking-license/licenses.db")
          db.row_factory=sqlite3.Row
          manager=db.execute("""
              SELECT telegram_id,maps_access,maps_manage
              FROM clan_members
              WHERE active=1 AND maps_manage=1
              ORDER BY updated_at DESC LIMIT 1
          """).fetchone()
          maprow=db.execute("""
              SELECT c.map_key
              FROM hk_maps_catalog c
              JOIN hk_map_points p ON p.map_key=c.map_key
              ORDER BY c.map_key LIMIT 1
          """).fetchone()
          assert manager and maprow, "manager or map data missing"

          # Core rule: management rights imply viewing rights.
          direct=server.hk_map_data(
              maprow["map_key"],
              member={"maps_access": 0, "maps_manage": 1},
          )
          assert direct.get("ok"), "manager override failed"

          token=server.cabinet_token(str(manager["telegram_id"]))
          req=urllib.request.Request(
              "http://127.0.0.1:3188/api/v1/cabinet/maps/data?key="+maprow["map_key"],
              headers={
                  "Authorization": "Bearer "+token,
                  "Origin": "https://tk-clan.ru",
              },
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              payload=json.load(response)
          assert payload.get("ok"), "private viewer route failed"
          assert payload.get("map",{}).get("key")==maprow["map_key"], "wrong map returned"
          print("PRIVATE_MANAGER_MAP_OK", maprow["map_key"], payload.get("point_count",0))
          PY

          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            live/server.py root@89.125.1.71:/tmp/hamsterking-server.py
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/verify-map-viewer.py root@89.125.1.71:/tmp/verify-map-viewer.py
          if [ -f /tmp/hk-maps-index.json ]; then
            scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
              /tmp/hk-maps-index.json root@89.125.1.71:/tmp/hk-maps-index.json
          fi

          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'set -euo pipefail;
              stamp="$(date +%Y%m%d-%H%M%S)";
              python3 -m py_compile /tmp/hamsterking-server.py;
              cp -a /opt/hamsterking-license/server.py "/opt/hamsterking-license/server.py.bak.$stamp";
              install -m 0644 /tmp/hamsterking-server.py /opt/hamsterking-license/server.py;
              systemctl restart hamsterking-license.service;
              systemctl is-active --quiet hamsterking-license.service;
              sleep 2;
              if [ -f /tmp/hk-maps-index.json ]; then
                python3 /opt/hamsterking-license/server.py --import-hk-maps-index /tmp/hk-maps-index.json;
                rm -f /tmp/hk-maps-index.json;
              fi;
              curl -fsS --max-time 10 http://127.0.0.1:8787/health || curl -fsS --max-time 10 http://127.0.0.1:3188/health;
              echo;
              curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/public/maps || curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/public/maps;
              echo;
              python3 /tmp/verify-map-viewer.py;
              rm -f /tmp/verify-map-viewer.py;
              echo MAPS_BACKEND_DEPLOY_OK'

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: topking-bookmarklet-live
          path: live/
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/server-maps-access.patch /tmp/hk-maps-index.json /tmp/verify-map-viewer.py
