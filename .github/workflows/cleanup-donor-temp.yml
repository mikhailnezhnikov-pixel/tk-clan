name: Cleanup Donor Temp Artifacts

on:
  push:
    paths:
      - 'reference/topking/cleanup-donor-temp-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary donor capture artifacts
        run: |
          set -euo pipefail
          rm -rf reference/topking/_upload_parts
          rm -rf reference/topking/_temp
          rm -f reference/topking/capture-kokkaras-trigger.txt
          rm -f reference/topking/reconstruct-upload-trigger.txt
          rm -f reference/topking/capture-current-temp-trigger.txt
          rm -f reference/topking/finalize-kokkaras-trigger.txt
          rm -f reference/topking/cleanup-donor-temp-trigger.txt
          rm -f .github/workflows/capture-kokkaras-reference.yml
          rm -f .github/workflows/reconstruct-kokkaras-reference.yml
          rm -f .github/workflows/capture-kokkaras-current-temp.yml
          rm -f .github/workflows/finalize-kokkaras-reference.yml
          rm -f .github/workflows/cleanup-donor-temp.yml
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "cleanup: remove temporary donor capture artifacts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
