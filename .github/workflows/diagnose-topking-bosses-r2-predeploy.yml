name: Diagnose TopKing Bosses R2 Predeploy

on:
  push:
    paths:
      - 'deploy/topking/bosses-r2-diagnose-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Diagnose r2 predeploy
        run: |
          set +e
          status=PASS
          reason=none
          detail=""
          input_sha=unknown
          core_sha=unknown
          patched_sha=unknown

          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          rc=$?
          if [ $rc -ne 0 ]; then status=FAIL; reason=fetch_live; detail="scp_rc_$rc"; fi

          if [ "$status" = PASS ]; then
            input_sha="$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"
            if [ "$input_sha" != "571d97f7aa2adf5d747f94275350abf0872f04a63bdaf795c9ec53aed2b393a9" ]; then
              status=FAIL; reason=exact_sha; detail="$input_sha"
            fi
          fi

          if [ "$status" = PASS ]; then
            node --check /tmp/HamsterKingMobile.user.js >/tmp/diag.out 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then status=FAIL; reason=input_node_check; detail="$(tail -20 /tmp/diag.out | tr '\n' ' ' | sed 's/|/ /g')"; fi
          fi

          if [ "$status" = PASS ]; then
            python3 -m py_compile deploy/topking/patch_bosses_area_target_r2_1174.py >/tmp/diag.out 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then status=FAIL; reason=python_compile; detail="$(tail -20 /tmp/diag.out | tr '\n' ' ' | sed 's/|/ /g')"; fi
          fi

          if [ "$status" = PASS ]; then
            python3 deploy/topking/patch_bosses_area_target_r2_1174.py >/tmp/diag.out 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              status=FAIL; reason=patch; detail="$(tail -20 /tmp/diag.out | tr '\n' ' ' | sed 's/|/ /g')"
            else
              core_sha="$(grep '^BOSSES_R2_CORE_SHA=' /tmp/diag.out | tail -1 | cut -d= -f2)"
              patched_sha="$(grep '^BOSSES_R2_PATCHED_SHA=' /tmp/diag.out | tail -1 | cut -d= -f2)"
            fi
          fi

          if [ "$status" = PASS ]; then
            node --check /tmp/HamsterKingMobile.user.js >/tmp/diag.out 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then status=FAIL; reason=node_check; detail="$(tail -20 /tmp/diag.out | tr '\n' ' ' | sed 's/|/ /g')"; fi
          fi

          if [ "$status" = PASS ]; then
            for needle in \
              "HK_STAGE2J_BOSSES_REV = 'bosses-area-target-20260920-r2'" \
              "HK_BOSSES_CANON_REV='bosses-area-target-20260920-r2'" \
              "HK_BOSSES_TARGET_REV='bosses-area-target-20260920-r2'" \
              "function bossCanonTargetPlan" \
              "function bossCanonRewardOnlyPlan" \
              "async function bossCanonRunAreaTargetContinuation" \
              "data-boss-target-level" \
              "data-boss-target-strategy"
            do
              grep -Fq "$needle" /tmp/HamsterKingMobile.user.js
              rc=$?
              if [ $rc -ne 0 ]; then status=FAIL; reason=invariant; detail="$needle"; break; fi
            done
          fi

          {
            echo "checked_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "status=$status"
            echo "reason=$reason"
            echo "detail=$detail"
            echo "input_sha256=$input_sha"
            echo "core_sha256=$core_sha"
            echo "patched_sha256=$patched_sha"
          } > audit/hk-stage2-03-bosses-r2-predeploy-status.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-03-bosses-r2-predeploy-status.txt
          git commit -m "stage2: diagnose Bosses r2 predeploy" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/diag.out
