name: Check Explore E4 Queue R1

on:
  push:
    paths:
      - 'deploy/topking/explore-e4-queue-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify E4 candidate
        run: |
          set -euo pipefail
          cp baseline/topking/HamsterKingMobile.current.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.20" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r22-explore-speed-tune" /tmp/HamsterKingMobile.user.js

          python3 -m py_compile deploy/topking/patch_explore_e4_queue_1_17_21.py
          python3 deploy/topking/patch_explore_e4_queue_1_17_21.py
          node --check /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.17.21" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r23-explore-e4-queue" /tmp/HamsterKingMobile.user.js
          grep -Fq "explore-e4-queue-20260921-r1" /tmp/HamsterKingMobile.user.js

          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text()

          def block(a,b):
              i=s.index(a); j=s.index(b,i); return s[i:j]

          e3=block("async function exploreE3ProcessOne(initial,settings)","async function runExploreE3Single()")
          e4=block("async function runExploreE4Queue()","function explorePrOptions")
          render=block("function renderExplore()","async function refreshExplore")
          runner=block("function renderRunnerState()","function renderUI()")

          # E4 must reuse the proven E3 building core, not clone action logic.
          assert "const result=await exploreE3ProcessOne(candidate,settings)" in e4
          assert "exploreE3Reconcile(String(candidate.id||''),'explore:e4-final-'+" in e4
          assert "await hkRunner.waitIfPaused()" in e4
          assert "await exploreE4BetweenDelay(settings)" in e4

          # Explicit bounded queue.
          assert "runLimit:[1,5,10,15,20].includes(Number(x.runLimit))" in s
          assert "const queue=limit===0?source:source.slice(0,Math.max(1,limit||1));" in e4
          assert 'id="hk-ex-run-limit"' in render
          for v in ["value=\"1\"","value=\"5\"","value=\"10\"","value=\"15\"","value=\"20\"","value=\"all\""]:
              assert v in render
          assert 'id="hk-ex-run-queue"' in render

          # Stop behavior: resource exhaustion / failure stops the queue.
          assert "result.status==='resources_exhausted'?'skipped':'error'" in e4
          assert "break;" in e4
          assert "hkRunner.fail(new Error(failed))" in e4

          # Ordinary skip can continue.
          assert "result.status==='skipped'" in e4
          assert "hkRunner.advance" in e4

          # Runner UI supports E4 and overall progress.
          assert "Explore · E4" in s
          assert "(buildingsRun||exploreRun)&&state.total" in runner
          assert "const exploreTitle=[" in s and "Explore · E4" in s

          # E3 behavior remains present.
          for marker in [
              "explore-e3-single-20260920-r9-runner",
              "explore-e3-speed-20260921-r1",
              "/player/building/fast_completion",
              "/player/battle/fast",
              "/player/building/remort?building_id=",
              "/player/building/fast_remort",
              "exploreE3Reconcile(buildingId,reason)",
          ]:
              assert marker in s

          # Protected work.
          for marker in [
              "buildings-native-sync-20260921-r1",
              "maps-shared-runtime-20260921-r7-safe5",
              "const HK_MAP_READ_CONCURRENCY = 5;",
              "AUTH_PASSIVE_SAFETY_R1",
          ]:
              assert marker in s
          assert "PUBLIC_COLLECTOR_AUTH_PROBE_URL" not in s
          assert "/api/v1/public-collector/auth-probe" not in s

          print("e4_reuses_e3_core=PASS")
          print("e4_queue_limits_1_5_10_15_20_all=PASS")
          print("e4_default_limit_1=PASS")
          print("e4_sequential_queue=PASS")
          print("e4_pause_stop=PASS")
          print("e4_failure_stop=PASS")
          print("e4_between_building_delay=PASS")
          print("e4_runner_progress=PASS")
          print("protected_e3_buildings_maps_auth=PASS")
          print("EXPLORE_E4_QUEUE_R1_PREDEPLOY=PASS")
          PY
