name: Force Minimum Userscript 1.17.8

on:
  push:
    paths:
      - 'deploy/topking/min-userscript-1-17-8-trigger.txt'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch fresh live server and release
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/server.py | awk '{print $1}' > /tmp/server-source.sha
          python3 -m py_compile /tmp/server.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq 'PUBLIC_SNAPSHOT_SERVER_ONLY_R3' /tmp/server.py
          grep -Fq 'PUBLIC_RATINGS_SERVER_ONLY_R3' /tmp/server.py
          grep -Fq '// @version      1.17.8' /tmp/HamsterKingMobile.user.js
          grep -Fq 'PRELOGIN_ZERO_GAME_API_R1' /tmp/HamsterKingMobile.user.js
          grep -Fq 'explore-e3-single-20260920-r9-runner' /tmp/HamsterKingMobile.user.js
          grep -Fq 'const HK_MAP_READ_CONCURRENCY = 5;' /tmp/HamsterKingMobile.user.js

      - name: Build minimum-version candidate
        run: |
          set -euo pipefail
          python3 deploy/topking/patch_min_userscript_1_17_8.py /tmp/server.py
          python3 -m py_compile /tmp/server.py
          grep -Fq 'FORCE_SAFE_USERSCRIPT_1_17_8_R1' /tmp/server.py
          grep -Fq 'MIN_SCRIPT_VERSION = "1.17.8"' /tmp/server.py

      - name: Upload and race-safe install
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/server.py root@89.125.1.71:/tmp/server.min-1.17.8.py
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            deploy/topking/install_min_userscript_1_17_8.py root@89.125.1.71:/tmp/install_min_userscript_1_17_8.py
          expected="$(cat /tmp/server-source.sha)"
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 "python3 /tmp/install_min_userscript_1_17_8.py '$expected'" \
            > /tmp/min-userscript-install.txt
          cat /tmp/min-userscript-install.txt
          grep -Fq 'min_userscript_1_17_8_install=PASS' /tmp/min-userscript-install.txt

      - name: Verify forced update behavior
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 - <<"PY"
          import importlib.util
          spec=importlib.util.spec_from_file_location("hk_license_verify","/opt/hamsterking-license/server.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.MIN_SCRIPT_VERSION=="1.17.8", mod.MIN_SCRIPT_VERSION
          assert mod.release_version()=="1.17.8", mod.release_version()
          old=mod.release_manifest("1.17.7","")
          safe=mod.release_manifest("1.17.8","")
          assert old["required"] is True, old
          assert old["available"] is True, old
          assert old["latest_version"]=="1.17.8", old
          assert safe["required"] is False, safe
          assert safe["available"] is False, safe
          print("minimum_version=1.17.8")
          print("old_1_17_7_required=yes")
          print("safe_1_17_8_required=no")
          print("release_latest=1.17.8")
          PY
          grep -Fq FORCE_SAFE_USERSCRIPT_1_17_8_R1 /opt/hamsterking-license/server.py
          systemctl is-active --quiet hamsterking-license.service
          ' > /tmp/min-userscript-verify.txt
          cat /tmp/min-userscript-verify.txt

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/server.py /tmp/HamsterKingMobile.user.js /tmp/server-source.sha /tmp/min-userscript-install.txt /tmp/min-userscript-verify.txt
