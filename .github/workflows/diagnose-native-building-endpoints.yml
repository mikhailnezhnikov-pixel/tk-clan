name: Diagnose Native Building Mutation Endpoints

on:
  push:
    paths:
      - 'deploy/topking/building-native-endpoints-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public game bundles read-only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, json

          base='https://app.hamsterking.games/'
          version_url='https://cdn-prod-route-service.hwgame.cloud/version'
          route=json.loads(urllib.request.urlopen(version_url,timeout=20).read().decode('utf-8','ignore'))
          build=route.get('client_build')
          page='app.html' if build is None else f'app_{int(build)}.html'
          page_url=urllib.parse.urljoin(base,page)
          print('client_build='+str(build))
          print('page='+page)
          html=urllib.request.urlopen(page_url,timeout=20).read().decode('utf-8','ignore')
          client_match=re.search(r'client:"([^"]+)"',html)
          client_base=client_match.group(1) if client_match else base
          print('client_asset_base='+client_base)
          candidates=[]
          candidates += re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          candidates += re.findall(r'<link[^>]+href=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',html,re.I)
          candidates += re.findall(r'["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',html,re.I)
          candidates += re.findall(r'([^\s"\']+/assets/[^\s"\']+\.js)',html,re.I)
          urls=[]
          for src in candidates:
              if str(src).startswith('/assets/'):
                  url=urllib.parse.urljoin(client_base,str(src).lstrip('/'))
              else:
                  url=urllib.parse.urljoin(base,src)
              if url not in urls: urls.append(url)
          print('html_size='+str(len(html)))
          print('html_preview='+re.sub(r'\s+',' ',html)[:5000])
          print('asset_candidates='+str(len(candidates)))
          print('bundle_count='+str(len(urls)))
          for url in urls:
              print('bundle_url='+url)
          if not urls:
              for extra in ['manifest.json','asset-manifest.json','vite-manifest.json','service-worker.js','sw.js']:
                  try:
                      body=urllib.request.urlopen(urllib.parse.urljoin(base,extra),timeout=10).read().decode('utf-8','ignore')
                  except Exception:
                      continue
                  for src in re.findall(r'["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',body,re.I):
                      url=urllib.parse.urljoin(base,src)
                      if url not in urls: urls.append(url)
              print('bundle_count_after_manifests='+str(len(urls)))

          # Crawl direct and dynamically imported JS chunks from the current client.
          queue=list(urls)
          seen=set()
          bodies={}
          while queue and len(seen)<350:
              url=queue.pop(0)
              if url in seen: continue
              seen.add(url)
              try:
                  body=urllib.request.urlopen(url,timeout=30).read().decode('utf-8','ignore')
              except Exception as exc:
                  print('bundle_fetch_error='+url+' :: '+str(exc)[:180])
                  continue
              bodies[url]=body
              refs=set()
              refs.update(re.findall(r'["\']([^"\']+\.js(?:\?[^"\']*)?)["\']',body,re.I))
              refs.update(re.findall(r'([^\s"\']+/assets/[^\s"\']+\.js)',body,re.I))
              for ref in refs:
                  child=urllib.parse.urljoin(url,ref)
                  if (child.startswith(base) or child.startswith(client_base)) and child not in seen and child not in queue:
                      queue.append(child)

          print('crawled_js='+str(len(bodies)))
          needles=[
              '/player/building',
              'favorite/add',
              'favorite/remove',
              'favorite',
              'player_active_building',
              'max_buildings',
              'building_id',
              'next_tier_level',
              'chosen_tier',
          ]
          found=[]
          for url,body in bodies.items():
              low=body.lower()
              if 'building' not in low and 'favorite' not in low:
                  continue
              hits_any=False
              literals=sorted(set(re.findall(r'["\']([^"\']{1,220})["\']',body)))
              interesting=[]
              for value in literals:
                  lv=value.lower()
                  if ('building' in lv or 'favorite' in lv) and (
                      '/' in value or 'player' in lv or 'active' in lv or 'add' in lv or 'remove' in lv or 'slot' in lv or 'tier' in lv
                  ):
                      interesting.append(value)
              if interesting:
                  hits_any=True
                  print('bundle_match='+url.rsplit('/',1)[-1][:120])
                  for value in interesting[:120]:
                      print('literal='+value[:220])
              for needle in needles:
                  start_i=0
                  hits=0
                  while hits<12:
                      i=body.find(needle,start_i)
                      if i<0: break
                      hits_any=True
                      frag=body[max(0,i-260):i+520].replace('\n',' ')
                      frag=re.sub(r'\s+',' ',frag)
                      print('context_'+re.sub(r'[^a-z0-9]+','_',needle.lower()).strip('_')+'='+frag[:820])
                      start_i=i+len(needle)
                      hits+=1
              if hits_any:
                  found.append(url)
          print('matched_bundles='+str(len(found)))
          if not found:
              raise SystemExit('no building/favorite semantics found in crawled bundles')
          print('NATIVE_BUILDING_ENDPOINT_DIAGNOSTIC=PASS')
          PY
