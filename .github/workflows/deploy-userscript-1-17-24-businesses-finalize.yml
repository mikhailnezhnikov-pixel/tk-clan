name: Deploy Userscript 1.17.24 Businesses Finalize

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-24-businesses-finalize-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.24" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r27-businesses-runner-canon" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-runner-canon-20260921-r1" /tmp/HamsterKingMobile.user.js
          cmp -s /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          echo "LIVE_BASELINE_INPUT=PASS"

      - name: Apply Businesses finalize hotfix
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_businesses_finalize_1_17_24.py
          python3 deploy/topking/patch_businesses_finalize_1_17_24.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.24" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r28-businesses-finalize" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-finalize-single-snapshot-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "business-final-check" /tmp/HamsterKingMobile.user.js
          grep -Fq "businessesTitle?6000:1800" /tmp/HamsterKingMobile.user.js
          echo "BUSINESSES_FINALIZE_CANDIDATE=PASS"

      - name: Static Businesses completion verification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')
          checks={
            'version_unchanged':"// @version      1.17.24" in s and "const BUILD_VERSION = '1.17.24';" in s,
            'core_r28':"core-20260921-r28-businesses-finalize" in s,
            'marker':"businesses-finalize-single-snapshot-20260921-r1" in s,
            'processed_progress':"let processedInsertRows = 0;" in s,
            'final_step':"Проверяю результат" in s and "Verifying result" in s,
            'single_snapshot':"hkAuthoritativePlayerRead('business-final-check')" in s,
            'targeted_recovery':"value => businessSlotIsActive(value, id), 3" in s,
            'completion_visible':"businessesTitle?6000:1800" in s,
            'runner_canon_preserved':"businesses-runner-canon-20260921-r1" in s,
            't4_t6_guard_preserved':"function businessRemovalAllowed(" in s and "assertBusinessRemovalPlanAllowed" in s,
            'catalog_preserved':"businesses-catalog-readonly-20260921-r1" in s,
            'explore_preserved':"explore-production-ui-20260921-r1" in s,
            'buildings_preserved':"buildings-native-sync-20260921-r1" in s,
            'maps_preserved':"maps-shared-runtime-20260921-r7-safe5" in s,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(f"{k}={'PASS' if v else 'FAIL'}")
          if failed: raise SystemExit("failed checks: "+", ".join(failed))
          block=s[s.index("  async function executeBusinessPlan()"):s.index("  function prepareOriginalBusinessRestore()")]
          assert "value => businessSlotIsActive(value, id), 6" not in block
          print("legacy_per_slot_final_loop=REMOVED")
          PY

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.24.finalize.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.1.17.24.finalize.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.24.finalize.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.1.17.24.finalize.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?businesses-finalize=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.24" /tmp/public.js
          grep -Fq "core-20260921-r28-businesses-finalize" /tmp/public.js
          grep -Fq "businesses-finalize-single-snapshot-20260921-r1" /tmp/public.js
          echo "PUBLIC_USERSCRIPT_1_17_24_FINALIZE=PASS"

      - name: Sync verified baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          {
            echo "USERSCRIPT_1_17_24_BUSINESSES_FINALIZE=PASS"
            echo "version=1.17.24"
            echo "core=core-20260921-r28-businesses-finalize"
            echo "final_check_single_snapshot=PASS"
            echo "legacy_per_slot_final_loop=REMOVED"
            echo "progress_after_last_insert=100_PERCENT"
            echo "completion_message_visibility=6_SECONDS"
            echo "t4_t6_removal_guard=PRESERVED"
            echo "runner_canon=PRESERVED"
            echo "catalog_read_only=PRESERVED"
            echo "explore_live_pass=PRESERVED"
            echo "buildings_live_pass=PRESERVED"
            echo "maps_safe5=PRESERVED"
          } > audit/hk-userscript-1-17-24-businesses-finalize-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-24-businesses-finalize-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "hotfix: finalize Businesses runner correctly"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.1.17.24.finalize.user.js /tmp/public.js
