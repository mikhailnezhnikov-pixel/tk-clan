name: Reconstruct Uploaded Kokkaras Donor

on:
  push:
    paths:
      - 'reference/topking/reconstruct-upload-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-kokkaras-reference
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact uploaded revision
        run: |
          set -euo pipefail
          mkdir -p /tmp/kokkaras reference/topking
          curl -fsSL --retry 3 --connect-timeout 20 \
            'https://kokkaras.com/hk_maps/panel.js' \
            -o /tmp/kokkaras/live.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/kokkaras/live.js')
          s=p.read_text(encoding='utf-8')
          replacement='const SERVER_ACCESS = {"playerId":"552583086","isAdmin":false,"features":["daily_tasks","businesses","pits","area_boss","clan_wars","explore","hamsters","rumors","fairs","fair_default","buildings","buildings_event","businesses_beta","neighborhood_battles"]};'
          s2,n=re.subn(r'^const SERVER_ACCESS = .*?;$',replacement,s,count=1,flags=re.M)
          if n!=1:
              raise SystemExit(f'SERVER_ACCESS replacement count={n}')
          Path('/tmp/kokkaras/reconstructed.js').write_text(s2,encoding='utf-8')
          PY

          expected='28c3104020ecb7f54d0d51a72d067404d0176bc069d59fcca417d66817d1fcf1'
          actual="$(sha256sum /tmp/kokkaras/reconstructed.js | awk '{print $1}')"
          raw="$(sha256sum /tmp/kokkaras/live.js | awk '{print $1}')"
          echo "LIVE_SHA=$raw"
          echo "RECONSTRUCTED_SHA=$actual"
          echo "EXPECTED_UPLOAD_SHA=$expected"
          test "$actual" = "$expected"
          node --check /tmp/kokkaras/reconstructed.js

      - name: Sanitize only player identity and preserve donor mechanics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/kokkaras/reconstructed.js')
          s=p.read_text(encoding='utf-8')
          s2,n=re.subn(
              r'^const SERVER_ACCESS = \{"playerId":"[^"]*"',
              'const SERVER_ACCESS = {"playerId":"[REDACTED]"',
              s,count=1,flags=re.M
          )
          if n!=1:
              raise SystemExit(f'playerId redaction count={n}')
          Path('/tmp/kokkaras/sanitized.js').write_text(s2,encoding='utf-8')
          PY

          node --check /tmp/kokkaras/sanitized.js
          version='5.3.22-ui-icons-pit-dim'
          original_sha='28c3104020ecb7f54d0d51a72d067404d0176bc069d59fcca417d66817d1fcf1'
          sanitized_sha="$(sha256sum /tmp/kokkaras/sanitized.js | awk '{print $1}')"
          short="${original_sha:0:12}"
          immutable="kokkaras-panel.${version}-${short}.sanitized.js"

          cp /tmp/kokkaras/sanitized.js reference/topking/donor.current.js
          cp /tmp/kokkaras/sanitized.js "reference/topking/${immutable}"

          cat > reference/topking/REFERENCE.json <<EOF
          {
            "schema": "hk-donor-reference-v1",
            "name": "Kokkaras HK Control Panel",
            "source_url": "https://kokkaras.com/hk_maps/panel.js",
            "version": "${version}",
            "original_uploaded_sha256": "${original_sha}",
            "repository_sha256": "${sanitized_sha}",
            "current_file": "reference/topking/donor.current.js",
            "immutable_file": "reference/topking/${immutable}",
            "role": "primary donor/reference for copied HK mechanics, API behavior, calculations and flows",
            "privacy_transform": "Only SERVER_ACCESS.playerId is replaced with [REDACTED]; mechanics are unchanged.",
            "verified_reconstruction": true,
            "captured_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cat > reference/topking/REFERENCE_STATUS.txt <<EOF
          name=Kokkaras HK Control Panel
          version=${version}
          original_uploaded_sha256=${original_sha}
          repository_sha256=${sanitized_sha}
          source=https://kokkaras.com/hk_maps/panel.js
          reconstructed_upload_match=PASS
          player_id_redacted=PASS
          syntax=ok
          EOF

      - name: Commit reference
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/topking
          if ! git diff --cached --quiet; then
            git commit -m "reference: capture verified Kokkaras donor revision"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main || true
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
