name: Deploy TopKing Pits Reward Planner R12

on:
  push:
    paths:
      - 'deploy/topking/pits-reward-planner-r12-trigger.txt'
  workflow_dispatch:

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact Pits r11 live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_DECISION_REV = 'pits-restoration-decision-20260920-r11'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "d2667d1fec05456cdb7e7bba0f0da2854d3fccf6275cf5df991b44942d05e52c"

      - name: Apply reward planner core r12
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_pits_reward_planner_r12_1174.py
          python3 deploy/topking/patch_pits_reward_planner_r12_1174.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_REWARD_REV = 'pits-reward-planner-core-20260920-r12'" /tmp/HamsterKingMobile.user.js
          grep -Fq "function pitCanonLoadRewardLive" /tmp/HamsterKingMobile.user.js
          grep -Fq "data-pit-reward-target" /tmp/HamsterKingMobile.user.js
          grep -Fq 'data-pit-daily-base-runs' /tmp/HamsterKingMobile.user.js
          grep -Fq "data-pit-reward-strategy" /tmp/HamsterKingMobile.user.js
          grep -Fq "function pitCanonRewardPlan(row,minScore)" /tmp/HamsterKingMobile.user.js
          echo "PATCHED_SHA=$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.pits-r12.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.pits-r12.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.pits-r12.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.pits-r12.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?pits-r12=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "HK_PITS_REWARD_REV = 'pits-reward-planner-core-20260920-r12'" /tmp/public.js
          echo "PUBLIC_SHA=$(sha256sum /tmp/public.js | awk '{print $1}')"
          echo "PITS_REWARD_PLANNER_R12=PASS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
