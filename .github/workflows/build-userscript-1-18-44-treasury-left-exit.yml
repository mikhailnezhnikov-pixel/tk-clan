name: Build Userscript 1.18.44 Treasury Left Path Exit Recovery

on:
  push:
    paths:
      - 'deploy/topking/patch_treasury_left_path_exit_recovery_1_18_44.py'
      - '.github/workflows/build-userscript-1-18-44-treasury-left-exit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.43" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-skip-run9-20260927-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_treasury_left_path_exit_recovery_1_18_44.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.44" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasury-left-path-exit-recovery-20260927-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasury-left-path-selected" /tmp/HamsterKingMobile.user.js
          grep -Fq "leave-modal-confirm-10-" /tmp/HamsterKingMobile.user.js
          grep -Fq "tick-preflight" /tmp/HamsterKingMobile.user.js

          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')

          choice=s[s.index('function autoMapTreasuryChoice()'):s.index('function autoMapTreasuryChestRows()')]
          assert ".sort((a,b)=>a.x-b.x" in choice
          assert "treasury-left-path-selected" in choice

          recover=s[s.index('async function autoMapRecoverOpenLeaveModal'):s.index('function autoMapModalPrimaryButton')]
          assert "autoMapLeaveConfirmButton(modal,10)" in recover
          assert "leave-modal-confirm-10-" in recover

          direct=s[s.index('async function autoMapDirectTreasuryExit()'):s.index('function autoMapStateFingerprint()')]
          assert "autoMapRecoverOpenLeaveModal('treasury-preopen')" in direct
          assert "treasury-leave-confirm-direct-10" in direct

          tick=s[s.index("async function runAutoMapTick"):s.index("function setAutoMapEnabled",s.index("async function runAutoMapTick"))]
          assert "autoMapLeaveModalRoot()" in tick
          assert "autoMapRecoverOpenLeaveModal('tick-preflight')" in tick
          print("TREASURY_LEFT_PATH_EXIT_RECOVERY_STATIC_SMOKE=PASS")
          PY

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.44.treasury-left-exit.candidate.user.js
          audit=audit/hk-userscript-1-18-44-treasury-left-exit-predeploy.txt
          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.43':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.43',
              'target_version':'1.18.44',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.44.treasury-left-exit.candidate.user.js',
              'primary_marker':'treasury-left-path-exit-recovery-20260927-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-44-treasury-left-exit-live-status.txt',
              'commit_message':'fix: deploy left treasury path and leave-modal recovery in userscript 1.18.44',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          {
            echo "USERSCRIPT_1_18_44_TREASURY_LEFT_EXIT_PREDEPLOY=PASS"
            echo "source_version=1.18.43"
            echo "target_version=1.18.44"
            echo "treasury_route=LEFTMOST_VISIBLE"
            echo "leave_modal_preopen=RECOVER"
            echo "leave_confirm_cost=10"
            echo "leave_reclick=DISABLED"
            echo "syntax=PASS"
            echo "static_smoke=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.44 treasury left exit"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
