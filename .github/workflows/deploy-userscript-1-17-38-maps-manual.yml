name: Deploy Userscript 1.17.38 Manual Map Scan

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-38-maps-manual-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Validate candidate
        run: |
          set -euo pipefail
          cp deploy/topking/HamsterKingMobile.1.17.38.maps-manual-scan.candidate.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.38" /tmp/HamsterKingMobile.user.js
          grep -Fq "maps-manual-scan-only-20260923-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "growth-hamster-nuts-canon-20260923-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-snapshot-numeric-player-id-20260923-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "auto-routines-in-today-20260922-r3" /tmp/HamsterKingMobile.user.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')
          assert "if (contribute && Date.now()-Number(load().lastMapContribution || 0)>86400000) await submitOwnedMapAreas(true);" not in s
          assert "Date.now()-lastByPlayer>86400000&&!initialMapResearchAttempted.has(playerId)" not in s
          assert s.count("submitOwnedMapAreas(true)") == 1
          i=s.index("submitOwnedMapAreas(true)")
          assert "#hk-map-scan" in s[max(0,i-250):i+250]
          assert "if (key === 'maps') {\n          playerDocument = await apiJson('/player/me','POST');\n          await loadMapIndex(false);" in s
          print('MAPS_MANUAL_SCAN_STATIC=PASS')
          PY

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/live.user.js
          node --check /tmp/live.user.js
          grep -Fq "// @version      1.17.37" /tmp/live.user.js
          grep -Fq "growth-hamster-nuts-canon-20260923-r1" /tmp/live.user.js
          grep -Fq "clan-snapshot-numeric-player-id-20260923-r1" /tmp/live.user.js
          cmp -s /tmp/live.user.js baseline/topking/HamsterKingMobile.current.user.js
          sha256sum /tmp/live.user.js | awk '{print $1}' > /tmp/source.sha

      - name: Race-safe deploy
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/source.sha)"
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.38.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 "SOURCE_SHA='$source_sha' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(sha256sum /opt/hamsterking-license/HamsterKingMobile.user.js | awk '{print $1}')" = "$SOURCE_SHA"
          node --check /tmp/HamsterKingMobile.1.17.38.user.js
          stamp="$(date +%Y%m%d-%H%M%S)"
          cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.38.$stamp"
          install -m 0644 /tmp/HamsterKingMobile.1.17.38.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
          printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.17.38\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
          systemctl daemon-reload
          systemctl restart hamsterking-license.service
          systemctl is-active --quiet hamsterking-license.service
          REMOTE

      - name: Verify public exact match
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://hk-license.89.125.1.71.sslip.io/panel.js?maps-manual=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.38" /tmp/public.js
          grep -Fq "maps-manual-scan-only-20260923-r1" /tmp/public.js
          echo "PUBLIC_1_17_38_MAPS_MANUAL_SCAN=PASS"

      - name: Sync baseline and audit
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          printf "%s\n" \
            "USERSCRIPT_1_17_38_MAPS_MANUAL_SCAN=PASS" \
            "version=1.17.38" \
            "base=1.17.37" \
            "automatic_district_research=REMOVED" \
            "24h_map_contribution=REMOVED" \
            "manual_scan_button=PRESERVED" \
            "explicit_submit_owned_map_areas_true_calls=1" \
            "growth_1_17_37=PRESERVED" \
            "ci_game_mutations=NONE" \
            "user_browser_check=PENDING" \
            > audit/hk-userscript-1-17-38-maps-manual-status.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/HK_STAGE2_CHECKPOINT.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('- userscript: 1.17.37','- userscript: 1.17.38')
          if 'Maps auto-research regression hotfix 1.17.38' not in s:
              s += '\n\n## Maps regression hotfix\n\n- Maps auto-research regression hotfix 1.17.38: TECHNICAL LIVE PASS; user check pending.\n- Opening Maps is read-only; full district scan is manual-only via scan button.\n'
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-38-maps-manual-status.txt audit/HK_STAGE2_CHECKPOINT.md
          if ! git diff --cached --quiet; then
            git commit -m "fix: make district research manual-only in userscript 1.17.38"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/live.user.js /tmp/public.js
