name: Check Userscript 1.17.43 Hamsters Kokkaras Auth State

on:
  push:
    paths:
      - '.github/workflows/check-userscript-1-17-43-hamsters-kokkaras-auth-state.yml'
      - 'deploy/topking/HamsterKingMobile.1.17.43.hamsters-kokkaras-auth-state.candidate.user.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate
        run: |
          set -euo pipefail
          f=deploy/topking/HamsterKingMobile.1.17.43.hamsters-kokkaras-auth-state.candidate.user.js
          node --check "$f"
          grep -Fq "// @version      1.17.43" "$f"
          grep -Fq "const BUILD_VERSION = '1.17.43';" "$f"
          grep -Fq "hamsters-kokkaras-auth-state-20260923-r3" "$f"
          grep -Fq "hamsters-kokkaras-live-state-20260923-r2" "$f"
          grep -Fq "hamsters-kokkaras-cost-parity-20260923-r1" "$f"
          grep -Fq "treasure-guide-selective-extract-20260923-r2" "$f"
          grep -Fq "maps-manual-scan-only-20260923-r1" "$f"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('deploy/topking/HamsterKingMobile.1.17.43.hamsters-kokkaras-auth-state.candidate.user.js').read_text(encoding='utf-8')
          assert 'function growthCachedAccountState()' in s
          assert 'function growthUsableAccountState(state)' in s
          assert "void growthLoadLive({force:false,loadShop:true,loadConfig:needsConfig,silent:true});" in s
          assert "state=await growthLoadLive({force:false,loadShop:true,loadConfig:settings.excludeCurrentEventHamsters,silent:true});" in s
          assert "throw growthLastLoadError||new Error" in s
          assert "growth-live-cache-hit" in s
          assert "growth-live-error" in s
          assert "box.classList.toggle('hamsters-run',hamstersRun)" in s
          assert "treasure-guide-selective-extract-20260923-r2" in s
          assert s.count('submitOwnedMapAreas(true)') == 1
          i=s.index('submitOwnedMapAreas(true)')
          assert '#hk-map-scan' in s[max(0,i-250):i+250]
          print('USERSCRIPT_1_17_43_HAMSTERS_AUTH_STATE_STATIC=PASS')
          PY