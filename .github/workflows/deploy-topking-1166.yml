name: Deploy TopKing 1.16.6 Rumors

on:
  push:
    paths:
      - 'deploy/topking/stage2g-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch verified live client and backend
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          grep -q '^// @version      1.16.5$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2F_RUNNER_REV = 'stage2f-clan-20260919-r1'" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          python3 -m py_compile /tmp/server.py

      - name: Build and validate Rumors migration
        run: |
          set -euo pipefail
          python3 deploy/topking/stage2g_rumors_patch.py
          python3 deploy/topking/stage2g_rumors_server_patch.py
          grep -q '^// @version      1.16.6$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2G_RUMORS_REV = 'stage2g-rumors-20260919-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "apiJson('/rumors/search','POST'" /tmp/HamsterKingMobile.user.js
          grep -Fq 'elif path == "/api/v1/rumors/today":' /tmp/server.py
          grep -Fq 'if path == "/admin/rumors/publish":' /tmp/server.py
          node --check /tmp/HamsterKingMobile.user.js
          python3 -m py_compile /tmp/server.py

      - name: Deploy client and backend
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/server.py root@89.125.1.71:/tmp/hamsterking-server.py
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -euo pipefail;
            stamp="$(date +%Y%m%d-%H%M%S)";
            node --check /tmp/HamsterKingMobile.user.js;
            python3 -m py_compile /tmp/hamsterking-server.py;
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp";
            cp -a /opt/hamsterking-license/server.py "/opt/hamsterking-license/server.py.bak.$stamp";
            install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js;
            install -m 0644 /tmp/hamsterking-server.py /opt/hamsterking-license/server.py;
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.16.6\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf;
            systemctl daemon-reload;
            systemctl restart hamsterking-license.service;
            systemctl is-active --quiet hamsterking-license.service;
            sleep 2;
            grep -q "^// @version      1.16.6$" /opt/hamsterking-license/HamsterKingMobile.user.js;
            grep -q "stage2g-rumors-server-20260919-r1" /opt/hamsterking-license/server.py;
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js;
            python3 -m py_compile /opt/hamsterking-license/server.py'

      - name: Round trip verify and record
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/live-client.js
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/live-server.py
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/live-client.js
          cmp -s /tmp/server.py /tmp/live-server.py
          node --check /tmp/live-client.js
          python3 -m py_compile /tmp/live-server.py
          client_sha="$(sha256sum /tmp/live-client.js | awk '{print $1}')"
          server_sha="$(sha256sum /tmp/live-server.py | awk '{print $1}')"
          mkdir -p audit
          {
            echo "version=1.16.6"
            echo "stage2g=stage2g-rumors-20260919-r1"
            echo "server_stage2g=stage2g-rumors-server-20260919-r1"
            echo "modules=rumors-route,today-rumors,rumors-admin"
            echo "client_syntax=ok"
            echo "backend_syntax=ok"
            echo "roundtrip=identical"
            echo "client_sha256=$client_sha"
            echo "server_sha256=$server_sha"
          } > audit/hk-1166-live-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-1166-live-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Verify live TopKing 1.16.6 Rumors"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/server.py /tmp/hamsterking-server.py /tmp/live-client.js /tmp/live-server.py
