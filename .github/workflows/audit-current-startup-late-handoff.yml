name: Audit Current Startup Late Handoff

on:
  push:
    paths:
      - '.github/workflows/audit-current-startup-late-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-current-startup-late-handoff
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract current startup/auth blocks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('baseline/topking/HamsterKingMobile.current.user.js').read_text(encoding='utf-8')
          out=[]
          needles=[
              'let bootstrapProblem',
              'function showBootstrap',
              'function setBootstrap',
              'function bootstrapLateGameConnection',
              'async function bootstrapLateGameConnection',
              'function hkTryLateLoginHandoff',
              'async function hkTryLateLoginHandoff',
              'function startAfterNativeGameLogin',
              'async function startAfterNativeGameLogin',
              'function hkNativeGameLoginReady',
              'function currentGameBearer',
              'function refreshStoredGameAuthorization',
              'async function ensureGameAuthorization',
              'function gameApiRateLimitError',
          ]
          seen=set()
          for needle in needles:
              idx=src.find(needle)
              if idx<0 or idx in seen: continue
              seen.add(idx)
              a=max(0,src.rfind('\n',0,max(0,idx-1800)))
              b=min(len(src),idx+6500)
              out.append('\n===== '+needle+' =====\n')
              out.append(src[a:b])
          Path('audit/hk-current-startup-late-handoff-snippet.txt').write_text(''.join(out),encoding='utf-8')
          PY

      - name: Commit audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-current-startup-late-handoff-snippet.txt
          if ! git diff --cached --quiet; then
            git commit -m "audit: capture current startup late handoff"
            git push origin HEAD:main
          fi
