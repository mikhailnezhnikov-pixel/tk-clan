name: Diagnose map localization duplicates

on:
  push:
    paths:
      - 'deploy/topking/map-localization-duplicates-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Read-only duplicate audit
        run: |
          set -euo pipefail
          cat > /tmp/audit-map-dupes.py <<'PY'
          import sqlite3,json,collections,re,unicodedata
          DB='/var/lib/hamsterking-license/licenses.db'
          db=sqlite3.connect('file:'+DB+'?mode=ro',uri=True); db.row_factory=sqlite3.Row

          def norm(s):
              s=unicodedata.normalize('NFKD',str(s or '')).encode('ascii','ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+','',s)

          areas=[dict(r) for r in db.execute("""SELECT area_id,city_id,city_name,x,y,expected_buildings,invest_count,last_seen
                                                FROM map_areas ORDER BY city_id,x,y,area_id""")]
          by_exact=collections.defaultdict(list)
          by_coords=collections.defaultdict(list)
          for a in areas:
              by_exact[(str(a['city_id']),a['x'],a['y'])].append(a)
              by_coords[(a['x'],a['y'])].append(a)

          candidates=[]
          seen=set()
          groups=[g for g in by_exact.values() if len(g)>1]
          # Also include same coordinates with different labels if building overlap is strong.
          for g in by_coords.values():
              if len(g)>1:
                  ids=tuple(sorted(a['area_id'] for a in g))
                  if ids not in seen:
                      groups.append(g); seen.add(ids)

          for g in groups:
              ids=tuple(sorted(a['area_id'] for a in g))
              if ids in seen and len({a['city_id'] for a in g})==1:
                  pass
              seen.add(ids)
              sets={}
              stats={}
              for a in g:
                  aid=a['area_id']
                  rows=[dict(r) for r in db.execute("""SELECT building_id,room_count,has_events,opened,is_invest,last_seen
                                                       FROM map_buildings WHERE area_id=?""",(aid,))]
                  sets[aid]={r['building_id'] for r in rows}
                  stats[aid]={
                    'total':len(rows),
                    'known':sum(r['room_count'] is not None for r in rows),
                    'opened':sum(bool(r['opened']) for r in rows),
                    'event_known':sum(bool(r['has_events']) for r in rows),
                    'known_ids':[r['building_id'] for r in rows if r['room_count'] is not None],
                  }
              pair=[]
              for i,a in enumerate(g):
                  for b in g[i+1:]:
                      A=sets[a['area_id']]; B=sets[b['area_id']]
                      inter=len(A&B); union=len(A|B)
                      pair.append({
                        'a':a['area_id'],'b':b['area_id'],
                        'intersection':inter,'union':union,
                        'jaccard':round(inter/union,4) if union else 0,
                        'a_only':len(A-B),'b_only':len(B-A),
                        'a_known_unique':len(set(stats[a['area_id']]['known_ids'])-set(stats[b['area_id']]['known_ids'])),
                        'b_known_unique':len(set(stats[b['area_id']]['known_ids'])-set(stats[a['area_id']]['known_ids'])),
                      })
              # restrict output to plausible duplicates
              plausible=(len({a['city_id'] for a in g})==1 and len({(a['x'],a['y']) for a in g})==1) or any(p['jaccard']>=0.75 for p in pair)
              if plausible:
                  candidates.append({'areas':g,'stats':stats,'pairs':pair})
          print('DUPLICATE_AUDIT_JSON='+json.dumps(candidates,ensure_ascii=False,separators=(',',':')))
          print('DUPLICATE_GROUPS',len(candidates))
          for c in candidates:
              print('GROUP',[(a['area_id'],a['city_id'],a['city_name'],a['x'],a['y']) for a in c['areas']])
              print('STATS',c['stats'])
              print('PAIRS',c['pairs'])
          # Exact building-set fingerprints reveal the same district even when
          # locale-specific city labels/ids caused separate canonical rows.
          import hashlib
          fps=collections.defaultdict(list)
          for a in areas:
              ids=[r[0] for r in db.execute("SELECT building_id FROM map_buildings WHERE area_id=? ORDER BY building_id",(a['area_id'],))]
              if len(ids)<20: continue
              fp=hashlib.sha256(("\\n".join(ids)).encode()).hexdigest()
              fps[fp].append((a,ids))
          exact=[]
          for fp,rows in fps.items():
              if len(rows)<2: continue
              # Do not treat FTUE sentinel -1:-1 rows from unrelated cities as a map duplicate.
              real=[r for r in rows if not (r[0]['x']==-1 and r[0]['y']==-1)]
              if len(real)<2: continue
              group=[]
              for a,ids in real:
                  known=db.execute("SELECT COUNT(*) FROM map_buildings WHERE area_id=? AND room_count IS NOT NULL",(a['area_id'],)).fetchone()[0]
                  links=[dict(r) for r in db.execute("SELECT map_key FROM hk_map_area_links WHERE canonical_area_id=?",(a['area_id'],))]
                  aliases=[dict(r) for r in db.execute("SELECT source_area_id FROM map_area_aliases WHERE canonical_area_id=?",(a['area_id'],))]
                  group.append({'area':a,'buildings':len(ids),'known':known,'links':links,'aliases':aliases})
              exact.append({'fingerprint':fp[:12],'rows':group})
          print('EXACT_BUILDING_SET_DUPES_JSON='+json.dumps(exact,ensure_ascii=False,separators=(',',':')))
          print('EXACT_BUILDING_SET_DUPES',len(exact))
          for g in exact:
              print('EXACT_GROUP',[(r['area']['area_id'],r['area']['city_id'],r['area']['city_name'],r['area']['x'],r['area']['y'],r['buildings'],r['known'],r['links']) for r in g['rows']])

          # High-overlap pairs, including partial scans of the same district.
          area_meta={a['area_id']:a for a in areas}
          area_sets=collections.defaultdict(set)
          owners=collections.defaultdict(list)
          for row in db.execute("SELECT area_id,building_id FROM map_buildings"):
              aid,bid=str(row['area_id']),str(row['building_id'])
              area_sets[aid].add(bid); owners[bid].append(aid)
          shared=collections.Counter()
          for bids in owners.values():
              uniq=sorted(set(bids))
              if len(uniq)>12:  # generic/template ids are not useful duplicate evidence
                  continue
              for i,a in enumerate(uniq):
                  for b in uniq[i+1:]:
                      shared[(a,b)]+=1
          overlaps=[]
          for (a,b),inter in shared.items():
              A=area_sets[a]; B=area_sets[b]
              union=len(A|B)
              jac=inter/union if union else 0
              if inter<20 or jac<0.30: continue
              ma,mb=area_meta.get(a),area_meta.get(b)
              if not ma or not mb: continue
              if (ma['x'],ma['y'])==(-1,-1) and (mb['x'],mb['y'])==(-1,-1): continue
              knownA={r[0] for r in db.execute("SELECT building_id FROM map_buildings WHERE area_id=? AND room_count IS NOT NULL",(a,))}
              knownB={r[0] for r in db.execute("SELECT building_id FROM map_buildings WHERE area_id=? AND room_count IS NOT NULL",(b,))}
              linksA=[r[0] for r in db.execute("SELECT map_key FROM hk_map_area_links WHERE canonical_area_id=?",(a,))]
              linksB=[r[0] for r in db.execute("SELECT map_key FROM hk_map_area_links WHERE canonical_area_id=?",(b,))]
              overlaps.append({
                'a':ma,'b':mb,'intersection':inter,'union':union,'jaccard':round(jac,4),
                'a_total':len(A),'b_total':len(B),'a_known':len(knownA),'b_known':len(knownB),
                'a_known_unique':len(knownA-knownB),'b_known_unique':len(knownB-knownA),
                'a_links':linksA,'b_links':linksB,
              })
          overlaps.sort(key=lambda x:(-x['jaccard'],-x['intersection']))
          print('HIGH_OVERLAP_DUPES_JSON='+json.dumps(overlaps[:120],ensure_ascii=False,separators=(',',':')))
          print('HIGH_OVERLAP_DUPES',len(overlaps))
          for p in overlaps[:120]:
              print('OVERLAP_PAIR',p)

          print('AREA_CITY_NAMES',json.dumps(db.execute("SELECT city_name,COUNT(*) c FROM map_areas GROUP BY city_name ORDER BY city_name").fetchall(),ensure_ascii=False,default=lambda o:list(o)))
          print('CATALOG_CITY_NAMES',json.dumps(db.execute("SELECT city,COUNT(*) c FROM hk_maps_catalog GROUP BY city ORDER BY city").fetchall(),ensure_ascii=False,default=lambda o:list(o)))
          db.close()

          # Ask the live backend for the exact Personal Cabinet rows.
          import importlib.util,sys
          spec=importlib.util.spec_from_file_location('live_server','/opt/hamsterking-license/server.py')
          srv=importlib.util.module_from_spec(spec); spec.loader.exec_module(srv)
          with srv.db_session() as live:
              mgr=live.execute("SELECT telegram_id FROM clan_members WHERE active=1 AND maps_manage=1 ORDER BY updated_at DESC LIMIT 1").fetchone()
          if mgr:
              payload=srv.cabinet_maps({'telegram_id':str(mgr['telegram_id']),'maps_manage':1,'maps_access':1})
              rows=payload.get('maps') or []
              slim=[{k:r.get(k) for k in ('key','website_key','website_keys','area_id','canonical_area_id','source_kind','source_label','city','grid','canonical_grid','buildings','unknown','shared_known','progress','open_url')} for r in rows]
              print('CABINET_MAP_ROWS_JSON='+json.dumps(slim,ensure_ascii=False,separators=(',',':')))
              print('CABINET_MAP_ROWS',len(slim))

              targets=[
                ('bc5a6599-3ddb-4dfd-855e-38c3ceda3165','dc998bea-026b-4ea6-a50d-664d3c9be9bd'),
                ('090d4543-e438-4998-afbf-978028187f83','ef46a07f-2031-4262-a291-d41dd524af8d'),
                ('23d4c221-b89a-459a-af5e-dceaa8fda578','b5f00990-70ae-4ed1-8faa-97b127811af5'),
                ('3fddb622-111f-488f-a70e-b31b563ce145','f87a568c-99db-4fb9-a79b-9ddf1a0c2f7f'),
              ]
              with srv.db_session() as live:
                hasgeom=bool(live.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='hk_map_area_geometry'").fetchone())
                for a,b in targets:
                  rows=[]
                  for aid in (a,b):
                    meta=live.execute("""SELECT area_id,city_id,city_name,x,y,expected_buildings,invest_count,last_seen
                                         FROM map_areas WHERE area_id=?""",(aid,)).fetchone()
                    br=[dict(r) for r in live.execute("""SELECT building_id,room_count,opened,has_events,is_invest,tier,faction,building_type,last_seen
                                                        FROM map_buildings WHERE area_id=? ORDER BY building_id""",(aid,))]
                    aliases=[r[0] for r in live.execute("SELECT source_area_id FROM map_area_aliases WHERE canonical_area_id=?",(aid,))]
                    links=[r[0] for r in live.execute("SELECT map_key FROM hk_map_area_links WHERE canonical_area_id=?",(aid,))]
                    geom=None
                    if hasgeom:
                      g=live.execute("SELECT feature_count,observed_at,length(geometry_json) bytes FROM hk_map_area_geometry WHERE canonical_area_id=?",(aid,)).fetchone()
                      geom=dict(g) if g else None
                    rows.append({'meta':dict(meta) if meta else None,'aliases':aliases,'links':links,'geometry':geom,
                                 'total':len(br),'known':sum(r['room_count'] is not None for r in br),
                                 'known_rows':[r for r in br if r['room_count'] is not None][:80],
                                 'types':dict(collections.Counter(str(r['building_type'] or '') for r in br)),
                                 'factions':dict(collections.Counter(str(r['faction'] or '') for r in br))})
                  A={r[0] for r in live.execute("SELECT building_id FROM map_buildings WHERE area_id=?",(a,))}
                  B={r[0] for r in live.execute("SELECT building_id FROM map_buildings WHERE area_id=?",(b,))}
                  print('TARGET_PAIR_JSON='+json.dumps({'a':a,'b':b,'intersection':len(A&B),'union':len(A|B),'rows':rows},ensure_ascii=False,separators=(',',':')))
          PY
          scp -q -i "$HOME/.ssh/topking" -o StrictHostKeyChecking=accept-new /tmp/audit-map-dupes.py root@89.125.1.71:/tmp/audit-map-dupes.py
          ssh -i "$HOME/.ssh/topking" -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/audit-map-dupes.py; rm -f /tmp/audit-map-dupes.py'
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/audit-map-dupes.py
