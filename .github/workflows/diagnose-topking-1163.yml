name: Diagnose TopKing 1.16.3 Build

on:
  push:
    paths:
      - '.github/workflows/diagnose-topking-1163.yml'
      - 'deploy/topking/1163-diagnostic-trigger.txt'
      - 'deploy/topking/stage2_runner_patch.py'
      - 'deploy/topking/stage2b_runner_patch.py'
      - 'deploy/topking/stage2c_state_patch.py'
      - 'deploy/topking/stage2d_resource_business_patch.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-topking-1163
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js

      - name: Run migration diagnostics
        run: |
          set +e
          : > /tmp/diag.log
          echo "source=$(grep -m1 '^// @version' /tmp/HamsterKingMobile.user.js)" >>/tmp/diag.log
          stage2a=not-run; stage2b=not-run; stage2c=not-run; stage2d=not-run; syntax=not-run

          python3 deploy/topking/stage2_runner_patch.py >>/tmp/diag.log 2>&1
          code=$?
          if [ "$code" = "0" ]; then stage2a=passed; else stage2a=failed; fi

          if [ "$code" = "0" ]; then
            python3 deploy/topking/stage2b_runner_patch.py >>/tmp/diag.log 2>&1
            code=$?
            if [ "$code" = "0" ]; then stage2b=passed; else stage2b=failed; fi
          fi

          if [ "$code" = "0" ]; then
            python3 deploy/topking/stage2c_state_patch.py >>/tmp/diag.log 2>&1
            code=$?
            if [ "$code" = "0" ]; then stage2c=passed; else stage2c=failed; fi
          fi

          if [ "$code" = "0" ]; then
            python3 deploy/topking/stage2d_resource_business_patch.py >>/tmp/diag.log 2>&1
            code=$?
            if [ "$code" = "0" ]; then stage2d=passed; else stage2d=failed; fi
          fi

          if [ "$code" = "0" ]; then
            node --check /tmp/HamsterKingMobile.user.js >>/tmp/diag.log 2>&1
            code=$?
            if [ "$code" = "0" ]; then syntax=ok; else syntax=bad; fi
          fi

          mkdir -p audit
          {
            echo "stage2a=$stage2a"
            echo "stage2b=$stage2b"
            echo "stage2c=$stage2c"
            echo "stage2d=$stage2d"
            echo "syntax=$syntax"
            echo "result_code=$code"
            echo "built=$(grep -m1 '^// @version' /tmp/HamsterKingMobile.user.js || true)"
            echo "--- log tail ---"
            tail -n 80 /tmp/diag.log
          } > audit/hk-1163-diagnostic.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-1163-diagnostic.txt
          git commit -m "Record TopKing 1.16.3 migration diagnostic" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/diag.log
