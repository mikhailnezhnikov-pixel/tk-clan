name: Check TopKing Explore E2

on:
  push:
    paths:
      - 'deploy/topking/explore-e2-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-topking-explore-e2
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Decode patch and fetch current live
        run: |
          set -euo pipefail
          base64 -d deploy/topking/patch_explore_readonly_plan_e2.py.gz.b64 | gzip -d > /tmp/patch_explore_e2.py
          python3 -m py_compile /tmp/patch_explore_e2.py
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "function exploreOwnedAreas()" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function refreshExplore(force=false)" /tmp/HamsterKingMobile.user.js
          ! grep -Fq "explore-readonly-plan-20260920-r1" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/source.sha

      - name: Apply E2 and validate
        run: |
          set -euo pipefail
          python3 /tmp/patch_explore_e2.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_EXPLORE_CANON_REV='explore-readonly-plan-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function exploreScanTarget(" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function exploreBuildPlan(" /tmp/HamsterKingMobile.user.js
          grep -Fq "Запуск появится на E3" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_BUILDINGS_CANON_REV = 'buildings-canon-core-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2J_BOSSES_REV = 'bosses-area-target-20260920-r2'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_REWARD_PICKER_REV = 'pits-reward-picker-20260920-r20'" /tmp/HamsterKingMobile.user.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text()
          a=s.index("  const HK_EXPLORE_CANON_REV=")
          b=s.index("  async function acceptBuildingStudy(",a)
          block=s[a:b]
          forbidden=[
            "/player/building/fast_completion",
            "/player/battle/fast",
            "/player/building/remort?",
            "/player/building/fast_remort",
            "/shop/buy",
          ]
          bad=[x for x in forbidden if x in block]
          assert not bad, bad
          assert "/player/building?building_id=" in block
          assert "disabled" in block and "E3" in block
          print("EXPLORE_E2_MUTATION_SCAN=PASS")
          PY
          source="$(cat /tmp/source.sha)"
          candidate="$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"
          {
            echo "EXPLORE_E2_BUILD=PASS"
            echo "source_live_sha256=$source"
            echo "candidate_sha256=$candidate"
            echo "syntax=PASS"
            echo "mutation_endpoints_in_explore=0"
            echo "deployed=no"
          } > audit/hk-stage2-explore-e2-build-status.txt

      - name: Commit build evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-explore-e2-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "audit: verify Explore E2 read-only build"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/patch_explore_e2.py /tmp/source.sha
