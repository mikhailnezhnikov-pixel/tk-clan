name: Check Userscript 1.17.42 Hamsters Kokkaras Live State

on:
  push:
    paths:
      - '.github/workflows/check-userscript-1-17-42-hamsters-kokkaras.yml'
      - 'deploy/topking/HamsterKingMobile.1.17.42.hamsters-kokkaras-live-state.candidate.user.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate
        run: |
          set -euo pipefail
          f=deploy/topking/HamsterKingMobile.1.17.42.hamsters-kokkaras-live-state.candidate.user.js
          node --check "$f"
          grep -Fq "// @version      1.17.42" "$f"
          grep -Fq "const BUILD_VERSION = '1.17.42';" "$f"
          grep -Fq "hamsters-kokkaras-live-state-20260923-r2" "$f"
          grep -Fq "hamsters-kokkaras-cost-parity-20260923-r1" "$f"
          grep -Fq "treasure-guide-selective-extract-20260923-r2" "$f"
          grep -Fq "treasure-guide-passive-capture-20260923-r1" "$f"
          grep -Fq "maps-manual-scan-only-20260923-r1" "$f"
          grep -Fq "growth-hamster-nuts-canon-20260923-r1" "$f"
          grep -Fq "clan-snapshot-numeric-player-id-20260923-r1" "$f"
          grep -Fq "auto-routines-in-today-20260922-r3" "$f"
          grep -Fq "game-api-rate-guard-20260922-r1" "$f"
          grep -Fq "public-collector-activity-lease-20260922-r1" "$f"
          grep -Fq "businesses-kokkaras-donor-20260922-r1" "$f"
          grep -Fq "businesses-runner-vertical-20260922-r1" "$f"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('deploy/topking/HamsterKingMobile.1.17.42.hamsters-kokkaras-live-state.candidate.user.js').read_text(encoding='utf-8')
          assert "documentValue?.result?.player" in s
          assert "GROWTH_DONOR_STATE_ROWS" in s
          assert "growthNormalizeDonorState(growthState,value,{full})" in s
          assert "growthNormalizeDonorState(growthState,data,{full:false})" in s
          assert "growthNormalizeDonorState(state,state,{full:false})" in s
          assert "hamstersRun=visibleState&&title===either('Хомяки','Hamsters')" in s
          assert "box.classList.toggle('hamsters-run',hamstersRun)" in s
          assert ".hk-runner.businesses-run,.hk-runner.hamsters-run" in s
          assert "if(businessesRun||hamstersRun){runnerFill.style.width='100%'" in s
          assert "const hamsterRows=growthArray('playerHamsters',state),levelRows=hamsterRows.filter(row=>row?.nextLevelUp).length;" in s
          assert "treasure-guide-selective-extract-20260923-r2" in s
          assert s.count('submitOwnedMapAreas(true)') == 1
          i=s.index('submitOwnedMapAreas(true)')
          assert '#hk-map-scan' in s[max(0,i-250):i+250]
          print('USERSCRIPT_1_17_42_HAMSTERS_KOKKARAS_STATIC=PASS')
          PY