name: Build Userscript 1.18.29 Fishing Human Fast

on:
  push:
    paths:
      - 'deploy/topking/patch_fishing_human_fast_1_18_29.py'
      - '.github/workflows/build-userscript-1-18-29-fishing-human-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.28" /tmp/HamsterKingMobile.user.js
          grep -Fq "minigame-single-tap-20260927-r1" /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/patch_fishing_human_fast_1_18_29.py /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.29" /tmp/HamsterKingMobile.user.js
          grep -Fq "fishing-human-fast-20260927-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "FISHING_MIN_NEXT_ACTION_GAP_MS = 1100" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha
      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.29.fishing-human-fast.candidate.user.js
          audit=audit/hk-userscript-1-18-29-fishing-human-fast-predeploy.txt
          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.28':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.28',
              'target_version':'1.18.29',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.29.fishing-human-fast.candidate.user.js',
              'primary_marker':'fishing-human-fast-20260927-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-29-fishing-human-fast-live-status.txt',
              'commit_message':'fix: deploy faster human-paced fishing in userscript 1.18.29',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          {
            echo "USERSCRIPT_1_18_29_FISHING_HUMAN_FAST_PREDEPLOY=PASS"
            echo "source_version=1.18.28"
            echo "target_version=1.18.29"
            echo "fishing_gap_ms=1100"
            echo "fishing_scan_ms=250-450"
            echo "fishing_aim_ms=180-320"
            echo "fishing_confirm_ms=350-650"
            echo "fishing_settle_ms=600-900"
            echo "fishing_target_cycle=APPROX_2_3_SECONDS"
            echo "other_minigames=UNCHANGED"
            echo "syntax=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.29 fishing human fast"
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
