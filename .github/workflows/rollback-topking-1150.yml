name: Emergency rollback TopKing 1.15.0

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rollback-topking-1150.yml'

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Roll back to verified 1.14.4 backup
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -euo pipefail;
            current=/opt/hamsterking-license/HamsterKingMobile.user.js;
            grep -q "^// @version      1.15.0$" "$current";
            backup="$(ls -1t /opt/hamsterking-license/HamsterKingMobile.user.js.bak.* | head -1)";
            test -n "$backup";
            grep -q "^// @version      1.14.4$" "$backup";
            cp "$backup" /tmp/rollback-1144.js; node --check /tmp/rollback-1144.js;
            cp -a "$current" "$current.failed-1.15.0.$(date +%Y%m%d-%H%M%S)";
            install -m 0644 "$backup" "$current";
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.14.4\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf;
            systemctl daemon-reload;
            systemctl restart hamsterking-license.service;
            systemctl is-active --quiet hamsterking-license.service;
            sleep 2;
            (curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/cabinet/config || curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/cabinet/config) >/tmp/cabinet.json;
            grep -q "^// @version      1.14.4$" "$current";
            cp "$current" /tmp/current-1144.js; node --check /tmp/current-1144.js;
            echo ROLLBACK_OK'
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking"
