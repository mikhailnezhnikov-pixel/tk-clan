name: Diagnose TopKing 1.16.8 Buildings Explore

on:
  push:
    paths:
      - 'deploy/topking/stage2i-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-topking-1168
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Fetch current live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.16.7$' /tmp/HamsterKingMobile.user.js
          grep -Fq "stage2h-wars-20260919-r1" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
      - name: Apply Buildings and Explore
        run: |
          set +e
          python3 deploy/topking/stage2i_buildings_explore_patch.py >/tmp/hk-1168.log 2>&1
          code=$?
          syntax=not-run
          if [ "$code" = "0" ]; then
            node --check /tmp/HamsterKingMobile.user.js >>/tmp/hk-1168.log 2>&1
            code=$?
            [ "$code" = "0" ] && syntax=ok || syntax=bad
          fi
          mkdir -p audit
          {
            echo "patch=$([ "$code" = "0" ] && echo passed || echo failed)"
            echo "syntax=$syntax"
            echo "result_code=$code"
            echo "built=$(grep -m1 '^// @version' /tmp/HamsterKingMobile.user.js || true)"
            echo "marker=$(grep -c 'stage2i-buildings-explore-20260919-r1' /tmp/HamsterKingMobile.user.js || true)"
            echo "player_building=$(grep -c '/player/building' /tmp/HamsterKingMobile.user.js || true)"
            echo "game_area=$(grep -c '/game_area/' /tmp/HamsterKingMobile.user.js || true)"
            echo "buildings_page=$(grep -c 'data-content=\"buildings\"' /tmp/HamsterKingMobile.user.js || true)"
            echo "explore_page=$(grep -c 'data-content=\"explore\"' /tmp/HamsterKingMobile.user.js || true)"
            echo "--- log tail ---"
            tail -n 100 /tmp/hk-1168.log
          } > audit/hk-1168-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git add audit/hk-1168-diagnostic.txt
          git commit -m "Record TopKing 1.16.8 Buildings Explore diagnostic" || true
          git push origin HEAD:main || true
          exit "$code"
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/hk-1168.log
