name: Deploy Userscript 1.17.6 Native Auth Observer

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-6-trigger.txt'

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh current main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate release tooling
        run: |
          set -euo pipefail
          python3 -m py_compile \
            deploy/topking/patch_userscript_auth_observer_1_17_6.py \
            deploy/topking/install_userscript_version_1_17_6.py

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch fresh live userscript
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/userscript-source.sha
          grep -Fq '// @version      1.17.6' /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.17.6';" /tmp/HamsterKingMobile.user.js
          grep -Fq 'PUBLIC_COLLECTOR_AUTH_HEARTBEAT_CLIENT_R1' /tmp/HamsterKingMobile.user.js
          grep -Fq 'PUBLIC_COLLECTOR_NATIVE_AUTH_OBSERVER_R1' /tmp/HamsterKingMobile.user.js
          grep -Fq 'explore-e3-single-20260920-r9-runner' /tmp/HamsterKingMobile.user.js
          grep -Fq 'const HK_MAP_READ_CONCURRENCY = 5;' /tmp/HamsterKingMobile.user.js
          grep -Fq 'public-server-only-20260920-r2' /tmp/HamsterKingMobile.user.js

      - name: Build 1.17.5 candidate
        run: |
          set -euo pipefail
          python3 deploy/topking/patch_userscript_auth_observer_1_17_6.py /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq '// @version      1.17.6' /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.17.6';" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r8-native-auth-observer" /tmp/HamsterKingMobile.user.js
          grep -Fq 'PUBLIC_COLLECTOR_AUTH_HEARTBEAT_CLIENT_R1' /tmp/HamsterKingMobile.user.js
          grep -Fq 'explore-e3-single-20260920-r9-runner' /tmp/HamsterKingMobile.user.js
          grep -Fq 'const HK_MAP_READ_CONCURRENCY = 5;' /tmp/HamsterKingMobile.user.js
          grep -Fq 'public-server-only-20260920-r2' /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/userscript-candidate.sha

      - name: Upload and race-safe install
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.6.user.js
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            deploy/topking/install_userscript_version_1_17_6.py root@89.125.1.71:/tmp/install_userscript_version_1_17_6.py
          source_sha="$(cat /tmp/userscript-source.sha)"
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 "python3 /tmp/install_userscript_version_1_17_6.py '$source_sha'" \
            > /tmp/userscript-1-17-6-install.txt
          cat /tmp/userscript-1-17-6-install.txt
          grep -Fq 'userscript_1_17_6_install=PASS' /tmp/userscript-1-17-6-install.txt

      - name: Verify live 1.17.5
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js
            grep -Fq "// @version      1.17.6" /opt/hamsterking-license/HamsterKingMobile.user.js
            grep -Fq "const BUILD_VERSION = '"'"'1.17.5'"'"';" /opt/hamsterking-license/HamsterKingMobile.user.js
            grep -Fq PUBLIC_COLLECTOR_AUTH_HEARTBEAT_CLIENT_R1 /opt/hamsterking-license/HamsterKingMobile.user.js
            grep -Fq PUBLIC_COLLECTOR_NATIVE_AUTH_OBSERVER_R1 /opt/hamsterking-license/HamsterKingMobile.user.js
            grep -Fq explore-e3-single-20260920-r9-runner /opt/hamsterking-license/HamsterKingMobile.user.js
            grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /opt/hamsterking-license/HamsterKingMobile.user.js
            grep -Fq public-server-only-20260920-r2 /opt/hamsterking-license/HamsterKingMobile.user.js
            echo userscript_1_17_6_live=PASS
            echo protected_maps_explore=PASS
          ' > /tmp/userscript-1-17-6-status.txt
          cat /tmp/userscript-1-17-6-status.txt

      - name: Sync baseline and audit
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.1.17.6.final.user.js
          {
            echo 'USERSCRIPT_1_17_6_LIVE=PASS'
            cat /tmp/userscript-1-17-6-status.txt
            cat /tmp/userscript-1-17-6-install.txt
            echo "source_sha=$(cat /tmp/userscript-source.sha)"
            echo "candidate_sha=$(cat /tmp/userscript-candidate.sha)"
          } > /tmp/hk-userscript-1-17-6.txt
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/HamsterKingMobile.1.17.6.final.user.js baseline/topking/HamsterKingMobile.current.user.js
            cp /tmp/hk-userscript-1-17-6.txt audit/hk-userscript-1-17-6.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-6.txt
            git commit -m 'release: publish userscript 1.17.6 native auth observer' || true
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.1.17.6.final.user.js /tmp/userscript-source.sha /tmp/userscript-candidate.sha /tmp/userscript-1-17-6-install.txt /tmp/userscript-1-17-6-status.txt /tmp/hk-userscript-1-17-6.txt
