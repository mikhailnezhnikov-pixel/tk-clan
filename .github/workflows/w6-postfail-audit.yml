name: W6 flag hotfix
on:
  push:
    paths: ['deploy/topking/w6-postfail-audit-trigger.txt']
permissions:
  contents: read
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ssh
        env:
          K: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          scp -i ~/.ssh/k -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
      - name: patch and test
        run: |
          python3 deploy/topking/patch_server_maps_flag_bitmask_w6.py
          python3 -m py_compile /tmp/server.py
          grep -Fq "investment_bit = old_flag & 0x08" /tmp/server.py
          python3 - <<'PY'
          assert (7 & 8) | 4 == 4
          assert (8 & 8) | 3 == 11
          assert (15 & 8) | 5 == 13
          print("W6_FLAG_BITMASK_BUILD=PASS")
          PY
          sha256sum /tmp/server.py
      - name: deploy
        run: |
          scp -i ~/.ssh/k -o StrictHostKeyChecking=accept-new /tmp/server.py root@89.125.1.71:/tmp/server.w6flag.py
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -e; cp -a /opt/hamsterking-license/server.py /opt/hamsterking-license/server.py.bak.w6flag; install -m 0644 /tmp/server.w6flag.py /opt/hamsterking-license/server.py; systemctl restart hamsterking-license.service; systemctl is-active --quiet hamsterking-license.service; sha256sum /opt/hamsterking-license/server.py'
