name: Diagnose Public Collector Live API

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/topking/public-collector-diagnose-trigger.txt'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Diagnose live API safely
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            deploy/topking/diagnose_public_collector.py root@89.125.1.71:/tmp/diagnose_public_collector.py
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'python3 /tmp/diagnose_public_collector.py' \
            > /tmp/public-collector-live-api.txt
          cat /tmp/public-collector-live-api.txt

      - name: Save diagnosis
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cp /tmp/public-collector-live-api.txt audit/hk-public-collector-live-api.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-public-collector-live-api.txt
          git commit -m "audit: diagnose live public collector API" || true
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/public-collector-live-api.txt
