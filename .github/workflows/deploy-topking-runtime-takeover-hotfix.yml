name: Deploy TopKing 1.17.4 Runtime Takeover Hotfix

on:
  push:
    paths:
      - 'deploy/topking/runtime-takeover-hotfix-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live 1.17.4
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.17.4$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_LAUNCHER_HANDOFF_REV = 'launcher-handoff-20260920-r4'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PUBLIC_WAR_ALLIANCE_V4" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Apply runtime takeover hotfix
        run: |
          set -euo pipefail
          python3 deploy/topking/patch_runtime_takeover_hotfix_1174.py
          grep -Fq "HK_RUNTIME_TAKEOVER_REV = 'runtime-takeover-20260920-r5'" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.17.4';" /tmp/HamsterKingMobile.user.js
          grep -Fq "hkRuntimeAtLeast(previousRuntime.version, BUILD_VERSION)" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Deploy hotfix
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
            grep -Fq "HK_RUNTIME_TAKEOVER_REV = '\''runtime-takeover-20260920-r5'\''" /opt/hamsterking-license/HamsterKingMobile.user.js
            grep -Fq "HK_PUBLIC_WAR_ALLIANCE_V4" /opt/hamsterking-license/HamsterKingMobile.user.js
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js
          '

      - name: Round trip verify
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/live-after.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/live-after.js
          node --check /tmp/live-after.js
          sha="$(sha256sum /tmp/live-after.js | awk '{print $1}')"
          mkdir -p audit
          {
            echo 'version=1.17.4'
            echo 'hotfix=runtime-takeover-20260920-r5'
            echo 'hardcoded_build_version=PASS'
            echo 'old_runtime_takeover=PASS'
            echo 'public_war_alliance_v4=PASS'
            echo 'syntax=ok'
            echo 'roundtrip=identical'
            echo "sha256=$sha"
          } > audit/hk-1174-runtime-takeover-hotfix-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-1174-runtime-takeover-hotfix-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Verify live TopKing 1.17.4 runtime takeover hotfix"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/live-after.js
