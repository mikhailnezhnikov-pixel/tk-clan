name: Deploy TopKing 1.16.3 Migration

on:
  push:
    paths:
      - '.github/workflows/deploy-topking-1163.yml'
      - 'deploy/topking/stage2_runner_patch.py'
      - 'deploy/topking/stage2b_runner_patch.py'
      - 'deploy/topking/stage2c_state_patch.py'
      - 'deploy/topking/stage2d_resource_business_patch.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-1163
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch verified Stage 1 live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.15.0$' /tmp/HamsterKingMobile.user.js
          grep -q "HK_MUTATION_GATE_REV.*stage1-20260919-r4" /tmp/HamsterKingMobile.user.js
          grep -q "GROWTH_HAMSTER_BUDGET_ID.*cur_cap" /tmp/HamsterKingMobile.user.js
          grep -q "GROWTH_GENERAL_BUDGET_ID.*item_pit_token" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Build 1.16.3
        run: |
          set -euo pipefail
          python3 deploy/topking/stage2_runner_patch.py
          python3 deploy/topking/stage2b_runner_patch.py
          python3 deploy/topking/stage2c_state_patch.py
          python3 deploy/topking/stage2d_resource_business_patch.py
          node --check /tmp/HamsterKingMobile.user.js

      - name: Validate migration
        run: |
          set -euo pipefail
          grep -q '^// @version      1.16.3$' /tmp/HamsterKingMobile.user.js
          grep -q "HK_STAGE2_RUNNER_REV.*stage2a-20260919-r1" /tmp/HamsterKingMobile.user.js
          grep -q "HK_STAGE2B_RUNNER_REV.*stage2b-20260919-r1" /tmp/HamsterKingMobile.user.js
          grep -q "HK_STAGE2_STATE_REV.*stage2c-state-20260919-r1" /tmp/HamsterKingMobile.user.js
          grep -q "HK_STAGE2D_RUNNER_REV.*stage2d-resource-business-20260919-r1" /tmp/HamsterKingMobile.user.js
          grep -q "hkRunner.stop('pit')" /tmp/HamsterKingMobile.user.js
          grep -q "hkRunner.stop('fair')" /tmp/HamsterKingMobile.user.js
          grep -q "hkRunner.stop('recipes')" /tmp/HamsterKingMobile.user.js
          grep -q "title:either('Магазин','Shop')" /tmp/HamsterKingMobile.user.js
          grep -q "title:either('Проектное бюро','Project Bureau')" /tmp/HamsterKingMobile.user.js
          grep -q "title:either('Ресурсные здания','Resource buildings')" /tmp/HamsterKingMobile.user.js
          grep -q "title:either('Перестановка бизнесов','Business rearrangement')" /tmp/HamsterKingMobile.user.js
          grep -q "else if (hkIsMutationRequest(path, method))" /tmp/HamsterKingMobile.user.js
          grep -q "hkAuthoritativePlayerRead('resources-complete')" /tmp/HamsterKingMobile.user.js
          grep -q "hkAuthoritativePlayerRead('business-complete')" /tmp/HamsterKingMobile.user.js
          grep -q "GROWTH_HAMSTER_BUDGET_ID.*cur_cap" /tmp/HamsterKingMobile.user.js
          grep -q "GROWTH_GENERAL_BUDGET_ID.*item_pit_token" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js > /tmp/topking-1163.sha256

      - name: Deploy and verify service
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -euo pipefail;
            stamp="$(date +%Y%m%d-%H%M%S)";
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp";
            node --check /tmp/HamsterKingMobile.user.js;
            install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js;
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.16.3\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf;
            systemctl daemon-reload;
            systemctl restart hamsterking-license.service;
            systemctl is-active --quiet hamsterking-license.service;
            grep -q "^// @version      1.16.3$" /opt/hamsterking-license/HamsterKingMobile.user.js;
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js;
            echo DEPLOY_OK'

      - name: Round trip verify and record live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/topking-live-1163.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/topking-live-1163.js
          node --check /tmp/topking-live-1163.js
          live_sha="$(sha256sum /tmp/topking-live-1163.js | awk '{print $1}')"

          mkdir -p audit
          {
            echo "version=1.16.3"
            echo "stage1=stage1-20260919-r4"
            echo "stage2a=stage2a-20260919-r1"
            echo "stage2b=stage2b-20260919-r1"
            echo "stage2c=stage2c-state-20260919-r1"
            echo "stage2d=stage2d-resource-business-20260919-r1"
            echo "modules=pit,fair,shop,recipes,bureau,state-store,resources,business"
            echo "hamsters=cur_cap"
            echo "generals=item_pit_token"
            echo "syntax=ok"
            echo "roundtrip=identical"
            echo "sha256=$live_sha"
          } > audit/hk-1163-live-status.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-1163-live-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Verify live TopKing 1.16.3 migration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/topking-live-1163.js /tmp/topking-1163.sha256
