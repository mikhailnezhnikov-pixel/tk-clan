name: Deploy TopKing Pits UI Align R2

on:
  push:
    paths:
      - 'deploy/topking/pits-ui-align-r2-trigger.txt'
  workflow_dispatch:

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact Core r1 live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          live_sha="$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"
          echo "LIVE_SHA=$live_sha"
          grep -Fq "HK_PITS_CANON_REV = 'pits-canon-core-20260920-r1'" /tmp/HamsterKingMobile.user.js
          if grep -Fq "HK_PITS_UI_REV = 'pits-ui-align-20260920-r2'" /tmp/HamsterKingMobile.user.js; then
            echo "UI_R2_ALREADY_LIVE=YES"
          else
            test "$live_sha" = "0d6de4888121d5e09d2cd5fa5140ec5941734dd30c23dc70fbbd95a951dcb825"
          fi

      - name: Apply UI alignment r2
        run: |
          set -euo pipefail
          if ! grep -Fq "HK_PITS_UI_REV = 'pits-ui-align-20260920-r2'" /tmp/HamsterKingMobile.user.js; then
            python3 deploy/topking/patch_pits_ui_align_r2_1174.py
          else
            echo "SKIP_PATCH_ALREADY_APPLIED"
          fi
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_UI_REV = 'pits-ui-align-20260920-r2'" /tmp/HamsterKingMobile.user.js
          grep -Fq '.hk-pit-canon-grid{display:grid;gap:9px;max-width:820px}' /tmp/HamsterKingMobile.user.js
          echo "PATCHED_SHA=$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.pits-ui-r2.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.pits-ui-r2.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.pits-ui-r2.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.pits-ui-r2.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
            node --check /opt/hamsterking-license/HamsterKingMobile.user.js
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?pits-ui-r2=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "HK_PITS_UI_REV = 'pits-ui-align-20260920-r2'" /tmp/public.js
          echo "PUBLIC_SHA=$(sha256sum /tmp/public.js | awk '{print $1}')"
          echo "PITS_UI_ALIGN_R2=PASS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
