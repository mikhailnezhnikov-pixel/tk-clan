name: Check TopKing Maps Shared KB W3

on:
  push:
    paths:
      - 'deploy/topking/maps-shared-kb-w3-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-topking-maps-shared-kb-w3
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact W2 live server
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          python3 -m py_compile /tmp/server.py
          test "$(sha256sum /tmp/server.py | awk '{print $1}')" = "1fe9fc44953713032bad755bc658233e881cba1941d7fae53747e6d27e7a7e3e"
          grep -Fq 'HK_MAP_AREA_LINKS_W2_V1' /tmp/server.py

      - name: Apply W3 patch
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_server_maps_shared_kb_w3.py
          python3 deploy/topking/patch_server_maps_shared_kb_w3.py
          python3 -m py_compile /tmp/server.py
          grep -Fq 'HK_MAP_ROOM_KNOWLEDGE_W3_V1' /tmp/server.py
          grep -Fq 'source-hk-maps-import' /tmp/server.py
          grep -Fq -- '--import-hk-map-room-knowledge' /tmp/server.py

      - name: Regression test on temporary DB
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os, tempfile
          spec=importlib.util.spec_from_file_location("server_candidate","/tmp/server.py")
          server=importlib.util.module_from_spec(spec); spec.loader.exec_module(server)
          fd,path=tempfile.mkstemp(prefix="hk-w3-",suffix=".db"); os.close(fd)
          try:
              server.DB_PATH=path
              server.init_db()
              now=server.utc_now()
              area="area-w3"
              with server.db_session() as db:
                  db.execute("""INSERT INTO map_areas(area_id,city_id,city_name,x,y,invest_count,expected_buildings,last_player_id,last_seen)
                                VALUES(?,?,?,?,?,?,?,?,?)""",(area,"city","Test",1,2,0,2,"game-source",now))
                  db.execute("""INSERT INTO map_area_aliases(source_area_id,canonical_area_id,first_seen,last_seen)
                                VALUES(?,?,?,?)""",(area,area,now,now))
                  db.execute("""INSERT INTO hk_maps_catalog(map_key,city,grid,updated_at)
                                VALUES(?,?,?,?)""",("hk_test0102","Test","02:01",now))
                  db.execute("""INSERT INTO hk_map_points(map_key,points_json,point_count,updated_at)
                                VALUES(?,?,?,?)""",("hk_test0102","[100,200,2]",1,now))
                  db.execute("""INSERT INTO hk_map_area_links(map_key,canonical_area_id,match_method,linked_at)
                                VALUES(?,?,?,?)""",("hk_test0102",area,"exact_area_id",now))
                  db.execute("""INSERT INTO map_buildings(area_id,building_id,opened,room_count,has_events,is_invest,tier,faction,building_type,last_player_id,last_seen)
                                VALUES(?,?,?,?,?,?,?,?,?,?,?)""",(area,"way1",0,None,0,0,None,"","","game-source",now))
                  db.execute("""INSERT INTO map_buildings(area_id,building_id,opened,room_count,has_events,is_invest,tier,faction,building_type,last_player_id,last_seen)
                                VALUES(?,?,?,?,?,?,?,?,?,?,?)""",(area,"way2",0,0,0,0,None,"","","game-source",now))
              before_points=None
              with server.db_session() as db:
                  before_points=db.execute("SELECT points_json FROM hk_map_points WHERE map_key='hk_test0102'").fetchone()[0]
              first=server.import_hk_map_room_knowledge("hk_test0102",[
                  {"building_id":"way1","room_count":2},
                  {"building_id":"way2","room_count":3},
                  {"building_id":"way404","room_count":1},
              ])
              assert first["filled"]==1,first
              assert first["preserved_nonnull"]==1,first
              assert first["missing_buildings"]==1,first
              detail=server.map_detail(area)
              byid={r["building_id"]:r for r in detail["buildings"]}
              assert byid["way1"]["room_count"]==2,byid["way1"]
              assert byid["way1"]["has_events"]==1,byid["way1"]
              assert byid["way2"]["room_count"]==0,byid["way2"]
              second=server.import_hk_map_room_knowledge("hk_test0102",[
                  {"building_id":"way1","room_count":5},
                  {"building_id":"way2","room_count":5},
              ])
              assert second["filled"]==0,second
              assert second["preserved_nonnull"]==2,second
              with server.db_session() as db:
                  rows=db.execute("SELECT building_id,room_count,last_player_id FROM map_buildings WHERE area_id=? ORDER BY building_id",(area,)).fetchall()
                  after_points=db.execute("SELECT points_json FROM hk_map_points WHERE map_key='hk_test0102'").fetchone()[0]
                  area_count=db.execute("SELECT COUNT(*) FROM map_areas").fetchone()[0]
              assert rows[0]["last_player_id"]=="source-hk-maps-import",dict(rows[0])
              assert rows[1]["last_player_id"]=="game-source",dict(rows[1])
              assert before_points==after_points=="[100,200,2]"
              assert area_count==1
              print("W3_TEMP_DB=PASS")
              print("W3_NULL_ONLY_FILL=PASS")
              print("W3_NON_NULL_PRESERVE=PASS")
              print("W3_DETAIL_READ=PASS")
              print("W3_IDEMPOTENT=PASS")
              print("W3_GEOMETRY_UNCHANGED=PASS")
              print("W3_NO_DISTRICT_DUPLICATE=PASS")
          finally:
              try: os.remove(path)
              except OSError: pass
          PY

      - name: Record build status
        run: |
          set -euo pipefail
          candidate="$(sha256sum /tmp/server.py | awk '{print $1}')"
          {
            echo "MAPS_SHARED_KB_W3_BUILD=PASS"
            echo "source_server_sha256=1fe9fc44953713032bad755bc658233e881cba1941d7fae53747e6d27e7a7e3e"
            echo "candidate_server_sha256=$candidate"
            echo "null_only_fill=PASS"
            echo "nonnull_preserve=PASS"
            echo "map_detail_read=PASS"
            echo "idempotent=PASS"
            echo "geometry_unchanged=PASS"
            echo "district_duplicate=NO"
            echo "bulk_migration=NO"
            echo "deployed=NO"
          } > audit/hk-stage2-maps-shared-kb-w3-build-status.txt
          cat audit/hk-stage2-maps-shared-kb-w3-build-status.txt

      - name: Commit build status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-maps-shared-kb-w3-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "audit: verify Maps shared KB W3 build"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/server.py
