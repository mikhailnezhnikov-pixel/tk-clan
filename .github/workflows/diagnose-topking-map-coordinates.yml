name: Diagnose TopKing Map Coordinates

on:
  push:
    paths:
      - 'deploy/topking/map-coords-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Fetch live backend
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          python3 -m py_compile /tmp/server.py
      - name: Extract map backend code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/server.py').read_text()
          out=['SERVER_MAP_COORDS_DIAGNOSTIC']
          needles=['maps/submit','/maps/list','/maps/detail','room_count','expected_buildings','ON CONFLICT','area_id']
          ranges=[]
          for needle in needles:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  ranges.append((max(0,i-2500),min(len(s),i+6500),needle))
                  start=i+len(needle)
          ranges.sort()
          merged=[]
          for a,b,n in ranges:
              if merged and a<=merged[-1][1]:
                  merged[-1]=(merged[-1][0],max(merged[-1][1],b),merged[-1][2]+'|'+n)
              else:
                  merged.append((a,b,n))
          for a,b,n in merged[:20]:
              line=s.count('\n',0,a)+1
              out.append(f'\n=== {n} around line {line} ===\n'+s[a:b])
          Path('audit/hk-map-coords-backend-diagnostic.txt').write_text('\n'.join(out))
          PY
          wc -c audit/hk-map-coords-backend-diagnostic.txt
      - name: Commit diagnostic
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-map-coords-backend-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "audit: inspect live map coordinate backend"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/server.py
