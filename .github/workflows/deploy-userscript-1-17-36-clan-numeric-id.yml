name: Deploy Userscript 1.17.36 Clan Numeric Player ID

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-36-clan-numeric-id-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch fresh live and patch
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.35" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-shop-dom-history-capture-20260922-r3" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/source.sha
          python3 deploy/topking/patch_clan_snapshot_numeric_player_id_1_17_36.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.36" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-snapshot-numeric-player-id-20260923-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "member.player_id ?? member.member_id ?? member.id" /tmp/HamsterKingMobile.user.js

      - name: Race-safe deploy
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/source.sha)"
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.36.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 "SOURCE_SHA='$source_sha' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(sha256sum /opt/hamsterking-license/HamsterKingMobile.user.js | awk '{print $1}')" = "$SOURCE_SHA"
          node --check /tmp/HamsterKingMobile.1.17.36.user.js
          stamp="$(date +%Y%m%d-%H%M%S)"
          cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.36.$stamp"
          install -m 0644 /tmp/HamsterKingMobile.1.17.36.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
          printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.17.36\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
          systemctl daemon-reload
          systemctl restart hamsterking-license.service
          systemctl is-active --quiet hamsterking-license.service
          REMOTE

      - name: Verify public
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://hk-license.89.125.1.71.sslip.io/panel.js?clan-numeric-id=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.36" /tmp/public.js
          grep -Fq "clan-snapshot-numeric-player-id-20260923-r1" /tmp/public.js
          echo "PUBLIC_1_17_36_CLAN_NUMERIC_ID=PASS"

      - name: Sync baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          printf "%s\n" "USERSCRIPT_1_17_36_CLAN_NUMERIC_ID=PASS" "version=1.17.36" > audit/hk-userscript-1-17-36-clan-numeric-id-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-36-clan-numeric-id-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve numeric player id in clan snapshot 1.17.36"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
