name: Deploy Userscript 1.17.37 Growth Nuts Canon

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-37-growth-nuts-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Validate Growth candidate
        run: |
          set -euo pipefail
          cp deploy/topking/HamsterKingMobile.1.17.37.growth-nuts.candidate.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.37" /tmp/HamsterKingMobile.user.js
          grep -Fq "growth-hamster-nuts-canon-20260923-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "const GROWTH_HAMSTER_BUDGET_ID = 'cur_nut';" /tmp/HamsterKingMobile.user.js
          grep -Fq "nutsPercent:pct(saved.nutsPercent ?? saved.capsPercent,100)," /tmp/HamsterKingMobile.user.js
          grep -Fq "function growthNutCost(cost)" /tmp/HamsterKingMobile.user.js
          grep -Fq 'id="hk-growth-nuts-percent"' /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-snapshot-numeric-player-id-20260923-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-shop-dom-history-capture-20260922-r3" /tmp/HamsterKingMobile.user.js
          grep -Fq "auto-routines-in-today-20260922-r3" /tmp/HamsterKingMobile.user.js
          grep -Fq "game-api-rate-guard-20260922-r1" /tmp/HamsterKingMobile.user.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')
          forbidden=[
              "const GROWTH_HAMSTER_BUDGET_ID = 'cur_cap';",
              'settings.capsPercent',
              'id="hk-growth-caps-percent"',
              'function growthCapCost(cost)',
              'Hamster Caps budget',
              'Крышки/Power',
              'Best Power / Cap',
          ]
          bad=[x for x in forbidden if x in s]
          assert not bad, bad
          print('GROWTH_NUTS_CANDIDATE=PASS')
          PY

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/live.user.js
          node --check /tmp/live.user.js
          grep -Fq "// @version      1.17.36" /tmp/live.user.js
          grep -Fq "clan-snapshot-numeric-player-id-20260923-r1" /tmp/live.user.js
          grep -Fq "clan-shop-dom-history-capture-20260922-r3" /tmp/live.user.js
          grep -Fq "auto-routines-in-today-20260922-r3" /tmp/live.user.js
          grep -Fq "game-api-rate-guard-20260922-r1" /tmp/live.user.js
          cmp -s /tmp/live.user.js baseline/topking/HamsterKingMobile.current.user.js
          sha256sum /tmp/live.user.js | awk '{print $1}' > /tmp/source.sha

      - name: Race-safe deploy
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/source.sha)"
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.37.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 "SOURCE_SHA='$source_sha' bash -s" <<'REMOTE'
          set -euo pipefail
          test "$(sha256sum /opt/hamsterking-license/HamsterKingMobile.user.js | awk '{print $1}')" = "$SOURCE_SHA"
          node --check /tmp/HamsterKingMobile.1.17.37.user.js
          stamp="$(date +%Y%m%d-%H%M%S)"
          cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.37.$stamp"
          install -m 0644 /tmp/HamsterKingMobile.1.17.37.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
          printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.17.37\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf
          systemctl daemon-reload
          systemctl restart hamsterking-license.service
          systemctl is-active --quiet hamsterking-license.service
          REMOTE

      - name: Verify public exact match
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://hk-license.89.125.1.71.sslip.io/panel.js?growth-nuts=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.37" /tmp/public.js
          grep -Fq "growth-hamster-nuts-canon-20260923-r1" /tmp/public.js
          grep -Fq "clan-snapshot-numeric-player-id-20260923-r1" /tmp/public.js
          echo "PUBLIC_1_17_37_GROWTH_NUTS=PASS"

      - name: Sync baseline and Stage 2.11 audit
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          printf "%s\n" \
            "USERSCRIPT_1_17_37_GROWTH_NUTS_CANON=PASS" \
            "version=1.17.37" \
            "base=1.17.36" \
            "hamster_budget_currency=cur_nut" \
            "legacy_caps_percent_migration=PASS" \
            "hamster_cost_guard=NUTS_ONLY" \
            "growth_efficiency=NUTS_PER_POWER" \
            "general_pit_token_logic=PRESERVED" \
            "auto_routines_today=PRESERVED" \
            "clan_numeric_player_id_1_17_36=PRESERVED" \
            "adaptive_429_guard=PRESERVED" \
            "collector_activity_lease=PRESERVED" \
            "ci_game_mutations=NONE" \
            "user_browser_check=PENDING" \
            > audit/hk-userscript-1-17-37-growth-nuts-status.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/hk-stage2-11-growth.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              '**SOURCE_PREFLIGHT_PASS · CANONICAL_CURRENCY_BUG_CONFIRMED · PATCH_PREPARING**',
              '**SOURCE_PREFLIGHT_PASS · CANONICAL_CURRENCY_BUG_CONFIRMED · TECHNICAL_LIVE_PASS · USER_BROWSER_CHECK_PENDING**'
          )
          p.write_text(s,encoding='utf-8')
          p=Path('audit/HK_STAGE2_CHECKPOINT.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('- userscript: 1.17.35','- userscript: 1.17.37')
          s=s.replace(
              '- current module status: SOURCE_PREFLIGHT_PASS · CANONICAL_CURRENCY_BUG_CONFIRMED',
              '- current module status: SOURCE_PREFLIGHT_PASS · CANONICAL_CURRENCY_BUG_CONFIRMED · TECHNICAL_LIVE_PASS · USER_BROWSER_CHECK_PENDING'
          )
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-37-growth-nuts-status.txt audit/hk-stage2-11-growth.md audit/HK_STAGE2_CHECKPOINT.md
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore Growth hamster Nuts canon in userscript 1.17.37"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/live.user.js /tmp/public.js
