name: Build Userscript 1.18.13 Treasure Run Recorder

on:
  push:
    paths:
      - 'deploy/topking/patch_treasure_run_recorder_1_18_13.py'
      - '.github/workflows/build-userscript-1-18-13-treasure-run-recorder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-userscript-1-18-13-treasure-run-recorder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate from exact live baseline
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          test -f "$base"
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.18.12" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.18.12';" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-visible-board-active-20260926-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-guide-passive-capture-20260923-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_treasure_run_recorder_1_18_13.py /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.13" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.18.13';" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-run-recorder-20260926-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-run-trace-v1" /tmp/HamsterKingMobile.user.js
          grep -Fq "Запись карты: ВКЛ" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasureRunRecorderObserveClick" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasureRunRecorderObserveNetwork" /tmp/HamsterKingMobile.user.js
          grep -Fq "installTreasureRunRecorder();" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-visible-board-active-20260926-r1" /tmp/HamsterKingMobile.user.js

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate and release manifest
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.13.treasure-run-recorder.candidate.user.js
          audit=audit/hk-userscript-1-18-13-treasure-run-recorder-predeploy.txt

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
            cp /tmp/HamsterKingMobile.user.js "$candidate"

            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.12':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.12',
              'target_version':'1.18.13',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.13.treasure-run-recorder.candidate.user.js',
              'primary_marker':'treasure-run-recorder-20260926-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-13-treasure-run-recorder-live-status.txt',
              'commit_message':'feat: deploy passive Treasure Map run recorder in userscript 1.18.13',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

            mkdir -p "$(dirname "$audit")"
            {
              echo "USERSCRIPT_1_18_13_TREASURE_RUN_RECORDER_PREDEPLOY=PASS"
              echo "source_version=1.18.12"
              echo "target_version=1.18.13"
              echo "mode=PASSIVE_OBSERVATION_ONLY"
              echo "game_requests_added=NONE"
              echo "clicks_added=NONE"
              echo "session_toggle=Запись карты"
              echo "captures=CLICKS,SCREENS,LOTS,MODALS,NETWORK_STATUS,RELEVANT_REQUEST_RESPONSE"
              echo "batch_interval_ms=10000"
              echo "batch_max_events=16"
              echo "resume_after_reload=ENABLED"
              echo "multiple_runs=SEPARATE_SESSION_IDS"
              echo "syntax=PASS"
              echo "base_sha256=$(cat /tmp/base.sha)"
              echo "candidate_sha256=$(cat /tmp/candidate.sha)"
            } > "$audit"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$candidate" deploy/topking/userscript-release.json "$audit"
            git commit -m "build: prepare userscript 1.18.13 Treasure Map run recorder"

            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
