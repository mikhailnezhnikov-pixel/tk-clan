name: Deploy TopKing Pits Start R5

on:
  push:
    paths:
      - 'deploy/topking/pits-start-r5-trigger.txt'
  workflow_dispatch:

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact Pits r4 live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_TOOLBAR_REV = 'pits-toolbar-clean-20260920-r4'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "003c3a2a47bc2dc97e1e073b14744a57463d936e1fdc20b02e6041b124842223"

      - name: Apply start snapshot r5
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_pits_start_r5_1174.py
          python3 deploy/topking/patch_pits_start_r5_1174.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_START_REV = 'pits-start-config-snapshot-20260920-r5'" /tmp/HamsterKingMobile.user.js
          grep -Fq "recordDiagnostic('pits-run-config-snapshot'" /tmp/HamsterKingMobile.user.js
          echo "PATCHED_SHA=$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.pits-r5.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.pits-r5.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.pits-r5.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.pits-r5.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?pits-r5=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "HK_PITS_START_REV = 'pits-start-config-snapshot-20260920-r5'" /tmp/public.js
          echo "PUBLIC_SHA=$(sha256sum /tmp/public.js | awk '{print $1}')"
          echo "PITS_START_R5=PASS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
