name: Deploy Runtime Smoke Capture V1

on:
  push:
    paths:
      - 'deploy/topking/runtime-smoke-capture-v1-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Patch live server
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          python3 deploy/topking/patch_runtime_smoke_capture_v1.py /tmp/server.py
          python3 -m py_compile /tmp/server.py
          grep -Fq "RUNTIME_SMOKE_CAPTURE_V1" /tmp/server.py
          grep -Fq "/api/v1/runtime-smoke/capture" /tmp/server.py

      - name: Deploy server
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            /tmp/server.py root@89.125.1.71:/tmp/server.runtime-smoke-v1.py
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            cp -a /opt/hamsterking-license/server.py "/opt/hamsterking-license/server.py.bak.runtime-smoke-v1.$stamp"
            install -m 0644 /tmp/server.runtime-smoke-v1.py /opt/hamsterking-license/server.py
            python3 -m py_compile /opt/hamsterking-license/server.py
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify
        run: |
          set -euo pipefail
          sleep 2
          curl -fsS --retry 4 --retry-delay 1 https://hk-license.89.125.1.71.sslip.io/health -o /tmp/health.json
          python3 -c "import json; d=json.load(open('/tmp/health.json')); assert d.get('ok') is True"
          echo "RUNTIME_SMOKE_CAPTURE_V1=PASS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/server.py /tmp/health.json
