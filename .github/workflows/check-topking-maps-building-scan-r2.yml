name: Check TopKing Maps Building Scan R2

on:
  push:
    paths:
      - 'deploy/topking/maps-building-scan-r2-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-topking-userscript
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_BUILDINGS_CANON_REV = 'buildings-canon-core-20260920-r1'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "0931ee3eb65a16f9dd768fe51b9a84b897620e011c51ee9e0226d92f37b9e686"

      - name: Decode and compile patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          raw=Path('deploy/topking/patch_maps_building_scan_r2.zb64').read_text().strip()
          Path('/tmp/patch_maps_building_scan_r2.py').write_bytes(zlib.decompress(base64.b64decode(raw)))
          PY
          python3 -m py_compile /tmp/patch_maps_building_scan_r2.py

      - name: Apply and validate only
        run: |
          set -euo pipefail
          python3 /tmp/patch_maps_building_scan_r2.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_SCANNER_REV = 'maps-building-scan-20260920-r2'" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function mapEnsureOwnedBuildingAreaIndex(force=false)" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function mapBackfillActiveBuildingStudies(selectedAreaIds=null)" /tmp/HamsterKingMobile.user.js
          grep -Fq "playerDocument=await hkAuthoritativePlayerRead('maps:scan-start')" /tmp/HamsterKingMobile.user.js
          grep -Fq "await mapSubmitBuildingStudy(buildingId,areaId,roomCount,hasEvents)" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_BUILDINGS_CANON_REV = 'buildings-canon-core-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2J_BOSSES_REV = 'bosses-area-target-20260920-r2'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_REWARD_PICKER_REV = 'pits-reward-picker-20260920-r20'" /tmp/HamsterKingMobile.user.js
          sha="$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"
          {
            echo "MAPS_BUILDING_SCAN_R2_BUILD=PASS"
            echo "source_live_sha256=0931ee3eb65a16f9dd768fe51b9a84b897620e011c51ee9e0226d92f37b9e686"
            echo "candidate_sha256=$sha"
            echo "syntax=PASS"
            echo "deployed=no"
          } > audit/hk-stage2-maps-building-scan-r2-build-status.txt

      - name: Commit build status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-maps-building-scan-r2-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "audit: verify maps building scanner r2 build"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/patch_maps_building_scan_r2.py
