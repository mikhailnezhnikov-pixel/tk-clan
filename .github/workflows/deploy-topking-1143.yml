name: Deploy TopKing 1.14.3

on:
  push:
    paths:
      - '.github/workflows/deploy-topking-1143.yml'
      - 'deploy/topking/userscript-1.14.3.patch.part00.b64'
      - 'deploy/topking/userscript-1.14.3.patch.part01.b64'
      - 'deploy/topking/userscript-1.14.3.patch.part02.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live 1.14.2
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.14.2$' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Build and audit 1.14.3
        run: |
          set -euo pipefail
          cat deploy/topking/userscript-1.14.3.patch.part00.b64 deploy/topking/userscript-1.14.3.patch.part01.b64 deploy/topking/userscript-1.14.3.patch.part02.b64 | base64 -d | gzip -d > /tmp/userscript-1.14.3.patch
          patch --fuzz=0 /tmp/HamsterKingMobile.user.js < /tmp/userscript-1.14.3.patch
          grep -q '^// @version      1.14.3$' /tmp/HamsterKingMobile.user.js
          grep -q "GROWTH_HAMSTER_BUDGET_ID = 'cur_cap'" /tmp/HamsterKingMobile.user.js
          grep -q "GROWTH_GENERAL_BUDGET_ID = 'item_pit_token'" /tmp/HamsterKingMobile.user.js
          grep -q 'growthHamsterCostSafe' /tmp/HamsterKingMobile.user.js
          grep -q 'growthHamsterLevelCostSafe' /tmp/HamsterKingMobile.user.js
          grep -q 'scheduleGrowthRender' /tmp/HamsterKingMobile.user.js
          grep -q 'value = hkStateStore.snapshot || value' /tmp/HamsterKingMobile.user.js
          grep -q 'async function refreshModuleLive' /tmp/HamsterKingMobile.user.js
          grep -q 'const hkGameBridge' /tmp/HamsterKingMobile.user.js
          grep -q 'game-request-player-locked' /tmp/HamsterKingMobile.user.js
          ! grep -q 'hk-growth-nuts-percent' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          echo '98159389d0c5b6aca82b895defd5c0da65cdf1b5756b6b849027ce1af37b1f4a  /tmp/HamsterKingMobile.user.js' | sha256sum -c -

      - name: Deploy 1.14.3
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 'set -euo pipefail;
            stamp="$(date +%Y%m%d-%H%M%S)";
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp";
            grep -q "^// @version      1.14.3$" /tmp/HamsterKingMobile.user.js;
            node --check /tmp/HamsterKingMobile.user.js;
            install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js;
            printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.14.3\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf;
            systemctl daemon-reload;
            systemctl restart hamsterking-license.service;
            systemctl is-active --quiet hamsterking-license.service;
            sleep 2;
            (curl -fsS --max-time 10 http://127.0.0.1:8787/api/v1/cabinet/config || curl -fsS --max-time 10 http://127.0.0.1:3188/api/v1/cabinet/config);
            grep -q "^// @version      1.14.3$" /opt/hamsterking-license/HamsterKingMobile.user.js;
            sha256sum /opt/hamsterking-license/HamsterKingMobile.user.js | grep -q "^98159389d0c5b6aca82b895defd5c0da65cdf1b5756b6b849027ce1af37b1f4a ";
            echo DEPLOY_OK'

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/userscript-1.14.3.patch
