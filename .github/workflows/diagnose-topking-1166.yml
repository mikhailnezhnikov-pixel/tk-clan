name: Diagnose TopKing 1.16.6 Rumors

on:
  push:
    paths:
      - '.github/workflows/diagnose-topking-1166.yml'
      - 'deploy/topking/stage2g_rumors_patch.py'
      - 'deploy/topking/stage2g_rumors_server_patch.py'
      - 'deploy/topking/stage2g-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-topking-1166
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch live userscript and backend read only
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          grep -q '^// @version      1.16.5$' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          python3 -m py_compile /tmp/server.py

      - name: Apply historical Rumors migration
        run: |
          set +e
          : > /tmp/hk-1166.log
          client=not-run
          backend=not-run
          client_syntax=not-run
          backend_syntax=not-run
          code=0

          python3 deploy/topking/stage2g_rumors_patch.py >>/tmp/hk-1166.log 2>&1
          code=$?
          if [ "$code" = "0" ]; then client=passed; else client=failed; fi

          if [ "$code" = "0" ]; then
            node --check /tmp/HamsterKingMobile.user.js >>/tmp/hk-1166.log 2>&1
            code=$?
            if [ "$code" = "0" ]; then client_syntax=ok; else client_syntax=bad; fi
          fi

          if [ "$code" = "0" ]; then
            python3 deploy/topking/stage2g_rumors_server_patch.py >>/tmp/hk-1166.log 2>&1
            code=$?
            if [ "$code" = "0" ]; then backend=passed; else backend=failed; fi
          fi

          if [ "$code" = "0" ]; then
            python3 -m py_compile /tmp/server.py >>/tmp/hk-1166.log 2>&1
            code=$?
            if [ "$code" = "0" ]; then backend_syntax=ok; else backend_syntax=bad; fi
          fi

          mkdir -p audit
          {
            echo "client=$client"
            echo "backend=$backend"
            echo "client_syntax=$client_syntax"
            echo "backend_syntax=$backend_syntax"
            echo "result_code=$code"
            echo "built=$(grep -m1 '^// @version' /tmp/HamsterKingMobile.user.js || true)"
            echo "client_marker=$(grep -c 'stage2g-rumors-20260919-r1' /tmp/HamsterKingMobile.user.js || true)"
            echo "backend_marker=$(grep -c 'stage2g-rumors-server-20260919-r1' /tmp/server.py || true)"
            echo "rumor_game_calls=$(grep -c '/rumors/search' /tmp/HamsterKingMobile.user.js || true)"
            echo "rumor_backend_routes=$(grep -c '/api/v1/rumors/today' /tmp/server.py || true)"
            echo "rumor_admin_routes=$(grep -c '/admin/rumors/publish' /tmp/server.py || true)"
            echo "--- log tail ---"
            tail -n 100 /tmp/hk-1166.log
          } > audit/hk-1166-diagnostic.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git add audit/hk-1166-diagnostic.txt
          git commit -m "Record TopKing 1.16.6 Rumors diagnostic" || true
          git push origin HEAD:main || true

          exit "$code"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/server.py /tmp/hk-1166.log
