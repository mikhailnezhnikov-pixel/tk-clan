name: Smoke Rumors Hunter 1.18.15 Live

on:
  push:
    paths:
      - 'deploy/topking/rumors-hunter-live-smoke-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smoke-rumors-hunter-live
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Verify public userscript and health
        run: |
          set -euo pipefail
          base=https://hk-license.89.125.1.71.sslip.io

          curl -fsS --retry 5 --retry-delay 2 "$base/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True,d
          print('HEALTH=PASS')
          PY

          curl -fsS --retry 5 --retry-delay 2 "$base/panel.js?smoke=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          node --check baseline/topking/HamsterKingMobile.current.user.js
          cmp -s /tmp/public.js baseline/topking/HamsterKingMobile.current.user.js
          grep -Fq "// @version      1.18.15" /tmp/public.js
          grep -Fq "const BUILD_VERSION = '1.18.15';" /tmp/public.js
          grep -Fq "rumors-hunter-coordinator-kokkaras-v40-20260926-r4" /tmp/public.js
          grep -Fq "class HKRumorCityHunter" /tmp/public.js
          grep -Fq "async function runRumorHunter()" /tmp/public.js
          grep -Fq "async function runDailyRumors(internal = false)" /tmp/public.js
          grep -Fq "treasure-run-recorder-stability-blockers-20260926-r2" /tmp/public.js
          grep -Fq "battle-visible-board-active-20260926-r1" /tmp/public.js
          grep -Fq "false zero is not stored." /tmp/public.js
          sha256sum /tmp/public.js | awk '{print $1}' > /tmp/public.sha

      - name: Verify protected rumor routes exist
        run: |
          set -euo pipefail
          base=https://hk-license.89.125.1.71.sslip.io
          origin=https://app.hamsterking.games

          today_code=$(curl -sS -o /tmp/today-unauth.json -w '%{http_code}'             -X POST -H "Origin: $origin" -H 'Content-Type: application/json'             --data '{}' "$base/api/v1/rumors/today")
          hunter_code=$(curl -sS -o /tmp/hunter-unauth.json -w '%{http_code}'             -X POST -H "Origin: $origin" -H 'Content-Type: application/json'             --data '{"action":"state","clan_id":"smoke"}' "$base/api/v1/rumors/hunter")

          test "$today_code" = 401
          test "$hunter_code" = 401
          grep -Fq '"unauthorized"' /tmp/today-unauth.json
          grep -Fq '"unauthorized"' /tmp/hunter-unauth.json
          printf '%s\n' "$today_code" > /tmp/today.code
          printf '%s\n' "$hunter_code" > /tmp/hunter.code

      - name: Verify live coordinator state read-only
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new             root@89.125.1.71 'python3 - <<'"'"'PY'"'"'
          import importlib.util,sqlite3,json
          path="/opt/hamsterking-license/server.py"
          text=open(path,encoding="utf-8").read()
          for marker in [
              "HK_RUMORS_COORDINATOR_R3",
              "def rumor_hunter_action",
              "def rumor_hunter_state",
              "path == \"/api/v1/rumors/hunter\"",
              "fetch_kokkaras_rumors",
          ]:
              assert marker in text,marker

          spec=importlib.util.spec_from_file_location("hk_live_server",path)
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)
          s.init_db()

          db=sqlite3.connect("/var/lib/hamsterking-license/licenses.db")
          names={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type=?",("table",))}
          required={"rumor_observations","rumor_hunter_presence","rumor_hunter_cities","rumor_hunter_history","rumor_routes"}
          assert required.issubset(names),(required-names)

          cycle=s.active_rumor_route_date()
          feed=s.fetch_kokkaras_rumors(force=True)
          assert feed and str(feed.get("date") or "")==cycle,(cycle,feed and feed.get("date"))
          routes=feed.get("routes") or []
          assert len(routes)==17,len(routes)
          points=sum(len(r.get("points") or []) for r in routes)
          assert points==51,points

          known=s.rumor_hunter_known_map(cycle)
          assert len(known)==17,len(known)
          known_points=sum(len((row or {}).get("points") or []) for row in known.values())
          assert known_points==51,known_points

          route_row=db.execute("SELECT route_date,routes_json,published_at FROM rumor_routes WHERE route_date=?",(cycle,)).fetchone()
          assert route_row is not None,cycle
          stored=json.loads(route_row[1] or "[]")
          assert len(stored)==17,len(stored)

          print("COORDINATOR_READONLY_SMOKE=PASS")
          print("cycle="+cycle)
          print("kokkaras_cities=17")
          print("kokkaras_points=51")
          print("known_map_cities=17")
          print("known_map_points=51")
          db.close()
          PY' | tee /tmp/coordinator-smoke.txt

          systemctl_status=$(ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71             'systemctl is-active hamsterking-license.service')
          test "$systemctl_status" = active

      - name: Verify coordinator lifecycle on temporary database
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'python3 - <<'"'"'PY'"'"'
          import importlib.util,os,tempfile

          path="/opt/hamsterking-license/server.py"
          spec=importlib.util.spec_from_file_location("hk_lifecycle_server",path)
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)

          fd,tmp=tempfile.mkstemp(prefix="hk-rumor-lifecycle-",suffix=".db")
          os.close(fd)
          os.unlink(tmp)
          try:
              s.DB_PATH=tmp
              s.init_db()
              s.rumor_hunter_known_map=lambda cycle_id: {}

              player="smoke-player"
              clan="smoke-clan"
              city1=s.RUMOR_HUNTER_CITIES[0][0]
              city2=s.RUMOR_HUNTER_CITIES[1][0]
              base={
                  "clan_id":clan,
                  "nickname":"Smoke Hunter",
                  "timezone":"UTC",
                  "unlocked_city_ids":[city1,city2],
                  "ready":True,
              }

              state=s.rumor_hunter_action(player,"heartbeat",base)
              assert state["ok"] is True,state
              assigned=[c for c in state["cities"] if c["assigned_player_id"]==player and c["status"]=="queued"]
              assert {c["city_id"] for c in assigned}=={city1,city2},assigned

              claim1=s.rumor_hunter_action(player,"claim",{**base,"city_id":city1})
              assert claim1["ok"] is True,claim1
              token1=claim1["lease_token"]
              assert token1 and claim1["lease_until"]>s.utc_now(),claim1

              progress1=s.rumor_hunter_action(player,"progress",{
                  **base,
                  "city_id":city1,
                  "lease_token":token1,
                  "probes":4,
                  "posts":3,
                  "wait409":1,
                  "jackpots":[{"x":11,"y":12,"gamearea_id":"smoke-area-a","rumor_id":"rumor_jackpot_test"}],
              })
              assert progress1["ok"] is True,progress1
              row1=next(c for c in progress1["state"]["cities"] if c["city_id"]==city1)
              assert row1["status"]=="running" and row1["probes"]==4 and row1["posts"]==3 and row1["wait409"]==1,row1
              assert len(row1["jackpots"])==1,row1

              release1=s.rumor_hunter_action(player,"release",{
                  **base,"city_id":city1,"lease_token":token1
              })
              assert release1["ok"] is True,release1
              row1=next(c for c in release1["state"]["cities"] if c["city_id"]==city1)
              assert row1["status"]=="queued" and row1["assigned_player_id"]==player,row1

              claim2=s.rumor_hunter_action(player,"claim",{**base,"city_id":city2})
              assert claim2["ok"] is True,claim2
              token2=claim2["lease_token"]

              points=[
                  {"x":21,"y":31,"gamearea_id":"smoke-area-1","rumor_id":"rumor_jackpot_test_1"},
                  {"x":22,"y":32,"gamearea_id":"smoke-area-2","rumor_id":"rumor_jackpot_test_2"},
                  {"x":23,"y":33,"gamearea_id":"smoke-area-3","rumor_id":"rumor_jackpot_test_3"},
              ]
              done=s.rumor_hunter_action(player,"done",{
                  **base,
                  "city_id":city2,
                  "lease_token":token2,
                  "probes":9,
                  "posts":8,
                  "wait409":2,
                  "jackpots":points,
              })
              assert done["ok"] is True,done
              row2=next(c for c in done["state"]["cities"] if c["city_id"]==city2)
              assert row2["status"]=="done" and len(row2["jackpots"])==3,row2
              assert row2["assigned_player_id"]=="",row2

              ready=s.rumor_hunter_action(player,"claim",{**base,"city_id":city2})
              assert ready["ok"] is False and ready["error"]=="RESULT_READY",ready

              left=s.rumor_hunter_action(player,"leave",{**base,"ready":False})
              self_row=next(p for p in left["players"] if p["player_id"]==player)
              assert self_row["ready"] is False,self_row
              row1=next(c for c in left["cities"] if c["city_id"]==city1)
              assert row1["status"]=="unassigned" and row1["assigned_player_id"]=="",row1

              print("COORDINATOR_TEMPDB_LIFECYCLE=PASS")
              print("heartbeat_assignment=PASS")
              print("claim_lease=PASS")
              print("progress_metrics=PASS")
              print("release=PASS")
              print("done_3of3=PASS")
              print("result_ready=PASS")
              print("leave_cleanup=PASS")
          finally:
              for suffix in ("","-wal","-shm"):
                  try: os.remove(tmp+suffix)
                  except FileNotFoundError: pass
          PY' | tee /tmp/coordinator-lifecycle.txt

      - name: Persist smoke audit
        run: |
          set -euo pipefail
          git pull --rebase origin main

          {
            echo "RUMORS_HUNTER_1_18_15_LIVE_SMOKE=PASS"
            echo "version=1.18.15"
            echo "public_userscript_exact_match=PASS"
            echo "public_sha256=$(cat /tmp/public.sha)"
            echo "health=PASS"
            echo "today_route_unauthorized_guard=$(cat /tmp/today.code)"
            echo "hunter_route_unauthorized_guard=$(cat /tmp/hunter.code)"
            echo "service=active"
            echo "coordinator_marker=PASS"
            echo "coordinator_tables=PASS"
            echo "coordinator_readonly_smoke=PASS"
            echo "coordinator_tempdb_lifecycle=PASS"
            echo "heartbeat_assignment=PASS"
            echo "claim_lease=PASS"
            echo "progress_metrics=PASS"
            echo "release=PASS"
            echo "done_3of3=PASS"
            echo "result_ready=PASS"
            echo "leave_cleanup=PASS"
            echo "kokkaras_cities=17"
            echo "kokkaras_points=51"
            echo "known_map_cities=17"
            echo "known_map_points=51"
            echo "runDailyRumors=PRESERVED"
            echo "full235_zero_guard=PRESERVED"
            echo "treasure_recorder_stability=PRESERVED"
            echo "battle_visible_board=PRESERVED"
            echo "game_mutations=NONE"
          } > audit/hk-rumors-hunter-1-18-15-live-smoke.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-rumors-hunter-1-18-15-live-smoke.txt
          git commit -m "audit: smoke full Rumors Hunter 1.18.15 live"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: |
          rm -f "$HOME/.ssh/topking" /tmp/health.json /tmp/public.js /tmp/public.sha             /tmp/today-unauth.json /tmp/hunter-unauth.json /tmp/today.code /tmp/hunter.code             /tmp/coordinator-smoke.txt /tmp/coordinator-lifecycle.txt
