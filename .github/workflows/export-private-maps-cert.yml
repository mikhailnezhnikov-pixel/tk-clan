name: Export private maps upload certificate

on:
  push:
    paths:
      - '.github/workflows/export-private-maps-cert.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"
      - name: Fetch public recipient certificate
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/private-maps/upload-cert.pem /tmp/upload-cert.pem
          openssl x509 -in /tmp/upload-cert.pem -noout -subject -fingerprint -sha256
      - name: Upload certificate
        uses: actions/upload-artifact@v4
        with:
          name: private-maps-upload-cert
          path: /tmp/upload-cert.pem
          retention-days: 1
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/upload-cert.pem
