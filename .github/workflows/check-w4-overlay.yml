name: Check W5 provenance priority
on:
  push:
    paths: ['deploy/topking/w5-check-trigger.txt']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: fetch live server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/topking
          chmod 600 ~/.ssh/topking
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          test "$(sha256sum /tmp/server.py|awk '{print $1}')" = "c1c583230f632ed38c654a00541809b1a7cb2f2bf0296708f4c44b2456ad46ce"
      - name: patch candidate
        run: |
          set -euo pipefail
          python3 deploy/topking/patch_server_maps_shared_kb_w5.py
          python3 -m py_compile /tmp/server.py
          grep -Fq HK_MAP_PROVENANCE_W5_V1 /tmp/server.py
          sha256sum /tmp/server.py
      - name: provenance regression
        run: |
          python3 - <<'PY'
          import importlib.util,os,tempfile
          spec=importlib.util.spec_from_file_location('s','/tmp/server.py')
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)
          fd,path=tempfile.mkstemp(suffix='.db');os.close(fd)
          try:
            s.DB_PATH=path
            s.init_db()
            with s.db_session() as db:
              db.execute("INSERT INTO map_areas(area_id,city_id,city_name,x,y,expected_buildings,last_player_id,last_seen) VALUES(?,?,?,?,?,?,?,?)",('area-w5','c','Test',1,2,1,'legacy',100))
              db.execute("INSERT INTO map_area_aliases(source_area_id,canonical_area_id,first_seen,last_seen) VALUES(?,?,?,?)",('area-w5','area-w5',100,100))
              db.execute("INSERT INTO hk_maps_catalog(map_key,city,grid,open_url,published,updated_at) VALUES(?,?,?,?,?,?)",('hk_test0102','Test','02:01','/x',1,100))
              db.execute("INSERT INTO hk_map_points(map_key,points_json,point_count,updated_at) VALUES(?,?,?,?)",('hk_test0102','[100000,200000,2]',1,100))
              db.execute("INSERT INTO hk_map_area_links(map_key,canonical_area_id,match_method,linked_at) VALUES(?,?,?,?)",('hk_test0102','area-w5','exact_area_id',100))
              db.execute("INSERT INTO map_buildings(area_id,building_id,room_count,has_events,last_player_id,last_seen) VALUES(?,?,?,?,?,?)",('area-w5','way1',2,1,'source-hk-maps-import',100))
            s.init_db()
            with s.db_session() as db:
              r=db.execute("SELECT knowledge_source,knowledge_observed_at FROM map_buildings WHERE area_id='area-w5' AND building_id='way1'").fetchone()
              assert r['knowledge_source']=='hk_maps_import' and r['knowledge_observed_at']==100,dict(r)
            live=s.submit_map_area('player-live',{
              'area_id':'area-w5','city_id':'c','city_name':'Test','x':1,'y':2,'invest_count':0,'expected_buildings':1,
              'buildings':[{'building_id':'way1','opened':True,'room_count':0,'has_events':False,'is_invest':False,'tier':None,'faction':'','building_type':''}]
            })
            assert live['ignored_complete'] is False,live
            with s.db_session() as db:
              r=db.execute("SELECT room_count,has_events,knowledge_source,knowledge_observed_at FROM map_buildings WHERE area_id='area-w5' AND building_id='way1'").fetchone()
              assert r['room_count']==0 and r['has_events']==0 and r['knowledge_source']=='game_live',dict(r)
              live_ts=r['knowledge_observed_at']
              db.execute("INSERT INTO map_buildings(area_id,building_id,room_count,last_player_id,last_seen,knowledge_source,knowledge_observed_at) VALUES(?,?,?,?,?,?,?)",('area-w5','way2',None,'legacy',50,'legacy',50))
            imp=s.import_hk_map_room_knowledge('hk_test0102',[{'building_id':'way1','room_count':3},{'building_id':'way2','room_count':2}])
            assert imp['filled']==1 and imp['preserved_nonnull']==1,imp
            with s.db_session() as db:
              a=db.execute("SELECT room_count,knowledge_source,knowledge_observed_at FROM map_buildings WHERE area_id='area-w5' AND building_id='way1'").fetchone()
              b=db.execute("SELECT room_count,knowledge_source,knowledge_observed_at FROM map_buildings WHERE area_id='area-w5' AND building_id='way2'").fetchone()
              assert a['room_count']==0 and a['knowledge_source']=='game_live' and a['knowledge_observed_at']==live_ts,dict(a)
              assert b['room_count']==2 and b['knowledge_source']=='hk_maps_import' and b['knowledge_observed_at']>=live_ts,dict(b)
            old=s.submit_map_area('kokkaras-import',{
              'area_id':'area-w5','city_id':'c','city_name':'Test','x':1,'y':2,'invest_count':0,'expected_buildings':2,
              'buildings':[{'building_id':'way1','opened':True,'room_count':5,'has_events':True,'is_invest':False,'tier':None,'faction':'','building_type':''},{'building_id':'way2','opened':True,'room_count':5,'has_events':True,'is_invest':False,'tier':None,'faction':'','building_type':''}]
            })
            assert old['ignored_complete'] is True,old
            d=s.map_detail('area-w5')
            by={x['building_id']:x for x in d['buildings']}
            assert by['way1']['room_count']==0 and by['way1']['knowledge_source']=='game_live'
            assert by['way2']['room_count']==2 and by['way2']['knowledge_source']=='hk_maps_import'
            assert by['way1']['knowledge_observed_at']>0 and by['way2']['knowledge_observed_at']>0
            print('W5_BACKFILL=PASS')
            print('W5_GAME_LIVE_OVERWRITES_COMPLETE=PASS')
            print('W5_IMPORT_CANNOT_OVERWRITE_GAME_LIVE=PASS')
            print('W5_LEGACY_CANNOT_OVERWRITE_COMPLETE=PASS')
            print('W5_SOURCE_TIMESTAMP_INSPECTABLE=PASS')
          finally:
            try:os.remove(path)
            except OSError:pass
          PY
