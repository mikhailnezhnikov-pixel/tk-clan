name: W6 dry-run all website maps
on:
  push:
    paths: ['deploy/topking/w6-dryrun-trigger.txt']
permissions:
  contents: write
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: prepare ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/topking
          chmod 600 ~/.ssh/topking
      - name: export live map data read-only
        run: |
          cat > /tmp/w6-export.py <<'PY'
          import importlib.util,json,sqlite3
          DB='file:/var/lib/hamsterking-license/licenses.db?mode=ro'
          spec=importlib.util.spec_from_file_location('s','/opt/hamsterking-license/server.py')
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)
          db=sqlite3.connect(DB,uri=True);db.row_factory=sqlite3.Row
          catalog=db.execute("SELECT map_key,city,grid FROM hk_maps_catalog ORDER BY map_key").fetchall()
          links={r['map_key']:dict(r) for r in db.execute("SELECT map_key,canonical_area_id,match_method,linked_at FROM hk_map_area_links")}
          out={'maps':[],'catalog_count':len(catalog),'existing_links':list(links.values())}
          for row in catalog:
              key=row['map_key']
              disc=s.discover_hk_map_area(db,key)
              item={'map_key':key,'city':row['city'],'grid':row['grid'],'discovery':disc,'existing_link':links.get(key)}
              p=db.execute("SELECT points_json,point_count FROM hk_map_points WHERE map_key=?",(key,)).fetchone()
              item['point_count']=int(p['point_count']) if p else 0
              item['points']=json.loads(p['points_json'] or '[]') if p else []
              if len(disc.get('candidates') or [])==1:
                  area=disc['candidates'][0]
                  item['canonical_area_id']=area
                  item['canonical_buildings']=[dict(r) for r in db.execute(
                      """SELECT building_id,room_count,is_invest,knowledge_source,knowledge_observed_at
                         FROM map_buildings WHERE area_id=? ORDER BY building_id""",(area,))]
              out['maps'].append(item)
          out['map_areas_count']=db.execute("SELECT COUNT(*) FROM map_areas").fetchone()[0]
          out['map_buildings_count']=db.execute("SELECT COUNT(*) FROM map_buildings").fetchone()[0]
          print(json.dumps(out,ensure_ascii=False,separators=(',',':')))
          db.close()
          PY
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/w6-export.py root@89.125.1.71:/tmp/w6-export.py
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/w6-export.py' > /tmp/w6-input.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/w6-input.json'))
          assert d['catalog_count']==235,d['catalog_count']
          print('W6_EXPORT=PASS maps=',d['catalog_count'],'areas=',d['map_areas_count'],'buildings=',d['map_buildings_count'])
          PY
      - name: resolve positive points against OSM
        run: |
          cat > /tmp/w6-analyze.py <<'PY'
          import json,time,urllib.parse,urllib.request
          from collections import Counter,defaultdict
          src=json.load(open('/tmp/w6-input.json'))
          def decode(flat):
              lng=lat=0;out=[]
              for i in range(0,len(flat),3):
                  lng+=int(flat[i]);lat+=int(flat[i+1]);flag=int(flat[i+2])
                  inv=flag>=7;rooms=flag-8 if inv else flag
                  out.append({'point_index':i//3,'lon':lng/1e5,'lat':lat/1e5,'room_count':rooms,'investment':inv,'source_flag':flag})
              return out
          def inside(ring,x,y):
              if len(ring)<3:return False
              ok=False;j=len(ring)-1
              for i in range(len(ring)):
                  xi,yi=ring[i];xj,yj=ring[j]
                  if ((yi>y)!=(yj>y)):
                      cross=(xj-xi)*(y-yi)/(yj-yi)+xi
                      if x<cross:ok=not ok
                  j=i
              return ok
          def polygons(e):
              if e.get('type')=='way':
                  g=[(float(n['lon']),float(n['lat'])) for n in e.get('geometry') or [] if 'lon' in n and 'lat' in n]
                  return [g] if len(g)>=3 else []
              segs=[]
              for m in e.get('members') or []:
                  if m.get('role')!='outer':continue
                  g=[(float(n['lon']),float(n['lat'])) for n in m.get('geometry') or [] if 'lon' in n and 'lat' in n]
                  if len(g)>=2:segs.append(g)
              rings=[]
              while segs:
                  ring=segs.pop(0);changed=True
                  while changed and segs:
                      changed=False
                      for k,g in enumerate(segs):
                          if ring[-1]==g[0]:ring.extend(g[1:]);segs.pop(k);changed=True;break
                          if ring[-1]==g[-1]:ring.extend(list(reversed(g[:-1])));segs.pop(k);changed=True;break
                          if ring[0]==g[-1]:ring=g[:-1]+ring;segs.pop(k);changed=True;break
                          if ring[0]==g[0]:ring=list(reversed(g[1:]))+ring;segs.pop(k);changed=True;break
                  if len(ring)>=3:rings.append(ring)
              return rings
          def call(q):
              body=urllib.parse.urlencode({'data':q}).encode()
              last=None
              endpoints=('https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.nchc.org.tw/api/interpreter')
              for endpoint in endpoints:
                  for attempt in range(3):
                      try:
                          req=urllib.request.Request(endpoint,data=body,headers={'User-Agent':'TopKing-W6-dryrun/2.0'})
                          with urllib.request.urlopen(req,timeout=55) as r:return json.load(r)
                      except Exception as exc:
                          last=repr(exc);time.sleep(2+attempt*2)
              raise RuntimeError(str(last))
          def canonical_features(ids):
              ways=[int(x[3:]) for x in ids if x.startswith('way') and x[3:].isdigit()]
              rels=[int(x[8:]) for x in ids if x.startswith('relation') and x[8:].isdigit()]
              chunks=[]
              for x in ways:chunks.append(f'way({x});')
              for x in rels:chunks.append(f'relation({x});')
              if not chunks:return {}
              data=call('[out:json][timeout:45];('+''.join(chunks)+');out geom;')
              out={}
              for e in data.get('elements',[]):
                  typ=e.get('type');eid=e.get('id')
                  if typ not in ('way','relation') or eid is None:continue
                  ps=polygons(e)
                  if ps:out[('way' if typ=='way' else 'relation')+str(eid)]=ps
              return out
          def local_features(p):
              d=0.00045;south=p['lat']-d;north=p['lat']+d;west=p['lon']-d;east=p['lon']+d
              q=f'[out:json][timeout:25];(way["building"]({south},{west},{north},{east});relation["building"]({south},{west},{north},{east}););out geom;'
              data=call(q);out={}
              for e in data.get('elements',[]):
                  typ=e.get('type');eid=e.get('id')
                  if typ not in ('way','relation') or eid is None:continue
                  ps=polygons(e)
                  if ps:out[('way' if typ=='way' else 'relation')+str(eid)]=ps
              return out
          metrics=Counter();map_rows=[];manifests=[];target_to_maps=defaultdict(list)
          for m in src['maps']:
              c=m['discovery'].get('candidates') or []
              if len(c)==1:
                  metrics['city_grid_yx_matches']+=1;target_to_maps[c[0]].append(m['map_key'])
              elif len(c)==0:metrics['unresolved_maps']+=1
              else:metrics['ambiguous_maps']+=1
          metrics['exact_area_id_matches']=sum(1 for x in src['existing_links'] if x['match_method']=='exact_area_id')
          duplicate_targets={k:v for k,v in target_to_maps.items() if len(v)>1}
          metrics['duplicate_target_groups']=len(duplicate_targets);metrics['duplicate_target_maps']=sum(len(v) for v in duplicate_targets.values())
          resolved_i=0
          for m in src['maps']:
              c=m['discovery'].get('candidates') or []
              row={'map_key':m['map_key'],'city':m['city'],'grid':m['grid'],'candidate_count':len(c),'candidates':c,'existing_link':m.get('existing_link')}
              if len(c)!=1:map_rows.append(row);continue
              resolved_i+=1;area=c[0];pts=decode(m['points']);can={x['building_id']:x for x in m.get('canonical_buildings') or []}
              feats=canonical_features(list(can))
              unique=[];unmatched=[];amb=[];used={}
              for p in pts:
                  hits=[bid for bid,polys in feats.items() if any(inside(poly,p['lon'],p['lat']) for poly in polys)]
                  if len(hits)==1:
                      bid=hits[0]
                  elif len(hits)>1:
                      amb.append({**p,'candidates':sorted(hits),'reason':'multiple_canonical_buildings'});continue
                  else:
                      local=local_features(p)
                      local_hits=[bid for bid,polys in local.items() if any(inside(poly,p['lon'],p['lat']) for poly in polys)]
                      if len(local_hits)==1:bid=local_hits[0]
                      elif len(local_hits)>1:
                          amb.append({**p,'candidates':sorted(local_hits),'reason':'multiple_local_buildings'});continue
                      else:
                          unmatched.append(p);continue
                  if bid in used:
                      amb.append({**p,'candidates':[bid],'reason':'duplicate_building_point','other_point_index':used[bid]});continue
                  used[bid]=p['point_index'];cur=can.get(bid)
                  rec={**p,'building_id':bid,'existing':bool(cur)}
                  if cur:
                      rec['canonical_room_count']=cur['room_count'];rec['canonical_source']=cur['knowledge_source'];rec['canonical_observed_at']=cur['knowledge_observed_at']
                      metrics['building_rows_already_known']+=1
                      if cur['room_count'] is None:metrics['existing_null_fill_candidates']+=1
                      elif int(cur['room_count'])!=int(p['room_count']):
                          metrics['room_count_conflicts_total']+=1;metrics['room_count_conflicts_'+str(cur['knowledge_source'])]+=1
                      else:metrics['room_count_same']+=1
                  else:metrics['building_rows_to_add']+=1
                  unique.append(rec)
              metrics['source_positive_points']+=len(pts);metrics['point_unique_matches']+=len(unique);metrics['point_unmatched']+=len(unmatched);metrics['point_ambiguous']+=len(amb)
              row.update({'canonical_area_id':area,'source_points':len(pts),'unique_points':len(unique),'unmatched_points':len(unmatched),'ambiguous_points':len(amb)})
              map_rows.append(row);manifests.append({'map_key':m['map_key'],'canonical_area_id':area,'area_match_method':'city_grid_yx','points':unique,'unmatched':unmatched,'ambiguous':amb})
              print(f"[resolved {resolved_i}/{metrics['city_grid_yx_matches']}] {m['map_key']} unique={len(unique)} unmatched={len(unmatched)} ambiguous={len(amb)}",flush=True)
              time.sleep(0.25)
          report={'stage':'W6','dry_run':True,'total_maps':src['catalog_count'],'existing_links_before':len(src['existing_links']),
            'exact_area_id_matches':metrics['exact_area_id_matches'],'city_grid_yx_matches':metrics['city_grid_yx_matches'],
            'unresolved_maps':metrics['unresolved_maps'],'ambiguous_maps':metrics['ambiguous_maps'],
            'duplicate_target_groups':metrics['duplicate_target_groups'],'duplicate_target_maps':metrics['duplicate_target_maps'],'duplicate_targets':duplicate_targets,
            'source_positive_points':metrics['source_positive_points'],'point_unique_matches':metrics['point_unique_matches'],'point_unmatched':metrics['point_unmatched'],'point_ambiguous':metrics['point_ambiguous'],
            'building_rows_to_add':metrics['building_rows_to_add'],'building_rows_already_known':metrics['building_rows_already_known'],
            'existing_null_fill_candidates':metrics['existing_null_fill_candidates'],'room_count_same':metrics['room_count_same'],
            'room_count_conflicts_total':metrics['room_count_conflicts_total'],
            'room_count_conflicts_by_source':{'game_live':metrics['room_count_conflicts_game_live'],'hk_maps_import':metrics['room_count_conflicts_hk_maps_import'],'legacy':metrics['room_count_conflicts_legacy']},
            'maps':map_rows,'migration_manifest':manifests}
          assert report['total_maps']==235
          assert report['city_grid_yx_matches']+report['unresolved_maps']+report['ambiguous_maps']==235
          open('audit/hk-stage2-w6-dryrun.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          summary={k:v for k,v in report.items() if k not in ('maps','migration_manifest','duplicate_targets')}
          open('audit/hk-stage2-w6-dryrun-summary.txt','w',encoding='utf-8').write('\n'.join(f'{k}={v}' for k,v in summary.items())+'\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True))
          PY
          python3 /tmp/w6-analyze.py
      - name: commit dry-run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-w6-dryrun.json audit/hk-stage2-w6-dryrun-summary.txt
          git commit -m "audit: W6 dry-run all 235 website maps"
          git pull --rebase origin main
          git push origin HEAD:main
