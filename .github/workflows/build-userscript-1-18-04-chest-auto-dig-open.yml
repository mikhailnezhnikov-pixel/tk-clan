name: Build Userscript 1.18.04 Chest Auto Dig Open

on:
  push:
    paths:
      - 'deploy/topking/patch_chest_auto_dig_open_1_18_04.py'
      - '.github/workflows/build-userscript-1-18-04-chest-auto-dig-open.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-userscript-1-18-04-chest-auto-dig-open
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate from exact live baseline
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          test -f "$base"
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.18.03" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.18.03';" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-victory-tap-fallback-20260926-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_chest_auto_dig_open_1_18_04.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.04" /tmp/HamsterKingMobile.user.js
          grep -Fq "const BUILD_VERSION = '1.18.04';" /tmp/HamsterKingMobile.user.js
          grep -Fq "chest-auto-dig-open-20260926-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "Автосундуки: ВКЛ" /tmp/HamsterKingMobile.user.js
          grep -Fq "runTreasureChestAuto" /tmp/HamsterKingMobile.user.js
          grep -Fq "item_treasurehunt_key_epic" /tmp/HamsterKingMobile.user.js
          grep -Fq "mf_treasurelot_chest_type_01" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-victory-tap-fallback-20260926-r1" /tmp/HamsterKingMobile.user.js

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate and release manifest
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.04.chest-auto-dig-open.candidate.user.js
          audit=audit/hk-userscript-1-18-04-chest-auto-dig-open-predeploy.txt

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
            cp /tmp/HamsterKingMobile.user.js "$candidate"

            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.03':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.03',
              'target_version':'1.18.04',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.04.chest-auto-dig-open.candidate.user.js',
              'primary_marker':'chest-auto-dig-open-20260926-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-04-chest-auto-dig-open-live-status.txt',
              'commit_message':'fix: deploy Treasure chest auto dig/open in userscript 1.18.04',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

            mkdir -p "$(dirname "$audit")"
            {
              echo "USERSCRIPT_1_18_04_CHEST_AUTO_DIG_OPEN_PREDEPLOY=PASS"
              echo "source_version=1.18.03"
              echo "target_version=1.18.04"
              echo "scope=COMMON_HK_USERSCRIPT_ONLY"
              echo "public_treasure_script=UNCHANGED"
              echo "dig_cost=item_treasurehunt_energy:5"
              echo "found_chest_type01_cost=item_treasurehunt_energy:5"
              echo "chest_015_cost=item_treasurehunt_key_common:1"
              echo "chest_02_cost=item_treasurehunt_key_uncommon:1"
              echo "chest_03_cost=item_treasurehunt_key_epic:1"
              echo "insufficient_resources=SKIP"
              echo "reward_chain=DISMISS_TO_END"
              echo "syntax=PASS"
              echo "base_sha256=$(cat /tmp/base.sha)"
              echo "candidate_sha256=$(cat /tmp/candidate.sha)"
            } > "$audit"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$candidate" deploy/topking/userscript-release.json "$audit"
            git commit -m "build: prepare userscript 1.18.04 chest auto dig/open"

            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
