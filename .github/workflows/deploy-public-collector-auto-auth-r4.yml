name: Deploy Public Collector Auto Auth R4

on:
  push:
    paths:
      - 'deploy/topking/public-collector-auto-auth-r4-trigger.txt'

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh current main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate repo code
        run: |
          set -euo pipefail
          python3 -m py_compile \
            deploy/topking/public_collector.py \
            deploy/topking/patch_public_collector_auth_heartbeat_r1.py \
            deploy/topking/patch_public_collector_auth_client_r1.py
          grep -Fq 'REV = "public-server-collector-20260921-r4-auto-auth"' deploy/topking/public_collector.py

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch fresh live server and userscript
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/server.py | awk '{print $1}' > /tmp/server-source.sha
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/userscript-source.sha
          grep -Fq "PUBLIC_SNAPSHOT_SERVER_ONLY_R3" /tmp/server.py
          grep -Fq "PUBLIC_RATINGS_SERVER_ONLY_R3" /tmp/server.py
          grep -Fq "HK_EXPLORE_CANON_REV='explore-e3-single-20260920-r9-runner'" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PUBLIC_SNAPSHOT_CLIENT_REV = 'public-server-only-20260920-r2'" /tmp/HamsterKingMobile.user.js

      - name: Build candidates against fresh live
        run: |
          set -euo pipefail
          python3 deploy/topking/patch_public_collector_auth_heartbeat_r1.py /tmp/server.py
          python3 deploy/topking/patch_public_collector_auth_client_r1.py /tmp/HamsterKingMobile.user.js
          python3 -m py_compile /tmp/server.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "PUBLIC_COLLECTOR_AUTH_HEARTBEAT_R1" /tmp/server.py
          grep -Fq "PUBLIC_COLLECTOR_AUTH_HEARTBEAT_CLIENT_R1" /tmp/HamsterKingMobile.user.js
          grep -Fq "PUBLIC_SNAPSHOT_SERVER_ONLY_R3" /tmp/server.py
          grep -Fq "PUBLIC_RATINGS_SERVER_ONLY_R3" /tmp/server.py
          grep -Fq "HK_EXPLORE_CANON_REV='explore-e3-single-20260920-r9-runner'" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PUBLIC_SNAPSHOT_CLIENT_REV = 'public-server-only-20260920-r2'" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/server.py | awk '{print $1}' > /tmp/server-candidate.sha
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/userscript-candidate.sha

      - name: Race-safe install auto auth
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/server.py root@89.125.1.71:/tmp/server.auto-auth-r4.py
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.auto-auth-r4.user.js
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            deploy/topking/public_collector.py root@89.125.1.71:/tmp/public_collector.r4.py
          server_source="$(cat /tmp/server-source.sha)"
          userscript_source="$(cat /tmp/userscript-source.sha)"
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 "
            set -euo pipefail
            current_server=\$\(sha256sum /opt/hamsterking-license/server.py | awk '{print \\$1}'\)
            current_userscript=\$\(sha256sum /opt/hamsterking-license/HamsterKingMobile.user.js | awk '{print \\$1}')
            test \\"\\$current_server\\" = \"$server_source\" || { echo LIVE_SERVER_CHANGED; exit 42; }
            test \"\\$current_userscript\" = \"$userscript_source\" || { echo LIVE_USERSCRIPT_CHANGED; exit 43; }
            python3 -m py_compile /tmp/server.auto-auth-r4.py /tmp/public_collector.r4.py
            node --check /tmp/HamsterKingMobile.auto-auth-r4.user.js
            stamp=\\$(date +%Y%m%d-%H%M%S%S)
            cp -a /opt/hamsterking-license/server.py /opt/hamsterking-license/server.py.bak.public-auto-auth-r4.\\$stamp
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js.bak.public-auto-auth-r4.\\$stamp
            install -m 0644 /tmp/server.auto-auth-r4.py /opt/hamsterking-license/server.py
            install -m 0644 /tmp/HamsterKingMobile.auto-auth-r4.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            install -m 0755 /tmp/public_collector.r4.py /opt/hamsterking-license/public_collector.py
            if [ ! -is /var/lib/hamsterking-license/public-collector-token ]; then
              set -a
              source /etc/hamsterking-public-collector.env
              set +a
              token=\$\{HK_PUBLIC_COLLECTOR_GAME_TOKEN:-}
              token=\$_token
              if [ -n \"\\token\" ]; then
                umask 077
                printf '%s\n' \"\$token\" > /var/lib/hamsterking-license/public-collector-token
                chmod 600 /var/lib/hamsterking-license/public-collector-token
                fi
            fi
            grep -q '^HK_PUBLIC_COLLECTOR_TOKEN_FILE='%' /etc/hamsterking-public-collector.env || printf '%s\n' 'HK_PUBLIC_COLLECTOR_TOKEN_FILE=/var/lib/hamsterking-license/public-collector-token' >> /etc/hamsterking-public-collector.env
            grep -q '^HK_PUBLIC_COLLECTOR_AUTH_BOOTSTRAP=' /etc/hamsterking-public-collector.env || printf '%s\n' 'HK_PUBLIC_COLLECTOR_AUTH_BOOTSTRAP=/var/lib/hamsterking-license/public-collector-auth.json' >> /etc/hamsterking-public-collector.env
            grep -q '^HK_PUBLIC_COLLECTOR_IDENTITY_FILE='%' /etc/hamsterking-public-collector.env || printf '%s\n' 'HK_PUBLIC_COLLECTOR_IDENTITY_FILE=/var/lib/hamsterking-license/public-collector-identity.sha256' >> /etc/hamsterking-public-collector.env
            grep -q '^HK_PUBLIC_COLLECTOR_AUTH_REFRESH_STATUS=' /etc/hamsterking-public-collector.env || printf '%s\n' 'HK_PUBLIC_COLLECTOR_AUTH_REFRESH_STATUS=/var/lib/hamsterking-license/public-collector-auth-refresh.json' >> /etc/hamsterking-public-collector.env
            chmod 600 /etc/hamsterking-public-collector.env /var/lib/hamsterking-license/public-collector-identity.sha256
            systemctl is-active --quiet hamsterking-license.service
            systemctl is-active --quiet hamsterking-public-war.timer
            systemctl is-active --quiet hamsterking-public-collector.timer
            echo auto_auth_server=PASS
            echo auto_auth_client=PASS
            echo identity_pin=PASS
            echo protected_maps_explore=PASS
          ' > /tmp/auto-auth-r4-status.txt
          cat /tmp/auto-auth-r4-status.txt

      - name: Sync live userscript baseline and audit
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          {
            echo "PUBLIC_COLLECTOR_AUTO_AUTH_R4_LIVE=PASS"
            cat /tmp/auth-r4-status.txt
            echo "server_source_sha=$(cat /tmp/server-source.sha)"
            echo "server_candidate_sha=$(cat /tmp/server-candidate.sha)"
            echo "userscript_source_sha=$(cat /tmp/userscript-source.sha)"
            echo "userscript_candidate_sha=$(cat /tmp/userscript-candidate.sha)"
            echo "token_value_logged=NO"
            echo "auth_data_logged=NO"
          } > audit/hk-public-collector-auto-auth-r4.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-public-collector-auto-auth-r4.txt
          git commit -m "feat: deploy technical collector auth heartbeat" || true
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/server.py /tmp/HamsterKingMobile.user.js /tmp/server-source.sha /tmp/userscript-source.sha /tmp/server-candidate.sha /tmp/userscript-candidate.sha /tmp/auto-auth-r4-status.txt
