name: Deploy TopKing Explore E3 Single R8

on:
  push:
    paths:
      - 'deploy/topking/explore-e3-single-r8-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch current live and patch Explore E3 only
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_EXPLORE_CANON_REV='explore-readonly-plan-20260920-r7-area-types'" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/source.sha
          cp /tmp/HamsterKingMobile.user.js /tmp/before.js

          python3 deploy/topking/patch_explore_e3_single_r8.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_EXPLORE_CANON_REV='explore-e3-single-20260920-r8'" /tmp/HamsterKingMobile.user.js
          grep -Fq "id=\"hk-ex-run-one\"" /tmp/HamsterKingMobile.user.js
          grep -Fq "runExploreE3Single" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /tmp/HamsterKingMobile.user.js
          grep -Fq "'/player/building/fast_completion/cost'" /tmp/HamsterKingMobile.user.js
          grep -Fq "'/player/building/fast_remort/cost'" /tmp/HamsterKingMobile.user.js

          python3 - <<'PY'
          from pathlib import Path
          before=Path('/tmp/before.js').read_text()
          after=Path('/tmp/HamsterKingMobile.user.js').read_text()
          assert "explore-e3-single-20260920-r8" in after
          assert "Запустить тест E3 · 1 здание" in after
          assert "const HK_MAP_READ_CONCURRENCY = 5;" in after
          # Scope guards: the only intentional global change is classification
          # of the two cost endpoints as read-only; Maps and later modules stay intact.
          assert before.count("'/player/building/fast_completion/cost'")==0
          assert before.count("'/player/building/fast_remort/cost'")==0
          assert after.count("'/player/building/fast_completion/cost'")>=2
          assert after.count("'/player/building/fast_remort/cost'")>=2
          assert "const HK_MAP_READ_CONCURRENCY = 5;" in after
          btail=before[before.index("  async function acceptBuildingStudy("):]
          atail=after[after.index("  async function acceptBuildingStudy("):]
          expected_tail=btail.replace("    '/player/building',\n    '/shop/view',","    '/player/building',\n    '/player/building/fast_completion/cost',\n    '/player/building/fast_remort/cost',\n    '/shop/view',",1)
          assert expected_tail==atail
          PY
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Race-safe install
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/source.sha)"
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.explore-e3-r8.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 "set -euo pipefail; current=\$(sha256sum /opt/hamsterking-license/HamsterKingMobile.user.js | awk '{print \$1}'); test \"\$current\" = \"$source_sha\" || { echo LIVE_CHANGED_BEFORE_EXPLORE_E3_R8; exit 42; }; node --check /tmp/HamsterKingMobile.explore-e3-r8.user.js; stamp=\$(date +%Y%m%d-%H%M%S); cp -a /opt/hamsterking-license/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js.bak.explore-e3-r8.\$stamp; install -m 0644 /tmp/HamsterKingMobile.explore-e3-r8.user.js /opt/hamsterking-license/HamsterKingMobile.user.js; systemctl restart hamsterking-license.service; systemctl is-active --quiet hamsterking-license.service"

      - name: Verify public exact candidate
        run: |
          set -euo pipefail
          sleep 2
          curl -fsSL --retry 4 --connect-timeout 15 --max-time 30 "https://hk-license.89.125.1.71.sslip.io/panel.js?explore-e3-r8=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          candidate="$(cat /tmp/candidate.sha)"
          test "$(sha256sum /tmp/public.js | awk '{print $1}')" = "$candidate"
          grep -Fq "HK_EXPLORE_CANON_REV='explore-e3-single-20260920-r8'" /tmp/public.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 5;" /tmp/public.js
          grep -Fq "runExploreE3Single" /tmp/public.js
          {
            echo "EXPLORE_E3_R8_LIVE=PASS"
            echo "source_live_sha256=$(cat /tmp/source.sha)"
            echo "live_sha256=$candidate"
            echo "public_sha256=$candidate"
            echo "public_byte_equality=PASS"
            echo "syntax=PASS"
            echo "e3_scope=single_building"
            echo "plan_detail_cards=REMOVED"
            echo "run_button=ENABLED_AFTER_PLAN"
            echo "fast_completion=ENABLED"
            echo "auto_manual_battles=ENABLED"
            echo "remort=ENABLED"
            echo "instant_max=ENABLED"
            echo "optional_material_buy=ENABLED"
            echo "mutation_retry=NO_BLIND_RETRY"
            echo "post_action_reconcile=PASS"
            echo "map_concurrency_5_preserved=PASS"
            echo "maps_backend_schema_changed=NO"
          } > /tmp/explore-e3-r8-live-status.txt

      - name: Sync baseline and evidence
        run: |
          set -euo pipefail
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
            cp /tmp/explore-e3-r8-live-status.txt audit/hk-stage2-explore-e3-r8-live-status.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-stage2-explore-e3-r8-live-status.txt
            git commit -m "stage2: enable Explore E3 single-building test r8" || true
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = 1

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js /tmp/before.js /tmp/source.sha /tmp/candidate.sha /tmp/explore-e3-r8-live-status.txt
