name: Check TopKing Maps Parallel Read R4

on:
  push:
    paths:
      - 'deploy/topking/maps-parallel-read-r4-check-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-topking-userscript
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_SCANNER_REV = 'maps-active-intersection-20260920-r3'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_COORDS_REV = 'maps-coordinates-column-row-20260920-r1'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "f8a34bff26fd449f315f07a2ef8e6a8a6e8169ea62f463e7efe527766d698101"

      - name: Compile patch
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_maps_parallel_read_r4.py

      - name: Apply and validate only
        run: |
          set -euo pipefail
          python3 deploy/topking/patch_maps_parallel_read_r4.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_SCANNER_REV = 'maps-parallel-read-20260920-r4'" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_READ_CONCURRENCY = 6;" /tmp/HamsterKingMobile.user.js
          grep -Fq "const HK_MAP_SUBMIT_BATCH = 100;" /tmp/HamsterKingMobile.user.js
          grep -Fq "async function mapSubmitBuildingStudyBatch(" /tmp/HamsterKingMobile.user.js
          grep -Fq "Promise.all(Array.from({length:workers},()=>worker()))" /tmp/HamsterKingMobile.user.js
          grep -Fq "activePlayerBuildingIds(state)" /tmp/HamsterKingMobile.user.js
          grep -Fq "ensureCrystalEventCatalog()" /tmp/HamsterKingMobile.user.js
          grep -Fq "hkMutationGate.run('/player/building'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_MAP_COORDS_REV = 'maps-coordinates-column-row-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_BUILDINGS_CANON_REV = 'buildings-canon-core-20260920-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2J_BOSSES_REV = 'bosses-area-target-20260920-r2'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_REWARD_PICKER_REV = 'pits-reward-picker-20260920-r20'" /tmp/HamsterKingMobile.user.js
          sha="$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"
          {
            echo "MAPS_PARALLEL_READ_R4_BUILD=PASS"
            echo "source_live_sha256=f8a34bff26fd449f315f07a2ef8e6a8a6e8169ea62f463e7efe527766d698101"
            echo "candidate_sha256=$sha"
            echo "syntax=PASS"
            echo "deployed=no"
          } > audit/hk-stage2-maps-parallel-read-r4-build-status.txt

      - name: Commit build status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-maps-parallel-read-r4-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "audit: verify parallel map reader r4 build"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js
