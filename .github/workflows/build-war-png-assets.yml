name: Build War PNG Assets

on:
  push:
    paths:
      - 'deploy/topking/build-war-png-assets-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize verified transparent PNG fighters
        run: |
          set -euo pipefail
          mkdir -p assets/war/units/topking assets/war/units/raider

          cat deploy/topking/war-png-parts/topking_idle_*.b64 | tr -d '\n' | base64 -d > assets/war/units/topking/idle.png
          cat \
            deploy/topking/war-png-parts/raider_idle_00.b64 \
            deploy/topking/war-png-parts/raider_idle_01.b64 \
            deploy/topking/war-png-parts/raider_idle_02.b64 \
            deploy/topking/war-png-parts/raider_idle_03_00.b64 \
            deploy/topking/war-png-parts/raider_idle_03_01.b64 \
            deploy/topking/war-png-parts/raider_idle_03_02.b64 \
            deploy/topking/war-png-parts/raider_idle_04.b64 \
            | tr -d '\n' | base64 -d > assets/war/units/raider/idle.png

          echo "TOPKING_SHA=$(sha256sum assets/war/units/topking/idle.png | awk '{print $1}')"
          echo "RAIDER_SHA=$(sha256sum assets/war/units/raider/idle.png | awk '{print $1}')"
          test "$(sha256sum assets/war/units/topking/idle.png | awk '{print $1}')" = "c330943f70605d2ee56b28175e552fbc56deda43bad3d541141e20cd089cb200"
          test "$(sha256sum assets/war/units/raider/idle.png | awk '{print $1}')" = "47b631de3ef116be4595d90af54ebfa755264def9e7074f05daa1be5d2c41b07"
          wc -c assets/war/units/topking/idle.png assets/war/units/raider/idle.png

          # First verified milestone: keep the same clean transparent character art
          # for all states while BattleAnimator supplies movement/hit reaction.
          cp assets/war/units/topking/idle.png assets/war/units/topking/attack.png
          cp assets/war/units/topking/idle.png assets/war/units/topking/hit.png
          cp assets/war/units/raider/idle.png assets/war/units/raider/attack.png
          cp assets/war/units/raider/idle.png assets/war/units/raider/hit.png

          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for group in ("topking","raider"):
              for state in ("idle","attack","hit"):
                  p=Path("assets/war/units")/group/f"{state}.png"
                  with Image.open(p) as im:
                      rgba=im.convert("RGBA")
                      lo,hi=rgba.getchannel("A").getextrema()
                      if lo >= 250:
                          raise SystemExit(f"alpha check failed: {p} alpha={(lo,hi)}")
                      print(f"PNG_OK {p} {rgba.width}x{rgba.height} alpha={(lo,hi)}")
          PY
          echo "WAR_PNG_BINARY_VERIFY=PASS"

      - name: Commit generated PNG assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/war/units/topking/*.png assets/war/units/raider/*.png
          if git diff --cached --quiet; then
            echo "WAR_PNG_ASSETS_ALREADY_CURRENT=PASS"
            exit 0
          fi
          git commit -m "assets: add verified transparent war fighters"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "WAR_PNG_ASSETS_COMMIT=PASS"
