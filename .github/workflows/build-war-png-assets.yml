name: Build War PNG Assets

on:
  push:
    paths:
      - 'deploy/topking/build-war-png-assets-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

      - name: Convert fighter WebP to transparent PNG
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          for group in topking raider bot; do
            for state in idle attack hit; do
              src="assets/war/units/$group/$state.webp"
              dst="assets/war/units/$group/$state.png"
              test -s "$src"
              dwebp "$src" -o "$dst"
            done
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for group in ("topking","raider","bot"):
              for state in ("idle","attack","hit"):
                  p=Path("assets/war/units")/group/f"{state}.png"
                  with Image.open(p) as im:
                      rgba=im.convert("RGBA")
                      alpha=rgba.getchannel("A")
                      lo,hi=alpha.getextrema()
                      transparent=sum(1 for px in alpha.getdata() if px < 250)
                      total=rgba.width*rgba.height
                      if lo >= 250 or transparent < total*0.03:
                          raise SystemExit(f"alpha check failed: {p} extrema={(lo,hi)} transparent={transparent}/{total}")
                      rgba.save(p,format="PNG",optimize=True)
                      print(f"PNG_OK {p} {rgba.width}x{rgba.height} alpha={(lo,hi)} transparent={transparent}/{total}")
          PY

      - name: Commit generated PNG assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/war/units/topking/*.png assets/war/units/raider/*.png assets/war/units/bot/*.png
          if git diff --cached --quiet; then
            echo "WAR_PNG_ASSETS_ALREADY_CURRENT=PASS"
            exit 0
          fi
          git commit -m "assets: add transparent PNG war fighters"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "WAR_PNG_ASSETS_COMMIT=PASS"
