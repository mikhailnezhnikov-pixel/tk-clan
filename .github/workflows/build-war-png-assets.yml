name: Build War PNG Assets

on:
  push:
    paths:
      - 'deploy/topking/build-war-png-assets-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize known-good transparent PNG fighters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets/war/units/topking assets/war/units/raider

          # Top King idle is a verified PNG blob already uploaded to this repository.
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/b3ae740a498466bbf3b24e8a5bde83572c1f5e37"             --jq '.content' | tr -d '\n' | base64 -d > assets/war/units/topking/idle.png

          # Raider idle is staged in small text chunks to avoid binary transport corruption.
          cat deploy/topking/war-png-parts/raider_idle_*.b64 | tr -d '\n' | base64 -d > assets/war/units/raider/idle.png

          # Milestone 1 uses the same verified character art for pose changes;
          # movement, contact, hit reaction and FX remain driven by BattleAnimator.
          cp assets/war/units/topking/idle.png assets/war/units/topking/attack.png
          cp assets/war/units/topking/idle.png assets/war/units/topking/hit.png
          cp assets/war/units/raider/idle.png assets/war/units/raider/attack.png
          cp assets/war/units/raider/idle.png assets/war/units/raider/hit.png

          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for group in ("topking","raider"):
              for state in ("idle","attack","hit"):
                  p=Path("assets/war/units")/group/f"{state}.png"
                  with Image.open(p) as im:
                      rgba=im.convert("RGBA")
                      lo,hi=rgba.getchannel("A").getextrema()
                      if lo >= 250:
                          raise SystemExit(f"alpha check failed: {p} alpha={(lo,hi)}")
                      if rgba.width < 100 or rgba.height < 200:
                          raise SystemExit(f"dimension check failed: {p} {rgba.size}")
                      print(f"PNG_OK {p} {rgba.width}x{rgba.height} alpha={(lo,hi)}")
          PY

      - name: Commit generated PNG assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/war/units/topking/*.png assets/war/units/raider/*.png
          if git diff --cached --quiet; then
            echo "WAR_PNG_ASSETS_ALREADY_CURRENT=PASS"
            exit 0
          fi
          git commit -m "assets: add verified transparent war fighters"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "WAR_PNG_ASSETS_COMMIT=PASS"
