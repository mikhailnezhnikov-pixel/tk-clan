name: Diagnose Maps Crystal Priority

on:
  push:
    paths:
      - 'deploy/topking/maps-crystal-priority-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Capture live map priority context
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/server.py').read_text(encoding='utf-8')
          terms=[
            'def submit_map_area',
            'def import_hk_map_room_knowledge',
            'def hk_map_data',
            'def map_detail',
            'def init_db',
            'CREATE TABLE IF NOT EXISTS map_buildings',
            'CREATE TABLE IF NOT EXISTS hk_map_point_links',
          ]
          out=[]
          for term in terms:
              start=0
              n=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  n+=1
                  out.append(f"\n===== {term} #{n} @ {i} =====\n{s[max(0,i-3000):min(len(s),i+16000)]}\n")
                  start=i+len(term)
                  if n>=4: break
          Path('audit/hk-maps-crystal-priority-live-context.txt').write_text(''.join(out),encoding='utf-8')
          PY

          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 \
            "python3 - <<'PY'
          import sqlite3, json
          db=sqlite3.connect('/var/lib/hamsterking-license/licenses.db');db.row_factory=sqlite3.Row
          out={}
          out['catalog']=db.execute('SELECT COUNT(*) FROM hk_maps_catalog').fetchone()[0]
          out['area_links']=db.execute('SELECT COUNT(*) FROM hk_map_area_links').fetchone()[0]
          out['point_links']=db.execute('SELECT COUNT(*) FROM hk_map_point_links').fetchone()[0]
          out['provenance']=[dict(r) for r in db.execute('SELECT knowledge_source,COUNT(*) n FROM map_buildings GROUP BY knowledge_source ORDER BY knowledge_source')]
          out['linked_room_sources']=[dict(r) for r in db.execute('''
            SELECT mb.knowledge_source, mb.room_count, COUNT(*) n
            FROM hk_map_point_links pl
            JOIN hk_map_area_links al ON al.map_key=pl.map_key
            JOIN map_buildings mb ON mb.area_id=al.area_id AND mb.building_id=pl.building_id
            GROUP BY mb.knowledge_source, mb.room_count
            ORDER BY mb.knowledge_source, mb.room_count
          ''')]
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          db.close()
          PY" > /tmp/maps-crystal-priority-db.json
          cp /tmp/maps-crystal-priority-db.json audit/hk-maps-crystal-priority-db.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-maps-crystal-priority-live-context.txt audit/hk-maps-crystal-priority-db.json
          git commit -m "audit: capture live Maps crystal priority context"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/server.py /tmp/maps-crystal-priority-db.json
