name: Check full235 archive importer V1

on:
  push:
    paths:
      - 'deploy/topking/full235-v1-check-trigger.txt'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          K: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          scp -i ~/.ssh/k -o StrictHostKeyChecking=accept-new root@89.125.1.71:/opt/hamsterking-license/server.py /tmp/server.py
          echo "source_sha=$(sha256sum /tmp/server.py | cut -d' ' -f1)"

      - name: Apply candidate patch
        run: |
          set -euo pipefail
          python3 deploy/topking/patch_server_full235_import_v1.py
          python3 -m py_compile /tmp/server.py
          grep -Fq HK_FULL235_IMPORT_V1 /tmp/server.py
          grep -Fq 'maps/full-import/resolve' /tmp/server.py
          sha256sum /tmp/server.py | tee /tmp/full235-candidate.sha

      - name: Regression on temporary DB
        run: |
          python3 - <<'PY'
          import importlib.util,os,tempfile,hashlib,json
          spec=importlib.util.spec_from_file_location('s','/tmp/server.py')
          s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)
          fd,path=tempfile.mkstemp(prefix='full235-',suffix='.db');os.close(fd)
          mgr={'telegram_id':'mgr','maps_manage':1,'maps_access':1}

          def cat(i):
              key=f'hk_test{i:03d}'
              city=f'Test{i}'
              y=i//100
              x=i%100
              grid=f'{y:02d}:{x:02d}'
              return key,city,grid

          def fullmap(i,rooms=(1,2,3)):
              key,city,grid=cat(i)
              return {'key':key,'city':city,'grid':grid,'buildings':[
                  [f'way{i:03d}a',rooms[0],False,'red','gen_a'],
                  [f'way{i:03d}b',rooms[1],True,'blue','gen_b'],
                  [f'way{i:03d}c',rooms[2],False,'',''],
              ]}

          try:
              s.DB_PATH=path;s.init_db();s.ensure_full235_import_schema()
              now=s.utc_now()
              # Website catalog: exact 235 keys.
              with s.db_session() as db:
                  for i in range(235):
                      key,city,grid=cat(i)
                      db.execute("""INSERT INTO hk_maps_catalog(
                        map_key,city,grid,open_url,published,updated_at)
                        VALUES(?,?,?,?,?,?)""",(key,city,grid,'',0,now))

              # Existing canonical target for map 0, already linked.
              a0={'area_id':'area0','city_id':'city0','city_name':'Test0','coord_revision':'column-row-v1',
                  'x':0,'y':0,'invest_count':0,'expected_buildings':3,'buildings':[
                    {'building_id':'way000a','opened':True,'room_count':5,'has_events':True,'is_invest':False,'tier':1,'faction':'live','building_type':'live'},
                    {'building_id':'way000b','opened':False,'room_count':None,'has_events':False,'is_invest':True,'tier':None,'faction':'','building_type':''},
                    {'building_id':'way000c','opened':False,'room_count':None,'has_events':False,'is_invest':False,'tier':None,'faction':'','building_type':''},
                  ]}
              s.submit_map_area('player-live',a0)
              s.link_hk_map_area('hk_test000','area0')

              # Existing canonical target for map 1, no website link yet.
              a1={'area_id':'area1','city_id':'city1','city_name':'Test1','coord_revision':'column-row-v1',
                  'x':1,'y':0,'invest_count':0,'expected_buildings':3,'buildings':[
                    {'building_id':'way001a','opened':False,'room_count':None,'has_events':False,'is_invest':False,'tier':None,'faction':'','building_type':''},
                    {'building_id':'way001b','opened':False,'room_count':None,'has_events':False,'is_invest':True,'tier':None,'faction':'','building_type':''},
                    {'building_id':'way001c','opened':False,'room_count':None,'has_events':False,'is_invest':False,'tier':None,'faction':'','building_type':''},
                  ]}
              s.submit_map_area('player-live',a1)

              start=s.full235_import_start(mgr,{
                'format':'HK Maps Full Export','version':3,'maps_found':235,'maps_exported':235,
                'errors_count':0,'exported_at':'2026-09-19T10:34:26.478Z',
                'archive_sha256':'a'*64
              })
              batch=start['batch_id']
              docs=[fullmap(i) for i in range(235)]
              for i in range(0,235,10):
                  r=s.full235_import_chunk(mgr,{'batch_id':batch,'maps':docs[i:i+10]})
              assert r['received_maps']==235,r

              # Add a deliberate second canonical hit for map 2: resolver must block.
              with s.db_session() as db:
                  db.execute("""INSERT INTO map_areas(area_id,city_id,city_name,x,y,last_player_id,last_seen)
                                VALUES(?,?,?,?,?,?,?)""",('bad-area','bad-city','Other',99,99,'p',now))
                  db.execute("""INSERT INTO map_area_aliases(source_area_id,canonical_area_id,first_seen,last_seen)
                                VALUES(?,?,?,?)""",('bad-area','bad-area',now,now))
                  db.execute("""INSERT INTO map_buildings(
                    area_id,building_id,opened,room_count,has_events,is_invest,tier,faction,building_type,
                    last_player_id,last_seen,knowledge_source,knowledge_observed_at)
                    VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                    ('bad-area','way002a',1,9,1,0,None,'','','p',now,'game_live',now))
                  # Put another building from the same archive map into area1 -> 2 targets.
                  db.execute("""INSERT INTO map_buildings(
                    area_id,building_id,opened,room_count,has_events,is_invest,tier,faction,building_type,
                    last_player_id,last_seen,knowledge_source,knowledge_observed_at)
                    VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                    ('area1','way002b',1,9,1,0,None,'','','p',now,'game_live',now))
              bad=s.full235_import_resolve(mgr,{'batch_id':batch})
              assert bad['ready_to_apply'] is False,bad['status_counts']
              item2=[x for x in bad['maps'] if x['map_key']=='hk_test002'][0]
              assert item2['status']=='ambiguous_building_overlap',item2

              # Remove deliberate conflict and resolve safely.
              with s.db_session() as db:
                  db.execute("DELETE FROM map_buildings WHERE building_id IN ('way002a','way002b')")
                  db.execute("DELETE FROM map_area_aliases WHERE source_area_id='bad-area'")
                  db.execute("DELETE FROM map_areas WHERE area_id='bad-area'")
              good=s.full235_import_resolve(mgr,{'batch_id':batch})
              assert good['ready_to_apply'] is True,good['status_counts']
              assert good['maps_received']==235
              assert good['unique_archive_building_ids']==705
              statuses=good['status_counts']
              assert statuses.get('matched_link')==1,statuses
              assert statuses.get('matched_building')==1,statuses
              assert statuses.get('new')==233,statuses

              applied=s.full235_import_apply(mgr,{'batch_id':batch,'confirm':'IMPORT_235'})
              assert applied['maps_imported']==235,applied
              assert applied['created_canonical_areas']==233,applied
              assert applied['source_counts'].get('combined')==235,applied
              assert applied['source_counts'].get('website')==0,applied

              # game_live room=5 must beat archive room=1. Null rows are filled.
              d0=s.map_detail('area0');by={x['building_id']:x for x in d0['buildings']}
              assert by['way000a']['room_count']==5 and by['way000a']['knowledge_source']=='game_live',by['way000a']
              assert by['way000b']['room_count']==2 and by['way000b']['knowledge_source']=='hk_maps_import',by['way000b']

              # Every website map now has a canonical bridge.
              with s.db_session() as db:
                  assert db.execute("SELECT COUNT(*) FROM hk_map_area_links").fetchone()[0]==235
                  assert db.execute("SELECT COUNT(*) FROM hk_full_map_import_links").fetchone()[0]==235
                  assert db.execute("SELECT COUNT(*) FROM map_areas").fetchone()[0]==235

              # Re-import same archive: all resolve to existing areas, no new areas.
              start2=s.full235_import_start(mgr,{
                'format':'HK Maps Full Export','version':3,'maps_found':235,'maps_exported':235,
                'errors_count':0,'exported_at':'2026-09-19T10:34:26.478Z',
                'archive_sha256':'a'*64
              })
              batch2=start2['batch_id']
              for i in range(0,235,10):
                  s.full235_import_chunk(mgr,{'batch_id':batch2,'maps':docs[i:i+10]})
              again=s.full235_import_resolve(mgr,{'batch_id':batch2})
              assert again['ready_to_apply'] is True,again['status_counts']
              applied2=s.full235_import_apply(mgr,{'batch_id':batch2,'confirm':'IMPORT_235'})
              assert applied2['created_canonical_areas']==0,applied2
              with s.db_session() as db:
                  assert db.execute("SELECT COUNT(*) FROM map_areas").fetchone()[0]==235
                  assert db.execute("SELECT COUNT(*) FROM hk_map_area_links").fetchone()[0]==235

              # A future live game scan with a different area_id joins synthetic area by exact building IDs
              # and is allowed to correct trusted coordinates.
              synthetic='hkfull'+hashlib.sha256('hk_test010'.encode()).hexdigest()[:32]
              live={'area_id':'real-game-area-10','city_id':'real-city','city_name':'Test10','coord_revision':'column-row-v1',
                    'x':77,'y':88,'invest_count':0,'expected_buildings':3,'buildings':[
                      {'building_id':'way010a','opened':True,'room_count':4,'has_events':True,'is_invest':False,'tier':1,'faction':'','building_type':''},
                      {'building_id':'way010b','opened':True,'room_count':2,'has_events':True,'is_invest':True,'tier':1,'faction':'','building_type':''},
                      {'building_id':'way010c','opened':True,'room_count':3,'has_events':True,'is_invest':False,'tier':1,'faction':'','building_type':''},
                    ]}
              live_result=s.submit_map_area('player-live',live)
              assert live_result['area_id']==synthetic,live_result
              detail=s.map_detail('real-game-area-10')
              assert detail['area']['area_id']==synthetic,detail['area']
              assert detail['area']['x']==77 and detail['area']['y']==88,detail['area']
              by10={x['building_id']:x for x in detail['buildings']}
              assert by10['way010a']['room_count']==4 and by10['way010a']['knowledge_source']=='game_live',by10['way010a']

              print('FULL235_AMBIGUITY_GATE=PASS')
              print('FULL235_BUILDING_ID_RESOLVER=PASS')
              print('FULL235_NEW_CANONICAL=PASS')
              print('FULL235_GAME_PRIORITY=PASS')
              print('FULL235_IDEMPOTENT=PASS')
              print('FULL235_FUTURE_LIVE_ALIAS=PASS')
          finally:
              try: os.remove(path)
              except OSError: pass
          PY

      - name: Verify cabinet importer source
        run: |
          set -euo pipefail
          grep -Fq 'id="hk-full-import-file"' cabinet/index.html
          grep -Fq "const chunkSize=6;" cabinet/index.html
          grep -Fq "DecompressionStream('gzip')" cabinet/index.html
          grep -Fq "'/maps/full-import/resolve'" cabinet/index.html
          grep -Fq "'/maps/full-import/apply'" cabinet/index.html
          echo FULL235_CABINET_IMPORTER=PASS

      - name: Record build status
        run: |
          candidate="$(sha256sum /tmp/server.py | cut -d' ' -f1)"
          {
            echo "FULL235_IMPORT_V1_BUILD=PASS"
            echo "candidate_server_sha256=$candidate"
            echo "ambiguity_gate=PASS"
            echo "building_id_resolver=PASS"
            echo "new_canonical_creation=PASS"
            echo "game_live_priority=PASS"
            echo "idempotent_reimport=PASS"
            echo "future_live_alias_by_building_id=PASS"
            echo "cabinet_archive_reader=PASS"
            echo "deployed=NO"
          } > audit/hk-full235-v1-build-status.txt
          cat audit/hk-full235-v1-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-full235-v1-build-status.txt
          git commit -m "audit: verify full235 archive importer V1"
          git pull --rebase origin main
          git push origin HEAD:main
