name: Verify Explore E3/E4 Current Live

on:
  push:
    paths:
      - 'deploy/topking/explore-e3-current-verify-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-explore-current
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch current live/public
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/live.js
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?explore-current=$(date +%s)" -o /tmp/public.js
          node --check /tmp/live.js
          node --check /tmp/public.js
          cmp -s /tmp/live.js /tmp/public.js
          cmp -s /tmp/live.js baseline/topking/HamsterKingMobile.current.user.js
          echo "live_public_baseline_equality=PASS"

      - name: Verify E3/E4 contract without mutations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          s=Path('/tmp/live.js').read_text(encoding='utf-8')

          required=[
              "// @version      1.17.22",
              "const BUILD_VERSION = '1.17.22';",
              "const HK_CORE_REVISION = 'core-20260921-r24-explore-production-ui';",
              "const HK_EXPLORE_CANON_REV='explore-e3-single-20260920-r9-runner';",
              "const HK_EXPLORE_SPEED_REV='explore-e3-speed-20260921-r1';",
              "const HK_EXPLORE_E4_REV='explore-e4-queue-20260921-r1';",
              "const HK_EXPLORE_UI_REV='explore-production-ui-20260921-r1';",
              "async function exploreE3ProcessOne(initial,settings)",
              "async function runExploreE3Single()",
              "async function runExploreE4Queue()",
              "id=\"hk-ex-run-queue\"",
              "const HK_MAP_READ_CONCURRENCY = 5;",
              "maps-shared-runtime-20260921-r7-safe5",
              "AUTH_PASSIVE_SAFETY_R1",
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("missing required markers: "+repr(missing))

          def block(a,b):
              i=s.index(a); j=s.index(b,i); return s[i:j]

          e3=block("async function exploreE3ProcessOne(initial,settings)","async function runExploreE3Single()")
          run1=block("async function runExploreE3Single()","async function runExploreE4Queue()")
          e4=block("async function runExploreE4Queue()","function explorePrOptions")
          mut=block("async function exploreE3Mutation(path,body,buildingId,reason)","async function exploreE3LoadTiers()")
          api=block("async function apiJson(path, method = 'GET', body = null, retryAuthorization = true, retryNetwork = 3)","async function hkAuthoritativePlayerRead")

          # E3 one-building path is preserved.
          assert "const candidate=explorePlan.selected[0]" in run1
          assert "E3: обработать 1 тестовое здание из " in run1
          assert "hkRunner.start({title:either('Исследование · E3','Explore · E3'),total:1" in run1
          assert "const result=await exploreE3ProcessOne(candidate,settings)" in run1

          # Shared mutation safety is preserved.
          assert "data=await apiJson(path,'POST',body)" in mut
          assert "exploreE3Reconcile(buildingId,reason)" in mut
          assert "hkMutationGate.run(" in api
          assert "() => apiJsonCore(path, method, body, retryAuthorization, 0)" in api

          # E3 action mechanics remain.
          for marker in [
              "/player/building/fast_completion/cost",
              "/player/building/fast_completion",
              "/player/battle/fast",
              "/player/battle?building_id=",
              "/player/building/remort?building_id=",
              "/player/building/fast_remort/cost",
              "/player/building/fast_remort",
              "/shop/buy",
          ]:
              assert marker in s
          assert "if(Number(current?.tier||0)<=beforeTier)" in e3
          assert "if(Number(current?.tier||0)<7)" in e3

          # Speed profile remains the approved 0.7 / 2.0 / 0.7 profile.
          assert "actionDelayMinMs=legacyDefaultSpeed?700" in s
          assert "actionDelayMaxMs=legacyDefaultSpeed?2000" in s
          assert "battleDelayMs=legacyDefaultSpeed?700" in s

          # Production queue reuses E3 core; maxBuildings is the single queue cap.
          assert "const result=await exploreE3ProcessOne(candidate,settings)" in e4
          assert "const queue=source;" in e4
          assert "maxBuildings:clamp(x.maxBuildings,1,5000,500)" in s
          assert "selected:settings.exploreTargetTier?candidates.slice(0,settings.maxBuildings):candidates" in s
          assert "await hkRunner.waitIfPaused()" in e4
          assert "await exploreE4BetweenDelay(settings)" in e4
          assert "result.status==='resources_exhausted'?'skipped':'error'" in e4
          assert "hkRunner.fail(new Error(failed))" in e4
          assert "exploreE3Reconcile(String(candidate.id||''),'explore:e4-final-'+" in e4

          # E3/E4 use the same staged runner UI and 15-second completion visibility.
          for key in ["'prepare'","'events'","'battles'","'tier'","'verify'"]:
              assert key in s
          assert "Explore · E3" in s and "either('Исследование','Explore')" in s
          assert "const keep=exploreTitle?15000:1800" in s
          assert "(buildingsRun||exploreRun)&&state.total" in s

          # Production UI has no test button or duplicate run-limit control.
          render=block("function renderExplore()","async function refreshExplore")
          assert 'id="hk-ex-run-queue"' in render
          assert "either('Запустить','Run')" in render
          assert 'Будет обработано зданий:' in render
          for bad in ['id="hk-ex-run-one"','id="hk-ex-run-limit"','Лимит запуска E4','Тест E3 · 1 здание','Запустить E4','s.runLimit','settings.runLimit']:
              assert bad not in s

          # Protected current work.
          assert "const HK_BUILDINGS_NATIVE_SYNC_REV = 'buildings-native-sync-20260921-r1';" in s
          assert "PUBLIC_COLLECTOR_AUTH_PROBE_URL" not in s
          assert "/api/v1/public-collector/auth-probe" not in s

          print("explore_e3_single_building_scope=PASS")
          print("explore_e3_mutation_gate=PASS")
          print("explore_e3_authoritative_reconcile=PASS")
          print("explore_e3_speed_profile=PASS")
          print("explore_e4_reuses_e3_core=PASS")
          print("explore_single_max_buildings_limit=PASS")
          print("explore_test_controls_removed=PASS")
          print("explore_e4_sequential_stop_safety=PASS")
          print("explore_runner_e3_e4=PASS")
          print("protected_buildings_maps_auth=PASS")
          print("userscript_1_17_21=PASS")
          print("EXPLORE_PRODUCTION_UI_CURRENT_REVALIDATION=PASS")
          PY

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/live.js /tmp/public.js
