name: Verify TopKing 1.17.1 Bureau Resources

on:
  push:
    paths:
      - 'deploy/topking/verify-1171-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-topking-1171-bureau-resources
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch current live read only
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '^// @version      1.17.0$' /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2B_RUNNER_REV = 'stage2b-20260919-r1'" /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_STAGE2I_BUILDINGS_REV = 'stage2i-buildings-explore-20260919-r1'" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          cp /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.before.js

      - name: Build 1.17.1 only
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_bureau_resources_live_1171.py
          python3 deploy/topking/patch_bureau_resources_live_1171.py
          grep -q '^// @version      1.17.1$' /tmp/HamsterKingMobile.user.js
          grep -Fq 'HK_BUREAU_RESOURCES_LIVE_V1 bureau-resources-live-20260920-r1' /tmp/HamsterKingMobile.user.js
          grep -Fq "const liveBureauCost = bureauCost();" /tmp/HamsterKingMobile.user.js
          grep -Fq "budgetDecision(liveBureauCost, 'bureau', attempts" /tmp/HamsterKingMobile.user.js
          grep -Fq "budgetDecision(row.cost, 'resources', row.plannedCompletions" /tmp/HamsterKingMobile.user.js
          grep -Fq "const freshEvents = allResourceEvents();" /tmp/HamsterKingMobile.user.js
          grep -Fq "},true,0);" /tmp/HamsterKingMobile.user.js
          grep -Fq "hkAuthoritativePlayerRead('bureau-complete')" /tmp/HamsterKingMobile.user.js
          grep -Fq "hkAuthoritativePlayerRead('resources-complete')" /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Verify patch idempotency
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.once.js
          python3 deploy/topking/patch_bureau_resources_live_1171.py
          cmp -s /tmp/HamsterKingMobile.once.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js

      - name: Record build-only verification
        run: |
          set -euo pipefail
          sha="$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"
          mkdir -p audit
          {
            echo 'source_live=1.17.0'
            echo 'target=1.17.1'
            echo 'revision=bureau-resources-live-20260920-r1'
            echo 'mode=build-only'
            echo 'syntax=ok'
            echo 'idempotent=yes'
            echo 'deployed=no'
            echo "sha256=$sha"
          } > audit/hk-1171-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-1171-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Verify TopKing 1.17.1 Bureau Resources build"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.before.js /tmp/HamsterKingMobile.once.js
