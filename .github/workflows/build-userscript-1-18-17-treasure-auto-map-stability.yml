name: Build Userscript 1.18.17 Treasure Auto Map Stability

on:
  push:
    paths:
      - 'deploy/topking/patch_treasure_auto_map_stability_1_18_17.py'
      - '.github/workflows/build-userscript-1-18-17-treasure-auto-map-stability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.16" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-auto-map-orchestrator-20260926-r1" /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/patch_treasure_auto_map_stability_1_18_17.py /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.17" /tmp/HamsterKingMobile.user.js
          grep -Fq "treasure-auto-map-stability-20260926-r2" /tmp/HamsterKingMobile.user.js
          grep -Fq "AUTO_MAP_ACTION_GAP_MS=1450" /tmp/HamsterKingMobile.user.js
          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.17.treasure-auto-map-stability.candidate.user.js
          audit=audit/hk-userscript-1-18-17-treasure-auto-map-stability-predeploy.txt
          git fetch origin main
          git reset --hard origin/main
          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.16':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [m.get('primary_marker'), *m.get('preserve_markers', [])]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.16',
              'target_version':'1.18.17',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.17.treasure-auto-map-stability.candidate.user.js',
              'primary_marker':'treasure-auto-map-stability-20260926-r2',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-17-treasure-auto-map-stability-live-status.txt',
              'commit_message':'fix: deploy Treasure Auto Map stability in userscript 1.18.17',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          mkdir -p "$(dirname "$audit")"
          {
            echo "USERSCRIPT_1_18_17_TREASURE_AUTO_MAP_STABILITY_PREDEPLOY=PASS"
            echo "source_version=1.18.16"
            echo "target_version=1.18.17"
            echo "actual_state_change_required=YES"
            echo "action_gap_ms=1450"
            echo "http_409=SKIP_CURRENT_LOT_6500MS_AND_RESCAN"
            echo "http_429=BACKOFF_3600MS"
            echo "http_5xx=BACKOFF_5600MS"
            echo "syntax=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.17 Treasure Auto Map stability"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
