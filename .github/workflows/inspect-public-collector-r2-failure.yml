name: Inspect Public Collector R2 Failure

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/topking/public-collector-r2-inspect-trigger.txt'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Inspect runtime
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            echo "=== STATUS FILE ==="
            cat /var/lib/hamsterking-license/public-collector-status.json 2>/dev/null || true
            echo
            echo "=== RATINGS SERVICE ==="
            systemctl status hamsterking-public-collector.service --no-pager -l || true
            echo "=== WAR SERVICE ==="
            systemctl status hamsterking-public-war.service --no-pager -l || true
            echo "=== RATINGS JOURNAL ==="
            journalctl -u hamsterking-public-collector.service -n 120 --no-pager || true
            echo "=== WAR JOURNAL ==="
            journalctl -u hamsterking-public-war.service -n 120 --no-pager || true
            echo "=== TIMERS ==="
            systemctl list-timers --all --no-pager | grep -E "hamsterking-public-(collector|war)" || true
            echo "=== DB COUNTS ==="
            python3 /opt/hamsterking-license/verify_public_collector_r2.py || true
          ' > /tmp/public-collector-r2-inspect.txt
          cat /tmp/public-collector-r2-inspect.txt

      - name: Save inspection
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cp /tmp/public-collector-r2-inspect.txt audit/hk-public-collector-r2-inspect.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-public-collector-r2-inspect.txt
          git commit -m "audit: inspect public collector R2 failure" || true
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/public-collector-r2-inspect.txt
