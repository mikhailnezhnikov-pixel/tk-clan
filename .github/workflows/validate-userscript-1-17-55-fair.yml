name: Validate Userscript 1.17.55 Fair Exact Combo

on:
  push:
    paths:
      - 'deploy/topking/HamsterKingMobile.1.17.55.fair-exact-combo.candidate.user.js'
      - '.github/workflows/validate-userscript-1-17-55-fair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.17.55.fair-exact-combo.candidate.user.js
          node --check "$candidate"
          grep -Fq "// @version      1.17.55" "$candidate"
          grep -Fq "const BUILD_VERSION = '1.17.55';" "$candidate"
          grep -Fq "fair-exact-combo-20260923-r1" "$candidate"
          grep -Fq "targets.length >= requiredGroup" "$candidate"
          grep -Fq "groupSize === requiredGroup" "$candidate"
          ! grep -Fq "Math.floor(Math.min(combo.exactLots, buyLimit - bought) / 3) * 3" "$candidate"
          sha256sum "$candidate"
