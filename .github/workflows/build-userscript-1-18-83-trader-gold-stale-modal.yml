name: Build Userscript 1.18.83 Trader Gold Stale Modal

on:
  push:
    paths:
      - 'deploy/topking/patch_trader_gold_stale_modal_1_18_83.py'
      - 'deploy/topking/verify_trader_gold_stale_modal_contract.py'
      - '.github/workflows/build-userscript-1-18-83-trader-gold-stale-modal.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-topking-userscript
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.18.82" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-visible-point-truth-20260929-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "trader-gold-currency-skip-20260928-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_trader_gold_stale_modal_1_18_83.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.83" /tmp/HamsterKingMobile.user.js
          grep -Fq "trader-gold-stale-modal-reset-20260929-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/verify_treasure_autopilot_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_lights_resume_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_lights_outer_modal_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_lights_map6_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_key_ack_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_battle_viewport_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_chest_fast_pacing_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_treasury_loop_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_battle_full_clear_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_battle_achievement_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_trader_gold_skip_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_trader_gold_stale_modal_contract.py /tmp/HamsterKingMobile.user.js

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.83.trader-gold-stale-modal.candidate.user.js
          audit=audit/hk-userscript-1-18-83-trader-gold-stale-modal-predeploy.txt

          git fetch origin main
          git reset --hard origin/main

          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.82':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [
              'battle-visible-point-truth-20260929-r1',
              'trader-gold-currency-skip-20260928-r1',
              'clan-crest-launcher-20260928-r1',
              m.get('primary_marker'),
              *m.get('preserve_markers', [])
          ]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.82',
              'target_version':'1.18.83',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.83.trader-gold-stale-modal.candidate.user.js',
              'primary_marker':'trader-gold-stale-modal-reset-20260929-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-83-trader-gold-stale-modal-live-status.txt',
              'commit_message':'fix: reset forbidden gold trader modal in userscript 1.18.83',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          {
            echo "USERSCRIPT_1_18_83_TRADER_GOLD_STALE_MODAL_PREDEPLOY=PASS"
            echo "source_version=1.18.82"
            echo "target_version=1.18.83"
            echo "gold_deny_by_reward=ENABLED"
            echo "gold_deny_before_whitelist=ENABLED"
            echo "stale_gold_modal_global_preflight=ENABLED"
            echo "gold_modal_icon_close_fallback=ENABLED"
            echo "generic_confirm_gold_guard=ENABLED"
            echo "trader_gold_stale_modal_contract=PASS"
            echo "syntax=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.83 trader gold stale modal reset"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
