name: Rollback TopKing to 1.11.0

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rollback-topking-1.11.yml'

permissions:
  contents: read
  actions: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Restore verified 1.11.0 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mikhailnezhnikov-pixel/tk-clan/actions/artifacts/10581482716/zip \
            -o /tmp/topking-1.11.0.zip
          mkdir -p /tmp/topking-1.11.0
          unzip -q /tmp/topking-1.11.0.zip -d /tmp/topking-1.11.0
          cp /tmp/topking-1.11.0/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          grep -q '@version      1.11.0' /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          ! grep -q 'growthRunHamsters' /tmp/HamsterKingMobile.user.js

      - name: Deploy stable 1.11.0
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'set -euo pipefail;
              stamp="$(date +%Y%m%d-%H%M%S)";
              cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.$stamp";
              install -m 0644 /tmp/HamsterKingMobile.user.js /opt/hamsterking-license/HamsterKingMobile.user.js;
              printf "%s\n" "[Service]" "Environment=\"HK_MIN_SCRIPT_VERSION=1.11.0\"" > /etc/systemd/system/hamsterking-license.service.d/min-version.conf;
              systemctl daemon-reload;
              systemctl restart hamsterking-license.service;
              systemctl is-active --quiet hamsterking-license.service;
              grep -m1 "^// @version" /opt/hamsterking-license/HamsterKingMobile.user.js'

      - name: Cleanup
        if: always()
        run: rm -rf "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/topking-1.11.0 /tmp/topking-1.11.0.zip
