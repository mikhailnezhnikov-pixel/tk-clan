name: Verify TopKing Stage 1 Live Read Only

on:
  push:
    paths:
      - 'deploy/topking/stage1-live-probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-topking-stage1-live
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Read current live userscript
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/topking-live.js

      - name: Record live facts
        run: |
          set -euo pipefail
          version=$(grep -m1 '^// @version' /tmp/topking-live.js | sed 's/^\/\/ @version[[:space:]]*//')
          if node --check /tmp/topking-live.js >/dev/null 2>&1; then syntax=ok; else syntax=bad; fi
          if grep -Fq "HK_MUTATION_GATE_REV = 'stage1-20260919-r4'" /tmp/topking-live.js; then revision=stage1-20260919-r4; else revision=missing; fi
          if grep -Fq "GROWTH_HAMSTER_BUDGET_ID = 'cur_cap'" /tmp/topking-live.js; then hamsters=cur_cap; else hamsters=wrong; fi
          if grep -Fq "GROWTH_GENERAL_BUDGET_ID = 'item_pit_token'" /tmp/topking-live.js; then generals=item_pit_token; else generals=wrong; fi
          guards=missing
          if grep -Fq 'growthCostOnlyUses(cost,[GROWTH_HAMSTER_BUDGET_ID])' /tmp/topking-live.js && \
             grep -Fq 'growthCostOnlyUses(cost,[GROWTH_GENERAL_BUDGET_ID])' /tmp/topking-live.js && \
             grep -Fq 'growthGeneralCostSafe(costs)' /tmp/topking-live.js; then guards=strict; fi
          no_progress=missing
          if grep -Fq 'growth-general-no-progress' /tmp/topking-live.js && grep -Fq 'growth-hamster-no-progress' /tmp/topking-live.js; then no_progress=2; fi
          stage2a=missing
          stage2b=missing
          stage2c=missing
          stage2d=missing
          grep -Fq "HK_STAGE2_RUNNER_REV = 'stage2a-20260919-r1'" /tmp/topking-live.js && stage2a=stage2a-20260919-r1 || true
          grep -Fq "HK_STAGE2B_RUNNER_REV = 'stage2b-20260919-r1'" /tmp/topking-live.js && stage2b=stage2b-20260919-r1 || true
          grep -Fq "HK_STAGE2_STATE_REV = 'stage2c-state-20260919-r1'" /tmp/topking-live.js && stage2c=stage2c-state-20260919-r1 || true
          grep -Fq "HK_STAGE2D_RUNNER_REV = 'stage2d-resource-business-20260919-r1'" /tmp/topking-live.js && stage2d=stage2d-resource-business-20260919-r1 || true
          live_sha=$(sha256sum /tmp/topking-live.js | awk '{print $1}')
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "stage2a=$stage2a"
            echo "stage2b=$stage2b"
            echo "stage2c=$stage2c"
            echo "stage2d=$stage2d"
            echo "hamsters=$hamsters"
            echo "generals=$generals"
            echo "growth_guards=$guards"
            echo "no_progress_limit=$no_progress"
            echo "syntax=$syntax"
            echo "sha256=$live_sha"
          } > /tmp/hk-stage1-live-probe.txt

          grep -nE -C 30 'growthRunGeneralsCore|growthRunLevelsCore|growthPitCost|growthCapCost|growthCostOnlyUses|growthGeneralCostSafe|growth-general-no-progress|growth-hamster-no-progress|HK_MUTATION_GATE_REV|HK_STAGE2_RUNNER_REV|HK_STAGE2B_RUNNER_REV|HK_STAGE2_STATE_REV|HK_STAGE2D_RUNNER_REV|async function apiJsonCore|const hkMutationGate' \
            /tmp/topking-live.js > /tmp/hk-growth-live-source.txt || true
          grep -nE -C 45 'resourceBusy|resourceBuildings|loadResources|runResource|executeResource|resourceRepeatCount|RESOURCE_BUILDING_TYPES|businessBusy|refreshBusinessData|runBusiness|applyBusiness|executeBusiness|preparedBusinessPlan|selectedSlots|selectedStock|hk-resource|hk-business' \
            /tmp/topking-live.js > /tmp/hk-resource-business-live-source.txt || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit
            cp /tmp/hk-stage1-live-probe.txt audit/hk-stage1-live-probe.txt
            cp /tmp/hk-growth-live-source.txt audit/hk-growth-live-source.txt
            cp /tmp/hk-resource-business-live-source.txt audit/hk-resource-business-live-source.txt
            git add audit/hk-stage1-live-probe.txt audit/hk-growth-live-source.txt audit/hk-resource-business-live-source.txt
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m "Probe current TopKing Stage 1 live"
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 2
          done
          test "$pushed" = "1"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/topking-live.js /tmp/hk-stage1-live-probe.txt /tmp/hk-growth-live-source.txt /tmp/hk-resource-business-live-source.txt
