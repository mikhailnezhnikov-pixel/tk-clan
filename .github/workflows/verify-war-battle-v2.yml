name: Verify War Battle V4
on:
  workflow_dispatch:
  push:
    paths:
      - 'wars/**'
      - 'assets/war/battle/**'
      - 'assets/war/units/**'
      - '.github/workflows/verify-war-battle-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and behavioral regressions
        run: |
          set -euo pipefail
          for f in assets/war/battle/*.js; do node --check "$f"; done
          node --test assets/war/battle/verify.cjs
          ! grep -Fq 'battle-engine-v2.js?v=' wars/index.html
          grep -Fq "version:'4.1.0-character-motion'" assets/war/battle/battle-runtime-v4.js
      - name: Decode production fighter sources
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          for path in ['topking/idle.png','raider/idle.png','combat-atlas-v4.webp']:
              with Image.open('assets/war/units/'+path) as image:
                  image.load()
                  print('DECODE_OK', path, image.size)
          PY
