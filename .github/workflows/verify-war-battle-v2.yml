name: Verify War Battle V4

on:
  workflow_dispatch:
  push:
    paths:
      - 'wars/index.html'
      - 'assets/war/battle/**'
      - 'assets/war/units/**'
      - '.github/workflows/verify-war-battle-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and wiring checks
        run: |
          set -euo pipefail
          for f in assets/war/battle/*.js; do node --check "$f"; done
          grep -Fq 'TopKingBattleV4' assets/war/battle/battle-runtime-v4.js
          grep -Fq "version:'4.0.6-distinct-fighter-states'" assets/war/battle/battle-runtime-v4.js
          grep -Fq 'class BattleScene' assets/war/battle/BattleScene.js
          grep -Fq 'class Fighter' assets/war/battle/Fighter.js
          grep -Fq 'class BattleAnimator' assets/war/battle/BattleAnimator.js
          grep -Fq 'class EffectsManager' assets/war/battle/EffectsManager.js
          grep -Fq 'class BattleEventQueue' assets/war/battle/BattleEventQueue.js
          grep -Fq 'class WarEventAdapter' assets/war/battle/WarEventAdapter.js
          grep -Fq 'pixi.js@8.21.0/dist/pixi.min.js' wars/index.html
          grep -Fq 'gsap@3.15.0/dist/gsap.min.js' wars/index.html
          grep -Fq 'id="battle-canvas"' wars/index.html
          grep -Fq 'TopKingBattleV4?.update(currentWar,info,{onHp:applyBattleHp})' wars/index.html
          grep -Fq 'battle-stage-v4 .battle-art-layer{display:none}' wars/index.html
          grep -Fq 'battle-stage-v4-ready .battle-v2-loading{opacity:0' wars/index.html
          grep -Fq 'canvasHost.replaceChildren(this.app.canvas)' assets/war/battle/BattleScene.js
          grep -Fq 'PIXI.Texture.from(image)' assets/war/battle/BattleScene.js
          grep -Fq "this.loadFighterSet('../assets/war/units/topking'" assets/war/battle/BattleScene.js
          grep -Fq "this.loadFighterSet('../assets/war/units/raider'" assets/war/battle/BattleScene.js
          grep -Fq "this.loadSet('../assets/war/units/bot','webp'" assets/war/battle/BattleScene.js
          test -s assets/war/units/topking/idle.png
          test -s assets/war/units/raider/idle.png
          test -s assets/war/units/topking/attack.webp
          test -s assets/war/units/topking/hit.webp
          test -s assets/war/units/raider/attack.webp
          test -s assets/war/units/raider/hit.webp
          test -s assets/war/units/bot/idle.webp
          test -s assets/war/units/bot/attack.webp
          test -s assets/war/units/bot/hit.webp
          ! cmp -s assets/war/units/topking/attack.webp assets/war/units/topking/hit.webp
          ! cmp -s assets/war/units/raider/attack.webp assets/war/units/raider/hit.webp
          ! cmp -s assets/war/units/bot/attack.webp assets/war/units/bot/hit.webp
          grep -Fq 'this.sprite.visible=false' assets/war/battle/Fighter.js
          if grep -Fq 'battle-engine-v2.js?v=' wars/index.html; then
            echo 'Legacy battle engine still wired into wars page' >&2
            exit 1
          fi
          echo 'WAR_BATTLE_V4_STATIC=PASS'
