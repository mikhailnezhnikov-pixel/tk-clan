name: Verify War Battle V4
on:
  workflow_dispatch:
  push:
    paths:
      - 'wars/**'
      - 'assets/war/battle/**'
      - 'assets/war/units/**'
      - 'assets/war/arena-courtyard-*.webp'
      - '.github/workflows/verify-war-battle-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and behavioral regressions
        run: |
          set -euo pipefail
          for f in assets/war/battle/*.js; do node --check "$f"; done
          node --test assets/war/battle/verify.cjs
          ! grep -Fq 'battle-engine-v2.js?v=' wars/index.html
          grep -Fq "version:'4.3.0-continuous-combat'" assets/war/battle/battle-runtime-v4.js
      - name: Decode production fighter sources
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          for path in ['topking-motion-v5.webp','raider-motion-v5.webp','bot-motion-v5.webp']:
              with Image.open('assets/war/units/'+path) as image:
                  image.load()
                  assert image.size == (2880,1920), (path,image.size)
                  assert image.mode == 'RGBA', (path,image.mode)
                  print('DECODE_OK', path, image.size)
          for name,size in [('desktop',(1672,941)),('mobile',(1024,1536))]:
              path='assets/war/arena-courtyard-'+name+'-v1.webp'
              with Image.open(path) as image:
                  image.load()
                  assert image.size == size, (path,image.size)
                  print('DECODE_OK', path, image.size)
          PY
