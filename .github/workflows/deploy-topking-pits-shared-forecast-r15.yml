name: Deploy TopKing Pits Shared Forecast R15

on:
  push:
    paths:
      - 'deploy/topking/pits-shared-forecast-r15-trigger.txt'
  workflow_dispatch:

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact Pits r14 live
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_SHARED_FORECAST_REV = 'pits-shared-reward-forecast-20260920-r15'" /tmp/HamsterKingMobile.user.js
          test "$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')" = "0079d453a830fc452b7d1d953cc3c2991ac023daea7543112377ccd90c1cade9"

      - name: Apply shared reward forecast r15
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_pits_shared_forecast_r15_1174.py
          python3 deploy/topking/patch_pits_shared_forecast_r15_1174.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "HK_PITS_SHARED_FORECAST_REV = 'pits-shared-reward-forecast-20260920-r15'" /tmp/HamsterKingMobile.user.js
          grep -Fq "function pitCanonPassivePitPassRate" /tmp/HamsterKingMobile.user.js
          grep -Fq "function pitCanonSharedRewardPool" /tmp/HamsterKingMobile.user.js
          grep -Fq 'function pitCanonMaxReachableReward' /tmp/HamsterKingMobile.user.js
          grep -Fq "function pitCanonRewardSharedForecastHtml" /tmp/HamsterKingMobile.user.js
          grep -Fq "Прогноз общего запаса" /tmp/HamsterKingMobile.user.js
          echo "PATCHED_SHA=$(sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}')"

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.pits-r15.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.pits-r15.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.pits-r15.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.pits-r15.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?pits-r15=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "HK_PITS_SHARED_FORECAST_REV = 'pits-shared-reward-forecast-20260920-r15'" /tmp/public.js
          echo "PUBLIC_SHA=$(sha256sum /tmp/public.js | awk '{print $1}')"
          echo "PITS_SHARED_FORECAST_R15=PASS"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/public.js
