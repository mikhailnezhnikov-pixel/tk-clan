name: Deploy Userscript 1.17.24 Businesses Runner Canon

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-24-businesses-runner-canon-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.24" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r26-businesses-rearrange-guard" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-rearrange-desktop-safe-t123-20260921-r1" /tmp/HamsterKingMobile.user.js
          cmp -s /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          echo "LIVE_BASELINE_INPUT=PASS"

      - name: Apply Businesses runner canon hotfix
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_businesses_runner_canon_1_17_24.py
          python3 deploy/topking/patch_businesses_runner_canon_1_17_24.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.24" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r27-businesses-runner-canon" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-runner-canon-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "box.classList.toggle('businesses-run',businessesRun);" /tmp/HamsterKingMobile.user.js
          grep -Fq ".hk-runner.businesses-run .hk-runner-actions{justify-content:flex-end}" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-rearrange-desktop-safe-t123-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-catalog-readonly-20260921-r1" /tmp/HamsterKingMobile.user.js
          echo "BUSINESSES_RUNNER_CANON_CANDIDATE=PASS"

      - name: Static regression verification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')
          checks={
            'version_unchanged':"// @version      1.17.24" in s and "const BUILD_VERSION = '1.17.24';" in s,
            'core_r27':"core-20260921-r27-businesses-runner-canon" in s,
            'business_mode':"businessesRun=visibleState&&title===either('Перестановка бизнесов','Business rearrangement')" in s,
            'business_class':"box.classList.toggle('businesses-run',businessesRun);" in s,
            'runner_counter':"(buildingsRun||exploreRun||businessesRun)&&state.total" in s,
            'canon_shell':".hk-runner.businesses-run{margin:0 0 14px;padding:14px 16px;border:1px solid #304057;border-radius:16px;background:#111925;box-shadow:none}" in s,
            'canon_actions':".hk-runner.businesses-run .hk-runner-actions{justify-content:flex-end}" in s,
            'canon_buttons':".hk-runner.businesses-run .hk-runner-actions button{flex:0 0 auto;width:auto;min-width:132px;min-height:36px;padding:9px 16px}" in s,
            'mobile_canon':".hk-runner.buildings-run .hk-runner-actions,.hk-runner.businesses-run .hk-runner-actions{display:grid;grid-template-columns:1fr 1fr}" in s,
            't4_t6_guard_preserved':"function businessRemovalAllowed(" in s and "assertBusinessRemovalPlanAllowed" in s,
            'catalog_preserved':"businesses-catalog-readonly-20260921-r1" in s,
            'explore_preserved':"explore-production-ui-20260921-r1" in s,
            'buildings_preserved':"buildings-native-sync-20260921-r1" in s,
            'maps_preserved':"maps-shared-runtime-20260921-r7-safe5" in s,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(f"{k}={'PASS' if v else 'FAIL'}")
          if failed: raise SystemExit("failed checks: "+", ".join(failed))
          PY

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.24.runner-canon.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.1.17.24.runner-canon.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.24.runner-canon.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.1.17.24.runner-canon.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?businesses-runner=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.24" /tmp/public.js
          grep -Fq "core-20260921-r27-businesses-runner-canon" /tmp/public.js
          grep -Fq "businesses-runner-canon-20260921-r1" /tmp/public.js
          echo "PUBLIC_USERSCRIPT_1_17_24_RUNNER_CANON=PASS"

      - name: Sync verified baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          {
            echo "USERSCRIPT_1_17_24_BUSINESSES_RUNNER_CANON=PASS"
            echo "version=1.17.24"
            echo "core=core-20260921-r27-businesses-runner-canon"
            echo "business_runner_canon=PASS"
            echo "compact_actions_desktop=PASS"
            echo "mobile_two_actions=PASS"
            echo "t4_t6_removal_guard=PRESERVED"
            echo "catalog_read_only=PRESERVED"
            echo "explore_live_pass=PRESERVED"
            echo "buildings_live_pass=PRESERVED"
            echo "maps_safe5=PRESERVED"
          } > audit/hk-userscript-1-17-24-businesses-runner-canon-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-24-businesses-runner-canon-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "hotfix: apply Businesses runner visual canon"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.1.17.24.runner-canon.user.js /tmp/public.js
