name: Build Userscript 1.18.82 Battle Visible Point Truth

on:
  push:
    paths:
      - 'deploy/topking/patch_battle_visible_point_truth_1_18_82.py'
      - 'deploy/topking/verify_battle_visible_point_truth_contract.py'
      - '.github/workflows/build-userscript-1-18-82-battle-visible-point.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-topking-userscript
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate
        run: |
          set -euo pipefail
          base=baseline/topking/HamsterKingMobile.current.user.js
          sha256sum "$base" | awk '{print $1}' > /tmp/base.sha
          cp "$base" /tmp/HamsterKingMobile.user.js

          grep -Fq "// @version      1.18.81" /tmp/HamsterKingMobile.user.js
          grep -Fq "clan-crest-launcher-20260928-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-target-safe-scroll-20260928-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/patch_battle_visible_point_truth_1_18_82.py /tmp/HamsterKingMobile.user.js

          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.18.82" /tmp/HamsterKingMobile.user.js
          grep -Fq "battle-visible-point-truth-20260929-r1" /tmp/HamsterKingMobile.user.js

          python3 deploy/topking/verify_treasure_autopilot_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_lights_resume_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_lights_outer_modal_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_lights_map6_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_key_ack_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_battle_viewport_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_chest_fast_pacing_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_treasury_loop_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_battle_full_clear_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_treasure_battle_achievement_contract.py /tmp/HamsterKingMobile.user.js
          python3 deploy/topking/verify_battle_visible_point_truth_contract.py /tmp/HamsterKingMobile.user.js

          sha256sum /tmp/HamsterKingMobile.user.js | awk '{print $1}' > /tmp/candidate.sha

      - name: Publish candidate
        run: |
          set -euo pipefail
          candidate=deploy/topking/HamsterKingMobile.1.18.82.battle-visible-point.candidate.user.js
          audit=audit/hk-userscript-1-18-82-battle-visible-point-predeploy.txt

          git fetch origin main
          git reset --hard origin/main

          test "$(sha256sum baseline/topking/HamsterKingMobile.current.user.js | awk '{print $1}')" = "$(cat /tmp/base.sha)"
          cp /tmp/HamsterKingMobile.user.js "$candidate"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('deploy/topking/userscript-release.json')
          m=json.loads(path.read_text(encoding='utf-8'))
          if m.get('target_version') != '1.18.81':
              raise SystemExit(f"unexpected current release target: {m.get('target_version')}")
          preserve=[]
          for marker in [
              'clan-crest-launcher-20260928-r1',
              'battle-target-safe-scroll-20260928-r1',
              'battle-full-fair-state-20260928-r1',
              'battle-egg-one-berry-buy-20260928-r1',
              m.get('primary_marker'),
              *m.get('preserve_markers', [])
          ]:
              if marker and marker not in preserve:
                  preserve.append(marker)
          out={
              'schema':1,
              'source_version':'1.18.81',
              'target_version':'1.18.82',
              'candidate_path':'deploy/topking/HamsterKingMobile.1.18.82.battle-visible-point.candidate.user.js',
              'primary_marker':'battle-visible-point-truth-20260929-r1',
              'preserve_markers':preserve,
              'audit_status_path':'audit/hk-userscript-1-18-82-battle-visible-point-live-status.txt',
              'commit_message':'fix: allow visible lower battle rows in userscript 1.18.82',
          }
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          {
            echo "USERSCRIPT_1_18_82_BATTLE_VISIBLE_POINT_PREDEPLOY=PASS"
            echo "source_version=1.18.81"
            echo "target_version=1.18.82"
            echo "fixed_height_gate=REMOVED"
            echo "clickability_source=ELEMENT_FROM_POINT"
            echo "desktop_lower_rows=ALLOWED"
            echo "mobile_footer_occlusion=PROTECTED"
            echo "full_battle_solver=PRESERVED"
            echo "one_berry_egg=PRESERVED"
            echo "clan_crest=PRESERVED"
            echo "battle_visible_point_contract=PASS"
            echo "syntax=PASS"
            echo "base_sha256=$(cat /tmp/base.sha)"
            echo "candidate_sha256=$(cat /tmp/candidate.sha)"
          } > "$audit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$candidate" deploy/topking/userscript-release.json "$audit"
          git commit -m "build: prepare userscript 1.18.82 battle visible point"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f /tmp/HamsterKingMobile.user.js /tmp/base.sha /tmp/candidate.sha
