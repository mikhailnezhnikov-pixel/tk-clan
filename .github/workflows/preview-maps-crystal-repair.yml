name: Preview Maps Crystal Repair

on:
  push:
    paths:
      - 'deploy/topking/maps-crystal-repair-preview-trigger.txt'
      - 'deploy/topking/preview_maps_crystal_repair.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Preview crystal repair
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            deploy/topking/preview_maps_crystal_repair.py root@89.125.1.71:/tmp/preview_maps_crystal_repair.py
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71 'python3 /tmp/preview_maps_crystal_repair.py' > /tmp/maps-crystal-repair-preview.json
          cp /tmp/maps-crystal-repair-preview.json audit/hk-maps-crystal-repair-preview.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-maps-crystal-repair-preview.json
          git commit -m "audit: preview Maps crystal repair"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/preview_maps_crystal_repair.py /tmp/maps-crystal-repair-preview.json
