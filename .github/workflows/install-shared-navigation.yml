name: Install shared navigation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-shared-navigation.yml'
      - 'assets/site-nav.js'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject shared navigation script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          nav_version='20260920-11'
          for p in Path('.').rglob('index.html'):
              rel=p.as_posix()
              if rel.startswith('.git/') or rel=='maps/moscow-20-19/index.html':
                  continue
              s=p.read_text('utf-8')
              depth=len(p.parent.parts)
              prefix='../'*depth
              home_href=prefix or './'
              crest=f'{prefix}assets/brand/topking-clan-crest.png'

              brand=f'<a class="brand" href="{home_href}" aria-label="Top King"><img class="tk-clan-crest" src="{crest}" alt="Top King"></a>'
              s=re.sub(r'<a class="brand"[^>]*>.*?</a>',brand,s,count=1,flags=re.S)

              s=re.sub(r'\s*<link[^>]+rel=["\'](?:shortcut )?icon["\'][^>]*>','',s,flags=re.I)
              s=re.sub(r'\s*<link[^>]+rel=["\']apple-touch-icon["\'][^>]*>','',s,flags=re.I)
              icons=f'  <link rel="icon" type="image/png" href="{crest}">\n  <link rel="apple-touch-icon" href="{crest}">\n'
              if '</head>' in s:
                  s=s.replace('</head>',icons+'</head>',1)

              tag=f'<script src="{prefix}assets/site-nav.js?v={nav_version}"></script>'
              if 'site-nav.js' in s:
                  s=re.sub(
                      r'<script src="(?:\.\./)*assets/site-nav\.js(?:\?v=[^"]*)?"></script>',
                      tag,
                      s
                  )
              elif '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)

              p.write_text(s,'utf-8')
          PY
      - name: Commit navigation normalization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' ':!maps/moscow-20-19/index.html'
          if git diff --cached --quiet; then
            echo 'No navigation changes.'
          else
            git commit -m 'Normalize site navigation and expose Maps section [skip ci]'
            git push
          fi
