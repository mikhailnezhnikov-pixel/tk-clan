name: Deploy Userscript 1.17.24 Businesses Rearrange Safe T123

on:
  push:
    paths:
      - 'deploy/topking/userscript-1-17-24-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-topking-userscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/topking"
          chmod 600 "$HOME/.ssh/topking"

      - name: Fetch exact current live
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            root@89.125.1.71:/opt/hamsterking-license/HamsterKingMobile.user.js /tmp/HamsterKingMobile.user.js
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.23" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r25-businesses-catalog" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-catalog-readonly-20260921-r1" /tmp/HamsterKingMobile.user.js
          cmp -s /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          echo "LIVE_BASELINE_INPUT=PASS"

      - name: Apply Businesses rearrange safety patch
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/topking/patch_businesses_rearrange_safe_1_17_24.py
          python3 deploy/topking/patch_businesses_rearrange_safe_1_17_24.py
          node --check /tmp/HamsterKingMobile.user.js
          grep -Fq "// @version      1.17.24" /tmp/HamsterKingMobile.user.js
          grep -Fq "core-20260921-r26-businesses-rearrange-guard" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-rearrange-desktop-safe-t123-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "function businessRemovalAllowed(" /tmp/HamsterKingMobile.user.js
          grep -Fq "removeAll:'Достать: T1–T3'" /tmp/HamsterKingMobile.user.js
          grep -Fq "Array.from({length:3}" /tmp/HamsterKingMobile.user.js
          grep -Fq "removeTierBox.innerHTML = tierChoices('remove',preferences.removeTiers,[1,2,3]);" /tmp/HamsterKingMobile.user.js
          grep -Fq "hk-business-rearrange-controls" /tmp/HamsterKingMobile.user.js
          grep -Fq "grid-template-columns:minmax(0,1fr) minmax(0,1fr)" /tmp/HamsterKingMobile.user.js
          grep -Fq "businesses-catalog-readonly-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "explore-production-ui-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "buildings-native-sync-20260921-r1" /tmp/HamsterKingMobile.user.js
          grep -Fq "maps-shared-runtime-20260921-r7-safe5" /tmp/HamsterKingMobile.user.js
          echo "BUSINESSES_REARRANGE_SAFE_T123_CANDIDATE=PASS"

      - name: Static Businesses safety verification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/HamsterKingMobile.user.js').read_text(encoding='utf-8')
          checks={
            'version':"// @version      1.17.24" in s,
            'core':"core-20260921-r26-businesses-rearrange-guard" in s,
            'catalog_preserved':"businesses-catalog-readonly-20260921-r1" in s and 'data-business-tab="catalog"' in s,
            'desktop_split':".hk-business-rearrange-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)" in s and "#hk-business-lists{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)" in s,
            'mobile_stack':"@media(max-width:760px){.hk-business-rearrange-controls,#hk-business-lists{grid-template-columns:1fr}}" in s,
            'manual_only_t123':"Array.from({length:3}, (_,i) => `<option value=\"${i+1}\">${tr('removeTier'" in s,
            'optimizer_only_t123':"removeTierBox.innerHTML = tierChoices('remove',preferences.removeTiers,[1,2,3]);" in s,
            'plan_guard':"if (prepared) return assertBusinessRemovalPlanAllowed(prepared);" in s and "assertBusinessRemovalPlanAllowed(remaining.map(row => [row, '']));" in s,
            'restore_guard':"const protectedPairs = pairs.filter(([row]) => row.businessId && !businessRemovalAllowed(row.businessId));" in s,
            'select_all_guard':"filter === 0 ? (!row.businessId || businessRemovalAllowed(row.businessId))" in s,
            'optimizer_guard':"businessRemovalAllowed(row.businessId) && !protectedByGoal(row)" in s,
            'explore_preserved':"explore-production-ui-20260921-r1" in s,
            'buildings_preserved':"buildings-native-sync-20260921-r1" in s,
            'maps_preserved':"maps-shared-runtime-20260921-r7-safe5" in s,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(f"{k}={'PASS' if v else 'FAIL'}")
          if failed: raise SystemExit("failed checks: "+", ".join(failed))
          PY

      - name: Backup and deploy
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            /tmp/HamsterKingMobile.user.js root@89.125.1.71:/tmp/HamsterKingMobile.1.17.24.user.js
          ssh -i "$HOME/.ssh/topking" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@89.125.1.71 '
            set -euo pipefail
            stamp="$(date +%Y%m%d-%H%M%S)"
            node --check /tmp/HamsterKingMobile.1.17.24.user.js
            cp -a /opt/hamsterking-license/HamsterKingMobile.user.js "/opt/hamsterking-license/HamsterKingMobile.user.js.bak.1.17.24.$stamp"
            install -m 0644 /tmp/HamsterKingMobile.1.17.24.user.js /opt/hamsterking-license/HamsterKingMobile.user.js
            systemctl restart hamsterking-license.service
            systemctl is-active --quiet hamsterking-license.service
          '

      - name: Verify public round trip
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 30 \
            "https://hk-license.89.125.1.71.sslip.io/panel.js?businesses-rearrange=$(date +%s)" -o /tmp/public.js
          node --check /tmp/public.js
          cmp -s /tmp/HamsterKingMobile.user.js /tmp/public.js
          grep -Fq "// @version      1.17.24" /tmp/public.js
          grep -Fq "core-20260921-r26-businesses-rearrange-guard" /tmp/public.js
          grep -Fq "businesses-rearrange-desktop-safe-t123-20260921-r1" /tmp/public.js
          grep -Fq "businesses-catalog-readonly-20260921-r1" /tmp/public.js
          echo "PUBLIC_USERSCRIPT_1_17_24=PASS"

      - name: Sync verified baseline
        run: |
          set -euo pipefail
          cp /tmp/HamsterKingMobile.user.js baseline/topking/HamsterKingMobile.current.user.js
          {
            echo "USERSCRIPT_1_17_24_BUSINESSES_REARRANGE_SAFE_T123=PASS"
            echo "version=1.17.24"
            echo "core=core-20260921-r26-businesses-rearrange-guard"
            echo "desktop_remove_left_insert_right=PASS"
            echo "mobile_stack_preserved=PASS"
            echo "manual_remove_t4_t6=BLOCKED"
            echo "optimizer_remove_t4_t6=BLOCKED"
            echo "preset_stale_remove_t4_t6=SANITIZED"
            echo "restore_remove_t4_t6=BLOCKED"
            echo "plan_runtime_guard=PASS"
            echo "rollback_transaction_safety=PRESERVED"
            echo "catalog_read_only=PRESERVED"
            echo "explore_live_pass=PRESERVED"
            echo "buildings_live_pass=PRESERVED"
            echo "maps_safe5=PASS"
          } > audit/hk-userscript-1-17-24-businesses-rearrange-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/topking/HamsterKingMobile.current.user.js audit/hk-userscript-1-17-24-businesses-rearrange-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "release: publish userscript 1.17.24 Businesses rearrange safety"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/topking" /tmp/HamsterKingMobile.user.js /tmp/HamsterKingMobile.1.17.24.user.js /tmp/public.js
