name: Dry-run 235 full-map fingerprints

on:
  push:
    paths:
      - 'deploy/maps/fp6.part.*'
      - 'deploy/topking/full235-fingerprint-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOPKING_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/topking
          chmod 600 ~/.ssh/topking

      - name: Decode fingerprints
        run: |
          set -euo pipefail
          cat deploy/maps/fp6.part.00 deploy/maps/fp6.part.01 deploy/maps/fp6.part.02 | base64 -d > /tmp/fp.json.gz
          gzip -dc /tmp/fp.json.gz > /tmp/fp.json
          python3 - <<'PY'
          import json,hashlib
          d=json.load(open('/tmp/fp.json'))
          assert len(d)==235,len(d)
          assert len({x['map_key'] for x in d})==235
          assert all(len(x['sample_ids'])==min(6,x['building_count']) for x in d)
          raw=open('/tmp/fp.json','rb').read()
          assert hashlib.sha256(raw).hexdigest()=='8c1aee427e7678ca8b64ef46682f77cd80f407f8d048ae64cf3968db253ab8fb'
          print('maps=',len(d))
          print('sha256=',hashlib.sha256(raw).hexdigest())
          PY

      - name: Match fingerprints against live canonical DB read-only
        run: |
          set -euo pipefail
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/fp.json root@89.125.1.71:/tmp/full235-fp.json
          cat > /tmp/full235-match.py <<'PY'
          import json,sqlite3,collections,re
          DB='/var/lib/hamsterking-license/licenses.db'
          fps=json.load(open('/tmp/full235-fp.json'))
          db=sqlite3.connect('file:'+DB+'?mode=ro',uri=True);db.row_factory=sqlite3.Row

          # One batched lookup over all deterministic sample building IDs.
          ids=sorted({bid for row in fps for bid in row['sample_ids']})
          hits={}
          for start in range(0,len(ids),700):
              part=ids[start:start+700]
              q=','.join('?' for _ in part)
              for r in db.execute(f"""
                  SELECT b.building_id,b.area_id,a.city_name,a.city_id,a.x,a.y,
                         b.room_count,b.knowledge_source
                  FROM map_buildings b
                  JOIN map_areas a ON a.area_id=b.area_id
                  WHERE b.building_id IN ({q})
              """,part):
                  hits.setdefault(r['building_id'],[]).append(dict(r))

          existing_links={r['map_key']:dict(r) for r in db.execute(
              "SELECT map_key,canonical_area_id,match_method FROM hk_map_area_links"
          )}

          def norm_city(v):
              return re.sub(r'[^a-z0-9]+','',str(v or '').lower())

          rows=[]
          cats=collections.Counter()
          for fp in fps:
              by_area=collections.Counter()
              area_meta={}
              sample_hit_ids=0
              duplicate_sample_hits=0
              for bid in fp['sample_ids']:
                  rr=hits.get(bid,[])
                  if rr:
                      sample_hit_ids+=1
                  if len(rr)>1:
                      duplicate_sample_hits+=1
                  for item in rr:
                      by_area[item['area_id']]+=1
                      area_meta[item['area_id']]={
                          'city_name':item['city_name'],'city_id':item['city_id'],
                          'x':item['x'],'y':item['y']
                      }
              ranked=by_area.most_common()
              top_area=ranked[0][0] if ranked else ''
              top_hits=ranked[0][1] if ranked else 0
              second_hits=ranked[1][1] if len(ranked)>1 else 0
              top_meta=area_meta.get(top_area,{})
              purity=(top_hits/sample_hit_ids) if sample_hit_ids else 0.0
              city_match=bool(top_area and (
                  norm_city(fp['city'])==norm_city(top_meta.get('city_name')) or
                  norm_city(fp['city'])==norm_city(top_meta.get('city_id'))
              ))
              # Fingerprint decision is intentionally conservative.
              if sample_hit_ids==len(fp['sample_ids']) and top_hits==sample_hit_ids and second_hits==0:
                  category='exact6'
              elif sample_hit_ids>=3 and purity==1.0 and second_hits==0 and city_match:
                  category='strong_unique'
              elif sample_hit_ids>=2 and purity>=0.80 and city_match:
                  category='probable_review'
              elif sample_hit_ids==0:
                  category='no_overlap'
              else:
                  category='conflict_review'
              cats[category]+=1
              existing=existing_links.get(fp['map_key'])
              rows.append({
                  **fp,
                  'sample_hit_ids':sample_hit_ids,
                  'top_area_id':top_area,
                  'top_hits':top_hits,
                  'second_hits':second_hits,
                  'purity':round(purity,6),
                  'top_area_meta':top_meta,
                  'city_match':city_match,
                  'duplicate_sample_hits':duplicate_sample_hits,
                  'category':category,
                  'existing_link':existing,
                  'existing_link_agrees':bool(existing and top_area and existing['canonical_area_id']==top_area),
              })

          safe=[r for r in rows if r['category'] in ('exact6','strong_unique')]
          report={
              'maps':len(rows),
              'categories':dict(cats),
              'safe_existing_candidates':len(safe),
              'safe_map_keys':[r['map_key'] for r in safe],
              'existing_links':len(existing_links),
              'existing_links_agree':sum(1 for r in rows if r['existing_link_agrees']),
              'existing_links_disagree':[
                  {'map_key':r['map_key'],'linked':r['existing_link']['canonical_area_id'],'fingerprint':r['top_area_id']}
                  for r in rows if r['existing_link'] and r['top_area_id'] and not r['existing_link_agrees']
              ],
              'rows':rows,
          }
          print(json.dumps({
              'maps':report['maps'],
              'categories':report['categories'],
              'safe_existing_candidates':report['safe_existing_candidates'],
              'existing_links':report['existing_links'],
              'existing_links_agree':report['existing_links_agree'],
              'existing_links_disagree':len(report['existing_links_disagree']),
          },sort_keys=True))
          open('/tmp/full235-match-report.json','w').write(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          db.close()
          PY
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new /tmp/full235-match.py root@89.125.1.71:/tmp/full235-match.py
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'python3 /tmp/full235-match.py' | tee /tmp/full235-summary.txt
          scp -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71:/tmp/full235-match-report.json /tmp/full235-match-report.json

      - name: Validate and record dry-run
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/full235-match-report.json'))
          assert r['maps']==235
          assert len(r['existing_links_disagree'])==0,r['existing_links_disagree']
          safe=[x for x in r['rows'] if x['category'] in ('exact6','strong_unique')]
          assert all(x['top_area_id'] for x in safe)
          print('FULL235_FINGERPRINT_DRYRUN=PASS')
          print('categories=',r['categories'])
          print('safe=',len(safe))
          print('existing_link_agree=',r['existing_links_agree'])
          PY
          cp /tmp/full235-match-report.json audit/hk-stage2-full235-fingerprint-dryrun.json
          cp /tmp/full235-summary.txt audit/hk-stage2-full235-fingerprint-summary.txt
          {
            echo
            echo "fingerprint_source_sha256=8c1aee427e7678ca8b64ef46682f77cd80f407f8d048ae64cf3968db253ab8fb"
            echo "fingerprint_maps=235"
            echo "production_writes=NO"
          } >> audit/hk-stage2-full235-fingerprint-summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/hk-stage2-full235-fingerprint-dryrun.json audit/hk-stage2-full235-fingerprint-summary.txt
          git commit -m "audit: match all 235 full-map fingerprints"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: |
          ssh -i ~/.ssh/topking -o StrictHostKeyChecking=accept-new root@89.125.1.71 'rm -f /tmp/full235-fp.json /tmp/full235-match.py /tmp/full235-match-report.json' || true
          rm -f ~/.ssh/topking /tmp/fp.json /tmp/fp.json.gz /tmp/full235-match.py /tmp/full235-match-report.json /tmp/full235-summary.txt
