<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b"><title>As-Salam — Hamster King · Top King</title>
<link rel="stylesheet" href="../generated/vendor/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;background:#11151b}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
#hud{position:fixed;z-index:800;left:12px;top:12px;width:265px;max-width:calc(100vw - 24px);padding:14px;border:1px solid rgba(232,182,84,.42);border-radius:16px;background:rgba(8,10,14,.94);box-shadow:0 18px 50px rgba(0,0,0,.42);backdrop-filter:blur(14px)}
.title{display:flex;align-items:center;gap:8px;margin:0 0 5px;font-weight:900}.sub{color:#aeb5c0;font-size:12px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0;font-size:13px}.row label{display:flex;gap:8px;align-items:center}.n{color:#ffe3a0;font-weight:900}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.btns button,.back{min-height:38px;border:1px solid rgba(232,182,84,.34);border-radius:10px;background:rgba(232,182,84,.07);color:#ffe3a0;font-weight:800;text-decoration:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
#loading{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#11151b;color:#ffe3a0;font-weight:800}.hide{display:none!important}
.leaflet-control-attribution{font-size:9px!important}
@media(max-width:640px){#hud{left:9px;top:9px;width:235px;padding:11px}.title{font-size:14px}.sub{font-size:11px}.row{font-size:12px}.btns button,.back{min-height:34px;font-size:12px}}
</style></head><body><div id="map"></div><div id="loading">Загрузка карты…</div>
<aside id="hud"><div class="title">🇸🇩 As-Salam</div><div class="sub">Игровые здания Hamster King</div>
<div class="row"><label><input id="ok" type="checkbox" checked> Есть данные игры</label><span class="n" id="okn">—</span></div>
<div class="row"><label><input id="nd" type="checkbox" checked> Без данных / 409</label><span class="n" id="ndn">—</span></div>
<div class="row"><span>Геометрий на карте</span><span class="n" id="gn">—</span></div>
<div class="btns"><button id="fit">Показать всё</button><a class="back" href="../">← Карты</a></div></aside>
<script src="../generated/vendor/leaflet.js"></script><script>
const loading=document.getElementById('loading'); let map,layer,data;
async function boot(){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),20000);
  try{
    const r=await fetch('data.json?v=1',{cache:'no-store',signal:ctl.signal});if(!r.ok)throw new Error('data '+r.status);data=await r.json();clearTimeout(to);
    document.getElementById('okn').textContent=data.ok;document.getElementById('ndn').textContent=data.nodata;document.getElementById('gn').textContent=data.geometries;
    map=L.map('map',{preferCanvas:true,zoomControl:true,minZoom:10,maxZoom:20});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);
    draw();fit();loading.classList.add('hide');
  }catch(e){console.error(e);loading.textContent='Не удалось загрузить карту · обновите страницу'}
}
function draw(){
  if(layer)layer.remove(); const showOk=document.getElementById('ok').checked,showNd=document.getElementById('nd').checked;
  layer=L.layerGroup().addTo(map); const renderer=L.canvas({padding:.5});
  for(const f of data.features){if((f.s&&!showOk)||(!f.s&&!showNd))continue;for(const ring of f.g){if(ring.length<2)continue;
    const ll=ring.map(p=>[p[1],p[0]]),closed=ring.length>3&&ring[0][0]===ring[ring.length-1][0]&&ring[0][1]===ring[ring.length-1][1];
    const style=f.s?{color:'#f2c86d',weight:1,fillColor:'#c69339',fillOpacity:.38,renderer}:{color:'#858b96',weight:1,fillColor:'#4b515c',fillOpacity:.20,renderer};
    const o=closed?L.polygon(ll,style):L.polyline(ll,style);o.bindTooltip(f.i,{sticky:true});o.addTo(layer);
  }}
}
function fit(){if(!data)return;const b=data.bounds;map.fitBounds([[b[1],b[0]],[b[3],b[2]]],{padding:[24,24]})}
document.getElementById('ok').onchange=draw;document.getElementById('nd').onchange=draw;document.getElementById('fit').onclick=fit;boot();
</script></body></html>
