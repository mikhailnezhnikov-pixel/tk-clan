<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b11">
<title>Интерактивные карты — Top King</title>
<meta name="description" content="Общедоступные интерактивные карты Hamster King с фильтром по городам и сортировкой по сумме алмазов: 120 за кристальную комнату.">
<link rel="stylesheet" href="../assets/public.css?v=20260924-backdrop4">
<link rel="icon" href="../assets/brand/topking-clan-crest.png">
<style>
.map-controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.map-controls label{display:grid;gap:6px;color:#b7bdc8;font-size:13px}.map-controls select{min-width:220px;padding:12px;border:1px solid #45413a;border-radius:12px;background:#171a20;color:#fff;font:inherit}.maps-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.map-card{padding:20px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit}.map-card:hover{border-color:#e8b654}.map-card h2{font-size:20px;line-height:1.3;margin:0}.map-grid{color:#d8b36b}.map-diamonds{font-size:26px;font-weight:800;color:#a4e7ff}.map-meta{display:flex;gap:10px;flex-wrap:wrap;color:#a9b0bc;font-size:13px}.map-open{margin-top:auto;color:#e8b654;font-weight:700}.maps-status{color:#a9b0bc;margin-bottom:16px}.map-empty{grid-column:1/-1;color:#b7bdc8}@media(max-width:900px){.maps-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.maps-grid{grid-template-columns:1fr}.map-controls label,.map-controls select{width:100%;min-width:0}}
</style></head>
<body>
<header class="topbar"><div class="shell topbar-inner"><a class="brand" href="../" aria-label="Top King"><img class="tk-clan-crest" src="../assets/brand/topking-clan-crest.png" alt="Top King"></a><nav class="nav"><a href="../">Главная</a><a class="active" href="./">Карты</a><a href="../cabinet/">Личный кабинет</a></nav></div></header>
<main><header class="shell page-head"><p class="eyebrow">HAMSTER KING</p><h1>Интерактивные карты</h1><p class="lead">Только карты, опубликованные для общего доступа. Сначала районы с наибольшей суммой алмазов: каждая кристальная комната даёт 120 💎.</p></header>
<section class="shell content"><div class="map-controls">
<label>Город<select id="map-city"><option value="">Все города</option></select></label>
<label>Сортировка<select id="map-sort"><option value="diamonds-desc">💎 От большего к меньшему</option><option value="diamonds-asc">💎 От меньшего к большему</option><option value="city">По городам</option></select></label>
</div><p id="maps-status" class="maps-status" role="status">Загружаю карты…</p><div id="published-maps" class="maps-grid"></div></section></main>
<footer class="footer"><div class="shell footer-row"><span>Top King · Hamster King</span><a href="../feedback/">Обратная связь</a></div></footer>
<script>
const MAPS_API='https://hk-license.89.125.1.71.sslip.io/api/v1/public/maps';
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=value=>Number(value||0).toLocaleString('ru-RU');
let publicMaps=[];
function diamondReward(map){
  return Math.max(0,Number(map.total_rooms)||0)*120;
}
function interactiveMap(map){
  if(!map.published||map.interactive!==true)return false;
  try{const url=new URL(map.open_url,location.href);return url.origin===location.origin&&url.pathname.startsWith('/maps/view/')}catch{return false}
}
function sortedMaps(maps,city,order){
  return maps.filter(map=>!city||map.city===city).slice().sort((a,b)=>{
    const name=String(a.city).localeCompare(String(b.city),'ru')||String(a.grid).localeCompare(String(b.grid),'ru',{numeric:true});
    return order==='city'?name:(order==='diamonds-asc'?1:-1)*(Number(a.total_rooms||0)-Number(b.total_rooms||0))||name;
  });
}
function renderMaps(){
  const maps=sortedMaps(publicMaps,document.getElementById('map-city').value,document.getElementById('map-sort').value);
  document.getElementById('maps-status').textContent='Показано '+fmt(maps.length)+' из '+fmt(publicMaps.length)+' карт · 💎 — награда по известным комнатам';
  document.getElementById('published-maps').innerHTML=maps.map(map=>'<a class="card map-card" href="'+esc(map.open_url)+'"><h2>'+esc(map.city)+' <span class="map-grid">'+esc(map.grid)+'</span></h2><div class="map-diamonds">💎 '+fmt(diamondReward(map))+'</div><div class="map-meta"><span>'+fmt(map.total_rooms)+' кристальных комнат</span><span>'+fmt(map.buildings)+' зданий</span><span>Исследовано '+Number(map.progress||0).toLocaleString('ru-RU',{maximumFractionDigits:1})+'%</span></div><span class="map-open">Открыть карту →</span></a>').join('')||'<p class="map-empty">Нет опубликованных интерактивных карт для этого города.</p>';
}
document.getElementById('map-city').addEventListener('change',renderMaps);
document.getElementById('map-sort').addEventListener('change',renderMaps);
(async()=>{try{
  const response=await fetch(MAPS_API,{cache:'no-store'});if(!response.ok)throw new Error('maps');const data=await response.json();
  publicMaps=(Array.isArray(data.maps)?data.maps:[]).filter(interactiveMap);
  document.getElementById('map-city').innerHTML='<option value="">Все города</option>'+[...new Set(publicMaps.map(map=>map.city))].sort((a,b)=>a.localeCompare(b,'ru')).map(city=>'<option value="'+esc(city)+'">'+esc(city)+'</option>').join('');renderMaps();
}catch{document.getElementById('maps-status').textContent='Не удалось загрузить карты. Обновите страницу чуть позже.'}})();
</script><script src="../assets/site-nav.js?v=20260920-11"></script></body></html>
