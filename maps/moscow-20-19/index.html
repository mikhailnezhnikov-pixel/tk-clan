info-line strong{color:#fff;text-align:right}.loading{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:#423F42;color:#fff1b8;font:700 15px Arial,sans-serif}.loading.hidden{display:none}.maplibregl-ctrl-top-right{top:8px;right:8px}.maplibregl-ctrl-group{background:rgba(17,10,2,.9)!important;border:1px solid #8b6b2d!important}.maplibregl-ctrl button span{filter:invert(1)}
@media(max-width:700px){#hud{top:10px;left:10px;right:10px;width:auto;max-width:330px;max-height:calc(100dvh - 20px);font-size:12px;padding:9px;border-radius:8px}#hud-roll{top:10px;left:10px}.area-title{font-size:15px}.sub-title{font-size:12px}.buttons{grid-template-columns:repeat(3,1fr)}#map-back{left:10px}body.hud-closed #map-back{top:49px}}

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const PARTS=['p01.txt','p02.txt','p03.txt','p04.txt','p05.txt','p06.txt','p07.txt'];
const BASE=[37620000,55756000], visibleCrystals=new Set(); let map;
const I18N={en:{hide_panel:'Hide',crystals_highlight:'Crystals',legend_null:'Not explored',legend_0:'0 crystals',legend_1:'1 crystal',legend_2:'2 crystals',legend_3:'3 crystals',legend_4:'4 crystals',legend_5:'5 crystals',only_null:'Only unexplored',only_0:'Only 0',only_1:'Only 1',only_2:'Only 2',only_3:'Only 3',only_4:'Only 4',only_5:'Only 5',total:'Total',normal:'Normal',investment:'Investment'},ru:{hide_panel:'Скрыть',crystals_highlight:'Кристаллы',legend_null:'Не исследовано',legend_0:'0 кристаллов',legend_1:'1 кристалл',legend_2:'2 кристалла',legend_3:'3 кристалла',legend_4:'4 кристалла',legend_5:'5 кристаллов',only_null:'Только не исслед.',only_0:'Только 0',only_1:'Только 1',only_2:'Только 2',only_3:'Только 3',only_4:'Только 4',only_5:'Только 5',total:'Всего',normal:'Обычные',investment:'Инвестиции'}};
function closeHud(){document.body.classList.add('hud-closed');updateBackButtonPosition()}function openHud(){document.body.classList.remove('hud-closed');updateBackButtonPosition()}function updateBackButtonPosition(){const hud=document.getElementById('hud'),back=document.getElementById('map-back');if(!document.body.classList.contains('hud-closed'))document.documentElement.style.setProperty('--map-back-top',(hud.offsetTop+hud.offsetHeight+10)+'px')}
function setLang(lang){const d=I18N[lang]||I18N.ru;document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(d[k])el.textContent=d[k]});document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.id==='lang-'+lang));localStorage.setItem('hk_map_lang',lang);updateBackButtonPosition()}
function decodeSeq(a){let x=BASE[0],y=BASE[1],o=[];for(let i=0;i<a.length;i+=2){x+=a[i];y+=a[i+1];o.push([x/1e6,y/1e6])}return o}
function decodeGeom(g){const[t,c]=g;if(t==='p')return{type:'Point',coordinates:[(BASE[0]+c[0])/1e6,(BASE[1]+c[1])/1e6]};if(t==='l')return{type:'LineString',coordinates:decodeSeq(c)};if(t==='m')return{type:'MultiLineString',coordinates:c.map(decodeSeq)};if(t==='g')return{type:'Polygon',coordinates:c.map(decodeSeq)};if(t==='q')return{type:'MultiPolygon',coordinates:c.map(p=>p.map(decodeSeq))}}
async function loadData(){const b64=(await Promise.all(PARTS.map(p=>fetch('data/'+p+'?v=full2').then(r=>{if(!r.ok)throw new Error(p);return r.text()})))).join('').replace(/\s/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');return JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(ds)).text())}
function crystalFilter(){return['all',['==',['get','is_db_building'],true],['in',['get','crystals_key'],['literal',Array.from(visibleCrystals)]]]}
function crystalPointFilter(){return['all',['==',['geometry-type'],'Point'],['==',['get','is_db_building'],true],['in',['get','crystals_key'],['literal',Array.from(visibleCrystals)]]]}
function refreshVisibility(){if(!map||!map.getLayer('buildings-highlight'))return;map.setFilter('buildings-highlight-glow',crystalFilter());map.setFilter('buildings-highlight',crystalFilter());map.setFilter('buildings-outline',crystalFilter());if(map.getLayer('buildings-point-highlight'))map.setFilter('buildings-point-highlight',crystalPointFilter())}
function updateCheckboxes(){document.querySelectorAll('.crystal-toggle').forEach(cb=>cb.checked=visibleCrystals.has(cb.value))}function showOnly(v){visibleCrystals.clear();visibleCrystals.add(v);updateCheckboxes();refreshVisibility()}
document.querySelectorAll('.crystal-toggle').forEach(cb=>cb.addEventListener('change',()=>{cb.checked?visibleCrystals.add(cb.value):visibleCrystals.delete(cb.value);refreshVisibility()}));
(async()=>{try{const d=await loadData();const buildings={type:'FeatureCollection',features:d.b.map(([g,ci,db,ck])=>({type:'Feature',geometry:decodeGeom(g),properties:{base_color:d.bc[ci],is_db_building:!!db,crystals_key:ck}}))};const roads={type:'FeatureCollection',features:d.r.map(([g,w])=>({type:'Feature',geometry:decodeGeom(g),properties:{width:w}}))};const landuse={type:'FeatureCollection',features:d.l.map(([g,ci])=>({type:'Feature',geometry:decodeGeom(g),properties:{color:d.lc[ci]}}))};const water={type:'FeatureCollection',features:d.w.map(g=>({type:'Feature',geometry:decodeGeom(g),properties:{}}))};
map=new maplibregl.Map({container:'map',attributionControl:false,style:{version:8,glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',sources:{},layers:[{id:'background',type:'background',paint:{'background-color':'#423F42'}}]},center:[37.6197853,55.75614595],zoom:16.5,pitch:0,bearing:0,minZoom:14,maxZoom:20,maxPitch:0,dragRotate:false,touchPitch:false,antialias:true});map.addControl(new maplibregl.NavigationControl({showCompass:false,showZoom:true,visualizePitch:false}),'top-right');map.dragRotate.disable();map.touchZoomRotate.disableRotation();
map.on('load',()=>{const cv=document.createElement('canvas');cv.width=cv.height=8;const cx=cv.getContext('2d');cx.clearRect(0,0,8,8);cx.strokeStyle='rgba(0,0,0,.42)';cx.lineWidth=1;cx.beginPath();cx.moveTo(-4,8);cx.lineTo(8,-4);cx.moveTo(0,12);cx.lineTo(12,0);cx.stroke();map.addImage('hk-selected-stripes',cv,{pixelRatio:1});
map.addSource('landuse',{type:'geojson',data:landuse});map.addLayer({id:'landuse',type:'fill',source:'landuse',paint:{'fill-color':['get','color'],'fill-opacity':1}});map.addSource('water',{type:'geojson',data:water});map.addLayer({id:'water',type:'fill',source:'water',paint:{'fill-color':'#243C56','fill-opacity':1}});map.addSource('roads',{type:'geojson',data:roads});map.addLayer({id:'roads-shadow',type:'line',source:'roads',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#2D2D34','line-width':['+', ['get','width'], 1.6],'line-opacity':.72}});map.addLayer({id:'roads-main',type:'line',source:'roads',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#5F616D','line-width':['get','width'],'line-opacity':.96}});map.addSource('buildings',{type:'geojson',data:buildings});map.addLayer({id:'buildings-base',type:'fill',source:'buildings',paint:{'fill-color':['get','base_color'],'fill-opacity':.95}});map.addLayer({id:'buildings-edge-shadow',type:'line',source:'buildings',paint:{'line-color':'#342f32','line-width':['interpolate',['linear'],['zoom'],14,.35,16,.55,18,.85,20,1.15],'line-opacity':.78}});map.addLayer({id:'buildings-edge-light',type:'line',source:'buildings',paint:{'line-color':'#7b7469','line-width':['interpolate',['linear'],['zoom'],14,.15,16,.25,18,.38,20,.55],'line-opacity':.28}});map.addLayer({id:'buildings-highlight-glow',type:'fill',source:'buildings',filter:crystalFilter(),paint:{'fill-color':'#000000','fill-opacity':.04}});map.addLayer({id:'buildings-highlight',type:'fill',source:'buildings',filter:crystalFilter(),paint:{'fill-pattern':'hk-selected-stripes','fill-opacity':.55}});map.addLayer({id:'buildings-outline',type:'line',source:'buildings',filter:crystalFilter(),paint:{'line-color':'#fff4be','line-width':['interpolate',['linear'],['zoom'],14,1.1,16,1.45,18,1.9,20,2.3],'line-opacity':.95}});map.addLayer({id:'buildings-point-base',type:'circle',source:'buildings',filter:['==',['geometry-type'],'Point'],paint:{'circle-radius':['interpolate',['linear'],['zoom'],14,4,16,5,18,7,20,9],'circle-color':['get','base_color'],'circle-opacity':.95,'circle-stroke-color':'#342f32','circle-stroke-width':1}});map.addLayer({id:'buildings-point-highlight',type:'circle',source:'buildings',filter:crystalPointFilter(),paint:{'circle-radius':['interpolate',['linear'],['zoom'],14,6,16,8,18,11,20,14],'circle-color':'#000000','circle-opacity':.05,'circle-stroke-color':'#fff4be','circle-stroke-width':['interpolate',['linear'],['zoom'],14,1.4,16,1.8,18,2.4,20,3],'circle-stroke-opacity':.95}});map.fitBounds([[37.6119433,55.751073],[37.6276273,55.7612189]],{padding:35,duration:0});map.setPitch(0);map.setBearing(0);refreshVisibility();document.getElementById('loading').classList.add('hidden')});}catch(e){console.error(e);document.getElementById('loading').textContent='Ошибка загрузки полной карты';}})();
setLang(localStorage.getItem('hk_map_lang')||'ru');updateBackButtonPosition();addEventListener('resize',updateBackButtonPosition);addEventListener('load',updateBackButtonPosition);
</script></body></html>
