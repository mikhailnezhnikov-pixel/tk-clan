<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#423F42">
<title>MOSCOW 20:19 — Hamster King · Top King</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#423F42}body{font-family:Arial,sans-serif;color:#f7e7b0}#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#423F42}#loading{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#423F42;color:#fff1b8;font-weight:800;font-size:15px;text-align:center;padding:24px}.hidden{display:none!important}
#hud{position:absolute;top:12px;left:12px;z-index:30;width:255px;max-height:calc(100dvh - 24px);overflow:auto;padding:10px;border:1px solid #8b6b2d;border-radius:8px;background:rgba(17,10,2,.93);box-shadow:0 3px 14px rgba(0,0,0,.58);font-size:13px;transition:.25s;transform-origin:top left}.hud-closed #hud{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.lang{display:flex;gap:6px}.lang button,.close,.map-btn{background:rgba(17,10,2,.95);border:1px solid #8b6b2d;color:#cab15b;border-radius:5px;cursor:pointer;font-weight:700}.lang button,.close{padding:4px 8px;font-size:12px}.lang button.active{color:#fff1b8;background:rgba(202,177,91,.22)}.title{text-align:center;font-size:18px;font-weight:800;color:#fff1b8;margin-bottom:5px}.subtitle{text-align:center;color:#cab15b;font-weight:700;margin-bottom:8px}.row label{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:center;margin:5px 0;cursor:pointer}.row input{accent-color:#cab15b}.count{min-width:42px;text-align:right;padding:2px 5px;border:1px solid rgba(202,177,91,.38);border-radius:4px;background:rgba(202,177,91,.16);color:#fff;font-weight:700}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}.buttons button{padding:5px;background:#110a02;border:1px solid #cab15b;color:#cab15b;border-radius:5px;font-size:12px;font-weight:700}.stats{margin-top:10px;padding-top:8px;border-top:1px solid rgba(202,177,91,.35);font-size:12px;line-height:1.55}.stats div{display:flex;justify-content:space-between}.stats span{color:#b8b3a7}.stats b{color:#fff}.map-btn{position:absolute;z-index:31;width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:20px;color:#fff1b8;box-shadow:0 3px 14px rgba(0,0,0,.45)}#openHud{top:12px;left:12px;opacity:0;pointer-events:none;transform:translateX(-50px);transition:.25s}.hud-closed #openHud{opacity:1;pointer-events:auto;transform:none}#back{left:12px;top:var(--back-top,390px);text-decoration:none}.hud-closed #back{top:52px}#zoomIn{right:12px;top:12px}#zoomOut{right:12px;top:52px}#fit{right:12px;top:92px;font-size:14px}
@media(max-width:700px){#hud{top:10px;left:10px;right:10px;width:auto;max-width:330px;max-height:calc(100dvh - 20px);font-size:12px}#openHud{top:10px;left:10px}#back{left:10px}.buttons{grid-template-columns:repeat(3,1fr)}#zoomIn,#zoomOut,#fit{right:10px}}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="loading">Загрузка полной карты…</div>
<button id="openHud" class="map-btn" type="button" onclick="openHud()">⚙</button>
<a id="back" class="map-btn" href="../" aria-label="Назад">←</a>
<button id="zoomIn" class="map-btn" type="button" aria-label="Приблизить">+</button>
<button id="zoomOut" class="map-btn" type="button" aria-label="Отдалить">−</button>
<button id="fit" class="map-btn" type="button" aria-label="Показать всю карту">FIT</button>
<div id="hud">
  <div class="topbar"><div class="lang"><button id="lang-en" onclick="setLang('en')">🇬🇧 EN</button><button id="lang-ru" onclick="setLang('ru')">🇷🇺 RU</button></div><button class="close" onclick="closeHud()" data-i18n="hide">Скрыть</button></div>
  <div class="title">MOSCOW 20:19</div><div class="subtitle" data-i18n="crystals">Кристаллы</div>
  <div id="filterRows"></div>
  <div class="buttons" id="onlyButtons"></div>
  <div class="stats"><div><span data-i18n="total">Всего</span><b>220</b></div><div><span data-i18n="normal">Обычные</span><b>215</b></div><div><span data-i18n="investment">Инвестиции</span><b>5</b></div></div>
</div>
<script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d',{alpha:false});
const loading=document.getElementById('loading');
const crystalValues=['NULL','0','1','2','3','4','5'], counts={'NULL':37,'0':103,'1':51,'2':23,'3':5,'4':1,'5':0};
const visible=new Set();
const I18N={
ru:{hide:'Скрыть',crystals:'Кристаллы',total:'Всего',normal:'Обычные',investment:'Инвестиции',labels:['Не исследовано','0 кристаллов','1 кристалл','2 кристалла','3 кристалла','4 кристалла','5 кристаллов'],only:['Только не исслед.','Только 0','Только 1','Только 2','Только 3','Только 4','Только 5']},
en:{hide:'Hide',crystals:'Crystals',total:'Total',normal:'Normal',investment:'Investment',labels:['Not explored','0 crystals','1 crystal','2 crystals','3 crystals','4 crystals','5 crystals'],only:['Only unexplored','Only 0','Only 1','Only 2','Only 3','Only 4','Only 5']}}
let lang='ru',data=null,decoded=null,dpr=1;
const bounds={minX:37.6119433,maxX:37.6276273,minY:55.751073,maxY:55.7612189};
const lat0=(bounds.minY+bounds.maxY)/2*Math.PI/180, cos0=Math.cos(lat0);
const view={cx:((bounds.minX+bounds.maxX)/2)*cos0,cy:-((bounds.minY+bounds.maxY)/2),scale:1};
function buildControls(){const rows=document.getElementById('filterRows'),buttons=document.getElementById('onlyButtons');rows.innerHTML='';buttons.innerHTML='';crystalValues.forEach((v,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<label><input type="checkbox" value="${v}"><span>${I18N[lang].labels[i]}</span><span class="count">${counts[v]}</span></label>`;const cb=r.querySelector('input');cb.checked=visible.has(v);cb.onchange=()=>{cb.checked?visible.add(v):visible.delete(v);draw()};rows.appendChild(r);const b=document.createElement('button');b.textContent=I18N[lang].only[i];b.onclick=()=>{visible.clear();visible.add(v);buildControls();draw()};buttons.appendChild(b)})}
function setLang(v){lang=I18N[v]?v:'ru';document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=I18N[lang][el.dataset.i18n]);document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.id==='lang-'+lang));localStorage.setItem('hk_map_lang',lang);buildControls();updateBack()}
function closeHud(){document.body.classList.add('hud-closed')}function openHud(){document.body.classList.remove('hud-closed');updateBack()}function updateBack(){const h=document.getElementById('hud');document.documentElement.style.setProperty('--back-top',(h.offsetTop+h.offsetHeight+10)+'px')}
function world(lon,lat){return[lon*cos0,-lat]}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!view.fitted)fitView();draw();updateBack()}
function fitView(){const a=world(bounds.minX,bounds.minY),b=world(bounds.maxX,bounds.maxY);const ww=Math.abs(b[0]-a[0]),hh=Math.abs(b[1]-a[1]);view.cx=(a[0]+b[0])/2;view.cy=(a[1]+b[1])/2;view.scale=Math.min((innerWidth-30)/ww,(innerHeight-30)/hh);view.fitted=true}
function screen(lon,lat){const [x,y]=world(lon,lat);return[(x-view.cx)*view.scale+innerWidth/2,(y-view.cy)*view.scale+innerHeight/2]}
function decodeSeq(a,base){let x=base[0],y=base[1],out=[];for(let i=0;i<a.length;i+=2){x+=a[i];y+=a[i+1];out.push([x/1e6,y/1e6])}return out}
function decodeGeom(g,base){const[t,c]=g;if(t==='p')return{t,cs:[[(base[0]+c[0])/1e6,(base[1]+c[1])/1e6]]};if(t==='l')return{t,cs:[decodeSeq(c,base)]};if(t==='m')return{t,cs:c.map(x=>decodeSeq(x,base))};if(t==='g')return{t,cs:c.map(x=>decodeSeq(x,base))};if(t==='q')return{t,cs:c.map(p=>p.map(x=>decodeSeq(x,base)))};return null}
function prepare(d){const base=d.o||[37620000,55756000];return{land:d.l.map(([g,ci])=>({g:decodeGeom(g,base),c:d.lc[ci]})),water:d.w.map(g=>decodeGeom(g,base)),roads:d.r.map(([g,w])=>({g:decodeGeom(g,base),w})),build:d.b.map(([g,ci,db,ck])=>({g:decodeGeom(g,base),c:d.bc[ci],db:!!db,ck}))}}
function pathGeom(g){if(!g)return false;ctx.beginPath();const add=ring=>{ring.forEach((p,i)=>{const s=screen(p[0],p[1]);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])})};if(g.t==='p')return false;if(g.t==='q')g.cs.forEach(poly=>poly.forEach(add));else g.cs.forEach(add);return true}
function fillGeom(g,color,stroke){if(!pathGeom(g))return;ctx.fillStyle=color;ctx.fill('evenodd');if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.7;ctx.stroke()}}
function strokeGeom(g,color,width){if(!pathGeom(g))return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function pointGeom(g,color,highlight){const p=g.cs[0][0],s=screen(p[0],p[1]);ctx.beginPath();ctx.arc(s[0],s[1],highlight?8:5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=highlight?'#fff4be':'#342f32';ctx.lineWidth=highlight?2:1;ctx.stroke()}
function draw(){if(!decoded)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#423F42';ctx.fillRect(0,0,innerWidth,innerHeight);decoded.land.forEach(x=>fillGeom(x.g,x.c));decoded.water.forEach(g=>fillGeom(g,'#243C56'));decoded.roads.forEach(x=>{strokeGeom(x.g,'#2D2D34',Math.max(1,x.w+1.5));strokeGeom(x.g,'#5F616D',Math.max(.6,x.w))});decoded.build.forEach(x=>{const hi=x.db&&visible.has(String(x.ck));if(x.g.t==='p')pointGeom(x.g,x.c,hi);else{fillGeom(x.g,x.c,'rgba(52,47,50,.8)');if(hi){strokeGeom(x.g,'#fff4be',2);ctx.save();ctx.globalAlpha=.13;fillGeom(x.g,'#fff4be');ctx.restore()}}})}
function zoomAt(f,cx=innerWidth/2,cy=innerHeight/2){const wx=view.cx+(cx-innerWidth/2)/view.scale,wy=view.cy+(cy-innerHeight/2)/view.scale;view.scale=Math.max(8000,Math.min(650000,view.scale*f));view.cx=wx-(cx-innerWidth/2)/view.scale;view.cy=wy-(cy-innerHeight/2)/view.scale;draw()}
const pointers=new Map();let lastSingle=null,lastPinch=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)lastSingle={x:e.clientX,y:e.clientY};if(pointers.size===2){const a=[...pointers.values()];lastPinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&lastSingle){const dx=e.clientX-lastSingle.x,dy=e.clientY-lastSingle.y;view.cx-=dx/view.scale;view.cy-=dy/view.scale;lastSingle={x:e.clientX,y:e.clientY};draw()}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;if(lastPinch&&lastPinch.d>0)zoomAt(d/lastPinch.d,mx,my);lastPinch={d,x:mx,y:my}}});
function endPointer(e){pointers.delete(e.pointerId);lastSingle=pointers.size===1?{...pointers.values().next().value}:null;lastPinch=null}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.18:.84,e.clientX,e.clientY)},{passive:false});
document.getElementById('zoomIn').onclick=()=>zoomAt(1.35);document.getElementById('zoomOut').onclick=()=>zoomAt(.74);document.getElementById('fit').onclick=()=>{view.fitted=false;fitView();draw()};
async function load(){const timer=setTimeout(()=>{loading.textContent='Карта загружается дольше обычного…';},8000);try{const controller=new AbortController(),abort=setTimeout(()=>controller.abort(),20000);const r=await fetch('data/full-data.json?v=canvas1',{cache:'no-store',signal:controller.signal});clearTimeout(abort);if(!r.ok)throw new Error('HTTP '+r.status);data=await r.json();if(!data||!data.b||!data.r||!data.l||!data.w)throw new Error('Некорректные данные');decoded=prepare(data);clearTimeout(timer);resize();requestAnimationFrame(()=>{draw();loading.classList.add('hidden')})}catch(e){clearTimeout(timer);console.error(e);loading.innerHTML='Не удалось загрузить карту.<br><small>Нажмите обновить страницу.</small>'}}
setLang(localStorage.getItem('hk_map_lang')||'ru');addEventListener('resize',resize);load();
</script>
</body></html>
