<script>window.TK_PAGE_TRANSLATIONS={ru:{pageTitle:'Рейтинг — Top King',eyebrow:'Топ-100',title:'Рейтинг',lead:'Лучшие игроки, кланы и альянсы по последнему снимку из игры.',influence:'Игроки · влияние',power:'Игроки · сила',clans:'Кланы',alliances:'Альянсы',search:'Поиск по названию',place:'Место',name:'Имя',value:'Значение',prev:'Назад',next:'Далее',page:'Страница'},en:{pageTitle:'Rankings — Top King',eyebrow:'Top 100',title:'Rankings',lead:'Top players, clans and alliances from the latest in-game snapshot.',influence:'Players · influence',power:'Players · power',clans:'Clans',alliances:'Alliances',search:'Search by name',place:'Rank',name:'Name',value:'Value',prev:'Previous',next:'Next',page:'Page'},fa:{pageTitle:'رتبه‌بندی — Top King',eyebrow:'۱۰۰ نفر برتر',title:'رتبه‌بندی',lead:'بهترین بازیکنان، قبیله‌ها و اتحادها بر اساس آخرین داده بازی.',influence:'بازیکنان · نفوذ',power:'بازیکنان · قدرت',clans:'قبیله‌ها',alliances:'اتحادها',search:'جستجو بر اساس نام',place:'رتبه',name:'نام',value:'مقدار',prev:'قبلی',next:'بعدی',page:'صفحه'}};</script><script src="../assets/site-i18n.js"></script><script>
const BASE='https://hk-license.89.125.1.71.sslip.io/api/v1/public/ratings?kind=';let kind='influence',rows=[],page=1;const pageSize=20;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),s=TopKingI18n.strings(),filtered=rows.filter(r=>String(r.name||'').toLowerCase().includes(q)),pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,pages);const shown=filtered.slice((page-1)*pageSize,page*pageSize);document.getElementById('rows').innerHTML=shown.map(r=>`<tr><td>${Number(r.rank||0)}</td><td><b>${esc(r.name)}</b></td><td>${Number(r.value??r.score??0).toLocaleString()}</td></tr>`).join('');document.getElementById('empty').classList.toggle('hidden',shown.length>0);document.querySelector('.table-wrap').classList.toggle('hidden',shown.length===0);document.getElementById('page').textContent=`${s.page} ${page} / ${pages}`;document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=pages}
async function load(){const status=document.getElementById('status');status.className='status';status.textContent=TopKingI18n.strings().loading;try{const r=await fetch(BASE+kind,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();rows=Array.isArray(d.rows)?d.rows:[];status.className='status '+(d.stale?'warn':'good');status.textContent=TopKingI18n.strings().updated+': '+(d.updated_at?new Date(d.updated_at*1000).toLocaleString(TopKingI18n.language):'—');page=1;render()}catch{status.className='status bad';status.textContent=TopKingI18n.strings().error;rows=[];render()}}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));load()});document.getElementById('search').oninput=()=>{page=1;render()};document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};document.addEventListener('tk-language-change',render);load();setInterval(load,60000);
</script></body></html>
