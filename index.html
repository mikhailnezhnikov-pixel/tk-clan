<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top King</title>
  <meta name="description" content="Официальный сайт клана Top King">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #090b10;
      color: #f4d27a;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 680px; }
    h1 { margin: 0 0 12px; font-size: clamp(48px, 12vw, 96px); letter-spacing: .08em; }
    p { margin: 0; color: #d7d9df; font-size: clamp(18px, 4vw, 24px); }
    .tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 28px;
    }
    .tools a {
      display: inline-block;
      padding: 14px 22px;
      border: 1px solid #b98a31;
      border-radius: 12px;
      background: linear-gradient(135deg, #3d2a0b, #17130c);
      color: #ffe19a;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }
    .tools a:hover { border-color: #f4d27a; }
    @media (max-width: 560px) { .tools { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>TOP KING</h1>
    <p>Официальный сайт клана готовится к запуску</p>
    <nav class="tools" aria-label="Инструменты клана">
      <a href="business-calculator/">Калькулятор бизнеса</a>
      <a href="recipes/">Рецепты</a>
    </nav>
  </main>
</body>
</html>
